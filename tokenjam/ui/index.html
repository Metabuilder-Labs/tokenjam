      ],
    };
    const plot = new window.uPlot(opts, data, ref.current);
    const onResize = () => plot.setSize({ width: ref.current.clientWidth || width, height });
    window.addEventListener('resize', onResize);
    return () => { window.removeEventListener('resize', onResize); plot.destroy(); };
  }, [data, height, bucket]);
  return html`<div class="chart" ref=${ref}></div>`;
}


// Per-analyzer legend-wording override for the component-waste chart/legend,
// `WASTE_LEGEND_OVERRIDE` is deleted with them. It carried one entry, for
// `placement`, whose purpose was to keep the Batch-API lever off this overlay
// on non-api pricing and to stop its legend row wearing the plain
// past-overspend wording every sibling analyzer used. Both rules still hold and
// both are still enforced where they are actually rendered: `placement`'s own
// card in `OptimizeFinding` gates on `pricing_mode === 'api'` and carries the
// "estimated price difference" wording itself. The override existed only to
// mirror that onto a legend that no longer exists.

// `buildComponentWaste` and `dominantSplit` lived here and are deleted with the
// segmented composition chart they existed for. Both took the /cost/components
// response apart into per-component bar segments (input / output / cache read /
// cache write) and a ">95% of spend is one component" label for when that stack
// collapsed to a single block. The spend surface is now ONE bar whose width is
// the total and whose shaded region is the overspend ceiling, so there are no
// segments to build and no dominance to explain. Nothing else called either.

// ============================
// SDK Services zone (#306)
// ============================
// Non-interactive SDK agents render as Prometheus-style rows: name + status
// dot, cost/day, a cost/min sparkline + a smaller err% sparkline, err-rate and
// req/min. Services that stopped emitting telemetry drop into a collapsible
// "Inactive" list keyed on last-seen — went_quiet (amber: recently silent →
// possible outage) vs long_dormant (muted: silent for a while). Reuses the
// shared Sparkline + fmtAgo + fmtFramedDollar; introduces no new palette.
function _sdkErrClass(pct) {
  return pct > 0.5 ? 'err-bad' : pct > 0 ? 'err-warn' : 'err-good';
}
function _sdkErrColor(pct) {
  return pct > 0.5 ? 'var(--error)' : pct > 0 ? 'var(--warn)' : 'var(--success)';
}
// The name to SHOW for an agent, with the tool prefix already stripped by the
// server (`alerts.agent_display_name`). The stripping RULE lives there, beside
// the prefix list that defines what an interactive coding agent is, so it
// cannot drift from the classifier; this side only supplies the fallback for a
// payload written before the field existed.
//
// `agent_id` remains the identity everywhere it matters — every link, filter,
// query parameter and dedup key on this page still uses it, and every rendered
// name carries it as a `title` so the full id is one hover away.
function agentName(row) {
  return (row && (row.agent_display_name || row.agent_id)) || '-';
}

// Stripping a shared prefix can make two DIFFERENT agents render identically:
// `claude-code-api` and `codex-api` both shorten to `api`. That is a list-level
// property, so it cannot be decided per row on the server. Any short name
// claimed by more than one id in the SAME list reverts to the full id for every
// row involved, so two rows never present as the same thing.
function disambiguateAgentNames(rows) {
  const byName = new Map();
  for (const r of rows || []) {
    const n = agentName(r);
    if (!byName.has(n)) byName.set(n, new Set());
    byName.get(n).add(r && r.agent_id);
  }
  const out = new Map();
  for (const r of rows || []) {
    const n = agentName(r);
    out.set(r && r.agent_id, byName.get(n).size > 1 ? (r.agent_id || n) : n);
  }
  return out;
}

// How many SDK sessions the history list asks for. A cap, disclosed as `N+`
// where it bites — never rendered as a total (root anti-pattern 22b).
const SDK_HISTORY_LIMIT = 50;

// Whether the SDK-services zone renders, stated ONCE so the render and the
// history fetch that feeds it cannot disagree about it. Not-yet-known shows the
// zone rather than hiding it: hiding on an unresolved persona read is a claim
// that this reader has no SDK side, which is exactly what is not known yet.
function showSdkZoneFor(persona, personaKnown) {
  return !personaKnown || persona !== 'claude-code';
}

// THREE states, gated on the history read's own fetch — never on a page-wide
// flag, and never collapsed to two:
//
//   not yet known    a skeleton. No number, and emphatically no "no X" claim:
//                    the read that would tell us has not answered.
//   known and empty  the only place an absence claim is honest. Says the thing
//                    the reader actually needs to know (nothing has ever been
//                    recorded), not the narrower live-window fact.
//   known, has rows  the live-window fact IS the right thing to say, because
//                    the history sitting under it supplies what a bare
//                    "nothing live" would have been read as denying.
function sdkLiveEmptyState(history) {
  if (!history || !history.known) {
    return html`<div class="svc-empty"><span class="shimmer" style="display:inline-block;height:11px;width:220px;vertical-align:middle"></span></div>`;
  }
  if (!history.sessions.length) {
    return html`<div class="svc-empty">No SDK or API traffic has been recorded on this machine yet. Instrument a workload with <span class="mono">@watch()</span> and it appears here.</div>`;
  }
  return html`<div class="svc-empty">No SDK services live right now. Earlier sessions are in the history below.</div>`;
}

// SDK SESSION HISTORY — the SDK zone's counterpart to the coding zone's
// archive, and the reason it exists: the services panel above is keyed on a
// LIVE-DISCOVERY WINDOW (`SDK_DISCOVERY_WINDOW`), so a service quiet for longer
// than that dropped out of the panel and, since this page is the SDK persona's
// only session surface, out of the product entirely.
//
// Deliberately NOT fixed by widening that window: `live` / `went quiet` /
// `long-dormant` are defined against it, so widening changes what all three
// words mean and only moves the cliff further out. An agent leaving the live
// window should DEGRADE INTO HISTORY, which is exactly what the coding zone
// already does with its archive.
//
// Fed by `GET /sessions?persona=sdk`, not by /status's live discovery — a
// different question needs a different source, and that endpoint applies the
// same agent_id-prefix bucketing `framing.agent_persona_mix` classifies with.
// Rows are SESSIONS (like the coding archive), not agents, so a row is a real
// thing to drill into rather than a second aggregate that could disagree with
// the panel above.
//
// The column is `Started`, from `started_at`, and it stays a single basis on
// purpose: an SDK service never closes, so `ended_at` is null for many of these
// rows and a "last activity" column would silently mean two different things
// depending on the row.
function SdkSessionHistory({ history, framing }) {
  if (!history || !history.known) {
    return html`
      <div class="section-gap"></div>
      <div class="zone-head">
        <span class="zone-title">Session history</span>
        <span class="zone-sub">loading…</span>
      </div>
      <div class="panel">${TableRowsSkeleton(['Session', 'Agent', 'Cost', 'Tokens in / out', 'Tools', 'Errors', 'Started'], 4)}</div>`;
  }
  if (!history.sessions.length) return null;

  const rows = history.sessions;
  const names = disambiguateAgentNames(rows);
  const agents = new Set(rows.map(s => s.agent_id).filter(Boolean));
  return html`
    <div class="section-gap"></div>
    <div class="zone-head">
      <span class="zone-title">Session history</span>
      ${/* Both figures cover the SAME population — the rows rendered below —
            and the cap is disclosed rather than passed off as a total. */ ''}
      <span class="zone-sub">${rows.length}${history.capped ? '+' : ''} session${rows.length === 1 ? '' : 's'} · ${agents.size} agent${agents.size === 1 ? '' : 's'} · newest first${history.capped ? ' · showing the most recent ' + rows.length : ''}</span>
    </div>
    <div class="panel">
      <div class="table-wrap"><table class="archive-list">
        <thead><tr><th>Session</th><th>Agent</th><th class="num">Cost</th><th>Tokens in / out</th><th class="num">Tools</th><th class="num">Errors</th><th>Started</th></tr></thead>
        <tbody>
          ${rows.map(s => html`
            <tr key=${s.session_id} class=${s.session_id ? 'clickable' : ''}
                onClick=${() => { if (s.session_id) location.hash = '#/sessions/' + s.session_id; }}>
              <td class="a-id">${s.session_id ? s.session_id.slice(0, 8) : '-'}</td>
              <td class="a-agent" title=${s.agent_id || ''}>${names.get(s.agent_id) || agentName(s)}</td>
              <td class="num" style="color:var(--text);font-weight:600">${fmtFramedDollar(s.total_cost_usd, framing)}</td>
              <td class="dim">${fmtTokens(s.input_tokens)} / ${fmtTokens(s.output_tokens)}</td>
              <td class="num dim">${s.tool_call_count != null ? s.tool_call_count : '-'}</td>
              <td class="num dim">${s.error_count != null ? s.error_count : '-'}</td>
              <td class="dim">${s.started_at ? fmtAgo(s.started_at) : '-'}</td>
            </tr>`)}
        </tbody>
      </table></div>
    </div>`;
}

function _flatlineSvg(color) {
  return html`<svg class="svg-flat" width="120" height="24" viewBox="0 0 120 24" preserveAspectRatio="none">
    <line x1="0" y1="12" x2="120" y2="12" stroke=${color} stroke-width="1.2" stroke-dasharray="3 3"></line>
  </svg>`;
}
// `history` is the SDK session-history read's state (see SdkSessionHistory), and
// this panel needs it for ONE reason: to know whether it may make an absence
// claim at all.
//
// "No SDK services live right now" is a true statement about the LIVE
// DISCOVERY WINDOW (`SDK_DISCOVERY_WINDOW`, api/routes/status.py — 7 days), and
// it was the only thing on the SDK persona's only session surface. A reader
// with a workload that last ran twelve days ago saw it and concluded tokenjam
// had no record of their SDK work at all, which is a different and much larger
// claim than the sentence was making. So this panel may only say "nothing live"
// once the history read has answered and can say what IS there — the same
// two-figures-over-two-populations rule the rest of this file follows.
function SdkServicesPanel({ services, framing, history }) {
  const live = services.filter(s => s.state === 'live');
  const inactive = services.filter(s => s.state !== 'live');
  const openTraces = (aid) => { location.hash = '#/traces?agent_id=' + encodeURIComponent(aid); };

  const svcRow = (s) => {
    const errPct = s.err_rate || 0;
    return html`
      <div class="svc-row clickable" title="Open service traces & cost"
           onClick=${() => openTraces(s.agent_id)}>
        <div class="svc-name" title=${s.agent_id || ''}><span class="status-dot live"></span>${agentName(s)}</div>
        <div class="svc-metric">$${(s.today_cost || 0).toFixed(2)}<span class="unit">/day</span></div>
        <div class="spark-wrap">
          <div class="spark-col" style="flex:1;min-width:1px">
            <span class="spark-lab">cost / min · ${fmtCost(s.window_cost)} · ${fmtTokens(s.window_tokens)} tokens last 24m</span>
            <${Sparkline} values=${s.cost_per_min} color="var(--brand)" width=${220} height=${30} />
          </div>
          <div class="spark-col" style="width:110px">
            <span class="spark-lab">error %</span>
            <${Sparkline} values=${s.err_pct_per_min} color=${_sdkErrColor(errPct)} width=${110} height=${30} />
          </div>
        </div>
        <div class="svc-metric ${_sdkErrClass(errPct)}">${errPct.toFixed(1)}%<div class="metric-label">err rate</div></div>
        <div class="svc-metric" style="text-align:right">~${Math.round(s.req_per_min || 0)}<span class="unit"> req/min</span></div>
      </div>`;
  };

  const inactRow = (s) => {
    const quiet = s.state === 'went_quiet';
    const dotCls = quiet ? 'quiet' : 'dormant';
    const tagCls = quiet ? 'tag-quiet' : 'tag-dormant';
    const tag = quiet ? 'went quiet' : 'long-dormant';
    const flatColor = quiet ? 'var(--warn)' : 'var(--text-faint)';
    const extra = quiet ? ('was ~' + Math.round(s.req_per_min || 0) + ' req/min') : 'no data in 24h';
    const seen = (quiet ? 'went quiet ' : 'last seen ') + fmtAgo(s.last_seen);
    return html`
      <div class=${'inact-row clickable ' + (quiet ? 'quiet' : 'dormant')}
           title=${quiet ? 'Was steady and just stopped; check for an incident' : 'Long silent; likely decommissioned'}
           onClick=${() => openTraces(s.agent_id)}>
        <div class="inact-name" title=${s.agent_id || ''}><span class="status-dot ${dotCls}"></span>${agentName(s)}</div>
        <div><span class=${'inact-tag ' + tagCls}>${tag}</span></div>
        <div class="inact-flat">${_flatlineSvg(flatColor)}<span class="inact-flatline">${extra}</span></div>
        <div class="inact-meta"><span class="inact-seen">${seen}</span><br/>$${(s.today_cost || 0).toFixed(2)}<span class="unit"> today</span></div>
        <div class="inact-actions">
          <a href=${'#/traces?agent_id=' + encodeURIComponent(s.agent_id)} onClick=${e => e.stopPropagation()}>Traces</a>
          <a href=${'#/cost?agent_id=' + encodeURIComponent(s.agent_id)} onClick=${e => e.stopPropagation()}>Cost</a>
        </div>
      </div>`;
  };

  return html`
    <div class="panel">
      <div class="panel-head">
        <span class="grip">⣿</span>
        <span>SDK agents / services · cost & error rate</span>
        <span class="range"><span class="range-tag">last 24m · 1m step</span></span>
      </div>
      <div>
        ${live.length ? live.map(svcRow) : sdkLiveEmptyState(history)}
      </div>
    </div>
    ${inactive.length ? html`
      <details class="archive-block" open>
        <summary>
          <span class="tw">▶</span>
          <span>Inactive</span>
          <span class="a-count">(no telemetry in 24h) · ${inactive.length}</span>
          <span class="a-hint">keyed on last-seen · a silent service may be an outage</span>
        </summary>
        <div class="inactive-list">${inactive.map(inactRow)}</div>
      </details>` : null}
  `;
}

// Remember the window scroll position per list view so returning from a detail
// page (e.g. clicking an archived session then "Back to status") lands you
// where you were, not at the top. The window scrolls (.main#app has no own
// overflow). Saved across remounts via a module-level map; restored once the
// list has rendered (`ready`), since the list loads async and a too-early
// scrollTo would clamp against the still-empty page.
const _scrollMem = {};
function useScrollMemory(key, ready) {
  const restored = useRef(false);
  useEffect(() => {
    const onScroll = () => { _scrollMem[key] = window.scrollY; };
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, [key]);
  useLayoutEffect(() => {
    if (ready && !restored.current && _scrollMem[key] != null) {
      restored.current = true;
      window.scrollTo(0, _scrollMem[key]);
    }
  }, [ready, key]);
}

// The coding-zone archive is capped server-side (ARCHIVE_LIMIT,
// api/routes/status.py) — 50 most-recent, most-active terminal/stale
// sessions, not the whole archive. Rendering the cap's own length with no
// qualifier ("50 archived") reads as a complete count against a much larger
// real total. `total` is /status's own `archived_total` (the count before
// the cap); it is best-effort — a sibling backend change may not have
// landed yet — so an absent/non-numeric total falls back to wording that
// makes no total claim at all, never "of undefined" or a fabricated "of 0".
function archivedCountLabel(shown, total) {
  if (typeof total !== 'number' || !Number.isFinite(total)) return String(shown);
  return shown + ' of ' + total.toLocaleString('en-US');
}

// A generic "N card tiles in a grid" skeleton, shaped like the `.cards`/
// `.card`/`.card-header`/`.card-row` geometry every card-grid screen already
// uses (Status's session tiles, Session/Run detail's overview cards) --
// content fills these in rather than replacing a differently-shaped block.
// `rows` is how many `.card-row`-shaped lines each tile shows.
function CardGridSkeleton(count, rows = 3) {
  return html`
    <div class="cards" aria-hidden="true">
      ${Array.from({ length: count }, (_, i) => html`
        <div class="card" key=${i}>
          <div class="card-header"><span class="shimmer" style="display:inline-block;height:13px;width:60%"></span></div>
          ${Array.from({ length: rows }, (_, j) => html`
            <div class="card-row" key=${j}>
              <span class="shimmer" style="display:inline-block;height:11px;width:${40 + (j * 11) % 30}%"></span>
              <span class="shimmer" style="display:inline-block;height:11px;width:${25 + (j * 7) % 20}%"></span>
            </div>`)}
        </div>`)}
    </div>`;
}

// A generic table-shaped skeleton (header row + N shimmer rows), for screens
// whose loaded content is a plain data table (Drift's per-agent metrics,
// Budget's per-agent/per-provider caps) -- same fill-in-don't-replace
// convention as CardGridSkeleton above, just table-shaped instead of card-grid
// shaped.
function TableRowsSkeleton(headers, rowCount) {
  return html`
    <table aria-hidden="true">
      <thead><tr>${headers.map((h, i) => html`<th key=${i}>${h}</th>`)}</tr></thead>
      <tbody>
        ${Array.from({ length: rowCount }, (_, i) => html`
          <tr key=${i}>
            ${headers.map((_, j) => html`<td key=${j}><span class="shimmer" style="display:inline-block;height:11px;width:${j === 0 ? 70 : 40 + (j * 13) % 25}%"></span></td>`)}
          </tr>`)}
      </tbody>
    </table>`;
}

// ============================
// Status View
// ============================
function StatusView({ params, persona, personaKnown, routeView }) {
  // Optional single-agent filter via URL (#112), filtered client-side.
  // The Status screen is two content-defined zones (#306): coding sessions
  // (bounded work → archived list) and SDK services (unbounded telemetry →
  // inactive list). Content, not a user toggle, decides what renders.
  const agentId = readParam(params, 'agent_id', '');
  const [data, setData] = useState(null);
  // Inline session-card rename (#306): which session's title is being edited,
  // its working value, and a ref so the input autofocuses + selects on open.
  const [editingId, setEditingId] = useState(null);
  const [editValue, setEditValue] = useState('');
  const renameRef = useRef(null);
  useLayoutEffect(() => {
    if (editingId && renameRef.current) {
      renameRef.current.focus();
      renameRef.current.select();
    }
  }, [editingId]);

  // `/alerts` is no longer fetched here: the five-row teaser that used to close
  // this page is replaced by the Alerts TAB in the SDK-services zone, which
  // renders AlertsView and does its own read. Two reads of the same endpoint on
  // one screen is how a teaser and a page end up disagreeing.
  const load = useCallback(async () => {
    setData(await api('/status'));
  }, []);

  // SDK SESSION HISTORY, its OWN read with its OWN resolved flag. It is a
  // separate state rather than a field on `data` precisely so the surfaces
  // below gate on whether THIS fetch answered — `/status` answering says
  // nothing about whether the history is known, and sharing one flag is how a
  // panel ends up claiming an absence off an unresolved read.
  //
  // `known: false` is the initial state and it is load-bearing: no count and no
  // "no X" copy may render until it flips.
  const [sdkHistory, setSdkHistory] = useState({ known: false, sessions: [], capped: false });
  useEffect(() => {
    if (!showSdkZoneFor(persona, personaKnown)) return undefined;
    let cancelled = false;
    api('/sessions', { persona: 'sdk', limit: SDK_HISTORY_LIMIT })
      .then(d => {
        if (cancelled) return;
        const sessions = (d && d.sessions) || [];
        setSdkHistory({
          known: true, sessions,
          // The endpoint applies `limit` AFTER the persona filter, so a full
          // page means there may be more — disclosed as `N+` rather than
          // published as a total.
          capped: sessions.length >= SDK_HISTORY_LIMIT,
        });
      })
      // A FAILED read is not an empty one. Leaving `known` false keeps the
      // skeleton up rather than letting a network error render as "no SDK
      // traffic has ever been recorded".
      .catch(() => {});
    return () => { cancelled = true; };
  }, [persona, personaKnown]);

  useEffect(() => { load(); const t = setInterval(load, 5000); return () => clearInterval(t); }, [load]);

  // Restore scroll position when returning from a session/run detail page.
  useScrollMemory('status', !!data);

  if (!data) return html`<div class="page-title">Sessions</div>${CardGridSkeleton(6)}`;
  const sdkServices = data.sdk_services || [];
  // Persona decides which zones this page HAS, so the heading below must be
  // derived from it too: a page showing one zone must not open by promising
  // two. Alerts reuse `personaHides` rather than a second persona literal, so
  // this page and the nav can never disagree about whether alerts exist for
  // the reader.
  const showSdkZone = showSdkZoneFor(persona, personaKnown);
  // The coding zone is the other half of the same decision, and it was missing:
  // this page rendered every coding session regardless of the picker, so
  // switching to "SDK workflows" left a screenful of Claude Code cards under an
  // SDK heading. Persona-not-yet-known shows both zones rather than guessing.
  const showCodingZone = !personaKnown || persona !== 'sdk';
  // Which SDK-services tab is open. Alerts / Budget are tabs of that zone now,
  // not top-level pages (see SESSIONS_SDK_TABS); `routeView` carries which of
  // their routes brought us here, defaulting to the services list.
  const sdkTab = SESSIONS_SDK_TAB_VIEWS.has(routeView) ? routeView : 'services';
  // The "nothing here at all" state may only replace the page when there is
  // genuinely nothing else on it. Once the SDK-services zone renders, this
  // screen also hosts the alerts / budget tabs, and an empty service
  // list says nothing about whether an alert fired or a cap was set — swapping
  // the whole page for "No agents found" would take those away on the strength
  // of a different question's answer.
  if (!showSdkZone && !data.agents.length && !(data.archived || []).length && !sdkServices.length) return html`<div class="empty">No agents found. Run an agent with ${'`@watch()`'} to start recording.<code>pip install tokenjam && tj onboard</code></div>`;

  const agents = agentId ? data.agents.filter(a => a.agent_id === agentId) : data.agents;
  // Coding zone = interactive coding agents (cards) + coding archive.
  // SDK zone = data.sdk_services, rendered by SdkServicesPanel. The two zones
  // are content-defined, not a user-selected view (#306).
  const codingAgents = agents.filter(a => a.kind === 'coding');
  const codingArchived = (data.archived || []).filter(s => s.kind === 'coding' && (!agentId || s.agent_id === agentId));
  // WHETHER THE CODING ZONE PUTS ANYTHING ON THE PAGE, hoisted because three
  // places need the same answer and they must agree: the header's active/
  // archived count, the zone itself, and the separator below it. `showCodingZone`
  // alone is not that answer — the persona can permit the zone while it has
  // nothing to render — and treating the two as interchangeable is what left a
  // separator standing on its own.
  const codingZoneShown = showCodingZone && !!(codingAgents.length || codingArchived.length);
  // Short names, disambiguated WITHIN each list: the cards and the archive are
  // two lists, so each resolves its own collisions rather than sharing a map
  // that could shorten a name in one on the strength of the other's contents.
  const cardNames = disambiguateAgentNames(codingAgents);
  const archNames = disambiguateAgentNames(codingArchived);

  // Group coding tiles by project (service.namespace). Agents whose telemetry
  // carried no namespace fall under "Ungrouped".
  const UNGROUPED = ' ungrouped';
  const groups = {};
  for (const a of codingAgents) {
    const key = a.namespace || UNGROUPED;
    (groups[key] = groups[key] || []).push(a);
  }
  const groupKeys = Object.keys(groups).sort((x, y) =>
    x === UNGROUPED ? 1 : y === UNGROUPED ? -1 : x.localeCompare(y));
  // Only show project headers when at least one agent has a real namespace.
  const showHeadings = groupKeys.some(k => k !== UNGROUPED);

  // Per-group count of current sessions hidden by the per-agent tile cap.
  // `overflow` is duplicated across an agent's tiles, so dedupe by agent_id.
  const groupOverflow = (key) => {
    const seen = {};
    let total = 0;
    for (const a of groups[key]) {
      if (a.overflow && !seen[a.agent_id]) { seen[a.agent_id] = 1; total += a.overflow; }
    }
    return total;
  };

  // Coding-session tile. The whole card is clickable through to the session
  // detail (or traces when there's no session_id yet). Cost goes through the
  // shared fmtPerItemCost(framing) path (#249). A footer echoes the openable
  // method surfaces (Map / Approach / Timeline live as tabs on the detail page).
  // Persist a right-click rename, then refresh immediately (don't wait for the
  // 5s poll). An empty value clears the rename (backend reverts to the default).
  const submitRename = async (a) => {
    const value = editValue.trim();
    setEditingId(null);
    try {
      await apiPost('/sessions/' + encodeURIComponent(a.session_id) + '/label', { label: value });
      await load();
    } catch (e) { /* leave the existing name; a transient failure isn't fatal */ }
  };

  const agentCard = (a) => {
    // The card's own name: a user-set label wins, else the agent's display
    // name (project without the tool prefix), never the raw id.
    const displayName = a.label || cardNames.get(a.agent_id) || agentName(a);
    const isEditing = a.session_id && editingId === a.session_id;
    const startEdit = a.session_id
      ? (e) => { e.preventDefault(); e.stopPropagation(); setEditValue(displayName); setEditingId(a.session_id); }
      : null;
    return html`
        <div class="card clickable" onContextMenu=${startEdit} onClick=${() => { if (isEditing) return; location.hash = a.session_id ? '#/sessions/' + a.session_id : '#/traces'; }}>
          <div class="card-header">
            <span class="status-dot ${a.status}"></span>
            ${isEditing
              ? html`<input ref=${renameRef} class="rename-input" value=${editValue}
                  onClick=${e => e.stopPropagation()}
                  onInput=${e => setEditValue(e.target.value)}
                  onBlur=${() => submitRename(a)}
                  onKeyDown=${e => {
                    e.stopPropagation();
                    if (e.key === 'Enter') { e.preventDefault(); submitRename(a); }
                    else if (e.key === 'Escape') { e.preventDefault(); setEditingId(null); }
                  }} />`
              : html`<span class="rename-title" title=${a.session_id ? 'Click ✎ or right-click to rename' : null} onContextMenu=${startEdit}>${displayName}${a.session_id ? html`<span class="rename-pencil" onClick=${startEdit} title="Rename">✎</span>` : null}</span>`}
            <span class="badge badge-${a.status}" style="margin-left:auto">${a.status}</span>
          </div>
          ${a.label ? html`<div class="card-row"><span class="label">Agent</span><span class="value" style="font-family:'Geist Mono',monospace;font-size:12px">${a.agent_id}</span></div>` : null}
          ${a.session_id ? html`<div class="card-row"><span class="label">Session</span><span class="value" style="font-family:'Geist Mono',monospace;font-size:12px">${a.session_id.slice(0, 8)}</span></div>` : null}
          <div class="card-row"><span class="label">Cost today <span class="info-btn">i<span class="info-tip">Estimated from token usage at API list rates.</span></span></span><span class="value">${fmtPerItemCost(a.cost_today, _costVal(a, true), data.framing)}</span></div>
          <div class="card-row"><span class="label">Tokens</span><span class="value">${fmtTokens(a.input_tokens)} in / ${fmtTokens(a.output_tokens)} out</span></div>
          <div class="card-row"><span class="label">Tool calls</span><span class="value">${a.tool_call_count}${a.error_count ? ' (' + a.error_count + ' failed)' : ''}</span></div>
          ${a.active_seconds != null ? html`<div class="card-row"><span class="label">Active <span class="info-btn">i<span class="info-tip">Compute time: the sum of this session's span durations. The work actually done.</span></span></span><span class="value">${fmtDur(a.active_seconds * 1000)}</span></div>` : null}
          ${a.duration_seconds != null ? html`<div class="card-row"><span class="label">Elapsed <span class="info-btn">i<span class="info-tip">Wall-clock from session start to last activity. Resumed Claude Code sessions span days, so this can be far larger than Active time.</span></span></span><span class="value">${fmtDurLong(a.duration_seconds * 1000)}</span></div>` : null}
          ${a.last_span_time ? html`<div class="card-row"><span class="label">Last seen</span><span class="value">${fmtAgo(a.last_span_time)}</span></div>` : null}
          ${/* Gated on whether the reader can OPEN alerts at all. Alerts now
                live in the SDK-services zone, so `showSdkZone` is the same
                question — a claude-code card showing "2 active" would point at
                a surface that persona has no route to.
                This line referenced a `showAlerts` binding that was deleted
                when alerts moved; the reference survived, and because it sits
                inside `agentCard` it only evaluates when there IS an active
                coding card to draw, so it never fired on a corpus with none. */ ''}
          ${a.active_alerts > 0 && showSdkZone ? html`<div class="card-row"><span class="label">Alerts</span><span class="value" style="color:var(--error)">${a.active_alerts} active</span></div>` : null}
          <div class="card-foot">View details →</div>
        </div>`;
  };

  // Archived coding-session row (mock parity): dot · session+badge · cost ·
  // tokens · duration (derived from started_at→last_span_time) · tool calls ·
  // ended-ago · Map/Approach/Timeline. The whole row opens the frozen session.
  const archRow = (s) => {
    const dur = (s.started_at && s.last_span_time)
      ? fmtDurLong(new Date(s.last_span_time).getTime() - new Date(s.started_at).getTime())
      : '-';
    // The "ended"/"last activity" prefix is redundant under the "Ended" column
    // header — just the relative time. (A stale row is flagged by its badge.)
    const endedLabel = fmtAgo(s.last_span_time || s.started_at);
    return html`
      <tr class=${s.session_id ? 'clickable' : ''} onClick=${() => { if (s.session_id) location.hash = '#/sessions/' + s.session_id; }}>
        ${/* No status dot and no "completed" badge: every archived row is done by
              definition (an active session sits above this table), so "completed"
              was pure noise. Only 'stale' — a session that timed out rather than
              ending cleanly — is a genuinely different state, so it alone keeps a
              badge. */ ''}
        <td class="a-id">${s.label || (s.session_id ? s.session_id.slice(0, 8) : '-')}${s.status === 'stale' ? html` <span class="badge badge-stale" style="margin-left:4px">stale</span>` : null}</td>
        <td class="a-agent" title=${s.agent_id || ''}>${archNames.get(s.agent_id) || agentName(s)}</td>
        <td class="num" style="color:var(--text);font-weight:600">${fmtFramedDollar(s.total_cost_usd, data.framing)}</td>
        <td class="dim">${fmtTokens(s.input_tokens)} / ${fmtTokens(s.output_tokens)}</td>
        <td class="dim">${dur}</td>
        <td class="num dim">${s.tool_call_count != null ? s.tool_call_count : '-'}</td>
        <td class="dim">${endedLabel}</td>
        <td class="row-actions">
          ${s.session_id ? html`
            <a href=${'#/sessions/' + s.session_id} onClick=${e => e.stopPropagation()}>Details →</a>` : null}
        </td>
      </tr>`;
  };

  return html`
    ${/* One heading, "Sessions", with the persona dropdown bare beside it —
          consistent with the Dashboard and Optimize headers. The old duplicated
          "Coding sessions · bounded work · active→idle→stale→closed" tagline (it
          appeared twice) is gone; the active/archived count carries the useful
          part. The SDK two-zone case keeps a small zone label so the coding zone
          is still distinguishable from the SDK-services panel below. */ ''}
    <div class="ov-head">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <div class="page-title" style="margin:0">Sessions</div>
        <${PersonaPicker} bare=${true} />
      </div>
      ${/* The count describes the CODING zone, so it may only appear when that
            zone does. Viewing as SDK it read "5 active · 50 of 5,741 archived"
            above a page with no coding sessions on it — a figure published
            beside a population it does not cover (root anti-pattern 22b). */ ''}
      ${codingZoneShown ? html`
        <span class="zone-count" style="align-self:center">${codingAgents.length} active · ${archivedCountLabel(codingArchived.length, data.archived_total)} archived</span>` : null}
    </div>
    ${agentId ? html`<div style="font-size:12px;color:var(--text-dim);margin:2px 0 16px;font-family:'Geist Mono',monospace">Filtered to <span class="mono">${agentId}</span> · <a href="#/sessions" style="color:var(--brand)">show all</a></div>` : null}

    ${codingZoneShown ? html`
      ${showSdkZone ? html`
        <div class="zone-head">
          <span class="zone-title">Coding sessions</span>
          <span class="zone-sub">bounded work · active → idle → stale → closed</span>
        </div>` : null}
      ${codingAgents.length ? groupKeys.map(key => html`
        ${(showHeadings || groupOverflow(key) > 0) ? html`
          <div style="display:flex;align-items:baseline;gap:10px;margin:18px 0 10px;font-family:'Geist Mono',monospace">
            <span style="font-size:13px;font-weight:600;color:var(--text)">${key === UNGROUPED ? 'Ungrouped' : key}</span>
            <span style="font-size:12px;color:var(--text-dim)">${groups[key].length} session${groups[key].length > 1 ? 's' : ''} · ${fmtCost(Object.values(groups[key].reduce((m, a) => (m[a.agent_id] = a.cost_today || 0, m), {})).reduce((s, c) => s + c, 0))} today${groupOverflow(key) > 0 ? ' · +' + groupOverflow(key) + ' more' : ''}</span>
          </div>` : null}
        <div class="cards">
          ${groups[key].map(agentCard)}
        </div>
      `) : html`
        <div style="font-size:12px;color:var(--text-dim);margin:8px 0 4px;font-family:'Geist Mono',monospace">No active coding sessions</div>`}

      ${/* The archive is a zone of this screen, not a drawer. It used to be a
            `<details>` the reader had to open, which made the closed sessions
            — most of what this screen holds — a click away behind a strip that
            read like a header. It is now a zone head plus the same
            `.panel > .table-wrap > table` head-strip every other data grid in
            the app uses. */ ''}
      ${codingArchived.length > 0 ? html`
        <div class="section-gap"></div>
        <div class="zone-head">
          <span class="zone-title">Archived</span>
          <span class="zone-sub">closed / stale · ${archivedCountLabel(codingArchived.length, data.archived_total)}</span>
        </div>
        <div class="panel">
          <div class="table-wrap"><table class="archive-list">
            <thead><tr><th>Session</th><th>Agent</th><th class="num">Cost</th><th>Tokens in / out</th><th>Duration</th><th class="num">Tools</th><th>Ended</th><th></th></tr></thead>
            <tbody>
              ${codingArchived.map(archRow)}
            </tbody>
          </table></div>
        </div>` : null}
    ` : null}

    ${/* THE SDK-SERVICES ZONE, now with its cross-agent surfaces attached.
          Alerts and Budget used to be top-level nav entries that no persona
          could actually open. Neither is per-session — budget is spend caps,
          alerts fire across agents — so they belong to the zone that lists the
          services, not to the session cards above. The strip renders whenever
          the zone does, including with no services live: an empty service list
          says nothing about whether an alert fired or a cap was set.

          THE BASELINE-COMPARISON SURFACE IS UN-SURFACED, NOT DELETED (founder
          decision). `DriftView`, the `/drift` route and the detector behind
          them all remain; this zone simply no longer offers a tab for them and
          nothing else links there. Re-surfacing is a wiring change: put the
          entry back in SESSIONS_SDK_TABS and SESSIONS_SDK_TAB_VIEWS and render
          the component here. Do NOT take the component's absence from this
          strip as licence to delete it.

          The old five-row "Recent Alerts" table that used to close this page is
          gone, superseded by the Alerts tab beside it — one surface for alerts
          on this screen rather than a teaser and a page disagreeing about how
          many there are. */ ''}
    ${showSdkZone ? html`
      ${/* A SEPARATOR, so it only exists when there are two things to separate.
            It used to sit above an "SDK services" zone-head that has since been
            removed as a duplicate, and it kept its place: viewing as SDK, where
            the coding zone renders nothing at all, it opened a 28px band of
            dead space between the page header and the tab row below. It is not
            unconditionally wrong either — with both zones on screen it is the
            only thing between the archived table and this strip — so it is
            conditional on the zone above having actually rendered, not deleted.
            `.tab-bar` carries its own margin-bottom; this is the top side. */ ''}
      ${codingZoneShown ? html`<div class="section-gap"></div>` : null}
      <div class="tab-bar" role="tablist">
        ${SESSIONS_SDK_TABS.map(([key, label]) => html`
          <a key=${key} class=${'tab' + (sdkTab === key ? ' active' : '')} role="tab"
             aria-selected=${sdkTab === key}
             href=${key === 'services' ? '#/sessions' : '#/' + key}>${label}</a>`)}
      </div>
      ${/* The panel ALWAYS renders, even with no discovered services: it owns
            the live-window empty state, and that state now has to be decided
            against the history read (see sdkLiveEmptyState). The bare
            `<div class="svc-empty">No SDK services live right now</div>`
            fallback that used to sit here bypassed the panel entirely, so on
            the exact case the founder hit — SDK sessions present, none inside
            the 7-day discovery window — that one sentence WAS the whole page. */ ''}
      ${sdkTab === 'services' ? html`
        <${SdkServicesPanel} services=${sdkServices} framing=${data.framing} history=${sdkHistory} />
        <${SdkSessionHistory} history=${sdkHistory} framing=${data.framing} />` : null}
      ${sdkTab === 'alerts' ? html`<${AlertsView} params=${EMPTY_PARAMS} persona=${persona} />` : null}
      ${sdkTab === 'budget' ? html`<${BudgetView} params=${EMPTY_PARAMS} />` : null}
    ` : null}
  `;
}

// ============================
// Session Detail View
// ============================
function SubagentBlock({ subagent }) {
  const [open, setOpen] = useState(false);
  const name = subagent.name || ('agent ' + (subagent.agent_id || '').slice(0, 8));
  const steps = subagent.steps || [];
  const count = subagent.step_count != null ? subagent.step_count : steps.length;
  const status = subagent.is_error ? 'error' : 'ok';
  // A capped/cycle ref has no expandable story — show a dim note instead.
  const capped = subagent.depth_capped || subagent.budget_capped || subagent.cycle;
  const cappedNote = subagent.cycle ? '… already shown above (cycle) …'
    : subagent.depth_capped ? '… deeper subagents omitted (depth cap) …'
    : subagent.budget_capped ? '… deeper subagents omitted (size cap) …'
    : null;
  return html`
    <div class="story-subagent">
      <div class=${'story-subagent-head' + (status === 'error' ? ' error' : '')}
           onClick=${() => !capped && setOpen(o => !o)}
           style=${capped ? 'cursor:default' : 'cursor:pointer'}>
        <span class="story-subagent-caret">${capped ? '·' : (open ? '▾' : '▸')}</span>
        <span class="story-subagent-label">subagent: ${name}</span>
        ${!capped ? html`<span class="story-subagent-meta">${count} step${count === 1 ? '' : 's'} · ${status === 'error' ? '✗' : '✓'}</span>` : null}
      </div>
      ${cappedNote ? html`<div class="story-omitted">${cappedNote}</div>` : null}
      ${(open && !capped) ? html`
        <div class="story-subagent-body">
          ${subagent.task ? html`
            <div class="story-callout" style="margin-bottom:8px">
              <div class="story-callout-label">Task</div>
              <div class="story-callout-body">${subagent.task}</div>
            </div>` : null}
          ${renderTimelineSteps(steps)}
          ${subagent.outcome ? html`
            <div class="story-callout" style="margin-top:8px">
              <div class="story-callout-label">Outcome</div>
              <div class="story-callout-body">${subagent.outcome}</div>
            </div>` : null}
        </div>
      ` : null}
    </div>
  `;
}

// First line of the narration (for the collapsed dense row).
function firstLine(text) {
  if (!text) return '';
  const nl = text.indexOf('\n');
  return nl === -1 ? text : text.slice(0, nl);
}

// Render a step list NEWEST-FIRST (data is canonical oldest-first; we reverse in
// render only). prevModel is the chronologically-previous step's model so the
// "model changed" dim tag tracks the real timeline, not the reversed order.
//
// The unit of the Timeline is the EXCHANGE: one human ask, then the steps it
// produced. The design frames that as a labelled "Ask" callout over a bordered
// panel of flat rows, and this emits exactly that pair, once per exchange. It
// repeats rather than pinning a single ask at the top of the page: a session
// gets many asks, and the first one stops describing the work almost at once.
// Returns a list of `.story-exchange` blocks, each supplying its own panel —
// callers must not wrap the result in another `.story-steps`.
function renderTimelineSteps(steps) {
  // Newest ask on top (like an inbox), but each ask reads top-down in order —
  // the prompt, then its responses chronologically — so input/output pair the
  // way the terminal shows them.
  const groups = [];
  let cur = null;
  for (let i = 0; i < steps.length; i++) {
    const step = steps[i];
    if (cur === null || step.ask != null) {
      cur = { ask: step.ask != null ? step.ask : null, items: [] };
      groups.push(cur);
    }
    cur.items.push({ step, i });
  }
  const out = [];
  for (let g = groups.length - 1; g >= 0; g--) {
    const grp = groups[g];
    const rows = [];
    let prevModel = null;
    for (const { step, i } of grp.items) {
      if (step.omitted != null) {
        rows.push(html`<div class="story-omitted" key=${'om' + i}>… ${step.omitted} step${step.omitted === 1 ? '' : 's'} omitted …</div>`);
      } else {
        rows.push(html`<${StoryStep} step=${step} prevModel=${prevModel} key=${step.n} />`);
        prevModel = step.model || prevModel;
      }
    }
    out.push(html`
      <div class="story-exchange" key=${'ex' + g}>
        ${grp.ask != null ? html`<${StoryAsk} prompt=${grp.ask} />` : null}
        <div class="panel"><div class="story-steps">${rows}</div></div>
      </div>`);
  }
  return out;
}

// A user prompt in the Timeline — the human ask that began an exchange, in the
// design's labelled callout so a prompt reads as a different KIND of thing from
// the agent's steps rather than as a differently-coloured one. Long asks clamp
// to a preview and toggle open on click.
function StoryAsk({ prompt }) {
  const [expanded, setExpanded] = useState(false);
  const long = prompt.length > 200;
  const short = long ? prompt.slice(0, 200) + '…' : prompt;
  return html`
    <div class=${'story-callout story-ask' + (long ? ' clickable' : '')}
         onClick=${long ? (() => setExpanded(e => !e)) : null}>
      <div class="story-callout-label">Ask</div>
      <div class="story-callout-body">${expanded ? prompt : short}</div>
    </div>`;
}

function StoryStep({ step, prevModel }) {
  const [expanded, setExpanded] = useState(false);
  const text = step.text || '';
  const tools = step.tools || [];
  const subagents = step.subagents || (step.subagent ? [step.subagent] : []);
  // Show the model only when it CHANGES from the previous step (noise on every row otherwise).
  const showModel = step.model && step.model !== prevModel;
  const preview = firstLine(text);
  // When a step is a pure tool action (no narration), surface the tool's
  // command/path inline instead of a dim "(no narration)" — the thing you'd
  // otherwise have to expand to see. Joins each tool's label (or its name when
  // unlabelled); the inline chips still carry the tool name + ok/error status.
  const toolLine = !preview && tools.length
    ? tools.map(t => (t.label || t.name || '').trim()).filter(Boolean).join(' · ')
    : '';
  const hasMore = subagents.length > 0 || tools.length > 0 || (text && (step.text_truncated || text.indexOf('\n') !== -1 || text.length > preview.length));
  return html`
    <div class=${'story-step' + (step.is_error ? ' error' : '')}>
      ${/* Row order follows the design: the meta a reader skims down the left
            (caret, step number, time, model), then the description, then the
            retry annotation pushed hard right. The tool chips are ours, not the
            mock's, and sit just before the description because on a tool-only
            step the description IS the tool's command. */ ''}
      <div class="story-step-row" onClick=${() => setExpanded(e => !e)}>
        <span class="story-caret">${hasMore ? (expanded ? '▾' : '▸') : ''}</span>
        <span class="story-step-n">#${step.n}</span>
        ${step.ts ? html`<span class="story-step-time" title=${step.ts}>${fmtAgo(step.ts)}</span>` : null}
        ${showModel ? html`<span class="story-model-tag" title=${step.model}>${step.model}</span>` : null}
        ${tools.map(t => html`
          <span class=${'story-chip inline' + (t.status === 'error' ? ' error' : '')} title=${t.label || t.name}>
            <span class="story-chip-name">${t.name}</span>
            <span class=${'story-chip-status ' + t.status}>${t.status === 'error' ? '✗' : '✓'}</span>
          </span>
        `)}
        <span class=${'story-line' + (preview ? '' : (toolLine ? ' tool' : ' dim'))} title=${toolLine || ''}>${preview || toolLine || '(no narration)'}</span>
        ${step.is_retry ? html`<span class="story-retry" title="retry">↺ retry</span>` : null}
      </div>
      ${expanded ? html`
        <div class="story-step-body">
          ${text ? html`<div class="story-text">${text}</div>` : null}
          ${tools.length > 0 ? html`
            <div class="story-chips" style="margin-top:8px">
              ${tools.map(t => html`
                <span class=${'story-chip' + (t.status === 'error' ? ' error' : '')} title=${t.label || t.name}>
                  <span class="story-chip-name">${t.name}</span>
                  ${t.label ? html`<span class="story-chip-label">${t.label}</span>` : null}
                  <span class=${'story-chip-status ' + t.status}>${t.status === 'error' ? '✗' : '✓'}</span>
                </span>
              `)}
            </div>
          ` : null}
          ${tools.filter(t => t.error).map(t => html`
            <div class="story-error"><span class="story-error-tool">${t.name} failed</span>${t.error}</div>
          `)}
          ${subagents.map((sa, i) => html`<${SubagentBlock} subagent=${sa} key=${'sa' + (sa.agent_id || i)} />`)}
        </div>
      ` : null}
    </div>
  `;
}

function StorySection({ sessionId }) {
  const [story, setStory] = useState(null);

  // Poll like every other view on this route so a live session's Timeline
  // updates in place. The /story endpoint re-parses the on-disk transcript on
  // each call, so new steps appear without remounting (switching tabs / leaving
  // and returning to the route). On a transient poll failure, keep the last
  // good Timeline — only fall back to the unavailable state on the first load.
  const load = useCallback(() => {
    api('/sessions/' + sessionId + '/story')
      .then(d => setStory(sanitizeStoryPayload(d)))   // de-mojibake at load
      .catch(() => setStory(prev => prev || { available: false }));
  }, [sessionId]);

  useEffect(() => { load(); const t = setInterval(load, 10000); return () => clearInterval(t); }, [load]);

  if (!story) return null;

  if (!story.available) {
    return html`
      <div class="story-unavailable">No transcript on disk. Timeline is available for Claude Code sessions.</div>
    `;
  }

  const steps = story.steps || [];

  // No pinned Task/Outcome summary: in a long-running session the first prompt
  // and last narration go stale (new prompts get sent, work continues). The
  // newest ask on top; within each ask the steps read in order (prompt first).
  // No repeated "Timeline" heading here — the active tab button already carries
  // the label (lens redesign; same for every other session-detail tab body).
  return html`
    <div class="tab-cap">The agent's own narration + tool calls, newest ask first; each reads in order${story.step_count ? ' · ' + story.step_count + ' step' + (story.step_count === 1 ? '' : 's') : ''}</div>

    ${steps.length === 0
      ? html`<div class="story-unavailable">Transcript found but no narrated steps.</div>`
      : renderTimelineSteps(steps)}
  `;
}

/* ==================== Approach/Map presentation helpers ====================
   Text-hygiene + layout helpers shared by the Approach spine and Map board:
   mojibake scrub, inline markdown, label truncation, chat-run detection,
   verify-flavored delegation detection, phase-title cleanup. */

// strip UTF-8-as-Latin-1 mojibake ("Â " / "Â " artifacts), collapse
// doubled spaces, trim. Applied to task/outcome/labels/quotes at data-load time.
function stripMojibake(s) {
  if (typeof s !== 'string') return s;
  return s
    .replace(/Â /g, ' ')
    .replace(/Â /g, ' ')
    .replace(/ /g, ' ')
    .replace(/  +/g, ' ')
    .trim();
}
// Deep-sanitize an approach payload in place-of a copy (immutable): task, outcome,
// every move label/quote, delegation task, nested spines, agent names.
// Same scrub for the Timeline's /story payload — asks and step narration come
// off the same mis-decoded transcript text as the approach spine.
function sanitizeStoryPayload(d) {
  if (!d || typeof d !== 'object') return d;
  return {
    ...d,
    task: stripMojibake(d.task),
    outcome: stripMojibake(d.outcome),
    steps: (d.steps || []).map((s) => ({
      ...s,
      text: stripMojibake(s.text),
      ask: s.ask != null ? stripMojibake(s.ask) : s.ask,
    })),
  };
}

function sanitizeApproachPayload(d) {
  if (!d || typeof d !== 'object') return d;
  const move = (m) => ({
    ...m,
    label: stripMojibake(m.label),
    quote: stripMojibake(m.quote),
    evidence: (m.evidence || []).map((e) => ({ ...e, label: stripMojibake(e.label), name: stripMojibake(e.name) })),
    delegations: (m.delegations || []).map(deleg),
  });
  function deleg(x) {
    return { ...x, name: stripMojibake(x.name), task: stripMojibake(x.task), spine: (x.spine || []).map(move) };
  }
  return {
    ...d,
    task: stripMojibake(d.task),
    outcome: stripMojibake(d.outcome),
    name: stripMojibake(d.name),
    spine: (d.spine || []).map(move),
    cross_terminal: (d.cross_terminal || []).map((c) => ({ ...c, name: stripMojibake(c.name), spine: (c.spine || []).map(move) })),
    agents: (d.agents || []).map((a) => ({ ...a, name: stripMojibake(a.name) })),
  };
}

// tiny inline-markdown → vnode renderer for **bold**, *italic*, `code`. No
// HTML injection risk: text runs become preact text nodes (auto-escaped), markers
// become <strong>/<em>/<code> vnodes. No links, no headings.
function mdInline(text) {
  if (typeof text !== 'string') return text;
  const re = /(\*\*([^*]+?)\*\*|\*([^*\s][^*]*?)\*|`([^`]+?)`)/g;
  const out = [];
  let last = 0, m;
  while ((m = re.exec(text)) !== null) {
    if (m.index > last) out.push(text.slice(last, m.index));
    if (m[2] != null) out.push(h('strong', null, m[2]));
    else if (m[3] != null) out.push(h('em', null, m[3]));
    else if (m[4] != null) out.push(h('code', { class: 'md-code' }, m[4]));
    last = re.lastIndex;
  }
  if (last < text.length) out.push(text.slice(last));
  return out;
}

// split a quote into a headline sentence (up to first '. '/'! '/'? ' or 160
// chars, word-boundary) + the remaining text.
function splitLeadSentence(q) {
  const s = (q || '').trim();
  const m = s.match(/^.*?[.!?](?=\s)/);
  if (m && m[0].length <= 160) {
    return { head: m[0].trim(), rest: s.slice(m[0].length).trim() };
  }
  if (s.length <= 160) return { head: s, rest: '' };
  const slice = s.slice(0, 160);
  const sp = slice.lastIndexOf(' ');
  const cut = sp > 0 ? sp : 160;
  return { head: slice.slice(0, cut).replace(/[.!?,;:]+$/, '') + '…', rest: s.slice(cut).trim() };
}
// Strip a label's trailing truncation marker so it can be prefix-matched against
// the full quote.
const labelCore = (label) => (label || '').replace(/\s*(…|\.\.\.)\s*$/, '').trim();

// a delegation is "verify-flavored" when its name or task reads as a
// review/verification/audit step.
const VERIFY_NAME_RE = /\b(review|verif\w*|audit|validate|check)\b/i;
const isVerifyDeleg = (d) => !!d && (VERIFY_NAME_RE.test(d.name || '') || VERIFY_NAME_RE.test(d.task || ''));

// is this move part of a plain conversational run (agent narration, no tool
// evidence, no delegation, not a failure/retry)?
const isChatMove = (m) =>
  (m.kind || 'act') === 'act' && m.source === 'agent_words'
  && !(m.evidence && m.evidence.length) && !(m.delegations && m.delegations.length)
  && !m.failed && !m.is_retry;

// The outcome callout, closing the spine: a green "✅ Outcome" heading over the
// prose, 3-line clamp with a click-to-toggle "show all" (outcomes are truncated
// server-side mid-word, so an unclamped one can run very long). ✅ is the fourth
// glyph in the spine's vocabulary, and this is where it is spent.
function ApproachOutcome({ text }) {
  const [open, setOpen] = useState(false);
  return html`
    <div class="ap-outcome">
      <div class="ap-outcome-h">✅ Outcome</div>
      <div class="ap-outcome-body ${open ? '' : 'clamp'}">${mdInline(text)}</div>
      <span class="ap-outcome-more" onClick=${() => setOpen((o) => !o)}>${open ? '⌃ collapse' : '⌄ more'}</span>
    </div>`;
}

// render a method spine, collapsing any run of >4 consecutive conversational
// moves into first + a click-to-expand "· N conversational steps" row + last.
function ApproachSpine({ moves }) {
  const [open, setOpen] = useState({});
  const rows = [];
  let i = 0, runId = 0;
  while (i < moves.length) {
    let j = i;
    while (j < moves.length && isChatMove(moves[j])) j++;
    const runLen = j - i;
    if (runLen > 4) {
      const id = 'run' + (runId++);
      const mid = runLen - 2;
      rows.push(html`<${ApproachMove} move=${moves[i]} key=${'a' + i} />`);
      // The fold marker keeps the spine's two-column grid so its text lines up
      // with the prose above and below it, and its gutter cell stays empty: a
      // fold is not a move, so it must not put a glyph into the vocabulary.
      if (open[id]) {
        for (let k = i + 1; k < j - 1; k++) rows.push(html`<${ApproachMove} move=${moves[k]} key=${'m' + k} />`);
        rows.push(html`<div class="ap-collapse" key=${id} onClick=${() => setOpen((o) => ({ ...o, [id]: false }))}><span></span><span>collapse ${mid} conversational steps ⌃</span></div>`);
      } else {
        rows.push(html`<div class="ap-collapse" key=${id} onClick=${() => setOpen((o) => ({ ...o, [id]: true }))}><span></span><span>${mid} conversational steps ⌄</span></div>`);
      }
      rows.push(html`<${ApproachMove} move=${moves[j - 1]} key=${'z' + (j - 1)} />`);
      i = j;
    } else {
      rows.push(html`<${ApproachMove} move=${moves[i]} key=${'s' + i} />`);
      i++;
    }
  }
  return html`<div class="ap-spine">${rows}</div>`;
}
/* ================== end Approach/Map presentation helpers ================= */

// Small text/emoji marker per move kind (offline — no icon font).
const APPROACH_ICONS = { delegate: '⑂', dead_end: '✗', verify: '✅', act: '•' };

// One move on the Approach spine. A `delegate` move renders one rich card per
// entry in `move.delegations` (ApproachDelegation), each expanding into the
// child's own method spine — so the recursion runs through the delegation, not
// a flat children list. Source is reported honestly as the agent's own words or
// a structural inference — never an invented "distilled".
function ApproachMove({ move }) {
  const kind = move.kind || 'act';
  const isDead = kind === 'dead_end' || move.failed;
  const isRetry = !!move.is_retry;
  const icon = APPROACH_ICONS[kind] || '•';
  const srcWords = move.source === 'agent_words';
  const ev = move.evidence || [];
  const delegations = move.delegations || [];
  // a delegate move that carries its own delegation card(s) — suppress the
  // redundant label + "Agent <name>" evidence line, keep the ⑂ marker + cards.
  const isDelegateCard = kind === 'delegate' && delegations.length > 0;
  // when the quote just re-states the truncated label, drop the separate
  // italic line and un-truncate the headline to the quote's first sentence;
  // spill the remainder into the italic line.
  const rawLabel = move.label || '';
  const quote = move.quote || '';
  const core = labelCore(rawLabel);
  const isDupe = quote && core && core.length > 8 && quote.startsWith(core);
  const split = isDupe ? splitLeadSentence(quote) : null;
  const headline = isDupe ? split.head : rawLabel;
  const italic = isDupe ? split.rest : quote;
  // The provenance caption, in words. It replaces the old colored source CHIP
  // that sat beside the headline: a chip needed a legend of its own, competed
  // with the glyph gutter for the reader's attention, and said less than the
  // sentence does. The kind marker leads (a dead end is the thing you want to
  // know first), then how tokenjam knows the line: the agent's own narration,
  // or an inference from the transcript's structure.
  const srcTxt = srcWords ? "agent's own words" : 'structural inference';
  const srcBits = [];
  if (kind === 'dead_end') srcBits.push('dead end · reverted');
  else if (isRetry) srcBits.push('retry');
  if (kind === 'delegate' && delegations.length) {
    srcBits.push('structural inference · ' + delegations.length + ' dispatch' + (delegations.length === 1 ? '' : 'es'));
  } else {
    srcBits.push(srcTxt);
  }
  return html`
    <div class="ap-move ap-${kind} ${isDead ? 'dead' : ''} ${isRetry ? 'retry' : ''}">
      <div class="ap-ic">${icon}</div>
      <div class="ap-txt">
        ${isDelegateCard ? null : html`<div class="ap-label">${mdInline(headline)}</div>`}
        ${!isDelegateCard && italic ? html`<div class="ap-quote">${mdInline(italic)}</div>` : null}
        ${/* Always rendered, including on a delegate card whose headline is
              suppressed as redundant — a row that is only a glyph and a card
              breaks the column of prose the gutter is read against. */ ''}
        <div class="ap-src">${srcBits.join(' · ')}</div>
        ${!isDelegateCard && ev.length ? html`<div class="ap-ev">▸ ${ev.map((e, i) => html`<span class="ap-ev-item">${i > 0 ? ' · ' : ''}${e.name} ${e.label}${e.status === 'error' ? html` <span class="ap-ev-st err">✗</span>` : null}</span>`)}</div>` : null}
        ${delegations.map(d => html`<${ApproachDelegation} deleg=${d} />`)}
      </div>
    </div>
  `;
}

// A single delegation card: `↳ name · depth N · tokens · $cost · status`. Click
// to expand a nested block — the child's "how it solved its piece" sub-header,
// its mandate, and its own method spine (rendered by ApproachMove, recursively).
// A `capped` delegation shows a "not expanded — reason" note and never expands.
function ApproachDelegation({ deleg }) {
  const [open, setOpen] = useState(false);
  const capped = deleg.capped;
  const spine = deleg.spine || [];
  // verify-flavored delegation → ✅ accent + a 'verify' chip.
  const isVerify = isVerifyDeleg(deleg);
  const verifyChip = isVerify ? html`<span class="ap-verify-chip">✅ verify</span>` : null;
  const stats = [
    deleg.tokens != null ? fmtTokens(deleg.tokens) : null,
    deleg.cost_usd != null ? fmtCost(deleg.cost_usd) : null,
    deleg.status || (capped ? 'capped' : 'ended'),
  ].filter(Boolean).join(' · ');
  if (capped) {
    return html`
      <div class="ap-deleg capped ${isVerify ? 'ap-verify-deleg' : ''}">
        <span class="ap-caret">▶</span>
        <div class="ap-deleg-main">
          <div class="ap-deleg-name">↳ ${deleg.name} <span class="ap-depthtag">depth ${deleg.depth}</span>${verifyChip}</div>
          <div class="ap-deleg-note">not expanded: ${capped}</div>
        </div>
      </div>`;
  }
  return html`
    <div class="ap-deleg ${open ? 'open' : ''} ${isVerify ? 'ap-verify-deleg' : ''}" onClick=${() => setOpen(o => !o)}>
      <span class="ap-caret">▶</span>
      <div class="ap-deleg-main">
        <div class="ap-deleg-name">↳ ${deleg.name} <span class="ap-depthtag">depth ${deleg.depth}</span>${verifyChip}</div>
      </div>
      <span class="ap-deleg-stats">${stats}</span>
    </div>
    ${open ? html`
      <div class="ap-nested">
        <div class="ap-chead">↳ <b>${deleg.name}</b> · how the subagent solved its piece</div>
        ${deleg.task ? html`<div class="ap-cmandate">mandate: <i>${mdInline(deleg.task)}</i></div>` : null}
        ${spine.length
          ? html`<${ApproachSpine} moves=${spine} />`
          : html`<div class="ap-cmandate"><i>no moves reconstructed for this subagent</i></div>`}
      </div>` : null}
  `;
}

// A spliced cross-terminal child (M2b): a separate run-linked session the harness
// spawned in another terminal. Rendered amber (↗) under the "cross-terminal
// children" divider, expanding into the child's OWN method spine — the same
// recursive ApproachMove styling an in-session delegation uses.
function ApproachCrossTerminal({ child }) {
  const [open, setOpen] = useState(false);
  const spine = child.spine || [];
  return html`
    <div class="ap-deleg ap-xterm ${open ? 'open' : ''}" onClick=${() => setOpen(o => !o)}>
      <span class="ap-caret">▶</span>
      <div class="ap-deleg-main">
        <div class="ap-deleg-name">↗ ${child.name} <span class="ap-depthtag">cross-terminal</span></div>
        <div class="ap-prov">cross-terminal child · run-linked</div>
      </div>
    </div>
    ${open ? html`
      <div class="ap-nested ap-xterm-nested">
        <div class="ap-chead">↗ <b>${child.name}</b> · how the child session solved its piece</div>
        ${spine.length
          ? html`<${ApproachSpine} moves=${spine} />`
          : html`<div class="ap-cmandate"><i>no moves reconstructed for this child</i></div>`}
      </div>` : null}
  `;
}

// The left delegation-tree rail: every agent in the spawn tree (data.agents),
// indented by depth. One row per agent: status dot, name, and the cost hard
// right. Tokens and depth ride in title= rather than on the row — the rail
// answers "who was spawned, and which branch was expensive", and a second
// figure per row turns a tree back into a table.
function ApproachRail({ agents }) {
  return html`
    <div class="panel ap-rail">
      <div class="panel-head">Delegation tree</div>
      ${agents.map(a => {
        const isMain = a.depth === 0;
        // A cross-terminal child (M2b) is a separate run-linked session, not an
        // in-session sidechain — amber, honestly marked by capture_completeness.
        const isCross = a.provenance === 'cross_terminal_child';
        const isCapped = a.capture_completeness !== 'full';
        const dotClass = isMain ? 'is-main' : ((isCross || isCapped) ? 'is-term' : 'is-sub');
        const dCls = a.depth ? ('d' + Math.min(a.depth, 3)) : '';
        // Tokens + depth are the row's tooltip, not a second visible line.
        const meta = 'depth ' + (a.depth || 0)
          + (a.tokens != null ? ' · ' + fmtTokens(a.tokens) + ' tok' : '');
        let badgeCls = '', badgeTxt;
        if (isMain) { badgeCls = a.status === 'active' ? 'live' : ''; badgeTxt = a.status === 'active' ? '● live' : (a.status || 'completed'); }
        else if (isCross) { badgeCls = 'partial'; badgeTxt = a.capture_completeness === 'full' ? '⏏ ended · method kept' : 'session-level'; }
        else if (isCapped) { badgeCls = 'partial'; badgeTxt = '⏏ ' + (a.status || 'capped'); }
        else { badgeTxt = '⏏ ended · method kept'; }
        const provLine = isMain ? null
          : (isCross ? 'cross-terminal child · run-linked' : 'in-session subagent · from transcript');
        // a plain in-session subagent's badge ("⏏ ended · method kept") and
        // provenance ("in-session subagent · from transcript") are the defaults for
        // every killed sidechain — pure noise repeated down the rail. Hide both and
        // fold them into the node's title=; keep badges only for the exceptions
        // (main/live, cross-terminal, capped/killed).
        const isPlainSub = !isMain && !isCross && !isCapped;
        // Same rule as the plain sidechain below: a badge earns its width only
        // when it says something the default doesn't. A finished main agent is
        // the default for any session you are reading after the fact, so only
        // `● live` gets a badge — and the row keeps that width for the name.
        const isPlainMain = isMain && a.status !== 'active';
        const showBadge = !isPlainSub && !isPlainMain;
        // The name is truncated on the row, so it leads the tooltip.
        const nodeTitle = [a.name || '(unnamed)', meta, showBadge ? null : badgeTxt, provLine]
          .filter(Boolean).join(' · ');
        return html`
          <div class="ap-node ${dCls}" title=${nodeTitle}>
            <span class="ap-dot ${dotClass}"></span>
            <span class="ap-nname">${a.name || '(unnamed)'}</span>
            ${showBadge ? html`<span class="ap-badge ${badgeCls}">${badgeTxt}</span>` : null}
            ${/* Faint, hard right. A cost this rail cannot price is left blank
                  rather than shown as $0.00 — an unpriced branch is not a free
                  one, and a zero here would read as one. */ ''}
            <span class="ap-ncost">${a.cost_usd != null ? fmtCost(a.cost_usd) : ''}</span>
          </div>`;
      })}
      <div class="ap-railcap">Indent is spawn depth. Nodes below main were <b>killed</b> when done; their context is gone, so tokenjam rebuilds <b>how each one solved its piece</b> from the captured transcript. The badge never claims more than tokenjam actually has.</div>
    </div>
  `;
}

// The Approach tab: HOW the agent attempted the work. Same fetch idiom as the
// other session-detail tabs (poll the dedicated endpoint; keep the last good
// payload on a transient failure). Two columns: the delegation-tree rail + the focused method
// panel (a bordered header card with mandate/outcome/stats, the spine, a legend).
function ApproachSection({ sessionId }) {
  const [data, setData] = useState(null);

  const load = useCallback(() => {
    api('/sessions/' + sessionId + '/approach')
      .then(d => setData(sanitizeApproachPayload(d)))   // de-mojibake at load
      .catch(() => setData(prev => prev || { available: false }));
  }, [sessionId]);

  useEffect(() => { load(); const t = setInterval(load, 10000); return () => clearInterval(t); }, [load]);

  if (!data) return null;

  if (!data.available) {
    return html`
      <div class="story-unavailable">${data.reason || 'No transcript or snapshot for this session. Approach is available for Claude Code sessions.'}</div>
    `;
  }

  const spine = data.spine || [];
  const agents = data.agents || [];
  const crossTerminal = data.cross_terminal || [];
  const counts = data.counts || { moves: 0, delegations: 0, dead_ends: 0, verifies: 0 };
  // the backend reports verifies:0 — recompute client-side by counting
  // verify-flavored delegations across the spine (and cross-terminal children).
  let verifyCount = 0;
  const countVerify = (moves) => (moves || []).forEach((m) => {
    (m.delegations || []).forEach((d) => { if (isVerifyDeleg(d)) verifyCount++; });
  });
  countVerify(spine);
  crossTerminal.forEach((c) => countVerify(c.spine));
  const meta = data.meta || {};
  // The counts read across the head as one sentence about the attempt, in the
  // order a reader asks them: how much was done, how much was handed off, how
  // much was wasted, how much was checked, what it cost.
  const stats = [
    counts.moves + ' move' + (counts.moves === 1 ? '' : 's'),
    counts.delegations + ' delegation' + (counts.delegations === 1 ? '' : 's'),
    counts.dead_ends + ' dead end' + (counts.dead_ends === 1 ? '' : 's'),
    verifyCount + ' verif' + (verifyCount === 1 ? 'y' : 'ies'),
    meta.cost_usd != null ? fmtCost(meta.cost_usd) : null,
    meta.tokens != null ? fmtTokens(meta.tokens) + ' tok' : null,
  ].filter(Boolean);
  // No repeated "Approach" heading here — the active tab button already
  // carries the label (lens redesign; same for every session-detail tab body).
  return html`
    <div class="tab-cap">How the agent attempted it: the method spine, rebuilt for every agent and kept after each is killed; expand any delegation to recurse into the child's own method${data.from_snapshot ? ' · from snapshot' : ''}.</div>
    <div class="ap-grid">
      <${ApproachRail} agents=${agents} />
      <div class="panel ap-panel">
        <div class="ap-head">
          ${data.name ? html`<div class="ap-who">${data.name}</div>` : null}
          ${data.task ? html`
            <div class="ap-head-l">Mandate</div>
            <div class="ap-mandate">${mdInline(data.task)}</div>
          ` : null}
          <div class="ap-stats">${stats.map(x => html`<span>${x}</span>`)}</div>
        </div>
        <div class="ap-body">
          ${spine.length === 0
            ? html`<div class="story-unavailable">Transcript found but no moves reconstructed.</div>`
            : html`<${ApproachSpine} moves=${spine} />`}
          ${crossTerminal.length ? html`
            <div class="ap-xterm-divider">cross-terminal children</div>
            ${crossTerminal.map(c => html`<${ApproachCrossTerminal} child=${c} />`)}
          ` : null}
          ${/* The outcome closes the account: what was attempted (head), how
                (spine), how it ended (here). It used to sit in the header,
                above the moves it summarises. */ ''}
          ${data.outcome ? html`<${ApproachOutcome} text=${data.outcome} />` : null}
          ${/* The legend decodes the gutter, which is the one thing on this tab
                a first-time reader cannot infer. The old legend explained the
                source chips instead; those are now spelled out in words on
                every row, so they need no key. */ ''}
          <div class="ap-legend">
            <span><span class="g act">•</span>acted</span>
            <span><span class="g delegate">⑂</span>delegated</span>
            <span><span class="g dead">✗</span>dead end</span>
            <span><span class="g verify">✅</span>verified</span>
          </div>
        </div>
      </div>
    </div>
  `;
}

// The session-detail loading placeholder, shaped like the real layout below
// (back button, identity row, the 4-tile stat grid, the tab bar, a content
