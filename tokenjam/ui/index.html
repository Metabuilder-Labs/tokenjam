        metric, group_by: groupBy, stack_by: effStack || undefined, since,
        agent_id: fAgent || undefined, provider: fProvider || undefined,
        model: fModel || undefined, tool: fTool || undefined,
      });
      if (gen.current === g) setSt({ loading: false, error: null, resp });
    } catch (e) {
      if (gen.current === g) setSt(s => ({ ...s, loading: false, error: e.message || String(e) }));
    }
  }, [metric, groupBy, stack, chart, since, fAgent, fProvider, fModel, fTool]);

  useEffect(() => {
    setSt(s => ({ ...s, loading: true, error: null }));
    load();
  }, [load]);

  const { loading, error, resp } = st;
  const framing = resp ? resp.framing : null;
  // Plan-tier framing: the spend metric switches to token volume for LOCAL
  // (dollars suppressed -- no marginal cost to price at all) — single
  // source, never re-derived. Subscription no longer suppresses (product
  // decision: tj does not differentiate subscription-billed from
  // API-billed users).
  const isSpend = metric === 'spend';
  const useTokens = isSpend && !!framing && framing.pricing_mode === 'local';
  const valueIsDollars = isSpend && !useTokens;
  // fmtDashUsd (at most 2dp), not fmtCost: this view only ever renders
  // embedded on the Dashboard (see the router's dashboard/analytics alias
  // note above), so its chart tooltip and leaderboard values follow the
  // Dashboard's precision rule.
  const fmtV = valueIsDollars ? fmtDashUsd : fmtTokens;
  const fmtVal = v => (metric === 'sessions' || metric === 'events') ? fmtTokens(v).replace(/ tokens$/, '') : fmtV(v);
  const axisFmt = valueIsDollars ? fmtAxisUsd : fmtTokens;

  const series = (chart === 'line' || chart === 'bar') ? buildAnalyticsSeries(resp, useTokens) : null;
  const board = chart === 'hbar' ? buildLeaderboard(resp, useTokens) : null;
  const kpis = resp ? resp.kpis : null;
  const filterChips = [['agent_id', fAgent], ['provider', fProvider], ['model', fModel], ['tool', fTool]].filter(x => x[1]);

  const metricSuffix = isSpend ? (useTokens ? ' (tokens)' : '') : '';

  // Tool spans carry no tokens/cost, so grouping spend/tokens BY tool (or tool
  // category) is structurally all-zeros (#268). Rather than render a wall of
  // zeros, show a helpful empty state with a one-click switch to Events.
  const toolDimNoMetric = (groupBy === 'tool' || groupBy === 'tool_category')
    && (metric === 'spend' || metric === 'tokens');

  // #295: a stacked breakdown can be structurally empty even when the metric has
  // plenty of data — e.g. Model × Tool category, since a span is either an LLM
  // call or a tool call, never both. Detect that so we can prompt the user to
  // clear the stack instead of stranding them on a bare "No data" chart. (Only
  // bar/line carry a stack — effStack is '' for the leaderboard.)
  const noRows = !!resp && Array.isArray(resp.rows) && resp.rows.length === 0;
  const emptyFromStack = !!effStack && noRows;
  const labelOf = dim => (ANALYTICS_DIMENSIONS.find(d => d[0] === dim) || [, dim])[1];

  // #313: surface the leaderboard's own total + item count (a ranked list with
  // no sum is confusing), and reconcile the gap when grouping by a PARTIAL
  // dimension — only some spans carry it (e.g. a tool), so the breakdown subtotal
  // is legitimately smaller than the all-events KPI and otherwise looks
  // contradictory. Purely additive: only the leaderboard (hbar) branch reads
  // these; nothing else changes.
  const boardTotal = board ? board.reduce((s, e) => s + (e.value || 0), 0) : 0;
  const boardCount = board ? board.length : 0;
  const dimName = (ANALYTICS_DIMENSIONS.find(d => d[0] === groupBy) || [, groupBy])[1].toLowerCase();
  const dimNamePlural = (/y$/.test(dimName) && !/[aeiou]y$/.test(dimName)) ? dimName.slice(0, -1) + 'ies' : dimName + 's';
  const countMetric = (metric === 'events' || metric === 'sessions') ? metric : null;
  const kpiCount = (countMetric && kpis) ? kpis[countMetric] : null;
  const boardGap = kpiCount != null && boardTotal > 0 && boardTotal < kpiCount;

  const getFilename = () => {
    if (!resp) return 'tokenjam-analytics.csv';
    const startStr = resp.window_start ? new Date(resp.window_start * 1000).toISOString().split('T')[0] : '';
    const endStr = resp.window_end ? new Date(resp.window_end * 1000).toISOString().split('T')[0] : '';
    return startStr && endStr ? `tokenjam-analytics_${startStr}_${endStr}.csv` : 'tokenjam-analytics.csv';
  };



  return html`
    ${embedded ? null : html`<div class="page-title" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      Analytics <${PlanBadge} framing=${framing} />
    </div>`}

    <div class="filters">
      <label class="ctl">Metric
        <select value=${metric} onChange=${e => setFilter('metric', e.target.value)}>
          ${ANALYTICS_METRICS.map(([v, l]) => html`<option value=${v}>${l}</option>`)}
        </select></label>
      <label class="ctl">By
        <select value=${groupBy} onChange=${e => setFilter('group_by', e.target.value)}>
          ${ANALYTICS_DIMENSIONS.map(([v, l]) => html`<option value=${v}>${l}</option>`)}
        </select></label>
      ${stackApplies ? html`<label class="ctl">Stack
        <select value=${stack} onChange=${e => setFilter('stack', e.target.value)}>
          <option value="">none</option>
          ${ANALYTICS_DIMENSIONS.filter(d => d[0] !== groupBy).map(([v, l]) => html`<option value=${v}>${l}</option>`)}
        </select></label>` : null}
      <label class="ctl">Chart
        <select value=${chart} onChange=${e => setFilter('chart', e.target.value)}>
          ${ANALYTICS_CHARTS.map(([v, l]) => html`<option value=${v}>${l}</option>`)}
        </select></label>
      ${embedded ? null : html`<select value=${since} onChange=${e => setFilter('since', e.target.value)}>
        <option value="24h">Last 24h</option><option value="7d">Last 7d</option>
        <option value="30d">Last 30d</option><option value="90d">Last 90d</option>
      </select>`}
      <button class="btn" onClick=${load}>Refresh</button>
      <button class="btn" onClick=${() => resp && downloadCsv(getFilename(), analyticsCsv(resp))} disabled=${loading}>Export CSV</button>
    </div>

    <div class="filters preset-row">
      <span class="dim" style="font-size:12px">Presets:</span>
      ${ANALYTICS_PRESETS.map(p => html`<button class="btn preset-btn" onClick=${() => applyPreset(p.q)}>${p.label}</button>`)}
      ${filterChips.map(([k, v]) => html`<button class="btn" onClick=${() => setFilter(k, '')}>${k.replace('_id', '')}: ${v} ✕</button>`)}
    </div>

    ${error ? html`<div class="chart-card" style="border-color:var(--error)"><div style="color:var(--error);font-size:13px;margin-bottom:10px">Couldn't load analytics: ${error}</div><button class="btn" onClick=${load}>Retry</button></div>` : null}

    ${!error && kpis ? (() => {
      // The Spend tile follows the server framing block (single source, never
      // re-derived). Under SUBSCRIPTION it shows an implied-value MULTIPLIER
      // ("43.5× plan value", #262) — NOT "% of cycle" and NOT raw tokens (which
      // duplicated the Tokens tile, #247). Its sparkline/delta still track SPEND
      // (cost_usd), since the multiplier is just spend rescaled by the plan fee
      // — so the trend/shape are identical to spend, never raw $. LOCAL / a
      // subscription with no declared fee have no denominator → the tile is
      // dropped rather than duplicate Tokens.
      const deltas = resp.kpi_deltas || {};
      const spend = spendTileDisplay(kpis.spend, framing);
      // A prior window with almost no activity makes period-over-period % a
      // misleading sliver (the ▲1682% on a fresh backfill, #262). Use the prior
      // window's session count as the universal "did anything happen" proxy.
      const prevThin = !!resp.kpi_prev && (resp.kpi_prev.sessions || 0) < 2;
      const onMetric = (k) => setFilter('metric', k);
      // #318: the ACTIVE count-metric tile shows the breakdown subtotal next to
      // the window total when grouping by a PARTIAL dimension (only some spans
      // carry it, e.g. tool), so the window-wide tile reconciles with the smaller
      // chart subtotal. Count metrics only (events/sessions — spend/tokens framing
      // is more complex); only when there's an actual gap.
      const breakdownTotal = (resp.rows || []).reduce((s, r) => s + (r.value || 0), 0);
      const breakdownDim = (ANALYTICS_DIMENSIONS.find(d => d[0] === groupBy) || [, groupBy])[1].toLowerCase();
      const activeSub = ((metric === 'events' || metric === 'sessions')
        && breakdownTotal > 0 && breakdownTotal < (kpis[metric] || 0))
        ? { value: fmtCount(breakdownTotal), label: `by ${breakdownDim}` } : null;
      // Founder request (2026-07-30): the Tokens card leads with the TOKEN
      // count, no dollar figure. On a subscription plan a raw $ spend is not a
      // figure the user actually pays (Rule 22 framing), and the card is
      // labelled "Tokens" -- so it shows the count, plain: no dollar headline,
      // no secondary line.
      const tiles = [];
      if (spend) {
        tiles.push({ key: 'spend', label: spend.label, cost: true, value: spend.value,
          series: kpiSparkValues(resp, 'spend'), delta: deltas.spend });
      }
      // kpiFigure, not the bare formatter: a field the payload omitted renders as
      // unknown rather than as fmtCount(null)'s "0" or fmtTokens(null)'s dash.
      tiles.push({ key: 'tokens', label: 'Tokens', cost: false,
        value: kpiFigure(kpis.tokens, fmtTokens),
        series: kpiSparkValues(resp, 'tokens'), delta: deltas.tokens });
      tiles.push({ key: 'sessions', label: 'Sessions', cost: false, value: kpiFigure(kpis.sessions, fmtCount),
        series: kpiSparkValues(resp, 'sessions'), delta: deltas.sessions });
      tiles.push({ key: 'events', label: 'Events', cost: false, value: kpiFigure(kpis.events, fmtCount),
        series: kpiSparkValues(resp, 'events'), delta: deltas.events });
      return html`
        <div class="kpi-row">
          ${tiles.map(t => html`<${KpiTile} label=${t.label} value=${t.value} active=${t.key === metric}
              series=${t.series} delta=${t.delta == null ? null : t.delta} cost=${t.cost}
              sub=${t.sub || (t.key === metric ? activeSub : null)}
              prevThin=${prevThin} onSelect=${() => onMetric(t.key)} />`)}
        </div>
        ${kpiCaption ? html`<div class="kpi-caption">${kpiCaption}</div>` : null}`;
    })() : null}

    ${/* The KPI row holds its final position while the numbers are unknown.
          Returning null here (the old behaviour) meant the row simply did not
          exist until /analytics answered, so on a large corpus the entire chart
          below it jumped down the page tens of seconds after first paint. Four
          placeholders, matching the four tiles that follow, in the app's own
          .shimmer; a placeholder cannot be mistaken for a figure, whereas the
          row's absence plus a chart sitting high on the page reads as a page
          that has finished loading. Not shown once `kpis` exists, and not shown
          on a REFRESH over numbers already on screen. */ ''}
    ${!error && !kpis ? html`
      <div class="kpi-row" aria-hidden="true">
        ${KPI_SKELETON_TILES.map(i => html`
          <div key=${i} class="kpi-tile">
            <div class="kpi-top">
              <div class="kpi-num" style="flex:1">
                <div class="shimmer" style="height:20px;width:56%"></div>
                <div class="shimmer" style="height:11px;width:38%;margin-top:6px"></div>
              </div>
              <div class="shimmer" style="height:24px;width:64px;flex-shrink:0;border-radius:3px"></div>
            </div>
            <div class="shimmer" style="height:11px;width:70px;margin-top:8px"></div>
          </div>`)}
      </div>` : null}

    ${!error ? html`
      <div class="chart-card" style=${loading ? 'opacity: 0.5; pointer-events: none; transition: opacity 0.2s' : 'transition: opacity 0.2s'}>
        <div class="chart-head">
          <div class="chart-title">${(ANALYTICS_METRICS.find(m => m[0] === metric) || [, metric])[1]} by ${(ANALYTICS_DIMENSIONS.find(d => d[0] === groupBy) || [, groupBy])[1]}${metricSuffix}</div>
        </div>
        ${toolDimNoMetric ? html`
          <div class="empty compact">
            <div style="font-size:13px;margin-bottom:12px">Tools don't carry ${metric === 'spend' ? 'cost' : 'tokens'}; those live on the LLM-call spans, not tool spans.</div>
            <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
              <button class="btn" onClick=${() => setFilter('metric', 'events')}>Switch to Events</button>
              <button class="btn" onClick=${() => setFilter('group_by', 'model')}>Group by Model</button>
              <button class="btn" onClick=${() => setFilter('group_by', 'agent')}>Group by Agent</button>
            </div>
          </div>`
          /* Same height the real chart renders at, so the switch to a chart
             moves nothing below it. */
          : loading && !resp ? html`<div class="shimmer" style="height:220px"></div>`
          : emptyFromStack ? html`
            <div class="empty compact">
              <div style="font-size:13px;margin-bottom:12px">No rows for ${labelOf(groupBy)} × ${labelOf(effStack)}. That breakdown is empty because a span carries only one of these: e.g. an LLM call has a model but no tool, a tool span has a tool but no model.</div>
              <button class="btn" onClick=${() => setFilter('stack', '')}>Clear stack</button>
            </div>`
          : chart === 'hbar'
            ? (board && board.length ? html`
              <div class="dim" style="font-size:12px;margin:2px 0 8px">Total: ${fmtVal(boardTotal)} · ${boardCount} ${boardCount === 1 ? dimName : dimNamePlural}</div>
              <div class="leaderboard">
                ${board.map((e, i) => {
                  const label = formatGroupLabel(e.group, groupBy);
                  return html`
                  <div class="lb-row">
                    <span class="lb-rank">${i + 1}</span>
                    <span class="lb-name" title=${label}>${label}</span>
                    <span class="lb-bar"><span class="lb-fill" style=${'width:' + (e.frac * 100).toFixed(1) + '%;background:' + colorFor(e.group)}></span></span>
                    <span class="lb-val">${fmtVal(e.value)}</span>
                  </div>`;
                })}
              </div>
              ${boardGap ? html`<div class="chart-foot"><span class="dim">Only ${fmtCount(boardTotal)} of ${fmtCount(kpiCount)} ${countMetric} have a ${dimName}; the rest aren't in this breakdown.</span></div>` : null}
              ` : html`<div class="empty compact">No data in this window.</div>`)
            : (series ? html`
              ${chart === 'line'
                ? html`<${SpendChart} data=${series.data} labels=${series.labels} height=${220} fmtY=${fmtV} axisFmtY=${axisFmt} showLegend=${series.labels.length > 1} bucket=${series.bucket} />`
                : html`<${StackedBarChart} data=${series.data} labels=${series.labels} height=${220} fmtY=${fmtV} axisFmtY=${axisFmt} bucket=${series.bucket} />`}
              ${series.coarsened ? html`<div class="chart-foot"><span class="dim">Showing ${series.bucket} buckets; this range is too long for ${series.requestedBucket}ly detail.</span></div>` : null}
            ` : html`<div class="empty compact">No data in this window.</div>`)}
      </div>` : null}
  `;
}

// ============================
// Merged Dashboard (#/dashboard) — the Improve lens's main triage front door.
// ============================
// Composes the triage front-door (spend hero + run-rate, compact
// recoverable-waste + health bands) with the Analytics pivot explorer as the
// hero canvas, reusing the existing helpers / components (SpendChart,
// recoverableTiles, HealthTile, AnalyticsView). The standalone Overview and
// Analytics screens this once sat alongside are both retired now: #/overview
// and #/analytics alias here (see primaryKeyFor) rather than 404ing.
// One window selector (header) drives BOTH the triage fetch and the embedded
// explorer (which reads `since` from the same URL params).
// ---- Review inbox (Improve lens home) ----
// The self-improve loop's Approve stage (self-improve-loop SPEC.md §12 /
// §8 reuse map): pending relearn fixes the cross-session relearn aggregator
// (core/optimize/analyzers/relearn.py, served from a background-refreshed
// cache at GET /relearn/proposals — see api/routes/relearn.py) land here for
// a human to review. Phase 2 wires Approve to a real write, routed by its
// delivery mechanism, through POST /relearn/apply (core.optimize.relearn_apply
// — git-commit or gzip-backup reversible, disabled-by-default for hooks).
// Dismiss stays a client-side-only hide (localStorage, never sent to the
// server). The chassis (listhead / listbox / addbar / cur-modal) is forked
// from Optimize ▸ Summarize's curate → diff → Apply/Reject screen
// (~6410-7040 above), per Phase A's scaffold.
const RELEARN_DISMISSED_KEY = 'tj_relearn_dismissed_v1';

function loadDismissedRelearns() {
  try {
    const raw = localStorage.getItem(RELEARN_DISMISSED_KEY);
    return raw ? new Set(JSON.parse(raw)) : new Set();
  } catch (e) { return new Set(); }
}

function saveDismissedRelearns(set) {
  try { localStorage.setItem(RELEARN_DISMISSED_KEY, JSON.stringify([...set])); } catch (e) { /* best-effort */ }
}

// Delivery mechanisms, mirroring core/rulewrite/kinds.py. A record from an
// older build carries no mechanism this build can name; it renders as unknown
// rather than as a guess, because the label is what tells a reader which
// artifact is about to be written where.
const DELIVERY_LABELS = {
  claude_md_rule: 'rule (CLAUDE.md)',
  path_scoped_rule: 'path-scoped rule',
  skill: 'skill / doc',
  executing_hook: 'hook (blocking guard)',
  injecting_hook: 'hook (context nudge)',
};
const UNKNOWN_DELIVERY_LABEL = 'unknown (legacy record)';
function deliveryLabel(name) {
  return DELIVERY_LABELS[String(name || '')] || UNKNOWN_DELIVERY_LABEL;
}
const ENFORCEMENT_DELIVERIES = new Set(['executing_hook', 'injecting_hook']);

// Verdict/recurrence-since-apply labels and the Compound-ledger summary that
// used to render here were the frontend half of the perpetual verify/receipts
// layer removed for making unsupportable realized-savings claims (see
// relearn_apply.py's AppliedFix.verify docstring) — nothing has populated
// them since, so they always rendered an inert "Not yet checked" placeholder.
// Replaced by the Applied tab's honest `est.` figure (InboxStatTiles /
// AppliedItemRow below), a bounded point-in-time snapshot taken at apply
// time, never a live re-measurement.

// The select-all state transition, kept pure and outside the component so it
// can be exercised directly rather than only asserted against as markup.
// `visibleSigs` is the RENDERED row set: clicking a fully-selected box clears
// exactly those rows from the selection, anything else adds them all. Rows the
// list is not showing are never touched in either direction.
function nextSelectAllSelection(visibleSigs, checkedSigs) {
  const next = new Set(checkedSigs);
  const all = visibleSigs.length > 0 && visibleSigs.every(sig => next.has(sig));
  for (const sig of visibleSigs) {
    if (all) next.delete(sig);
    else next.add(sig);
  }
  return next;
}

// The table's select-all box. `indeterminate` has no HTML attribute and cannot
// be expressed as a checked value, so it is assigned to the DOM node through a
// ref on every render — a two-state header box over a partial selection is a
// well-known source of accidental bulk actions.
function SelectAllCheckbox({ total, selected, onToggle }) {
  const ref = useRef(null);
  const all = total > 0 && selected === total;
  useEffect(() => {
    if (ref.current) ref.current.indeterminate = selected > 0 && selected < total;
  });
  return html`<input type="checkbox" ref=${ref} checked=${all} disabled=${total === 0}
    title=${all ? 'Clear selection' : 'Select all listed'}
    aria-label=${all ? 'Clear selection' : 'Select all listed'}
    onChange=${onToggle} />`;
}

// --- Inbox redesign: sort + long-tail collapse, badges, est./mo formatting
// (behavioral requirements #1-#4). Shared by both the Recurring-mistakes and
// Cost-advisories tabs so the two never drift on what "biggest first" means.

const INBOX_COLLAPSE_THRESHOLD = 8;

//: Noise floor for BOTH tabs. A card worth less than this is not worth a row:
//: acting on it costs the reader more attention than the fix returns, and on a
//: real corpus the sub-$5 tail is the bulk of the card count for a small
//: fraction of the money. Founder call, 2026-07-26.
//
// Two rules that keep this a display filter rather than a quiet write-off:
//   * ONLY A KNOWN FIGURE CAN BE JUDGED SMALL. An item with no dollar figure
//     is unpriced, not cheap, so the floor never hides it — hiding it would
//     turn "we could not price this" into "this did not matter", which is the
//     same inversion the analyzer gates already had to be corrected for.
//   * WHAT IS HIDDEN IS STATED. Each tab renders a line naming how many rows
//     the floor removed and what they cost combined, so the filter is never
//     silent shrinkage. The headline figure is untouched: it is the server's
//     own total over every open proposal, and it still counts these.
const INBOX_MIN_USD = 5;

// True only for an item whose OWN priced figure is under the floor. Reads the
// same `past_overspend_usd` the row renders, so what is filtered and what is
// displayed can never disagree.
function belowInboxFloor(item) {
  const usd = item && item.past_overspend_usd;
  return usd != null && usd < INBOX_MIN_USD;
}

// Founder-approved carve-out, scoped to the Review inbox ONLY: the resend
// ("TRIM") card's own dollar figure is a structural token-share measurement,
// not a savings claim (RESEND_HONESTY_CAVEAT in analyzers/context_resend.py
// says so explicitly), so this page treats it as unpriced for every
// dollar-first decision below even though its dollar field carries a real,
// non-null number. dollarsSuppressed() itself is NOT touched by this set — it
// still governs every other surface in the app unchanged.
const NOT_A_SAVINGS_CLAIM_ANALYZERS = new Set(['resend']);

// --- The mechanism axis: what tj can actually DO about a row ---------------
//
// This page used to be two tabs cut on WHICH ANALYZER produced a row: one fed
// by `relearn` alone, one by the other sixteen. That is a fact about our own
// module layout, not a decision the reader makes, and it put the largest
// figures the product computes on the second tab. One list ranked by money
// replaces both, so the axis that genuinely changes what the reader does next
// has to travel ON the row instead of being the tab they picked.
//
// TWO ORTHOGONAL FACTS, NOT ONE ENUM. This started as a three-valued enum
// (write / snippet / none) and that was wrong, because the two are not mutually
// exclusive and the card has never treated them as such: `CostProposalCard`
// renders `${prop.suggestion ? ...}` and `${prop.apply_capable ? ...}` as two
// INDEPENDENT conditionals, and `deadweight`'s mcp_remove proposal is exactly
// the overlap case, showing a copyable snippet AND a confirm-target apply
// control together. An enum has to pick one of those to report, so it
// necessarily lies about that row. Two booleans cannot.
//
//   inboxCanApply(item)    tj makes the change itself. RELEARN: the cluster is
//                          not advise-only, which is exactly
//                          `RelearnApplyModal`'s own gate, so a row tagged this
//                          way can never open a modal reading "nothing to
//                          approve". COST: `apply_capable`, the same flag the
//                          apply controls are gated on. No budget/ceiling gate
//                          sits on top of either flag.
//                          Drives: checkbox eligibility, the primary action,
//                          and bulk scope.
//
//   inboxHasSnippet(item)  there is an exact change to hand over. COST:
//                          `suggestion`. RELEARN: `advise_snippet_offered`,
//                          stamped server-side
//                          (`relearn_proposals.advise_snippet_offered`), true
//                          for an advise-only cluster that still carries a
//                          `proposed_fix` the user can copy by hand.
//                          Drives: whether the copy box renders. The snippet IS
//                          the deliverable where there is no writer, so it gets
//                          a labelled box on the row, never a hover or a
//                          footnote.
//
// "Nothing actionable yet" is DERIVED from both being false, not a third peer
// value: `summarize` (its fix lives in its own curate/diff/apply lifecycle) and
// the clusters no fix template matched (the real next step is the example
// sessions). Stated in words; such a row must never be a blank space the reader
// is expected to interpret.
//
// Both predicates read the SAME flags their fix blocks gate on, so a tag can
// never advertise an action the card then refuses. Neither is keyed on analyzer
// identity: the day a `downsize` proposal becomes apply-capable its rows gain
// the apply control with no edit here.
function inboxCanApply(item) {
  if (!item) return false;
  if (item.kind === 'relearn') return !item.advise_only;
  return !!item.apply_capable;
}

function inboxHasSnippet(item) {
  if (!item) return false;
  if (item.kind === 'relearn') {
    return !!item.advise_snippet_offered && String(item.proposed_fix || '').trim() !== '';
  }
  return String(item.suggestion || '').trim() !== '';
}

// A `MechanismTags` component and its `MECHANISM_TAG_COPY` map used to render up
// to two badges here (TJ CAN APPLY / COPY THE FIX / NO FIX YET). Both are GONE, on
// founder call, and the reasoning is worth keeping because it generalises: THE
// ACTION BUTTON ALREADY SAYS WHAT PRESSING IT DOES. "Approve & write", "Remove
// entry", "Apply note", "Mark applied" and "Review in Summarize" are each
// unambiguous, so a badge restating them was chrome, and on the two rows that
// showed TJ CAN APPLY and then demanded a pasted path before the button would do
// anything, it was actively over-promising. With no label there is only one promise
// on the row and it is the button, which is wired to the real capability, so that
// whole class of mismatch cannot recur.
//
// `inboxNothingActionable` went with them: it existed only to pick the third badge
// and had no consumer in the render, so it is deleted rather than left stranded.
// The two predicates below still drive BEHAVIOUR (which button, whether the copy
// box renders) and are the reason removing the labels is safe.
//
// `inboxMechanismTag` survives, feeding only the row's `data-mechanism` attribute:
// a test and console hook, never anything a reader sees. It reports the OVERLAP
// ("apply snippet") rather than collapsing it, so the attribute cannot drift from
// what the two predicates decided.
function inboxMechanismTag(item) {
  const parts = [];
  if (inboxCanApply(item)) parts.push('apply');
  if (inboxHasSnippet(item)) parts.push('snippet');
  return parts.length ? parts.join(' ') : 'none';
}

// --- Ordering: observed money, and nothing that merely resembles it --------
//
// Rank on the OBSERVED past-overspend token figure, full stop. The previous
// key fell back to `estimated_monthly_tokens` when the observed figure was
// absent, which let a forward 30-day PROJECTION compete for position against
// past observations inside one sort: two different quantities, two different
// tenses, silently interleaved, and the reader has no way to tell which kind
// of number put a row where it is.
//
// This is a LATENT bug, not one anyone has seen: every cluster and proposal in
// the real payload carries `past_overspend_tokens`, so the fallback has never
// fired. It is fixed as a structural guard rather than as a repair — a row with
// no observed figure is now unable to enter the ranked list at all, because it
// goes to `unobserved` and renders in its own group below the fold.
//
// Tokens, not dollars: some rows have no dollar rate at all, and ordering them
// against priced rows would mean inventing a $/token rate to make the two
// comparable. The product forbids that, so the ranking runs on the one figure
// every row carries and dollars stay a per-row DISPLAY choice.
function observedRankTokens(item) {
  const t = item && item.past_overspend_tokens;
  return typeof t === 'number' && isFinite(t) ? t : null;
}

// Split BEFORE the sort, so an unranked row is structurally incapable of
// interleaving with ranked ones rather than merely sorting to the bottom.
function partitionByObservedOverspend(items) {
  return {
    ranked: items.filter(i => observedRankTokens(i) != null),
    unobserved: items.filter(i => observedRankTokens(i) == null),
  };
}

// THE ordering function, and it is upstream's, by name and by key. This branch
// had grown a second function computing the identical thing;
// upstream's `sortByPastOverspend` shipped first, so that duplicate is deleted
// rather than kept in parallel. Upstream's reasoning, preserved because it is the
// justification for the key: rank by TOKENS, the one figure every item carries,
// priced or not. Comparing a dollar-priced item against a tokens-only one would
// mean inventing a $/token rate to make them comparable, which the product
// forbids, so dollars stay a per-row DISPLAY choice decoupled from ranking. A
// relearn cluster now carries `past_overspend_tokens` on exactly the same basis a
// cost proposal does, so one function serves both.
function sortByPastOverspend(items) {
  return [...items].sort((a, b) => (observedRankTokens(b) || 0) - (observedRankTokens(a) || 0));
}

// What the noise floor removed, stated rather than silently dropped. Renders
// nothing when the floor caught nothing, so a small clean inbox stays clean.
//
// Deliberately NOT an expandable row: these are items the product has decided
// are not worth the reader's attention, and giving them a toggle re-creates
// the noise the floor exists to remove. The count and the combined figure are
// enough to prove nothing was swept under the rug — the headline above still
// counts them, and `tj optimize <analyzer> --json` still lists them in full.
function BelowFloorNote({ items, label }) {
  if (!items || items.length === 0) return null;
  const usd = items.reduce((s, i) => s + (i.past_overspend_usd || 0), 0);
  return html`
    <div class="dim" style="font-size:12px;padding:var(--pad-row-y) var(--inset-x);border-top:1px solid var(--border)">
      ${items.length} smaller ${label} under ${fmtUsd(INBOX_MIN_USD)} ${items.length === 1 ? 'is' : 'are'} hidden · ${fmtUsd(usd)} combined, still counted in the total above.
    </div>`;
}

// Top N normally, the remainder folded into one collapsible row (behavioral
// requirement #3) — a 42-tiny-fixes tail must read as one bundled decision,
// not 42 peers.
function splitTopAndTail(sorted, max = INBOX_COLLAPSE_THRESHOLD) {
  if (sorted.length <= max) return { top: sorted, tail: [] };
  return { top: sorted.slice(0, max), tail: sorted.slice(max) };
}

// --- Loading state: placeholders shaped like the rows they become -----------
//
// The bug this replaced was a correctness bug, not a styling one. Both endpoints
// serve their CACHED result immediately and merely flag `status: "computing"`
// when a refresh is in flight, so the page had 55 clusters and 16 proposals in
// hand while printing a bare "Loading…", omitting the avoided tile, and rendering
// the tab as "Open (0)". A zero is the single most misleading value this page can
// print: it reads as "you are all clear" on an inbox holding thousands of dollars.
//
// Three server states that used to collapse into one dead screen, now distinct:
//   * `computing` WITH cached rows -> render the rows, and let the header's own
//     "scanning…" be the quiet refreshing indicator. Never blank the list for a
//     recompute.
//   * `computing` with NOTHING cached -> a first scan really is running, so say so
//     and hold the geometry with skeletons.
//   * `never_run` / a completed-but-empty scan -> the existing empty states.
//
// The skeleton mirrors the real row's geometry (title line, the 3-line clamped
// description block, a fix block, an action row) so real content FILLS IN rather
// than replacing a differently-shaped block. Motion is the app's existing
// `.shimmer` and nothing else: no spinner, no bouncing dots, and above all no
// progress bar, which on a scan of unknown length could only fake progress.
function InboxSkeletonRow() {
  return html`
    <div class="opt-section inbox-row" aria-hidden="true">
      <div style="display:flex;align-items:center;gap:8px">
        <div class="shimmer" style="height:13px;width:38%"></div>
        <div class="shimmer" style="height:11px;width:64px;flex-shrink:0"></div>
        <div class="shimmer" style="height:13px;width:74px;margin-left:auto;flex-shrink:0"></div>
      </div>
      ${/* Same height the real description block is clamped to, so the switch to
            real text moves nothing. */ ''}
      <div style="margin-top:8px;display:flex;flex-direction:column;gap:6px">
        <div class="shimmer" style="height:12px;width:100%"></div>
        <div class="shimmer" style="height:12px;width:100%"></div>
        <div class="shimmer" style="height:12px;width:72%"></div>
      </div>
      <div class="shimmer" style="height:30px;width:132px;margin-top:14px;border-radius:6px"></div>
    </div>`;
}

// What the page is actually doing, stated rather than animated. The most engaging
// thing this state can say is the truth, and the server knows it: once a scan has
// reported its corpus, name the size. Before that there is genuinely nothing to
// report but the step being performed, so it says only that and never invents a
// number or a percentage.
function InboxLoadingNote({ scanning, sessionsScanned }) {
  const corpus = sessionsScanned != null
    ? ` Scanning ${sessionsScanned.toLocaleString('en-US')} sessions of history.` : '';
  return html`
    <div class="dim" style="font-size:12px;margin:0 2px 8px">
      ${scanning
        ? 'A scan is running now, and this is the first one, so there is no earlier result to show yet.' + corpus
        : 'Reading the last completed scan.' + corpus}
    </div>`;
}

// --- The row's description block: the same height on every row --------------
//
// Wraps whatever prose a row has in a fixed-line clamp with an in-place
// expander, so the collapsed list has one vertical rhythm top to bottom. Both
// row components use it, and the collapsed tail and the below-the-fold group
// render through those, so the rhythm holds inside them too.
//
// Trimmed TEXTUALLY, at a sentence boundary, not merely clipped by CSS. A pure
// line clamp made every row the same height but cut the prose mid-clause, and the
// founder asked for the collapsed state to read as a short, complete thought. So
// the UI SELECTS the opening sentences and holds the remainder behind "Read more".
//
// The server's strings are never rewritten here, only split: these are the
// analyzers' own words, and paraphrasing them in the UI would put a second,
// drifting copy of every claim on screen.
const INBOX_LEAD_CHARS = 200;

// `{ lead, rest }` where `lead` is whole sentences up to the budget. Two rules:
//   * never cut mid-sentence, so the boundary is punctuation FOLLOWED BY
//     whitespace. That is what keeps "$1,842.56 of that cost" and "claude-4.7"
//     intact: the period there is followed by a digit, not a space.
//   * never cut mid-word. Text with no sentence boundary at all (a raw error dump
//     from a relearn example) falls back to a word-boundary cut, which is the only
//     honest option left when the content has no sentences to respect.
// Returns `{ lead, full, more }`. `full` is the whole normalised text, which is
// what the expanded state renders; `more` says whether anything was withheld.
// Deliberately NOT `{ lead, rest }` to be concatenated on expand: the word-
// boundary fallback appends an ellipsis to the lead, so lead + rest would have put
// "…" in the middle of the expanded sentence.
function splitLead(text, budget = INBOX_LEAD_CHARS) {
  const full = String(text || '').replace(/\s+/g, ' ').trim();
  if (full.length <= budget) return { lead: full, full, more: false };
  // The lead is built from OFFSETS into `full`, so it is a prefix of `full` by
  // construction and cannot begin anywhere but the start.
  //
  // The first version accumulated `/[^.!?]+[.!?]+(?:\s+|$)/g` matches instead,
  // which silently DROPPED whatever preceded the first matchable sentence. A
  // sentence containing a period that is not a boundary has no match starting at
  // index 0 — "MCP server posthog (configured in .mcp.json) made 0 tool calls."
  // fails because the only period is followed by a letter — so `exec` advanced
  // and matched from mid-string, and the row rendered "json) made 0 tool calls"
  // as its opening words. Two of eight live rows read that way. Collecting
  // boundaries rather than matches removes the whole failure mode; there is no
  // starting position left for the scan to skip past.
  const ends = [];
  for (let i = 0; i < full.length; i++) {
    if (full[i] !== '.' && full[i] !== '!' && full[i] !== '?') continue;
    let j = i;
    while (j + 1 < full.length && '.!?'.indexOf(full[j + 1]) >= 0) j++;   // "?!", "..."
    // A boundary is terminal punctuation FOLLOWED BY whitespace (or the end of
    // the text). That is what keeps "$1,842.56", "claude-4.7" and ".mcp.json"
    // whole: the period there is followed by a digit or a letter.
    if (j + 1 >= full.length || /\s/.test(full[j + 1])) ends.push(j + 1);
    i = j;
  }
  // Take whole sentences while they fit; if even the FIRST one overruns the
  // budget, take it anyway rather than cutting a sentence in half.
  let cut = 0;
  for (const end of ends) {
    if (cut && end > budget) break;
    cut = end;
    if (end >= budget) break;
  }
  if (cut) {
    const lead = full.slice(0, cut).trim();
    return { lead, full, more: lead !== full };
  }
  // No sentence boundary anywhere (a raw error dump off a relearn example). A
  // word-boundary cut is the only honest option left.
  const sp = full.lastIndexOf(' ', budget);
  const lead = (sp > 0 ? full.slice(0, sp) : full.slice(0, budget)).trim() + '…';
  return { lead, full, more: true };
}

// Long analyzer prose (`estimate_basis`, `caveat`, `placement_basis`, and
// friends) is written as Python triple-quoted strings and grouped into
// paragraphs by a literal blank line in the source; a single newline inside a
// paragraph is just where the source line happened to wrap, not an intended
// break. That is the same distinction `splitLead` above draws between a real
// sentence boundary and incidental punctuation — here it is a real paragraph
// break vs. incidental whitespace — so this does its own collapse rather than
// reaching for `white-space: pre-line`, which would turn every source-line
// wrap into a visible break.
function proseParagraphs(text) {
  if (!text) return [];
  return String(text).split(/\n\s*\n+/)
    .map(chunk => chunk.replace(/\s+/g, ' ').trim())
    .filter(Boolean)
    .map((p, i) => html`<p key=${i} class="prose-p">${p}</p>`);
}

// The description block: a short lead, and "Read more" only where there is
// genuinely more. The CSS clamp stays as a hard ceiling so a narrow viewport
// cannot let a long single sentence break the height band; on a normal width the
// lead already fits inside it, so the clamp never actually bites.
function TrimmedDescription({ text }) {
  const [open, setOpen] = useState(false);      // per row, local, never persisted
  const { lead, full, more } = splitLead(text);
  if (!full) return null;
  return html`
    <div>
      <div class=${'inbox-desc' + (open ? ' is-open' : '')}>
        <div class="sz-note">${open ? full : lead}</div>
      </div>
      ${more ? html`
        <div class="sz-link inbox-more" onClick=${() => setOpen(o => !o)}>${open ? 'Read less' : 'Read more'}</div>` : null}
    </div>`;
}

// The collapse/floor labels used to be fixed plurals ("cost advisories"), which
// was safe while each tab had its own noun and its own always-plural phrasing.
// On the merged list the noun is generic and a group of one is common, so a
// singular count is reachable. Agreed here rather than at each call site.
// CollapsedTailRow no longer needs a noun at all ("Show N more"/"Show less"
// don't inflect); BelowFloorNote still does ("N items under $5.00...").
function pluralItems(n) {
  return n === 1 ? 'item' : 'items';
}

// --- Relearn cluster: observed cost only, no forward claim ------------------
//
// A recurring-mistake row used to render a SECOND number — a forward
// `estimated_monthly_*` claim, captioned "est. / mo". That figure was GATED by
// the now-deleted write-budget module, which zeroed it whenever no permanent
// rule was worth offering. On a real corpus that meant most rows rendering
// "$0.00 est./mo" with no reason given, while those same clusters had already
// cost real observed spend. A zero with no explanation reads as "this was
// free", which is the exact inversion of what the gate meant.
//
// Founder decision: the forward claim is deleted from the card entirely, not
// merely de-emphasised. A relearn cluster now shows its PAST figure only —
// straight off `past_overspend_*` — same as every other analyzer's card.
function relearnObservedFigure(cluster) {
  const usd = cluster.past_overspend_usd;
  const toks = cluster.past_overspend_tokens;
  if (usd != null) return { big: fmtUsd(usd), sub: toks ? '~' + fmtTokens(toks) + ' tok' : '' };
  if (toks != null) return { big: '~' + fmtTokens(toks) + ' tok', sub: '' };
  // A cache written before the observed fields existed carries neither. Return
  // null so the caller falls back to the forward figure WITH its own caption,
  // rather than relabelling a projection as an observation.
  return null;
}

// A `writeGateNote(cluster)` helper used to live here, rendering a budget
// verdict as a one-line "No permanent fix offered: <short label>". It is
// GONE: there is no budget verdict to render any more. `RecurringMistakeRow`
// renders `advise_only_reason` for the clusters that genuinely have no apply
// path (no workspace, an advisory family, or a persona with no write
// surface) — every other cluster's apply action is simply offered.
//
// --- Past overspend: the number this product LEADS with -------------------
//
// Every figure below is PAST TENSE and window-OBSERVED: what the flagged
// behaviour already cost, priced at the rates it actually billed at, over a
// window that has already happened. Nothing here is projected, and the word
// "recoverable" appears on none of these surfaces — a forward figure asks the
// reader to trust a model of their next month, an observation asks them to
// check a bill they already paid.
//
// The headline is the AVOIDABLE amount, and it is now the ONLY per-card figure.
// This band once led with `resend`'s full cost-of-re-sending figure, ~16x its
// avoidable figure, implicitly asserting that 94% of it had been shown to be
// unavoidable. It had not: that money was analysed on the model-role card,
// filtered out below the context floor, or outside the re-read tail definition.
// That was corrected first by demoting the total to a COST-worded second line,
// and then by deleting the total outright (founder decision) — two analyzers of
// twelve emitted it, one rendered it, and the aggregate it fed published a
// subset claim that was false. What the figure does not cover is stated in words
// by `coverage_note`, which is the part that was load-bearing.
//
// Read straight off the payload, never derived here (the single-compute-path
// rule): `past_overspend_usd`/`_tokens`/`_basis` per card, and the headline
// totals off the response's own `past_overspend` block, which the server
// computes once over the open set so the Dashboard hero and the Review inbox
// headline are the same number by construction rather than by coincidence.
// No pacing ratio is ever applied on this side (or on the server side —
// see `cost_proposals.past_overspend_rollup`).
function pastOverspendFigure(item) {
  const usd = item.past_overspend_usd;
  const toks = item.past_overspend_tokens;
  if (usd != null) return { big: fmtUsd(usd), sub: toks ? '~' + fmtTokens(toks) + ' tok' : '' };
  if (toks != null) return { big: '~' + fmtTokens(toks) + ' tok', sub: '' };
  // No cost-only branch. The one card that ever took it was relearn's aggregate,
  // whose only figure was the retired total; that card is deleted server-side, so
  // a branch here would be reachable by nothing. Every remaining card carries the
  // canonical figure or is not built at all.
  return { big: '—', sub: '' };
}

// "over the last 30 days" — the window the figure was observed over, taken
// from the payload rather than from whatever window picker the surrounding
// screen happens to be set to (the Dashboard's picker changes the cost chart,
// not the window these proposals were computed against).
function pastWindowLabel(days) {
  const n = Number(days || 0);
  if (!n) return 'the analyzed window';
  return 'the last ' + (Number.isInteger(n) ? n : n.toFixed(0)) + ' days';
}

// A `inboxSpan(item, spans)` helper used to live here, naming per row the span its
// figure was observed over: a cost proposal sees a bounded `window_days`, a relearn
// cluster sees all retained history. It is GONE because the per-row amount caption
// that carried it was removed on founder instruction, which retired the per-row
// span disclosure with it.
//
// The asymmetry itself is REAL and did not go away: the ranking still orders a
// 30-day cost figure against an all-time recurrence figure. `corpus_basis` and
// `window_days` are still on the finding for whoever states it next, and the
// headline tile still names its own window. Putting every analyzer on one observed
// corpus span remains separate, tracked work.

// An `observedCostSentence(item)` helper used to live here, rendering "In total,
// this behaviour cost $X over the same window." on the one card that carried a
// total-observed-cost figure. Both the helper and the field are GONE, not
// misplaced: the figure is deleted from the contract (founder decision), so
// there is nothing for a second sentence to report.
//
// The reader does not lose the coverage question it was there to answer. What
// the avoidable figure does and does not cover is still stated, in words, by the
// `coverage_note` disclosure the card renders directly below its description —
// and words were always the honest form of that answer, since a ratio between
// two figures computed over different populations means nothing.

// The observed-overspend figure as a TILE, sized and shaped to sit in the
// stat row beside "Fixes applied" — not as a full-width hero band.
//
// It led the page as a large band with three paragraphs of prose and a
// derivation accordion. Founder call, 2026-07-26: that band read as heavy and
// was removed from both the Dashboard and the Review inbox; this figure now
// occupies the compact slot the old forward-looking "est. savings" tile used
// to hold, which is the shape the page was asked for.
//
// What did NOT change, because it is honesty discipline rather than layout:
//   * the number is the server's `past_overspend` block, read verbatim, never
//     reduced over the rendered cards, so it cannot drift from what the
//     endpoint computed;
//   * it stays past tense and observed, and carries no recovery vocabulary;
//   * the TOTAL observed cost is still disclosed and still worded as cost
//     rather than waste (rule 30 — the gap between the two is what was not
//     analysed, never a finding of necessity). It moved into the tile's
//     tooltip and sub-line rather than a paragraph, but it did not vanish;
//   * the full derivation still travels with the figure, on hover.
function PastOverspendTile({ block }) {
  if (!block) return null;
  const usd = block.past_overspend_usd;
  const toks = block.past_overspend_tokens;
  const causes = block.proposal_count || 0;
  if (!causes && !toks) return null;
  const win = pastWindowLabel(block.window_days);
  // The derivation the figure carries on hover. It is `basis` + `disclosure`, both
  // computed over the SAME proposals as the figure. The rollup used to publish a
  // second total covering 2 of its 13 proposals, and printing it here attached a
  // two-proposal denominator to "13 causes"; it was dropped from this tile first
  // and has since been deleted from the rollup itself, so there is no longer a
  // second-population key available to put back.
  const derivation = [block.basis, block.disclosure].filter(Boolean).join('\n\n');
  return html`
    <div class="opt-section opt-tile">
      <div class="dim" style="font-size:11px;text-transform:uppercase;letter-spacing:.03em">
        You Overspent
      </div>
      ${/* Past tense in the figure's own caption, not only in the label: a
            screenshot of this tile has to carry its own tense. */ ''}
      <div style="font-size:24px;font-weight:600;margin-top:4px" title=${derivation}>${usd != null ? fmtUsd(usd) : '—'}</div>
      ${/* All three parts read from the SAME population, which is why this
            version is honest where the old one was not: `window_days`,
            `past_overspend_tokens` and `proposal_count` are each summed over the
            same 13 proposals. Rendered from the block, never hardcoded. */ ''}
      <div class="dim" style="font-size:12px;margin-top:2px">
        over ${win}${toks ? ' · ~' + fmtTokens(toks) + ' tok' : ''}${causes ? ' · ' + causes + ' cause' + (causes === 1 ? '' : 's') : ''}
      </div>
    </div>`;
}

// The tail's summary line, on the SAME past-tense basis its expanded rows use
// (`pastOverspendFigure` / `relearnObservedFigure` — both read
// `past_overspend_*`, the one canonical dollar field). Returns null when no item
// carries an observed figure (a pre-observed-fields cache), so the caller states
// nothing rather than printing a confident $0.00.
//
// A `combinedEstMonthly` companion used to sit above this, summing a forward
// est./mo across the group. It is deleted, upstream's call: it read
// `monthlyUsdForDisplay`, and with relearn's forward claim retired there is no
// forward figure left for a group to combine. There is now exactly one basis for a
// tail summary, which is what makes the summary and the rows inside it agree by
// construction rather than by coincidence.
function combinedObservedCost(items) {
  const observed = items.filter(i => i.past_overspend_usd != null);
  if (observed.length) {
    return fmtUsd(observed.reduce((s, i) => s + i.past_overspend_usd, 0)) + ' already spent, combined';
  }
  const toks = items.reduce((s, i) => s + (i.past_overspend_tokens || 0), 0);
  if (toks) return '~' + fmtTokens(toks) + ' tok already spent, combined';
  return null;
}

// The collapsed long-tail row: count + combined figure, an expand toggle, and the
// bulk Dismiss all / (optional) Mark all applied actions. `renderItem` renders one
// expanded tail row in the caller's own shape (a RecurringMistakeRow or a
// CostProposalCard, dispatched by ReviewInboxView's single `renderRow`).
//
// `summary` is always supplied by the caller now — every group states its combined
// figure in the past tense, off `combinedObservedCost` — so there is no
// forward-basis default left to fall back to.
//
// The label used to read "N smaller items", the same word BelowFloorNote uses
// for items below the $5 noise floor — but this row's items are ranked below
// the top 8 while still being worth $5+ each (still worth acting on), the
// opposite of "smaller" meaning skippable. It is now the toggle control it
// actually is: "Show N more" while collapsed, "Show less" once expanded — a
// command that stays correct in both states, unlike a static description
// that would still say "N more" after they are already on screen. No noun is
// needed ("more"/"less" don't inflect), so the collapsed count reads
// correctly whether N is 1 or many.
function CollapsedTailRow({ tail, suppressed, summary, onDismissAll, onMarkAllApplied, renderItem }) {
  const [open, setOpen] = useState(false);
  if (tail.length === 0) return null;
  const label = open ? 'Show less' : ('Show ' + tail.length + ' more');
  return html`
    <div class="cur-row panel-row">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span class="sz-link" onClick=${() => setOpen(o => !o)}>
          ${open ? '▾' : '▸'} ${label}${summary ? ' · ' + summary : ''}
        </span>
        <span style="margin-left:auto;display:flex;gap:14px">
          ${onMarkAllApplied ? html`<span class="sz-link" onClick=${onMarkAllApplied}>Mark all applied</span>` : null}
          <span class="sz-link" onClick=${onDismissAll}>Dismiss all</span>
        </span>
      </div>
      ${open ? html`<div style="margin-top:6px">${tail.map(renderItem)}</div>` : null}
    </div>`;
}

// Human-readable fix-type badge for a relearn cluster (requirement #4) —
// user vocabulary, never internal jargon ("relearn", "injecting_hook") as the
// primary label. `family_key`/`delivery` stay available in the row's title
// attribute for anyone who wants the internal detail.
// One sentence answering "what is this" for a relearn cluster, which carries no
// analyzer prose of its own. The failure TEXT is the answer: it is what actually
// recurred, it exists on every cluster, and it is not duplicated anywhere else on
// the collapsed row (the fix goes in the copy box or behind Approve; the examples
// live in the modal).
//
// Falls back through `proposed_fix` to `title` so the block is never empty, and
// derives nothing it cannot read off the cluster. `splitLead` handles the fact
// that an error dump has no sentence boundaries.
// A snippet has to read as WORDS to be a description. Some clusters' captured
// snippet is a bare identifier — one live row's was `gen_ai.tool.call` — which
// answers "what is this" for nobody, and the requirement is a sentence, not
// merely a non-empty string. Two words is the whole test: anything that clears it
// is the failure as the agent actually saw it, which is the most honest sentence
// available; anything that does not falls through to the derived fix or the title
// rather than being dressed up here.
function isProse(s) {
  return String(s || '').trim().split(/\s+/).filter(Boolean).length >= 2;
}

function relearnDescription(cluster) {
  if (!cluster) return '';
  const snippet = ((cluster.examples || []).find(e => e && isProse(e.snippet)) || {}).snippet;
  const candidates = [snippet, cluster.proposed_fix, cluster.title];
  return String(candidates.find(isProse) || cluster.title || '').trim();
}

const RELEARN_BADGE_BY_DELIVERY = {
  claude_md_rule: 'PROMPT TWEAK',
  path_scoped_rule: 'PROMPT TWEAK',
  skill: 'SNIPPET',
  executing_hook: 'GUARDRAIL',
  injecting_hook: 'GUARDRAIL',
};
function relearnBadge(cluster) {
  if (cluster.advise_only) return 'ADVISE ONLY';
  const fam = (cluster.family_key || '').toLowerCase();
  if (fam.includes('cache')) return 'CACHE BREAKPOINT';
  return RELEARN_BADGE_BY_DELIVERY[cluster.delivery] || 'FIX';
}

// One relearn cluster, as a card on the single open list.
//
// It was a flat table-like row while it had a tab to itself. On a merged list
// it sits between cost cards, so it takes the SAME card chrome (bordered box,
// title + badges, figure top-right, fix block at the bottom): a list that
// alternates flat rows and bordered cards reads as two lists that failed to
// merge, and the whole point of the merge is that the reader stops caring which
// analyzer produced a row.
//
// The checkbox appears ONLY on a row tj can apply, which is also the only row
// the bulk review queue can drive (see `bulkRelearn` in ReviewInboxView) — an
// unselectable-looking row that a bulk action can still reach is the ambiguity
// the scoping rule exists to remove.
function RecurringMistakeRow({ cluster, checked, onToggle, onExpand, onDismiss, suppressed }) {
  // The card's only figure: what the recurrence already cost. No forward claim
  // renders anywhere on this row any more — upstream retired relearn's
  // forward-savings claim, the last dollar-field exception, and deleted the
  // figure from the card rather than de-emphasising it. `observed` is null only
  // for a pre-observed-fields cache, in which case the row falls back to a bare
  // dash.
  const observed = relearnObservedFigure(cluster);
  // No second figure. The forward est./mo claim that used to sit here is retired
  // upstream (relearn's was the last dollar-field exception), so the row carries
  // the past figure or a dash, and there is no `showForward` gate left to compute.
  const headline = observed || { big: '—', sub: '' };
  const lastSeenTs = (cluster.examples || []).map(e => e.ts).filter(Boolean).sort().pop();
  const canApply = inboxCanApply(cluster);
  const hasSnippet = inboxHasSnippet(cluster);
  const fixText = String(cluster.proposed_fix || '').trim();
  // The reason tokenjam will not write this one — a workspace-less cluster, an
  // advisory family, or a persona with no write surface. `advise_only_reason`
  // is stamped server-side by `relearn_proposals.advise_only_reason`, which is
  // also the CLI's source, so the two cannot drift.
  const cannotApplyReason = canApply ? null : String(cluster.advise_only_reason || '').trim();
  return html`
    <div class="opt-section inbox-row" data-mechanism=${inboxMechanismTag(cluster)} key=${cluster.signature}>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        ${/* Only where a bulk action can genuinely reach this row. */ ''}
        ${canApply ? html`<input type="checkbox" checked=${checked} onChange=${onToggle} />` : null}
        ${/* Still clickable (cursor + hover underline come from sz-link), but
              rendered in body text: the row already names its action in the
              fix block below, so blue on every title made the list read as a
              wall of links. */ ''}
        <span class="sz-link" onClick=${onExpand} style="font-weight:500;color:var(--text)">${cluster.title}</span>
        <span class="badge badge-warning" title=${(cluster.family_key || '') + ' · ' + deliveryLabel(cluster.delivery)}>${relearnBadge(cluster)}</span>
        <span style="margin-left:auto;text-align:right">
          ${/* The figure alone. Both row shapes carry exactly this, so the
                right-hand column reads identically down the list. The basis stays
                on hover. */ ''}
          ${/* Figure only; the caption line was removed on founder instruction,
                the same removal the cost card got. */ ''}
          <span class="po-amount" title=${cluster.past_overspend_basis || 'occurrences x a conservative per-turn token cost; review before applying'}>${headline.big}</span>
        </span>
      </div>
      ${/* THE DESCRIPTION BLOCK, the same clamp the cost card uses, so the two
            row shapes share one skeleton and one vertical rhythm.

            A relearn cluster carries no analyzer prose, which is exactly the case
            the founder called out: shortening the long rows would only move the
            raggedness onto the short ones. So this block leads with the facts the
            row actually has — how often it recurred, across how many sessions,
            when it was last seen — and `min-height` on the clamp keeps it the
            same height as a cost row's wall of text. Nothing is invented: every
            figure here is on the cluster.

            The no-apply-path reason sits INSIDE the clamp on this row, unlike
            the cost card's `blockedReason`. The mechanism tag already says the
            row has no writer, and the fix block below carries the
            recommendation the reader acts on. */ ''}
      ${/* A DESCRIPTION, in words, before any counts. A relearn cluster carries no
            analyzer prose, so it used to render nothing but "Recurred in N
            sessions" and read as a different species of row from a cost card.
            `relearnDescription` derives the sentence from what the cluster
            actually has: the failure text itself, which is the one thing that
            answers "what is this" for every cluster, applyable or not, and is not
            duplicated anywhere else on the collapsed row. */ ''}
      <div style="margin-top:8px">
        <${TrimmedDescription} text=${relearnDescription(cluster)} />
      </div>
      ${/* Counts are METADATA and follow the description, no longer standing in
            for it. */ ''}
      <div class="dim" style="font-size:11.5px;margin-top:6px">Recurred ${cluster.occurrences} time${cluster.occurrences === 1 ? '' : 's'} across ${cluster.sessions} session${cluster.sessions === 1 ? '' : 's'}${lastSeenTs ? ' · last seen ' + lastSeenTs.slice(0, 16).replace('T', ' ') : ''}</div>
      ${/* Why tokenjam will not write it. Its own disclosure, collapsed: the
            mechanism tag above already says the row has no writer. */ ''}
      ${cannotApplyReason ? html`
        <details class="po-basis">
          <summary>Why there is no permanent fix on offer</summary>
          <p>${cannotApplyReason}</p>
        </details>` : null}

      ${/* The two fix facts are rendered INDEPENDENTLY, mirroring how the cost
            card has always rendered its own two. A relearn cluster happens never
            to be both today (a cluster either has an apply path or it doesn't),
            but writing them as one if/else would bake the coincidence into the
            structure and break the day it stops holding. */ ''}
      ${hasSnippet ? html`
        ${/* THE case that must never read as a dead end, and the common one: 21
              of 55 clusters have a real derived recommendation that tokenjam has
              no file it owns to write. The recommendation itself is then the
              deliverable, so it gets the same labelled copy box a cost card's
              snippet gets. */ ''}
        <div class="sz-fixbox">
          <span class="sz-copy-slot"><${CopySnippetButton} text=${fixText} /></span>
          <div class="sz-copybox">${fixText}</div>
        </div>
      ` : null}

      ${!canApply && !hasSnippet && !cannotApplyReason ? html`
        ${/* Neither fact is true AND the server had no sentence of its own, so
              this is the last line of defence against a blank action area, which
              reads as a bug. Gated on the reason being absent because when it is
              present it already says what to do, and printing both put "the
              example sessions" on screen twice (seen live with the noise floor
              off, not reasoned about).

              There is deliberately NO "Mark applied" in this component at all:
              an advise-only cluster has no apply path (`RelearnApplyModal` itself
              says "nothing to approve"), so a marker button would ask the reader
              to confirm having done something we never told them to do, and would
              write a ledger entry for a fix that does not exist. */ ''}
        <div class="sz-note" style="font-size:12px;margin-top:10px">There is nothing to apply here yet. The example sessions are what we have.</div>
      ` : null}

      <div style="display:flex;gap:12px;align-items:center;justify-content:flex-end;margin-top:12px">
        ${canApply ? html`
          ${/* Plain ampersand, not `&amp;`: htm assigns text content rather than
                parsing HTML entities, so an entity here renders literally. */ ''}
          <button class="cur-btn primary" onClick=${onExpand} title="Opens the write: you confirm scope and target before anything is written to disk">Approve & write →</button>
        ` : html`<span class="sz-link" onClick=${onExpand}>${hasSnippet ? 'See the evidence →' : 'See the example sessions →'}</span>`}
        <span class="sz-link" style="color:var(--text)" onClick=${onDismiss}>Dismiss</span>
      </div>
    </div>`;
}

// The card's Approve flow: preview -> (optional active-session warning ->
// "apply anyway") -> write. Scope + target are ALWAYS human-editable before
// Approve (§7 — repo-identity is noisy; never trust the suggestion blindly).
// `queuePos` ({ index, total }) and `onNext` are set only when the modal was
// opened from the toolbar's "Review N checked" queue. Approving stays strictly
// one-at-a-time even then — each fix needs its own scope/target confirmation
// (requirement #9), so the queue only automates *getting to* the next card,
// never the approval itself. onClose abandons the whole queue; onNext leaves
// the current card untouched and opens the following one.
function RelearnApplyModal({ cluster, onClose, onApplied, queuePos, onNext }) {
  const [scope, setScope] = useState('project');
  const [target, setTarget] = useState('');
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [warning, setWarning] = useState(null);   // active-session 409 text — offers "apply anyway"
  const [result, setResult] = useState(null);      // the applied record, once written

  useEffect(() => {
    if (!cluster) return;
    setScope(cluster.scope || 'project');
    setTarget(cluster.suggested_target || '');
    setBusy(false); setError(null); setWarning(null); setResult(null);
  }, [cluster && cluster.signature]);

  if (!cluster) return null;

  const doApprove = async (force) => {
    if (!target.trim()) { setError('enter a target path first'); return; }
    setBusy(true); setError(null);
    try {
      // Only the proposal's ID travels: the server reads the cluster content
      // from its own stored proposals, so the browser can't apply anything the
      // detector didn't produce. Scope + target stay client-supplied because
      // the human edits them here before approving.
      const body = {
        proposal_id: cluster.proposal_id,
        scope, target_path: target.trim(), go: true, force: !!force,
      };
      const r = await apiPostOrDetail('/relearn/apply', body);
      setWarning(null);
      setResult(r.record);
      onApplied && onApplied(r.record);
    } catch (e) {
      // The active-session guard refuses via 409 unless force=true — offer
      // the explicit "apply anyway" the spec calls for, instead of a bare error.
      if (e.status === 409 && /active session/.test(e.message || '')) {
        setWarning(e.message);
      } else {
        setError(e.message || String(e));
      }
    } finally {
      setBusy(false);
    }
  };

  return html`
    <div class="cur-overlay" onClick=${onClose}>
      <div class="cur-modal" onClick=${e => e.stopPropagation()}>
        <div class="cur-modal-head">
          <span class="cur-modal-title">${cluster.title}</span>
          ${queuePos ? html`<span class="dim" style="font-size:11.5px;margin-left:6px">${queuePos.index} of ${queuePos.total}</span>` : null}
          <span class=${'rev-state ' + (result ? 'applied' : 'staged')} style="margin-left:6px">${result ? 'applied' : 'pending'}</span>
          <button class="cur-modal-x" onClick=${onClose} title=${queuePos ? 'Stop reviewing' : 'Close'}>✕</button>
        </div>
        <div class="cur-modal-body">
          <div style="font-size:12.5px;margin-bottom:10px">
            <b>${cluster.sessions}</b> distinct sessions · <b>${cluster.occurrences}</b> occurrences ·
            spread across <b>${(cluster.repos || []).length}</b> repo${(cluster.repos || []).length === 1 ? '' : 's'} ·
            ${deliveryLabel(cluster.delivery)}
          </div>
          ${/* What this recurrence ALREADY COST, before any gate. Rendered on
                the expanded card as well as the row because this is the one
                figure that stays true whether or not our library has a fix
                for it — a cluster we cannot act on still spent the money. */ ''}
          ${(cluster.past_overspend_usd != null || cluster.past_overspend_tokens != null) ? html`
            <div class="opt-section" style="margin:0 0 14px">
              <div class="opt-title" style="font-size:13px">What this already cost</div>
              <div class="sz-note" style="margin-top:4px" title=${cluster.past_overspend_basis || ''}>
                ${cluster.past_overspend_usd != null ? fmtUsd(cluster.past_overspend_usd) : '~' + fmtTokens(cluster.past_overspend_tokens) + ' tokens'}
                ${/* Leading space is explicit: htm does not preserve the
                      newline between an interpolation and the literal text
                      that follows it, so without it this reads "tokensover". */ ''}
                ${cluster.past_overspend_usd != null && cluster.past_overspend_tokens ? ' · ~' + fmtTokens(cluster.past_overspend_tokens) + ' tokens ' : ' '}
                over the scanned corpus, priced at the rates these sessions were billed at. Observed, not projected, and not netted against any fix's cost.
                ${cluster.past_reread_usd != null ? html`<div style="margin-top:4px">Of that, ${fmtUsd(cluster.past_reread_usd)} is the re-read tail: the failure text still being carried on later calls. That share is re-sent context the Resend card prices in full, so the two overlap and must never be added together.</div>` : null}
              </div>
            </div>` : null}
          <div class="opt-section" style="margin:0 0 14px">
            <div class="opt-title" style="font-size:13px">Proposed fix</div>
            <div class="sz-note" style="margin-top:4px">${cluster.proposed_fix}</div>
          </div>
          <div class="opt-section" style="margin:0 0 6px">
            <div class="opt-title" style="font-size:13px">Evidence: repro sessions</div>
            ${(cluster.examples || []).map((ex, i) => html`
              <div class="sz-runrow" key=${i} style="align-items:flex-start">
                ${ex.session_resolvable
                  ? html`<a class="sz-link" href=${'#/sessions/' + ex.session_id} target="_blank" rel="noopener">${(ex.session_id || '').slice(0, 12)}</a>`
                  : html`<span class="dim" style="font-size:12px" title="This session was read from a transcript on disk and has not been ingested, so there is no session page to open.">${(ex.session_id || '').slice(0, 12)}</span>`}
                <span class="dim" style="font-size:12px">${ex.repo}${ex.ts ? ' · ' + ex.ts.slice(0, 16).replace('T', ' ') : ''}</span>
                <pre class="rev-diff" style="margin:4px 0 0;white-space:pre-wrap;font-size:11.5px;flex-basis:100%">${ex.snippet}</pre>
              </div>`)}
            ${(!cluster.examples || cluster.examples.length === 0) ? html`<div class="dim" style="font-size:12.5px">No example sessions captured.</div>` : null}
          </div>

          ${cluster.advise_only ? html`
            <div class="opt-section" style="margin:0 0 6px">
              <div class="opt-title" style="font-size:13px">No apply path <span class="dim" style="font-weight:400">· advise-only</span></div>
              <div class="sz-note" style="margin-top:4px">${cluster.advise_only_reason || 'Every agent in this cluster is a service tokenjam has no workspace for, so there is no file to write a fix into. Apply the recommendation yourself, then measure it with tj relearn verify --otel.'}</div>
            </div>
          ` : !result ? html`
            <div class="opt-section" style="margin:0 0 6px">
              <div class="opt-title" style="font-size:13px;margin-bottom:2px">Where to write it</div>
              <div style="margin:0 0 4px"><span class="dim" style="font-weight:400">repo-identity is noisy; confirm before approving</span></div>
              <div style="display:flex;gap:8px;margin-top:0;flex-wrap:wrap">
                <select class="rename-input" style="width:160px" value=${scope} onChange=${e => setScope(e.target.value)}>
                  <option value="project">project</option>
                  <option value="user-global">user-global</option>
                </select>
                <input class="rename-input" style="flex:1;min-width:280px" value=${target}
                  placeholder="/absolute/path/to/target"
                  onInput=${e => setTarget(e.target.value)} />
              </div>
              ${ENFORCEMENT_DELIVERIES.has(cluster.delivery) ? html`<div class="sz-note" style="margin-top:8px;color:var(--warn)">This writes a hook, DISABLED by default; it will not run until you separately confirm "Enable enforcement".</div>` : null}
            </div>
          ` : html`
            <div class="opt-section" style="margin:0 0 6px">
              <div class="opt-title" style="font-size:13px">Written to</div>
              <div class="sz-note" style="margin-top:4px"><code>${result.target_path}</code>${result.git_commit ? html` · committed <code>${result.git_commit.slice(0, 8)}</code>` : ' · backed up (not a git repo)'}</div>
            </div>
          `}

          ${warning ? html`<div class="opt-caveat" style="color:var(--warn)">${warning} <span class="sz-link" onClick=${() => doApprove(true)}>Apply anyway →</span></div>` : null}
          ${error ? html`<div class="opt-caveat" style="color:var(--error)">${error}</div>` : null}
        </div>
        <div class="cur-modal-foot">
          ${cluster.advise_only ? html`<span class="dim" style="font-size:12px">Nothing to approve: this recommendation is yours to apply.</span>`
            : !result ? html`
            ${/* States the write's consequence BEFORE it happens. The body
                  below only reports git-commit vs backup after the fact, and
                  this is the last point at which the user can decline. */ ''}
            <button class="cur-btn primary" disabled=${busy} onClick=${() => doApprove(false)}
              title="Writes this fix: git-committed, or backed up if the target is not a git repo; you confirm the scope and target first">${busy ? 'Applying…' : 'Approve →'}</button>
          ` : html`<span class="dim" style="font-size:12px">Applied. Manage enforcement/revert from the Applied section below.</span>`}
          ${queuePos && onNext ? html`<button class="cur-btn" style="margin-left:auto" onClick=${onNext} title="Leave this one as-is and open the next checked row">Next →</button>` : null}
          <button class="cur-btn" style=${queuePos && onNext ? '' : 'margin-left:auto'} onClick=${onClose}>${queuePos ? 'Stop reviewing' : 'Close'}</button>
        </div>
      </div>
    </div>`;
}

// The days-ago label the Applied tab's mockup uses ("Applied 3 days ago").
function daysAgoLabel(iso) {
  if (!iso) return '';
  const then = new Date(iso).getTime();
  if (Number.isNaN(then)) return '';
  const days = Math.floor((Date.now() - then) / 86400000);
  if (days <= 0) return 'today';
  return days === 1 ? '1 day ago' : days + ' days ago';
}

// A merged applied record's (`rec.kind`: 'relearn' | 'cost') own figure — a
// bounded, point-in-time snapshot taken at the moment of apply, NEVER a live
// re-measurement (behavioral requirement #7, REVISED: the perpetual
// verify/receipts layer that would have produced a real measured figure was
// removed in commit c0316aba for making unsupportable realized-savings
// claims; see the note above InboxStatTiles).
//
// The two ledgers are on DIFFERENT storage shapes but the SAME one canonical
// field now — this function does not pretend otherwise, it returns bare
// `usd`/`tokens`, and the caller labels them per kind. For a COST marker it
// is `past_overspend_usd`/`_tokens`, the window-observed avoidable figure
// carried straight onto the ledger record by cost_apply.mark_applied. For
// RELEARN it is `verify.past_overspend_usd/tokens`, the same field snapshotted
// once by relearn_apply.apply_relearn_fix at the moment of apply — a relearn
// cluster shows its past figure only, same as every other analyzer's card, so
// there is no separate monthly-basis figure to reach for here any more.
//
// Applies the same NOT_A_SAVINGS_CLAIM_ANALYZERS exclusion a resend/TRIM
// marker needs here too.
// Read-only compat for records applied BEFORE the past_overspend_* collapse:
// a pre-upgrade `applied_fixes.json` entry snapshotted its estimate under the
// retired forward-savings field names (`estimated_monthly_usd`/`_tokens`) --
// `verify.*` for relearn, top-level for a cost marker. Falling back to those
// only when the canonical field is genuinely absent (`!= null`, so a real `0`
// is never mistaken for "missing") keeps the figure on the Applied tab for an
// existing ledger entry instead of it silently disappearing the moment this
// function started reading only the new names. Never a write path: nothing
// here re-persists the legacy field onto the record.
function appliedEstimate(rec) {
  const isRelearn = rec.kind === 'relearn';
  const source = isRelearn ? (rec.verify || {}) : rec;
  const usd = source.past_overspend_usd != null
    ? source.past_overspend_usd : source.estimated_monthly_usd;
  const tokens = source.past_overspend_tokens != null
    ? source.past_overspend_tokens : source.estimated_monthly_tokens;
  return {
    isRelearn,
    usd: NOT_A_SAVINGS_CLAIM_ANALYZERS.has(rec.analyzer) ? null : usd,
    tokens,
  };
}

// The Applied tab's one row shape for BOTH ledgers (`rec.kind` discriminates
// 'relearn' | 'cost' — stamped by ReviewInboxView when it merges the two
// lists). Mockup: title, "Applied N days ago", a green delta figure — always
// labeled `est.`, NEVER a "verified" claim or chip (behavioral requirement
// #7, REVISED — see the note above `appliedEstimate` and InboxStatTiles).
// Enforcement enable/disable only ever applies to relearn hook fixes.
// The applied row's loading placeholder, in the same geometry as the real row
// (title line, metadata line, action line) so real content FILLS IN rather than
// replacing a differently-shaped block. Kept immediately beside `AppliedItemRow`
// so the two shapes are edited together; a skeleton that has drifted from the row
// it stands in for causes exactly the layout jump it exists to prevent.
function AppliedSkeletonRow() {
  return html`
    <div class="sz-runrow" aria-hidden="true" style="align-items:flex-start;flex-direction:column;gap:6px">
      <div style="display:flex;align-items:center;gap:8px;width:100%">
        <div class="shimmer" style="height:13px;width:38%"></div>
        <div class="shimmer" style="height:13px;width:60px;margin-left:auto"></div>
      </div>
      <div class="shimmer" style="height:11px;width:64%"></div>
      <div class="shimmer" style="height:11px;width:12%"></div>
    </div>`;
}

function AppliedItemRow({ rec, onChanged, suppressed }) {
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [confirming, setConfirming] = useState(false);

  const call = async (fn) => {
    setBusy(true); setError(null);
    try { await fn(); onChanged && onChanged(); }
    catch (e) { setError(e.message || String(e)); }
    finally { setBusy(false); setConfirming(false); }
  };

  const isRelearn = rec.kind === 'relearn';
  const enforcement = rec.enforcement;
  // The ledger's own `kind` names the artifact. A record written before
  // mechanisms had names carries a word this set does not hold, so it simply
