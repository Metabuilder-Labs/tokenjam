                say "nothing has been applied yet". */ ''}
          ${sfAppliedN === 0
              ? html`<div class="opt-card-body">Nothing has been applied yet. A rewrite you approve on Summarize is recorded here with the estimate it carried at the time.</div>`
              : html`
                ${(st.bk || []).filter(b => (b.est_tokens_saved || 0) > 0).map(b => html`
                  <div class="opt-applied-row" key=${b.path || b.backup_path}>
                    <span>${shortPath(b.path || b.backup_path || '')}</span>
                    <span class="est">~${fmtTokens(b.est_tokens_saved)} tok/call</span>
                  </div>`)}
                <div class="opt-card-note" style="margin-top:10px;display:block">
                  ${sfAppliedN} file${sfAppliedN === 1 ? '' : 's'} · ~${fmtTokens(sfApplied)} tok/call, ${sfPctApplied}% of what has been found.
                </div>`}
          <div class="opt-card-note" style="margin-top:10px;display:block">
            est. at apply time, never re-measured: a point-in-time snapshot, not a realized saving.
          </div>
        </div>
      </div>

      ${st.cmp ? html`<div class="chart-card"><div class="chart-title">Window comparison (${compare})</div>
        <div class="opt-line">Cost ${st.cmp.cost_delta_usd >= 0 ? '▲' : '▼'} ${fmtFramedDollar(Math.abs(st.cmp.cost_delta_usd), framing)} ${st.cmp.cost_delta_pct != null ? '(' + st.cmp.cost_delta_pct.toFixed(1) + '%)' : ''} · Tokens ${st.cmp.tokens_delta >= 0 ? '▲' : '▼'} ${fmtTokens(Math.abs(st.cmp.tokens_delta))}</div></div>` : null}
      ${(st.opt.budgets || []).length ? html`<section class="opt-section" id="opt-budget-projection">
        <div class="opt-title"><span>Budget projection <span class="forecast-tag" title="A forecast of spend against your configured ceiling, not a measurement of waste. There is nothing here to apply.">forecast</span></span></div>
        ${st.opt.budgets.map(b => html`<div class="opt-line">
          <a class="sz-link" href=${'#/budget?provider=' + encodeURIComponent(b.provider)} title="Edit this provider's monthly ceiling on the Budget screen">${b.provider}</a>:
          run rate ${fmtFramedDollar(b.monthly_run_rate_usd, framing)}/mo vs
          ${fmtFramedDollar(b.budget_usd, framing)}/cycle ceiling
          (<a class="sz-link" href=${'#/budget?provider=' + encodeURIComponent(b.provider)}>configured for ${b.provider}</a>, cycle resets day ${b.cycle_start_day})
          ${b.over_budget ? html`<span style="color:var(--error)">· projected ${fmtFramedDollar(b.projected_overage_usd, framing)} over ceiling</span>` : html`<span style="color:var(--text-dim)">· projected within ceiling</span>`}
        </div>`)}
        <div class="opt-caveat">! This projects your current run rate forward against the ceiling you set for that provider on the <a class="sz-link" href="#/budget">Budget screen</a>, not the per-agent daily/session caps shown there. It identifies exposure, not recoverable spend. There is nothing to apply here; the fix is to spend less or raise the ceiling.</div>
        ${st.opt.budgets.some(b => b.over_budget) && st.comp && st.comp.largest_recoverable_analyzer ? html`
        <div class="opt-line" style="margin-top:6px">Biggest single cause: <b>${fmtFramedSavings(st.comp.largest_recoverable_usd, st.comp.largest_recoverable_tokens, compFraming)}</b> via <a class="sz-link" href=${optimizeFindingHref(st.comp.largest_recoverable_analyzer, since)}>${(ANALYZER_META[st.comp.largest_recoverable_analyzer] && ANALYZER_META[st.comp.largest_recoverable_analyzer].title) || capitalize(st.comp.largest_recoverable_analyzer)}</a>. The fastest way to bring the projection back under ceiling.</div>` : null}
      </section>` : null}
    ` : null}
  `;
}

// ============================
// FAQ (formerly Optimize ▸ Guide) — what each check looks for, in plain language.
// ============================
// This page exists for one question that kept getting asked: how are `downsize`
// and `subagent` different? They sit next to each other on the Optimize screen,
// both talk about models and workers, and nothing on either card says where the
// line is. A reader who finishes this page still unsure which check covers
// which mistake means the page has failed, so that contrast is stated first,
// before any per-check text.
//
// TWO SOURCES, KEPT SEPARATE ON PURPOSE.
//   * WHICH checks apply is the server's answer, read from
//     `/optimize/analyzers` (derived from the analyzer registry and the
//     persona gate in core/optimize/runner.py). There is no gating in this
//     file: no name list, no persona conditional deciding what runs. A JS copy
//     of that map is exactly the thing that silently desyncs the first time
//     Python changes, which is why the endpoint exists.
//   * WHAT each check means is prose, and prose has to live somewhere. This map
//     is keyed by analyzer name and carries nothing but words; if a key is
//     absent from the server's list it simply never renders, and if the server
//     lists a name this map does not cover the guide says so out loud rather
//     than quietly omitting a check the reader was told runs.
//
// PERSONA. The structure is per-persona because the gate is per-persona and the
// right explanation genuinely differs by setup. Exactly one persona is written
// today. An unwritten persona gets an honest banner naming the gap, never
// invented copy: text describing an SDK user's levers, written from a corpus of
// interactive coding sessions, would be fabrication.
// Per-check prose: one heading, one description (a few paragraphs of flowing
// text). Deliberately no numbers, no field names, no thresholds: those live on
// the cards, which is where a reader can see them against their own data.
//
// Downsize and Subagent used to share a separate callout card stating the
// distinction between them (WHERE the work happened vs. WHO did it); that
// card is gone, and the distinction is written into each of their own
// descriptions instead, so either section stands alone. The WHERE/WHO framing
// and the "a session can only trip one of them" claim are grounded in how
// `model_downgrade.py`'s driver-role case and `subagent_rightsizing.py` are
// actually scoped: the driver-role case (the bulk of what Downsize flags) only
// admits sessions that never dispatched a subagent at all, and
// `subagent_rightsizing` only ever reads spans already tagged with a
// `sub_agent_id` (i.e. already dispatched to a worker), so the two describe
// disjoint populations for the flagship detection each card reports on.
//
// This is a card for every analyzer whose check ends in a fix a user could
// apply -- NOT every name in `ANALYZER_REGISTRY` (`core/optimize/`). Those
// are different lists: `budget-projection` and `stream-usage` both live in
// the registry, but neither ends in anything to change (budget-projection is
// a spend forecast against a ceiling; stream-usage corrects a spend FIGURE,
// it recovers nothing), so neither gets a card. The other 6 gated-off names
// below (cache, cache-recommend, reuse, script, trim, verbosity) DO end in a
// fix in the abstract -- they are gated off for Claude Code specifically
// (no lever that persona can reach, or the check cannot fire for it), which
// is a different, narrower kind of exclusion than "has no fix at all". A
// newly-registered analyzer must be triaged against this same rule by a
// human before it gets a card here; see
// `test_analyzer_guide_covers_the_reviewed_user_facing_analyzer_list` in
// `tests/unit/test_lens_ui_regression.py`, which fails loudly (naming the
// analyzer) when a registry name is in neither this object's `order` nor its
// own explicit excluded list, rather than silently doing nothing or
// silently adding a card.
//
// `order` below lists the live-for-Claude-Code ones first, then the ones
// gated off for Claude Code, and the two groups are never interleaved. The
// live/gated split and the reasoning inside each gated entry's description
// are grounded in `.claude/product-state/ANALYZER-PERSONA-MATRIX.md` (the
// durable decision record for persona gating) plus the gated analyzer's own
// module docstring, not re-derived here. `placement` is a sub-check
// `downsize` attaches, not its own registry entry, so it has no card of its
// own -- it is covered inside Downsize's description of what the
// driver-role case claims.
//
// Static and complete by construction, so this page needs no server fetch:
// which analyzers exist and which are gated for Claude Code are both decided
// in code (the analyzer registry and the persona gate map in
// `core/optimize/runner.py`), not at runtime.
const GUIDE_ENTRIES = {
  'claude-code': {
    order: [
      // Live for Claude Code: these produce cards on the Optimize screen.
      'downsize', 'subagent', 'resend', 'summarize', 'deadweight', 'relearn',
      // Gated off for Claude Code: documented here, never shown as an empty
      // card on Optimize.
      'cache', 'cache-recommend', 'reuse', 'script', 'trim', 'verbosity',
    ],
    // WHICH of `order` is gated off, named rather than inferred from position.
    // The split used to live only in the comment above, so the two groups the
    // page promises ("live for this setup, then off for it, with the reason")
    // were a reading convention no code could act on.
    gated: ['cache', 'cache-recommend', 'reuse', 'script', 'trim', 'verbosity'],
    entries: {
      downsize: {
        title: 'Downsize',
        description: [
          'Downsize is about WHERE the work happened: a context-heavy piece of work carried out inline, in the main thread, on an expensive model, rather than handed to a worker. Everything read in the main thread stays in the main thread, and is sent again on every turn that follows, so the cost of that reading keeps compounding for as long as the session runs. The longer the session, the more the original decision costs.',
          'The main way this check flags a session requires that the session never dispatched a subagent at all. The moment a worker gets involved, the question this check is asking (should this have been delegated) is no longer open; whether the worker chosen was the right size is a different question, and it is what the Subagent check answers instead.',
          'The fix is a standing rule that sends context-heavy sub-tasks to a worker, so the reading lands in the worker and only its conclusion comes back. Pair it with a cheaper model pinned for that worker.',
        ],
      },
      subagent: {
        title: 'Subagent',
        description: [
          'Subagent is about WHO did the work, once delegation had already happened: the work went to a worker, which was the right call, but the worker itself was over-sized for the job, a premium model where a cheaper one would have done, or far more context handed over than the task ever needed.',
          'This check only ever looks at spans already dispatched to a worker, so it never asks whether the work should have been delegated in the first place; that question belongs to Downsize, which (for the case that carries most of its money) only considers sessions where no worker was ever dispatched. A session that delegates moves out of Downsize\'s territory and into Subagent\'s instead of tripping both.',
          'The fix is to pin a cheaper model for that worker. The delegation stays; only the size of what you dispatched changes.',
        ],
      },
      resend: {
        title: 'Context resend',
        description: [
          'The same context, charged again every turn: context accumulates in the main thread and is re-sent with every subsequent turn, long after the turn that actually needed it. Nothing about it is re-read by you, but all of it travels with each request.',
          'The fix is to move the work that produced it to a worker, so its output never lands in your thread in the first place. Then right-size that worker so the offload is not simply a more expensive way to read the same files.',
        ],
      },
      summarize: {
        title: 'Summarize',
        description: [
          'Always-loaded instruction files that run long: files that are always in context, such as CLAUDE.md, rules and skills, carry more prose than they need. Length there is not paid once; it is paid on every call of every session that loads the file.',
          'The fix is a reviewed rewrite that shortens the prose and keeps the structure exactly as it was. Each rewrite is shown as a diff you approve file by file, and nothing is written until you say so.',
        ],
      },
      deadweight: {
        title: 'Deadweight',
        description: [
          'A connected tool nothing ever calls: an MCP server is connected but never actually used. Its tool definitions still ship with every request, so you pay to describe capabilities that go untouched.',
          'The fix is to remove the server, or disable it for the projects that do not use it.',
        ],
      },
      relearn: {
        // Same naming rule as ANALYZER_META above: the key stays the
        // analyzer's internal name, the label the user reads is "Relearn".
        title: 'Relearn',
        description: [
          'The same mistake, session after session: the agent runs into the same class of problem repeatedly across sessions and works it out again each time, because nothing carried the answer forward.',
          'The fix is to write it down once, as a rule, a skill or a hook, so the next session starts already knowing. Each proposal is shown with the recurrences behind it before anything is written.',
        ],
      },
      // ---- Gated off for Claude Code, documented rather than hidden ---- //
      cache: {
        title: 'Cache',
        description: [
          'Cache checks how much of a request is served from the model provider\'s cache instead of billed fresh, and flags a provider and model whose reuse rate is sitting below where it should be.',
          'It does not show up here: which part of a request gets cached is decided by the harness that builds the request, not by you, so there is no lever this check could hand you. It is still off, not missing; it will not appear later.',
        ],
      },
      'cache-recommend': {
        title: 'Cache recommend',
        description: [
          'Cache recommend looks for a stable, repeated prefix worth marking for explicit caching, such as project instructions that stay the same across turns.',
          'It does not show up here, for the same reason as Cache: setting that flag on a request is something the harness does, not something you can reach. It is off on purpose, not broken and not pending.',
        ],
      },
      reuse: {
        title: 'Reuse',
        description: [
          'Reuse looks for a session that re-planned work an earlier session had already planned, on the idea that the second pass could have reused the first instead of starting over.',
          'It does not show up here: measured against real interactive sessions, the claim that two planning passes were actually interchangeable does not hold up, so this check stays off rather than offer a fix built on a foundation that is not there.',
        ],
      },
      script: {
        title: 'Script',
        description: [
          'Script looks for a tool-call pattern repeated often enough, in the exact same order, to be worth replacing with a small deterministic script instead of asking the agent to redo it by hand each time.',
          'It does not show up here: its match requires a session\'s entire ordered call sequence to repeat exactly, and on real coding sessions one extra file read is enough to break the match, so it essentially never fires. It is off because it cannot fire, not because it was turned off.',
        ],
      },
      trim: {
        title: 'Trim',
        description: [
          'Trim looks for low-value tokens inside a prompt template that are worth cutting to shorten every call built from that template.',
          'It does not show up here: it needs a prompt template you can edit, and an interactive coding agent constructs and sends its own prompts, so there is no template file this check could point you at.',
        ],
      },
      verbosity: {
        title: 'Verbosity',
        description: [
          'Verbosity flags a session whose output ran noticeably longer than similarly-shaped sessions, on the idea that some of that length was not necessary.',
          'It does not show up here: the only available fix is a blanket instruction to answer in fewer words everywhere, which trades away how useful the agent is just to save tokens, and that is not a trade this product makes.',
        ],
      },
    },
  },
};

function GuideCheck({ name, entry }) {
  return html`<section class="guide-card" id=${'guide-' + name}>
    <div class="guide-card-head">
      <span class="guide-card-title">${entry.title}</span> <span class="guide-name">${name}</span>
    </div>
    ${entry.description.map((p, i) => html`<div key=${i} class="guide-prose">${proseParagraphs(p)}</div>`)}
  </section>`;
}

// One card per registered analyzer, in `guide.order` (live-for-Claude-Code
// first, gated-off-for-Claude-Code after, never interleaved). Fully static:
// see the comment above `GUIDE_ENTRIES` for why this needs no server fetch.
function GuideBody() {
  const guide = GUIDE_ENTRIES['claude-code'];
  const gated = new Set(guide.gated || []);
  const live = guide.order.filter(n => !gated.has(n));
  const off = guide.order.filter(n => gated.has(n));
  return html`
    ${live.length ? html`
      <div class="section-band" style="margin-top:0">Live for this setup</div>
      <div class="guide-grid">
        ${live.map(n => html`<${GuideCheck} key=${n} name=${n} entry=${guide.entries[n]} />`)}
      </div>` : null}
    ${/* The gated checks are not cards. A card says "here is a thing for you";
          these are the checks that produce nothing for this setup, and the only
          useful content on each is the one sentence saying why. They read as a
          list of reasons, which is what they are. */ ''}
    ${off.length ? html`
      <div class="section-band">Off for this setup</div>
      <div class="panel">
        ${off.map(n => html`
          <div class="guide-off-row" key=${n}>
            <div class="guide-off-name">${guide.entries[n].title} <span class="guide-name">${n}</span></div>
            <div class="guide-off-why">${proseParagraphs((guide.entries[n].description || []).slice(-1)[0] || '')}</div>
          </div>`)}
      </div>` : null}
  `;
}

function AnalyzerGuideView() {
  return html`
    <div class="page-title" style="margin-bottom:6px">FAQ</div>
    <div class="guide-prose" style="max-width:720px;margin-bottom:20px">Below is every check that ends in something you could change, in two groups: first the ones that actually produce cards on the Optimize screen for this setup, then the ones that are turned off for it, with the reason why. Figures on a live check's card are estimates from your own history, offered as candidates to review before you act on them.</div>
    <${GuideBody} />
  `;
}

// ============================
// Optimize ▸ Summarize (Track B) — curate → run → review/apply.
// ============================
// The Optimize dashboard SHOWS the recoverable signal (the Track A `summarize`
// analyzer); THIS screen DOES the work. Its reason to exist vs. `tj summarize`
// on the CLI is granularity (DEC-034): the CLI applies all-or-nothing, here you
// pick a subset, run the structure-aware summarizer per file, review each diff,
// and apply individually. Every write goes through core `apply_staged` (owner +
// content-hash-drift + symlink guards, gzip backup, dry-run until an explicit
// per-file Apply — no flag bypasses a guard). All data comes from
// /api/v1/summarize/* (core in-process; the run route is `tj serve`'s first
// outbound LLM caller — capabilities-gated so dead engines are disabled).
function diffLine(ln, i) {
  let col = 'var(--text-faint)';
  if (ln.startsWith('+')) col = 'var(--success)';
  else if (ln.startsWith('-')) col = 'var(--error)';
  return html`<div key=${i} style=${'color:' + col}>${ln || ' '}</div>`;
}

// Group a unified diff into per-hunk "blocks" so the review shows the change
// block-by-block instead of one wall of @@ noise. Drops the ---/+++ file headers
// and the cryptic @@ hunk header; each hunk becomes a block with +/- line counts.
function diffBlocks(diffText) {
  const out = [];
  let cur = null;
  for (const ln of (diffText || '').split('\n')) {
    if (ln.startsWith('--- ') || ln.startsWith('+++ ')) continue;
    if (ln.startsWith('@@')) { cur = { add: 0, del: 0, lines: [] }; out.push(cur); continue; }
    if (!cur) { cur = { add: 0, del: 0, lines: [] }; out.push(cur); }
    if (ln.startsWith('+')) cur.add++;
    else if (ln.startsWith('-')) cur.del++;
    cur.lines.push(ln);
  }
  return out.filter(b => b.lines.some(l => l.trim()));
}

// Optimize ▸ Relearn — the placed rule-write surface. (Route and component
// name stay `rules`; "Relearn" is the label, see ANALYZER_META.)
//
// Four analyzers (downsize, resend, subagent, relearn) end in the same
// artifact: a rule appended to a CLAUDE.md. The backend now decides WHICH
// files each one lands in, from the working directories the sessions recorded.
// A Review-inbox card can express one write; it cannot express "this rule,
// into these 4 of your 11 projects, here is each diff, apply selectively" —
// which is what a placed rule is, and why this screen exists beside the inbox.
//
// Single compute path: every number, destination, verdict and blocked-reason
// on this screen is read verbatim from /api/v1/rules*. Nothing here re-derives
// placement, netting, or which analyzers write rules — extend the endpoint, not
// this component.
function RulesView() {
  const [rules, setRules] = useState(null);       // null = not yet known
  // The delivery-mechanism registry, read from the server. Appending markdown
  // to a CLAUDE.md is one way to get a rule in front of the agent, not the
  // only one, so the label comes from the endpoint rather than a second copy
  // of the list in JS (single compute path).
  const [deliveryKinds, setDeliveryKinds] = useState({});
  const [staged, setStaged] = useState(null);
  const [applied, setApplied] = useState(null);
  const [err, setErr] = useState(null);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);
  const [preview, setPreview] = useState(null);   // { signature, applied, skipped }
  const [tab, setTab] = useState('open');         // 'open' | 'applied'

  // Each panel gates on ITS OWN fetch. `null` is "not yet known" and renders a
  // skeleton; `[]` is "known and empty" and is the only state allowed to say
  // "no rules". A count or a "none" claim painted before its fetch resolves is
  // the recurring defect this product has (root anti-pattern 22) — zero is the
  // worst placeholder, because "no waste" reads as reassurance.
  const load = async () => {
    try {
      const [r, s, a] = await Promise.all([
        api('/rules'), api('/rules/staged'), api('/rules/applied'),
      ]);
      setRules(r.rules || []);
      setDeliveryKinds(r.delivery_kinds || {});
      setStaged(s.staged || []);
      setApplied(a.applied || []);
      setErr(null);
    } catch (e) { setErr(String(e && e.message || e)); }
  };
  useEffect(() => { load(); }, []);

  const stagedBySig = {};
  (staged || []).forEach(s => {
    (stagedBySig[s.signature] = stagedBySig[s.signature] || []).push(s);
  });

  // The two tab populations, split ONCE. "In place" is either route to done:
  // tokenjam applied it (a ledger knows, exactly) or the user already had it
  // (`already_present`, resolved by the model on the analyzer pass). Everything
  // else is open. Split here rather than filtered inline at each render site, so
  // the counts on the tabs and the rows inside them cannot disagree — and the
  // predicate matches the server's own `open_count`/`in_place_count` derivation.
  const allRules = rules || [];
  const inPlaceRules = allRules.filter(r => r.already_applied || r.already_present);
  const openRules = allRules.filter(r => !r.already_applied && !r.already_present);

  // Stat tiles, in the analyzer-detail shell's vocabulary. Deliberately COUNTS,
  // never a summed dollar figure: the rules on this page come from four
  // different analyzers whose `past_overspend_usd` populations overlap, so a
  // total here would double-count the same recovery — relearn reaches the
  // rollup through its contribution path, and this screen must not grow a
  // second, naive one (root anti-pattern 22b: two figures published together
  // have to cover the same population).
  //
  // ONE STRIP PER TAB, RENDERED INSIDE IT. These used to be a single strip in
  // the page head, pinned to the pending population, so standing on "In place
  // (2)" — two real rules, real figures — you read three zeros captioning them.
  // A tile has to describe the list directly beneath it, so each tab now owns
  // its own strip and its own vocabulary, and neither can caption the other's
  // rows.
  const openDestPaths = new Set();
  openRules.forEach(r => (r.destinations || []).forEach(d => openDestPaths.add(d.path)));
  // The done population splits by the two ROUTES the rows below already carry:
  // tokenjam wrote it (a ledger knows), or it was already in the file. Derived
  // as a complement rather than a second filter, so the two always add up to
  // the population tile exactly — the three tiles cover one population, not two
  // (root anti-pattern 22b).
  const inPlaceWritten = inPlaceRules.filter(r => r.already_applied).length;
  const inPlaceAlreadyThere = inPlaceRules.length - inPlaceWritten;

  // One tile. `null` is "not yet known" and renders the skeleton — never a
  // number, and never a 0 standing in for a read that has not landed (root
  // anti-pattern 22). Each call site passes its OWN fetch's gate, so a tile
  // reading `/rules/staged` does not borrow `/rules`'s resolution.
  const statTile = (v, label) => html`
    <div class="opt-stat-tile">
      <div class="opt-stat-v">${v === null
        ? html`<span class="shimmer" style="display:inline-block;width:44px;height:20px;border-radius:4px"></span>`
        : v}</div>
      <div class="opt-stat-l">${label}</div>
    </div>`;

  const doStage = async (sig) => {
    setBusy(true); setMsg(null);
    try {
      await apiPostOrDetail('/rules/stage', { signature: sig });
      await load();
      setMsg('Staged. Review each diff below, then Apply.');
    } catch (e) { setMsg(String(e && e.message || e)); }
    setBusy(false);
  };
  const doPreview = async (sig) => {
    setBusy(true); setMsg(null);
    try {
      const res = await apiPostOrDetail('/rules/apply', { signature: sig, go: false });
      setPreview({ signature: sig, ...res });
    } catch (e) { setMsg(String(e && e.message || e)); }
    setBusy(false);
  };
  const doApply = async (sig) => {
    setBusy(true); setMsg(null);
    try {
      const res = await apiPostOrDetail('/rules/apply', { signature: sig, go: true });
      setPreview(null);
      await load();
      const n = (res.applied || []).length, k = (res.skipped || []).length;
      // The skipped count is never dropped: "3 of 4 written" is the honest
      // result, and reporting only the successes would state the rule landed
      // everywhere it was meant to.
      setMsg(`Wrote ${n} file(s)` + (k ? `, skipped ${k} (see reasons below)` : '') + '.');
    } catch (e) { setMsg(String(e && e.message || e)); }
    setBusy(false);
  };
  const doDismiss = async (sig, undo) => {
    setBusy(true); setMsg(null);
    try {
      await apiPostOrDetail(undo ? '/rules/undismiss' : '/rules/dismiss', { signature: sig });
      await load();
      setMsg(undo ? 'Brought back.' : 'Dismissed. What it already cost is still reported.');
    } catch (e) { setMsg(String(e && e.message || e)); }
    setBusy(false);
  };
  const doUndo = async (sig, path) => {
    setBusy(true); setMsg(null);
    try {
      await apiPostOrDetail('/rules/undo', { signature: sig, path, go: true });
      await load();
      setMsg('Reverted.');
    } catch (e) { setMsg(String(e && e.message || e)); }
    setBusy(false);
  };

  return html`
    <div class="view">
      ${/* The analyzer-detail shell, so this page stops reading as a different
            product from the eleven `#/optimize/<name>` pages: the same head row
            (title · CLI chip · mechanism badge), the same blurb, the same stat
            tile grid. No breadcrumb chip strip: those chips address the eleven
            analyzer detail pages, and this screen is not one of them — it is
            the cross-analyzer write queue, reached from the sidebar as a
            nav-child of Optimize, which already shows its parent one line
            above it. */ ''}
      <div class="opt-head-row">
        <div class="page-title" style="margin-bottom:0">Relearn</div>
        ${/* `tj rules` is the group that drives THIS surface — list / show /
              stage / apply / undo / applied / dismiss, one subcommand per
              button below. `tj relearn` is the self-improve loop's eval-case
              emitter and reaches none of it, so the label moving to Relearn
              does not move the command. Group-level, like the sibling
              analyzer pages' `tj optimize <name>`. */ ''}
        <span class="opt-cli-chip">tj rules</span>
        <span class="opt-mech-badge opt-mech-apply">${OPT_MECH_LABEL.apply}</span>
      </div>
      <div class="opt-blurb">
        Four analyzers end in the same artifact: a rule appended to an
        instruction file. tokenjam picks which files each one lands in from the
        working directories your sessions recorded, so one rule can be a single
        write, or the same write into several of your projects, each with its
        own diff.
      </div>
      ${err ? html`<div class="panel" style="margin-top:var(--stack-gap)"><div class="panel-body opt-line" style="color:var(--error)">${err}</div></div>` : null}
      ${msg ? html`<div class="panel" style="margin-top:var(--stack-gap)"><div class="panel-body opt-line">${msg}</div></div>` : null}

      ${/* TWO POPULATIONS, TWO TABS. This page used to be one "On offer" zone
            listing every rule, including the ones the write budget refused, each
            explaining its refusal: "below the $5 floor", "would cost more to keep
            than it recovers", "your instruction files already carry more standing
            context than the budget allows to grow". Individually honest;
            collectively a page of things the product declined to do, shown to a
            user who came looking for something to apply.

            The gate moved below this surface, so there is no refusal prose left
            to render. What remains splits cleanly: something to do, or something
            already done. Counts come from the server (`open_count` /
            `in_place_count`) rather than being re-derived here, and they are held
            back until the fetch resolves — a "(0)" painted mid-flight reads as a
            settled "you have nothing", which is the worst thing this page can
            say wrongly (root anti-pattern 22). */ ''}
      <div class="tabs" role="tablist" style="margin-top:var(--stack-gap)">
        <button class="tab ${tab === 'open' ? 'active' : ''}" role="tab" aria-selected=${tab === 'open'} onClick=${() => setTab('open')}>
          Pending ${rules === null
            ? html`<span class="shimmer" style="display:inline-block;width:20px;height:9px;vertical-align:middle;border-radius:3px"></span>`
            : html`(${openRules.length})`}
        </button>
        <button class="tab ${tab === 'applied' ? 'active' : ''}" role="tab" aria-selected=${tab === 'applied'} onClick=${() => setTab('applied')}>
          In place ${rules === null
            ? html`<span class="shimmer" style="display:inline-block;width:20px;height:9px;vertical-align:middle;border-radius:3px"></span>`
            : html`(${inPlaceRules.length})`}
        </button>
      </div>

      ${tab === 'open' ? html`
      ${/* Counted only when there is something to count. A known-empty tab gets
            the sentence below and no strip at all: "0 rules waiting to be
            written" is a true measurement that still reads as a broken tile,
            and the empty state is the one honest home for that claim (root
            anti-pattern 22a). Not-yet-known still gets the skeleton strip, so
            the page does not jump when the fetch lands. */ ''}
      ${rules === null || openRules.length > 0 ? html`
        <div class="opt-stats">
          ${statTile(rules === null ? null : openRules.length, 'rules waiting to be written')}
          ${statTile(rules === null ? null : openDestPaths.size, 'project files they would land in')}
          ${statTile(staged === null ? null : staged.length, 'staged, ready to review')}
        </div>` : null}
      ${rules === null
          ? html`<div class="opt-line dim">Loading…</div>`
          : openRules.length === 0
            ? html`<div class="empty compact">${
                inPlaceRules.length > 0
                  ? 'Nothing left to write. Every rule the analyzers derived is already in your files.'
                  : 'No permanent rules to write. Run an optimize pass, then reload.'
              }</div>`
            : openRules.map(r => {
                const dests = r.destinations || [];
                const st = stagedBySig[r.signature] || [];
                // Primary action, one per card, in the order the flow actually
                // runs: stage the diffs, then write them. A rule with no
                // resolved destination has no writer at all, so its primary
                // action is to take the text away — the same "hands you the
                // fix" fallback the analyzer pages use when no apply path
                // exists, rather than a disabled button implying one does.
                const primary = st.length
                  ? html`<button class="cur-btn primary" disabled=${busy} onClick=${() => doApply(r.signature)}>Approve & write</button>`
                  : (r.offered && !r.dismissed && dests.length)
                    ? html`<button class="cur-btn primary" disabled=${busy} onClick=${() => doStage(r.signature)}>Stage diffs</button>`
                    : null;
                return html`<div key=${r.signature} class="rule-card">
                  <div class="rule-head">
                    <b>${r.title || r.signature}</b>
                    <span class="rule-meta">${r.analyzer} · ${
                      (deliveryKinds[r.delivery] && deliveryKinds[r.delivery].label)
                        || deliveryLabel(r.delivery)}</span>
                    ${r.past_overspend_usd == null
                      ? html`<span class="rule-usd dim">—</span>`
                      : html`<span class="rule-usd">${fmtUsd(r.past_overspend_usd)}</span>`}
                  </div>
                  <div class="rule-dest">
                    ${dests.length === 0
                      ? 'No destination resolved: no session it was derived from recorded a working directory that still exists.'
                      : dests.length === 1
                        ? html`Writes into <span class="mono" title=${dests[0].path}>${shortPath(dests[0].path)}</span> <span class="dim">(${dests[0].scope})</span>`
                        : html`Writes into ${dests.length} project files`}
                  </div>
                  ${dests.length > 1 || r.placement_basis || r.placement_coverage_note ? html`
                    <div class="rule-basis">
                      ${r.placement_basis ? proseParagraphs(r.placement_basis) : null}
                      ${dests.length > 1 ? dests.map(d => html`<span class="mono" title=${d.path}>· ${shortPath(d.path)}${d.sessions ? ` (${d.sessions} session${d.sessions === 1 ? '' : 's'})` : ''}</span>`) : null}
                      ${r.placement_coverage_note ? proseParagraphs(r.placement_coverage_note) : null}
                    </div>` : null}
                  ${/* No "Not on offer: <reason>" line any more. A rule the budget
                        declined is not in this list at all — the gate sits below
                        the surface now — so the only state worth stating here is
                        the user's own: they dismissed it. */ ''}
                  ${r.dismissed
                    ? html`<div class="rule-dest"><b>Dismissed.</b> ${r.blocked_reason}</div>`
                    : null}
                  ${/* The exact words that would be appended, shown outright. */ ''}
                  <div class="rule-text">${r.artifact_text}</div>
                  ${st.length ? html`<div class="rule-basis">
                    ${st.map(s => html`<span class="mono" title=${s.path}>
                      ${s.applyable ? '✓' : '!'} ${shortPath(s.path)}${s.applyable ? '' : `: ${s.reason}`}
                    </span>`)}
                  </div>` : null}
                  <div class="rule-acts">
                    ${primary}
                    ${st.length ? html`<button class="cur-btn" disabled=${busy} onClick=${() => doPreview(r.signature)}>Preview diffs (${st.length})</button>` : null}
                    <${CopySnippetButton} text=${r.artifact_text} />
                    ${r.dismissed
                      ? html`<button class="cur-btn" disabled=${busy} onClick=${() => doDismiss(r.signature, true)}>Bring back</button>`
                      : html`<button class="cur-btn" disabled=${busy} onClick=${() => doDismiss(r.signature, false)}>Dismiss</button>`}
                  </div>
                </div>`;
              })}

      ${preview ? html`<div class="panel">
        <div class="panel-head"><h2>Preview: nothing written</h2></div>
        <div class="panel-body">
          ${(preview.applied || []).map(a => html`<div class="sz-diffblock" key=${a.path}>
            <div class="sz-diffblock-h">${a.path}${a.created_file ? ' (new file)' : ''}</div>
            <div class="rev-diff">${a.diff}</div>
          </div>`)}
          ${(preview.skipped || []).map(s => html`<div class="opt-line" style="color:var(--warn)" key=${s.path}>${s.path}: ${s.reason}</div>`)}
          <div style="margin-top:8px;display:flex;gap:8px">
            <button class="cur-btn primary" disabled=${busy} onClick=${() => doApply(preview.signature)}>Write these</button>
            <button class="cur-btn" onClick=${() => setPreview(null)}>Close</button>
          </div>
        </div>
      </div>` : null}
      ` : null}

      ${tab === 'applied' ? html`
      ${/* IN PLACE, BY EITHER ROUTE. Two ways a rule ends up here and the row
            says which: tokenjam wrote it (an apply ledger knows, exactly), or the
            user already had it (the model read their file and quoted back the
            words that cover it). The second is the one that was missing, and it
            is the reason a machine whose instruction files are full of these
            rules used to see a page of refusals instead of a page of checkmarks.

            Both keep their figure. What the recurrence cost before it was fixed
            is what it cost (Critical Rule 32) — being fixed now does not un-spend
            it, and for an already-present rule that still recurs the figure is
            the interesting part, since it says the wording is not working. */ ''}
      ${/* Same gate, this tab's vocabulary: how many are done, and by which of
            the two routes. Suppressed entirely when the tab is known-empty —
            the sentence below says it in words. */ ''}
      ${rules === null || inPlaceRules.length > 0 ? html`
        <div class="opt-stats">
          ${statTile(rules === null ? null : inPlaceRules.length, 'rules in place')}
          ${statTile(rules === null ? null : inPlaceWritten, 'written by tokenjam')}
          ${statTile(rules === null ? null : inPlaceAlreadyThere, 'already in your instruction files')}
        </div>` : null}
      ${rules === null
          ? html`<div class="opt-line dim">Loading…</div>`
          : inPlaceRules.length === 0
            ? html`<div class="empty compact">No rules are in place yet. Nothing here has been written, and nothing matching was found in your instruction files.</div>`
            : inPlaceRules.map(r => html`
                <div key=${r.signature} class="rule-card">
                  <div class="rule-head">
                    <b>${r.title || r.signature}</b>
                    <span class="rule-meta">${r.analyzer} · ${r.already_applied ? 'applied by tokenjam' : 'already in your instruction files'}</span>
                    ${r.past_overspend_usd == null
                      ? html`<span class="rule-usd dim">—</span>`
                      : html`<span class="rule-usd">${fmtUsd(r.past_overspend_usd)}</span>`}
                  </div>
                  ${r.already_applied
                    ? html`<div class="rule-dest ok">✓ Applied by tokenjam.</div>`
                    : html`<div class="rule-dest ok">
                        ✓ Already in your instruction files${r.presence_path ? html` · <span class="mono" title=${r.presence_path}>${shortPath(r.presence_path)}</span>` : null}
                      </div>
                      ${/* The model's own evidence, shown rather than summarised:
                            this verdict is an inference, and a reader who did not
                            make it needs the file's words to check it against. */ ''}
                      ${r.presence_evidence ? html`<div class="rule-basis">Found: ${r.presence_evidence}</div>` : null}`}
                  <div class="rule-text">${r.artifact_text}</div>
                  <div class="rule-acts">
                    <${CopySnippetButton} text=${r.artifact_text} />
                  </div>
                </div>`)}

      ${/* The file-level undo surface, kept beneath the rows. It answers a
            different question — which FILES tokenjam has written into and can
            still restore — so it is not merged with the rule rows above. */ ''}
      ${applied === null
          ? null
          : applied.length === 0
            ? null
            : html`<div class="rules-zone">Written by tokenjam · undo</div>
              ${applied.map(a => html`<div class="opt-section inbox-row opt-line" key=${a.source_path + a.signature}>
                <span class="mono" title=${a.source_path}>${shortPath(a.source_path)}</span>
                <span class="dim"> · ${a.applied_at}</span>
                ${a.undoable
                  ? html` <button class="cur-btn" disabled=${busy} onClick=${() => doUndo(a.signature, a.source_path)}>Undo</button>`
                  : html` <span class="dim">(${a.reason})</span>`}
              </div>`)}`}
      ` : null}

      ${/* The standing terms of this screen, kept at the foot of both tabs:
            what pressing a button does, what it costs to keep a rule around,
            and why one is offered at all. */ ''}
      <div class="rule-foot">
        Nothing is written until you press it. Every write is git-commit or
        gzip-backup reversible, and a rule is context you pay for on every
        session; tokenjam offers one only when the recovery it prevents costs
        more than the rule does.
      </div>
    </div>`;
}

function SummarizeView({ params }) {
  // Flow: curate (landing — candidates load immediately, no tool choice) →
  // run → review. Looking is free; the engine is only demanded inline, at
  // the Finish/Approve step, the moment a rewrite is actually requested.
  const [phase, setPhase] = useState('curate');
  const [engine, setEngine] = useState(null);          // 'api' | 'claude-p' | 'manual'; chosen at Approve time
  const [caps, setCaps] = useState(null);
  const [capErr, setCapErr] = useState(null);

  // Scan + staged data (read-only reads).
  const [scan, setScan] = useState(null);              // ScanResult.to_dict
  const [staged, setStaged] = useState([]);            // staged records (CheckVerdict + source_sha256)
  const [backups, setBackups] = useState([]);          // applied files that still have a gzip backup (undo surface)
  const [dataErr, setDataErr] = useState(null);
  // Starts true: the mount effect always kicks off a scan, so the very first
  // render must show the loading treatment, never an unearned "no candidates".
  const [loading, setLoading] = useState(true);
  const [recursive, setRecursive] = useState(false);
  const [repoScope, setRepoScope] = useState(false);
  const scanSeq = useRef(0);   // discards a slower earlier scan's response (out-of-order landing)
  const scanOpts = useRef({ recursive: false, repo: false });   // synchronous source of truth for the toggles (no stale closure)

  // Curator.
  const [checked, setChecked] = useState(() => new Set());
  const [added, setAdded] = useState(() => new Set());
  const [kind, setKind] = useState('all');
  const [scope, setScope] = useState('all');
  const [status, setStatus] = useState('all');
  const [query, setQuery] = useState('');
  const [modal, setModal] = useState(null);            // 'review' | 'approve'
  const [mQuery, setMQuery] = useState('');

  // Run.
  const [runList, setRunList] = useState([]);          // ordered basket snapshot
  const [runState, setRunState] = useState(null);      // api/claude-p batch progress
  const [tick, setTick] = useState(0);                 // 1s ticker so the in-flight run row shows live elapsed
  const [manIdx, setManIdx] = useState(0);             // manual per-file stepper
  const [manPrep, setManPrep] = useState(null);
  const [manSummary, setManSummary] = useState('');
  const [manBusy, setManBusy] = useState(false);
  const [manErr, setManErr] = useState(null);

  // Review.
  const [revChecked, setRevChecked] = useState(() => new Set());
  const [revModal, setRevModal] = useState(null);      // staged path whose diff is open
  const [rvState, setRvState] = useState('all');
  const [rvKind, setRvKind] = useState('all');
  const [rvScope, setRvScope] = useState('all');
  const [rvQuery, setRvQuery] = useState('');
  const [fileStates, setFileStates] = useState({});    // path -> 'applied' | 'rejected' (client overlay)
  const [applyMsg, setApplyMsg] = useState(null);
  const [busy, setBusy] = useState(false);

  // The scan omits already-summarized files by design; a file that's been run
  // but not yet applied is still a candidate AND has a staged record → 'staged'.
  const cands = scan ? scan.candidates : [];
  const stagedPaths = new Set(staged.map(s => s.path));
  const candByPath = {};
  cands.forEach(c => { candByPath[c.path] = c; });
  const statusOf = c => stagedPaths.has(c.path) ? 'staged' : 'candidate';
  // Landing stat-tile row: sums an already-fetched field across an
  // already-fetched list (same reduce pattern `addedTok` below uses for the
  // basket) — not a server-side computation redone in JS. Only meaningful
  // once `scan` has actually resolved; the render site below gates on
  // `scan != null` rather than defaulting this to 0 while still loading
  // (root anti-pattern 22 — a naive sum over the empty pre-scan `cands`
  // would otherwise paint "0 candidates" before the scan ever ran).
  const totalEstTok = cands.reduce((s, c) => s + (c.est_tokens_saved || 0), 0);

  // ---- loaders (all core in-process) ----
  const loadCaps = async () => {
    try { setCaps(await api('/summarize/capabilities')); }
    catch (e) { setCapErr(e.message || String(e)); }
  };
  const loadScan = async (opts) => {
    // Merge the toggle into a ref SYNCHRONOUSLY: a second toggle handled before the
    // re-render must not rebuild the other value from a stale closure (the seq guard
    // would otherwise make that stale-but-later request authoritative).
    if (opts) scanOpts.current = { ...scanOpts.current, ...opts };
    const { recursive: rec, repo: rp } = scanOpts.current;
    const seq = ++scanSeq.current;
    setLoading(true); setDataErr(null);
    try {
      const [sc, stg] = await Promise.all([
        api('/summarize/candidates', { recursive: rec || undefined, repo: rp || undefined }),
        api('/summarize/staged'),
      ]);
      if (seq !== scanSeq.current) return;   // a newer scan superseded this response — drop it
      setScan(sc); setStaged(stg.staged || []);
    } catch (e) { if (seq === scanSeq.current) setDataErr(e.message || String(e)); }
    if (seq === scanSeq.current) setLoading(false);
  };
  const loadStaged = async () => {
    try { const stg = await api('/summarize/staged'); setStaged(stg.staged || []); }
    catch (e) { setDataErr(e.message || String(e)); }
  };
  const loadBackups = async () => {
    try { const bk = await api('/summarize/backups'); setBackups(bk.backups || []); }
    catch (e) { /* backups are a convenience surface; don't block the screen on them */ }
  };

  // Mount: candidates (so the landing view is the list, not a gate), engine
  // capabilities (needed once the user reaches Approve), and any already-staged
  // work, so the screen can also offer "review N staged" WITHOUT forcing an
  // engine choice (reviewing/applying staged rewrites needs no LLM — only
  // running does; looking never needed one either).
  useEffect(() => { loadScan(); loadCaps(); loadStaged(); loadBackups(); }, []);

  // While a batch run is in flight, tick once a second so the in-flight row shows
  // live elapsed time (a claude-p file can take 30-90s; silence reads as "hung").
  const runActive = phase === 'run' && !!runState && runState.running;
  useEffect(() => {
    if (!runActive) return undefined;
    const id = setInterval(() => setTick(t => t + 1), 1000);
    return () => clearInterval(id);
  }, [runActive]);

  // Engine card renderer, shared by the inline picker inside the Approve
  // modal (the only place a tool is ever demanded — see the Finish/Approve
  // footer below). Picking a card just sets `engine`; the picker step and the
  // "run via X" confirm step stay separate clicks so an unavailable engine's
  // reason is visible before anything runs.
  const eng = (id, name, tag, desc) => {
    const cap = caps ? caps[id] : null;
    const avail = cap ? cap.available : false;
    const val = id === 'claude_p' ? 'claude-p' : id;
    return html`<button class="sz-engine" disabled=${!avail} onClick=${() => avail && setEngine(val)}>
      <div class="sz-eng-name">${name}</div>
      <div class="sz-eng-tag">${tag}</div>
      <div class="sz-eng-desc">${desc}</div>
      ${!avail && cap && cap.reason ? html`<div class="sz-eng-off badge badge-closed">${cap.reason}</div>` : null}
    </button>`;
  };

  // ---- curator ----
  const seg = (val, set, opts, label) => html`
    <div class="cur-seg"><span class="seg-label">${label}</span>
      ${opts.map(o => html`<button class=${val === o.v ? 'on' : ''} onClick=${() => set(o.v)}>${o.t}</button>`)}
    </div>`;

  // The two filter bars on this screen (curator and review) share these option
  // lists so the same dimension cannot end up spelled two ways.
  const KIND_OPTS = [{ v: 'all', t: 'All' }, { v: 'prompt', t: 'Prompt' }, { v: 'other', t: 'Other' }];
  const SCOPE_OPTS = [{ v: 'all', t: 'All' }, { v: 'global', t: 'Global' }, { v: 'repo', t: 'Repo' }, { v: 'project', t: 'Project' }];
  const STATUS_OPTS = [{ v: 'all', t: 'All' }, { v: 'candidate', t: 'Candidate' }, { v: 'staged', t: 'Staged' }];
  const RV_STATE_OPTS = [{ v: 'all', t: 'All' }, { v: 'staged', t: 'Staged' }, { v: 'applied', t: 'Applied' },
    { v: 'rejected', t: 'Rejected' }, { v: 'reverted', t: 'Reverted' }];

  // Decide whether one filter dimension is worth a control at all, and what it
  // should actually filter by.
  //
  // A dimension whose population holds ONE distinct value cannot change the
  // result: every button either does nothing or empties the list. That was the
  // steady state here — `Kind` is binary and is almost always all-`prompt`,
  // `Scope` is usually all-`project`, and the review bar's `applied` /
  // `rejected` / `reverted` states live only in the client-side `fileStates`
  // overlay, so after a reload every row is `staged` and three of the five
  // buttons matched nothing while still being offered.
  //
  // BASIS IS THE WHOLE POPULATION THE BAR FILTERS, never the currently-visible
  // subset. Faceting on the visible subset makes a control vanish the instant
  // it is used (one value left once you pick it) and strands the reader with no
  // way back to All.
  //
  // Returns `shown: null` for "render no control", plus the value that should
  // apply. A retained selection the control can no longer offer — the data
  // moved under a stale filter, or the dimension collapsed entirely — reverts
  // to 'all' rather than silently emptying a list with nothing on screen to
  // explain why (root anti-pattern 22: a hidden control must never be
  // mistakable for "no results").
  const facet = (opts, val, rows, valueOf) => {
    const present = new Set();
    rows.forEach(r => { const v = valueOf(r); if (v != null && v !== '') present.add(v); });
    const shown = present.size < 2 ? null : opts.filter(o => o.v === 'all' || present.has(o.v));
    return { shown, effective: (shown && present.has(val)) ? val : 'all' };
  };

  const kindFacet = facet(KIND_OPTS, kind, cands, c => c.kind);
  const scopeFacet = facet(SCOPE_OPTS, scope, cands, c => c.scope);
  const statusFacet = facet(STATUS_OPTS, status, cands, statusOf);
  // Whether any dimension is still filtering, so the empty state can say which
  // of the two empties it is looking at.
  const curFiltered = kindFacet.effective !== 'all' || scopeFacet.effective !== 'all'
    || statusFacet.effective !== 'all' || query !== '';

  const baseMatch = c =>
    (kindFacet.effective === 'all' || c.kind === kindFacet.effective) &&
    (scopeFacet.effective === 'all' || c.scope === scopeFacet.effective) &&
    (statusFacet.effective === 'all' || statusOf(c) === statusFacet.effective) &&
    (query === '' || c.path.toLowerCase().includes(query.toLowerCase()));
  const visible = cands.filter(baseMatch);
  const selectable = visible.filter(c => !added.has(c.path));
  const checkedCount = [...checked].filter(p => !added.has(p)).length;

  const toggle = p => setChecked(prev => { const n = new Set(prev); n.has(p) ? n.delete(p) : n.add(p); return n; });
  const checkShown = () => setChecked(prev => { const n = new Set(prev); selectable.forEach(c => n.add(c.path)); return n; });
  const uncheckShown = () => setChecked(prev => { const n = new Set(prev); visible.forEach(c => n.delete(c.path)); return n; });
  const doAdd = () => { setAdded(prev => { const n = new Set(prev); checked.forEach(p => n.add(p)); return n; }); setChecked(new Set()); };
  const removeAdded = p => setAdded(prev => { const n = new Set(prev); n.delete(p); return n; });
  const clearAll = () => setAdded(new Set());
  const clearShownModal = () => setAdded(prev => { const n = new Set(prev); [...prev].filter(p => mQuery === '' || p.toLowerCase().includes(mQuery.toLowerCase())).forEach(p => n.delete(p)); return n; });
  const openModal = m => { setMQuery(''); setModal(m); };

  const addedList = [...added].map(p => candByPath[p]).filter(Boolean);
  const addedTok = addedList.reduce((s, c) => s + (c.est_tokens_saved || 0), 0);
  const modalList = addedList.filter(c => mQuery === '' || c.path.toLowerCase().includes(mQuery.toLowerCase()));

  // Smart tally: individual chips while few; collapse to directory groups past a cap.
  const CHIP_CAP = 8;
  const dirOf = p => { const i = p.lastIndexOf('/'); return i < 0 ? './' : p.slice(0, i + 1); };
  let chipEls;
  if (addedList.length <= CHIP_CAP) {
    chipEls = addedList.map((c, i) => html`<span class="cur-chip" key=${i}>${c.path}</span>`);
  } else {
    const groups = {};
    addedList.forEach(c => { const k = dirOf(c.path); groups[k] = (groups[k] || 0) + 1; });
    const sorted = Object.entries(groups).sort((a, b) => b[1] - a[1]);
    chipEls = [
      ...sorted.slice(0, CHIP_CAP).map(([dir, n], i) => html`<span class="cur-chip" key=${i}>${dir} <span class="dim">×${n}</span></span>`),
      ...(sorted.length > CHIP_CAP ? [html`<span class="cur-chip more" key="more">+${sorted.length - CHIP_CAP} dirs</span>`] : []),
    ];
  }

  // ---- run transitions ----
  const approve = () => {
    const list = [...added];
    setRunList(list); setModal(null); setFileStates({}); setRevChecked(new Set()); setApplyMsg(null);
    if (engine === 'manual') {
      setManIdx(0); setManSummary(''); setManErr(null); setPhase('run'); prepFile(list[0]);
    } else {
      setPhase('run'); runBatch(list);
    }
  };
  const runBatch = async list => {
    setRunState({ total: list.length, done: 0, current: null, results: [], running: true });
    for (const path of list) {
      setRunState(s => ({ ...s, current: path, curStart: Date.now() }));
      try {
        const r = (await apiPostOrDetail('/summarize/run', { path, mode: engine, ratio: 0.5 })) || {};
        const ok = !!(r.verdict && r.verdict.staged);
        const note = r.skipped_note || (r.verdict && !r.verdict.structure_ok ? (r.verdict.reason || 'structure check did not pass') : '');
        setRunState(s => ({ ...s, done: s.done + 1, results: [...s.results, { path, ok, note, amortization: r.amortization, cost_unknown: r.cost_unknown }] }));
      } catch (e) {
        setRunState(s => ({ ...s, done: s.done + 1, results: [...s.results, { path, ok: false, error: true, note: e.message || String(e) }] }));
      }
    }
    setRunState(s => ({ ...s, current: null, running: false }));
    await loadStaged();
  };
  const prepFile = async path => {
    if (!path) { await loadStaged(); setPhase('review'); return; }
    setManBusy(true); setManErr(null); setManSummary('');
    try { setManPrep(await apiPostOrDetail('/summarize/prep', { path, ratio: 0.5 })); }
    catch (e) { setManErr(e.message || String(e)); setManPrep({ path, wrapped_prompt: '', system_rules: '', source_sha256: '', note: '', error: true }); }
    setManBusy(false);
  };
  const manNext = async () => {
    const next = manIdx + 1;
    if (next >= runList.length) { await loadStaged(); setPhase('review'); return; }
    setManIdx(next); await prepFile(runList[next]);
  };
  const manCheck = async () => {
    if (!manPrep || !manPrep.source_sha256) return;
    setManBusy(true); setManErr(null);
    try { await apiPostOrDetail('/summarize/check', { path: manPrep.path, summary: manSummary, source_hash: manPrep.source_sha256 }); }
    catch (e) { setManErr(e.message || String(e)); setManBusy(false); return; }
    await manNext();
    setManBusy(false);
  };

  // ---- review ----
  const revRows = staged.map(s => { const c = candByPath[s.path]; return { ...s, kind: c ? c.kind : 'other', scope: c ? c.scope : '—' }; });
  const stOf = p => fileStates[p] || 'staged';
  // Same facet rule as the curator bar, on the review population. `State` is
  // the one that matters most here: `applied` / `rejected` / `reverted` are set
  // only by this session's Apply / Reject / Undo, and nothing persists them, so
  // on a fresh load `stOf` returns 'staged' for every row and the whole
  // dimension correctly disappears instead of offering three buttons that
  // cannot match. Nothing here invents server persistence for those states.
  const rvStateFacet = facet(RV_STATE_OPTS, rvState, revRows, r => stOf(r.path));
  const rvKindFacet = facet(KIND_OPTS, rvKind, revRows, r => r.kind);
  const rvScopeFacet = facet(SCOPE_OPTS, rvScope, revRows, r => r.scope);
  const rvFiltered = rvStateFacet.effective !== 'all' || rvKindFacet.effective !== 'all'
    || rvScopeFacet.effective !== 'all' || rvQuery !== '';

  const rvMatch = r => {
    const st = stOf(r.path);
    return (rvStateFacet.effective === 'all' || st === rvStateFacet.effective) &&
      (rvKindFacet.effective === 'all' || r.kind === rvKindFacet.effective) &&
      (rvScopeFacet.effective === 'all' || r.scope === rvScopeFacet.effective) &&
      (rvQuery === '' || r.path.toLowerCase().includes(rvQuery.toLowerCase()));
  };
  const rvVisible = revRows.filter(rvMatch);
  const rvSelectable = rvVisible.filter(r => stOf(r.path) === 'staged');
  // Reject is a client-side dismiss (no write), so it filters nothing — any row can
  // be cleared from the view. Apply WRITES, so it excludes structure_ok===false
  // (defense-in-depth; core is the real guard — check() never stages a failed rewrite
  // and apply_staged re-skips one server-side).
  const rvCheckedReject = [...revChecked].filter(p => stOf(p) === 'staged');
  const rvCheckedStaged = rvCheckedReject.filter(
    p => !staged.some(s => s.path === p && s.structure_ok === false));
  const appliedCount = revRows.filter(r => stOf(r.path) === 'applied').length;
  const rejectedCount = revRows.filter(r => stOf(r.path) === 'rejected').length;
  const revertedCount = revRows.filter(r => stOf(r.path) === 'reverted').length;
  const stagedCount = revRows.length - appliedCount - rejectedCount - revertedCount;
  const rvToggle = p => setRevChecked(prev => { const n = new Set(prev); n.has(p) ? n.delete(p) : n.add(p); return n; });
  const rvCheckShown = () => setRevChecked(prev => { const n = new Set(prev); rvSelectable.forEach(r => n.add(r.path)); return n; });
  const rvUncheckShown = () => setRevChecked(prev => { const n = new Set(prev); rvVisible.forEach(r => n.delete(r.path)); return n; });
  const shortP = p => { const i = p.lastIndexOf('/'); return i < 0 ? p : '…/' + p.slice(i + 1); };
  const setMsg = (text, tone) => setApplyMsg({ text, tone: tone || 'ok' });

  // Apply writes via core apply_staged (go=true). Staging is NOT reloaded after —
  // applied files are cleared from disk on write, but we keep the row visible and
  // overlay 'applied' via fileStates so the review stays legible for this session.
  const applyPaths = async paths => {
    if (!paths.length) return;
    setBusy(true);
    const results = [];
    for (const path of paths) {
      try {
        const r = (await apiPostOrDetail('/summarize/apply', { path, go: true })) || {};
        if (r.applied && r.applied.length) { results.push({ path, ok: true }); setFileStates(s => ({ ...s, [path]: 'applied' })); }
        else { results.push({ path, ok: false, reason: (r.skipped && r.skipped[0]) ? r.skipped[0].reason : 'not applied' }); }
      } catch (e) { results.push({ path, ok: false, reason: e.message || String(e) }); }
    }
    setRevChecked(new Set()); setBusy(false);
    const okN = results.filter(r => r.ok).length;
    const fails = results.filter(r => !r.ok);
    setMsg('Applied ' + okN + ' file(s).' + (fails.length ? ' ' + fails.length + ' skipped: ' + fails.map(f => shortP(f.path) + ' (' + f.reason + ')').join('; ') : ''), fails.length ? 'warn' : 'ok');
    loadBackups();   // newly-applied files now have a backup → surface them as undoable
  };
  const applyChecked = () => applyPaths(rvCheckedStaged);
  const rejectChecked = () => {
    setFileStates(s => { const n = { ...s }; rvCheckedReject.forEach(p => n[p] = 'rejected'); return n; });
    setRevChecked(new Set());
  };
  // Undo restores an APPLIED file from its gzip backup via core `undo` (go=true).
  // Refuses (409) if the file changed since apply or the backup is gone — the
  // reason is surfaced. On success the row goes terminal 'reverted' (its staged
  // copy was already cleared at apply, so it can't be re-applied — re-run to redo).
  const undoPath = async path => {
    setBusy(true);
    try {
      await apiPostOrDetail('/summarize/undo', { path, go: true });
      setFileStates(s => ({ ...s, [path]: 'reverted' }));
      setBackups(bs => bs.filter(b => b.source_path !== path));   // no longer undoable (now == original)
      setMsg('Reverted ' + shortP(path) + '. Restored from backup.', 'ok');
    } catch (e) { setMsg('Undo failed for ' + shortP(path) + ': ' + (e.message || String(e)), 'warn'); }
    setBusy(false);
  };
  const reRun = async path => {
    if (engine === 'manual') return;
    setBusy(true);
    try {
      await apiPostOrDetail('/summarize/run', { path, mode: engine, ratio: 0.5 });
      const one = await api('/summarize/staged', { path });
      if (one.staged && one.staged.length) {
        setStaged(prev => prev.map(s => s.path === path ? one.staged[0] : s));
        setFileStates(s => { const n = { ...s }; delete n[path]; return n; });
      }
    } catch (e) { setMsg('Re-run failed for ' + shortP(path) + ': ' + (e.message || String(e)), 'warn'); }
    setBusy(false);
  };

  // ======================= RENDER =======================
  if (phase === 'run' && engine !== 'manual') {
    const rs = runState || { total: runList.length, done: 0, current: null, results: [], running: true };
    const pct = rs.total ? Math.round(rs.done / rs.total * 100) : 100;
    const okN = rs.results.filter(r => r.ok).length;
    const elapsed = rs.curStart ? Math.max(0, Math.round((Date.now() - rs.curStart) / 1000)) : 0;
    return html`
      <div class="page-title">Summarize <span class="sz-sub">· running via ${engine}</span></div>
      <div class="sz-note">Summarizing ${rs.total} file(s), one at a time${engine === 'claude-p' ? ' (~30-90s each via claude-p)' : ''}. Results are staged; <b>nothing is written yet</b>.</div>
      <div class="sz-prog"><div style=${'width:' + pct + '%'}></div></div>
      <div class="dim" style="font-size:12px;margin-bottom:10px">${rs.done} / ${rs.total} done${rs.running && rs.current ? ' · running ' + shortP(rs.current) + ' (' + elapsed + 's)' : (rs.running ? '' : ' · complete')}</div>
      <div class="cur-listbox" style="max-height:360px">
        ${rs.results.map((r, i) => html`<div class="sz-runrow" key=${i}>
          <span style=${'color:' + (r.ok ? 'var(--success)' : (r.error ? 'var(--error)' : 'var(--warn)'))}>${r.ok ? '✓' : (r.error ? '✕' : '—')}</span>
          <span style="flex:1;word-break:break-all">${r.path}</span>
          ${r.amortization ? html`<span class="dim">${fmtCost(r.amortization.rewrite_usd)}${r.amortization.break_even_calls != null ? ' · breaks even after ' + r.amortization.break_even_calls + ' calls' : ''}${r.amortization.rates_known ? '' : ' (est. rates)'}</span>`
            : (r.cost_unknown ? html`<span class="dim">cost unknown</span>` : null)}
          ${!r.ok && r.note ? html`<span class="dim" title=${r.note}>${r.note.length > 44 ? r.note.slice(0, 44) + '…' : r.note}</span>` : null}
        </div>`)}
        ${rs.running && rs.current ? html`<div class="sz-runrow">
          <span class="sz-spin">⟳</span>
          <span style="flex:1;word-break:break-all">${rs.current}</span>
          <span class="dim">summarizing${'.'.repeat((tick % 3) + 1)} · ${elapsed}s</span>
        </div>` : null}
        ${rs.results.length === 0 && !(rs.running && rs.current) ? html`<div class="empty compact">Starting…</div>` : null}
      </div>
      <div class="cur-addbar">
        <button class="cur-btn primary" disabled=${rs.running} onClick=${() => setPhase('review')}>Review ${okN} staged →</button>
        <button class="cur-btn" disabled=${rs.running} onClick=${() => setPhase('curate')}>← back to curator</button>
      </div>
    `;
  }

  if (phase === 'run' && engine === 'manual') {
    const total = runList.length;
    const path = runList[manIdx];
    const belowGate = manPrep && !manPrep.error && !manPrep.wrapped_prompt;
    const full = manPrep ? (manPrep.system_rules ? manPrep.system_rules + '\n\n' : '') + manPrep.wrapped_prompt : '';
    return html`
      <div class="page-title">Summarize <span class="sz-sub">· manual · file ${Math.min(manIdx + 1, total)} of ${total}</span></div>
      <div class="dim" style="font-size:12.5px;margin-bottom:10px;font-family:'Geist Mono',monospace">${path}</div>
      ${manBusy ? html`<div class="shimmer" style="height:120px"></div>` : null}
      ${manErr ? html`<div class="chart-card" style="border-color:var(--error)"><div style="color:var(--error);font-size:13px">${manErr}</div></div>` : null}
      ${!manBusy && manPrep && !manPrep.error && !belowGate ? html`
        <div class="sz-note">Paste this into a <b>new</b> Claude session, then paste the reply below and Check & stage.</div>
        <div style="font-size:12px;color:var(--text-faint);margin:8px 0">${manPrep.prose_words} prose words → target ~${manPrep.target_prose_words} · ${manPrep.protected_blocks} protected block(s)</div>
        <div class="sz-copybox">${full}</div>
        <button class="cur-btn" style="margin:8px 0" onClick=${() => navigator.clipboard && navigator.clipboard.writeText(full)}>Copy</button>
        <textarea class="sz-ta" placeholder="Paste Claude's summary here…" value=${manSummary} onInput=${e => setManSummary(e.target.value)}></textarea>
        <div class="cur-addbar">
          <button class="cur-btn primary" disabled=${manBusy || !manSummary.trim()} onClick=${manCheck}>Check & stage →</button>
          <button class="cur-btn" disabled=${manBusy} onClick=${manNext}>Skip this file</button>
          <button class="cur-btn" style="margin-left:auto" onClick=${() => setPhase('curate')}>← back to curator</button>
        </div>
      ` : null}
      ${!manBusy && belowGate ? html`
        <div class="opt-caveat">${manPrep.note || 'Below the prose gate; not worth summarizing.'}</div>
        <div class="cur-addbar"><button class="cur-btn primary" onClick=${manNext}>Skip →</button><button class="cur-btn" onClick=${() => setPhase('curate')}>← back to curator</button></div>
      ` : null}
    `;
  }

  if (phase === 'review') {
    const mf = revModal ? revRows.find(r => r.path === revModal) : null;
    const mst = mf ? stOf(mf.path) : null;

// ============================
// Analytics explorer (#210)
// ============================
// The single explorable pivot: metric × group_by × optional stack × chart-type,
// filters, KPI tiles, presets, URL state, CSV export. Renders entirely from the
// /api/v1/analytics response + its framing block (single compute path — the UI
// never re-derives plan-tier rules). Subsumes the cost-by-model / spend-over-
// time / leaderboard charts as presets (#214/#216).
const ANALYTICS_METRICS = [
  ['spend', 'Spend'], ['tokens', 'Tokens'], ['sessions', 'Sessions'], ['events', 'Events'],
];
const ANALYTICS_DIMENSIONS = [
  ['model', 'Model'], ['agent', 'Agent'], ['provider', 'Provider'], ['tool', 'Tool'],
  ['tool_category', 'Tool category'], ['kind', 'Span kind'], ['request_type', 'Request type'],
  ['day', 'Day'],
  // SDK cost-attribution dimensions (#SDK dashboard shape).
  ['tenant', 'Tenant'], ['feature', 'Feature'], ['environment', 'Environment'],
  ['prompt_version', 'Prompt version'],
];
const ANALYTICS_CHARTS = [['bar', 'Bars'], ['line', 'Lines'], ['hbar', 'Leaderboard']];
// Built-in presets (close #214 leaderboard + #216 multi-series as preset views).
const ANALYTICS_PRESETS = [
  { id: 'spend-by-model', label: 'Spend by model', q: { metric: 'spend', group_by: 'model', chart: 'line', stack: '' } },
  { id: 'leaderboard', label: 'Cost leaderboard', q: { metric: 'spend', group_by: 'model', chart: 'hbar', stack: '' } },
  { id: 'tokens-over-time', label: 'Tokens over time', q: { metric: 'tokens', group_by: 'day', chart: 'bar', stack: '' } },
  { id: 'tool-usage', label: 'Tool usage', q: { metric: 'events', group_by: 'tool_category', chart: 'hbar', stack: '' } },
];

// Pivot the analytics rows into a uPlot [xs, ...ys] time-series, one ys per
// top-N group (+ "other"), zero-filled across the window (reuses _windowGrid so
// the x-axis spans the full selected window, #133). `valueOf` picks cost vs
// tokens per plan-tier framing.
function buildAnalyticsSeries(resp, useTokens) {
  if (!resp || !resp.rows) return null;
  const grid = _windowGrid({ ...resp, series: resp.rows });
  if (!grid) return null;
  const { xs, idx, step, bucket, coarsened } = grid;
  const valueOf = r => (useTokens ? (r.tokens || 0) : (r.value || 0));
  // When group_by IS the time dimension (Day), time is already the x-axis, so
  // coloring by the day-bucket key produces a meaningless rainbow with raw epoch
  // legend labels (#227). The colored SERIES then come from stack_by (g2) if
  // present, otherwise a SINGLE series — never one-per-day-bucket.
  const timeGroup = resp.group_by === 'day';
  const keyOf = timeGroup ? (r => r.stack) : (r => r.group);
  const seriesKeys = timeGroup ? (resp.stacks || []) : (resp.groups || []);
  if (!seriesKeys.length) {
    const ys = xs.map(() => 0);
    resp.rows.forEach(r => {
      const b = Math.floor(r.bucket / step) * step;
      if (b in idx) ys[idx[b]] += valueOf(r);
    });
    return { data: [xs, ys], labels: ['Total'], bucket, coarsened, requestedBucket: grid.reqBucket };
  }
  const top = seriesKeys.slice(0, 5);
  const topSet = new Set(top);
  const hasOther = seriesKeys.length > top.length;
  const labels = hasOther ? [...top, 'other'] : [...top];
  const yss = labels.map(() => xs.map(() => 0));
  resp.rows.forEach(r => {
    const b = Math.floor(r.bucket / step) * step; if (!(b in idx)) return;
    const k = keyOf(r);
    const li = topSet.has(k) ? labels.indexOf(k) : (hasOther ? labels.length - 1 : -1);
    if (li >= 0) yss[li][idx[b]] += valueOf(r);
  });
  return { data: [xs, ...yss], labels, bucket, coarsened, requestedBucket: grid.reqBucket };
}

// Collapse the time dimension into per-group totals for the leaderboard (#214):
// sorted desc, each with a fraction-of-max for the inline magnitude bar.
function buildLeaderboard(resp, useTokens) {
  if (!resp || !resp.rows) return null;
  const totals = {};
  resp.rows.forEach(r => { totals[r.group] = (totals[r.group] || 0) + (useTokens ? (r.tokens || 0) : (r.value || 0)); });
  const entries = Object.keys(totals).map(g => ({ group: g, value: totals[g] }))
    .sort((a, b) => b.value - a.value);
  const max = entries.length ? Math.max(...entries.map(e => e.value), 0) : 0;
  entries.forEach(e => { e.frac = max > 0 ? e.value / max : 0; });
  return entries;
}

// CSV from the current pivot — built client-side from the response (offline,
// no server round-trip), downloaded via a Blob object URL.
function analyticsCsv(resp) {
  const framing = resp.framing || {};
  const mode = framing.pricing_mode || 'unknown';

  const head = [
    'bucket_epoch',
    'bucket_iso',
    resp.group_by,
    resp.stack_by || 'stack',
    'cost',
    'cycle_share_pct',
    'input_tokens',
    'output_tokens',
    'cache_read_tokens',
    'cache_write_tokens',
    'sessions',
    'events'
  ];

  const lines = [head.join(',')];

  (resp.rows || []).forEach(r => {
    const iso = new Date(r.bucket * 1000).toISOString();
    const cell = v => { const s = String(v == null ? '' : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };

    const rawCost = r.cost || 0;

    // Route through existing helper rather than inline mode derivation to prevent leaks
    const costVal = perItemUsesTokens(framing) ? '' : String(rawCost);
    
    let cycleShareVal = '';
    if (framing.pricing_mode === 'subscription' && framing.plan_monthly_usd > 0) {
      cycleShareVal = String((rawCost / framing.plan_monthly_usd) * 100.0);
    }

    const rowData = [
      r.bucket,
      iso,
      cell(r.group),
      cell(r.stack),
      costVal,
      cycleShareVal,
      r.input_tokens || 0,
      r.output_tokens || 0,
      r.cache_read_tokens || 0,
      r.cache_write_tokens || 0,
      r.sessions || 0,
      r.events || 0
    ];

    lines.push(rowData.join(','));
  });

  return lines.join('\n');
}

function downloadCsv(filename, text) {
  const blob = new Blob([text], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

// `route` lets the pivot live on another screen (the Dashboard reuses it under
// #/dashboard, which is now the ONLY way to reach this component: the
// standalone #/analytics route was retired, since it was a second nav entry
// for the exact same explorer the Dashboard already embeds. Old #/analytics
// links alias to the Dashboard instead of 404ing — see primaryKeyFor).
// `embedded` drops the standalone title + window picker so the host screen
// owns those. Default args keep this signature call-compatible even though
// nothing invokes it bare anymore.
// Four placeholders for the four KPI tiles the row settles into (Spend, Tokens,
// Sessions, Events), so the row occupies its final height from first paint. A
// LOCAL corpus (no marginal cost to price at all) drops the Spend tile, in
// which case the row narrows by one when the answer lands; holding four is still
// the closer guess than holding none.
const KPI_SKELETON_TILES = [0, 1, 2, 3];

function AnalyticsView({ params, route = 'analytics', embedded = false, kpiCaption = null }) {
  const DEFAULTS = { since: DEFAULT_SINCE, metric: 'spend', group_by: 'model', stack: '', chart: 'bar',
    agent_id: '', provider: '', model: '', tool: '' };
  const since = readParam(params, 'since', DEFAULTS.since, validSince);
  const metric = readParam(params, 'metric', DEFAULTS.metric, v => ANALYTICS_METRICS.some(m => m[0] === v));
  const groupBy = readParam(params, 'group_by', DEFAULTS.group_by, v => ANALYTICS_DIMENSIONS.some(d => d[0] === v));
  const stack = readParam(params, 'stack', DEFAULTS.stack, v => v === '' || ANALYTICS_DIMENSIONS.some(d => d[0] === v));
  const chart = readParam(params, 'chart', DEFAULTS.chart, v => ANALYTICS_CHARTS.some(c => c[0] === v));
  const fAgent = readParam(params, 'agent_id', '');
  const fProvider = readParam(params, 'provider', '');
  const fModel = readParam(params, 'model', '');
  const fTool = readParam(params, 'tool', '');
  const cur = { since, metric, group_by: groupBy, stack, chart, agent_id: fAgent, provider: fProvider, model: fModel, tool: fTool };
  const setFilter = (k, v) => navigate(route, { ...cur, [k]: v }, DEFAULTS);
  const applyPreset = (q) => navigate(route, { ...cur, ...q }, DEFAULTS);

  // #295: Stack only makes sense on the multi-series charts (bar/line). The
  // Leaderboard (hbar) collapses the time dimension into a single per-group
  // total and ignores stack entirely, so a stale stack there just strands the
  // view on an empty cross-tab ("No data"). Gate it: hide the Stack control AND
  // drop stack_by from the query for non-stacking charts. The chosen stack stays
  // in the URL, so it returns when the user switches back to a bar/line chart.
  const stackApplies = chart === 'bar' || chart === 'line';
  const effStack = stackApplies ? stack : '';

  const [st, setSt] = useState({ loading: true, error: null, resp: null });
  // Generation guard, same mechanism as useTriageRead: `load` has no polling
  // of its own, but a rapid pivot/window change (metric, group_by, stack,
  // since, or any filter) fires a NEW request while an OLDER one from the
  // previous selection can still be in flight. Without dropping a stale
  // settle, a slower earlier request (e.g. "By: Model", which groups more
  // rows) landing AFTER a faster later one ("By: Tenant") would silently
  // overwrite the current selection's chart/legend with the PREVIOUS
  // dimension's data — the chart would show tenant grouping while the legend
  // still lists model names, a rendered element outliving the data it
  // described. `gen` makes only the settle matching the CURRENT selection
  // allowed to write state.
  const gen = useRef(0);

  const load = useCallback(async () => {
    const g = ++gen.current;
    setSt(s => ({ ...s, loading: true, error: null }));
    try {
      const resp = await api('/analytics', {
