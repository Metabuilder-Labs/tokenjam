// needs a completed read behind it, and the reads behind them are independently
// fallible and — for /optimize, an analyzer sweep that is minutes long on a
// large history — independently slow. The original code funnelled all of them
// through `.catch(() => <empty default>)`, which erases the difference between
// "the answer is nothing" and "there is no answer": a timed-out /optimize
// arrived at the tiles as an empty report and printed "No recoverable
// candidates." over a corpus holding thousands of dollars of them.
//
// So the decision of what a band is ALLOWED TO SAY is factored out here, into
// two pure functions with no rendering in them. They are the single place that
// rule lives, and being pure they are directly testable under node
// (tests/unit/test_lens_dashboard_states.py, same extraction trick as
// test_lens_select_all_behaviour.py) rather than only string-matched.

// What the "Past overspend" band renders, from its read's outcome.
//   phase — 'loading' | 'ready' | 'timeout' | 'error' (see DashboardView)
//   data  — the last COMPLETE /optimize payload we hold, or null for none ever
// Returns one of:
//   'tiles'    — complete answer, candidates to show
//   'none'     — complete answer, nothing recoverable. The ONLY state permitted
//                to state that there is nothing here.
//   'stale'    — we hold a complete answer AND the latest refresh did not land;
//                show the old tiles, labelled as the last complete result.
//   'scanning' — no answer yet and still waiting.
//   'timeout'  — stopped waiting without an answer. Unknown, not empty.
//   'failed'   — the read errored. Unknown, not empty.
function recoverableBandState(phase, data, tileCount) {
  // A COLD store is checked before anything else, because it is the one case
  // that looks like a complete answer and isn't. The read succeeded; the store
  // it described holds nothing. Falling through would reach `tileCount > 0`,
  // find 0, and return 'none' — "we scanned and found nothing" — for a scan
  // that has never run. See scanState().
  if (data && data.report_available === false) {
    return data.status === 'computing' ? 'scanning' : 'cold';
  }
  // A held answer always wins over the absence of a fresh one: showing the last
  // complete result (labelled) beats blanking a band we do have numbers for.
  if (data) {
    if (phase === 'timeout' || phase === 'error') return 'stale';
    return tileCount > 0 ? 'tiles' : 'none';
  }
  if (phase === 'timeout') return 'timeout';
  if (phase === 'error') return 'failed';
  return 'scanning';
}

// Why a tile has no figure, in its own words. A tile inherits its source's
// outcome, so it can be specific: "still scanning" (the read is outstanding past
// the band's wait) is a different fact from "couldn't load" (it failed), and
// telling the user which one it is decides whether waiting is worth anything.
const HEALTH_UNKNOWN_SUB = {
  loading: 'checking',
  timeout: 'still scanning',
  error: "couldn't load",
  // The store answered and holds nothing yet. Distinct from every entry above:
  // nothing is in flight and nothing failed, there has simply never been a scan.
  cold: 'not scanned yet',
};

// What goes in a health tile's number slot. 'loading' returns null, meaning the
// caller renders a shimmer there instead; anything other than an answered read
// returns the unknown mark. A caller cannot get a number out of this function
// for a source that did not answer, which is the point: the zero it would
// otherwise have derived from an empty fallback is the dangerous placeholder.
// 'timeout' does NOT return null — an indefinite shimmer would read as progress
// past the point where we have admitted we do not know.
function healthValueFor(status, value) {
  if (status === 'ready') return String(value);
  if (status === 'loading') return null;
  return UNKNOWN_FIGURE;
}

// `status` decides what the tile may SAY, independently of `value`:
//   'ready'   — the source answered; render the figure and let `attention` and
//               `sub` speak
//   'loading' — no answer yet; shimmer in the number slot, "checking" sub-line
//   'timeout' — outstanding past the band's wait; "?" and "still scanning"
//   'error'   — the source failed; "?" and "couldn't load"
function HealthTile({ label, value, attention, href, sub, status = 'ready' }) {
  const shown = healthValueFor(status, value);
  const unknown = status !== 'ready';
  return html`<a class="health-tile ${!unknown && attention ? 'attn' : ''}" href=${href}>
    ${shown === null
      ? html`<div class="shimmer health-value-skel" title="still checking"></div>`
      : html`<div class="health-value ${unknown ? 'unknown' : ''}">${shown}</div>`}
    <div class="health-label">${label}</div>
    ${/* The sub-line is where the unknown states explain themselves. An answered
          tile keeps whatever caption the caller gave it; an unanswered one
          replaces it, because that caption ("all clear", "within baseline") is
          exactly the claim we have no basis for. */ ''}
    ${unknown
      ? html`<div class="health-sub">${HEALTH_UNKNOWN_SUB[status] || HEALTH_UNKNOWN_SUB.error}</div>`
      : (sub ? html`<div class="health-sub">${sub}</div>` : null)}
  </a>`;
}

// ---- Optimize detail screen ----
// Stat-tile numbers 2 and 3 (the design's 3-tile row — tile 1 is always past
// overspend, computed in OptimizeFinding itself). Every value here already
// exists as inline prose in the branch below; this just picks the two most
// legible per-analyzer numbers and labels them, no new server data and no
// analysis performed client-side beyond a plain sum over rows the branch
// already renders (same precedent as the existing `sfTok` reduce above).
// Returns `[stat2, stat3]`, each `{v, l}` or null when the analyzer found
// nothing this window — the branch's own empty-state sentence in the
// Evidence panel already covers that case, so the tiles just don't render.
function optDetailStats(name, fd, dg) {
  if (name === 'downsize') {
    if (!dg) return [null, null];
    // `n_sessions`/`percent_of_all_sessions`, not `candidate_sessions`/
    // `percent_of_sessions`: the latter pair covers the tiny-session case
    // ALONE, while stat tile 1 (past overspend, rendered by the caller) sums
    // BOTH the tiny-session and driver-role cases. A driver-role-only window
    // has `candidate_sessions === 0`, which rendered a real dollar figure
    // beside "0%, 0 of N" — two figures over two different populations shown
    // together. `n_sessions`/`percent_of_all_sessions` cover the SAME
    // population the dollar figure does.
    return [{ v: dg.percent_of_all_sessions + '%', l: 'of sessions flagged' }, { v: dg.n_sessions + ' / ' + dg.total_sessions, l: 'flagged sessions' }];
  }
  if (!fd) return [null, null];
  if (name === 'placement') return [{ v: String(fd.candidates.length), l: 'workloads fit the batch shape' }, { v: fd.percent_of_window_cost + '%', l: 'of window cost' }];
  if (name === 'cache') return [{ v: String((fd.rows || []).length), l: '(provider, model) pairs' }, { v: String((fd.flagged || []).length), l: 'below efficacy threshold' }];
  if (name === 'resend') return fd.repeat_share == null ? [null, null] : [{ v: (fd.repeat_share * 100).toFixed(0) + '%', l: 'of prompt tokens are repeats' }, { v: String(fd.turns_examined), l: 'turns measured' }];
  if (name === 'cache-recommend') {
    if (!fd.enabled || !(fd.candidates || []).length) return [null, null];
    const tok = fd.candidates.reduce((s, c) => s + (c.estimated_cacheable_tokens || 0), 0);
    return [{ v: String(fd.candidates.length), l: 'prefix candidates' }, { v: fmtTokens(tok), l: 'tokens behind them' }];
  }
  if (name === 'script') {
    if (!(fd.clusters || []).length) return [null, null];
    const inst = fd.clusters.reduce((s, c) => s + (c.instances || 0), 0);
    return [{ v: String(fd.clusters.length), l: 'deterministic clusters' }, { v: String(inst), l: 'total instances' }];
  }
  if (name === 'trim') {
    if (!fd.enabled || !(fd.per_prompt || []).length) return [null, null];
    return [{ v: String(fd.prompts_scored), l: 'prompts scored' }, { v: fd.total_bloat_chars + ' / ' + fd.total_chars, l: 'chars flagged' }];
  }
  if (name === 'reuse') {
    if (!(fd.clusters || []).length) return [null, null];
    const reps = fd.clusters.reduce((s, c) => s + (c.repetitions || 0), 0);
    return [{ v: String(fd.clusters.length), l: 'repeated-plan clusters' }, { v: String(reps), l: 'total repetitions' }];
  }
  if (name === 'subagent') {
    if (!fd.total_subagents) return [null, null];
    return [{ v: String(fd.total_subagents), l: 'subagents dispatched' }, { v: (fd.percent_of_cost * 100).toFixed(0) + '%', l: 'of window cost' }];
  }
  if (name === 'verbosity') {
    if (!(fd.candidates || []).length) return [null, null];
    return [{ v: String(fd.total_candidates || fd.candidates.length), l: 'high-verbosity candidates' }, { v: String(fd.sessions_examined), l: 'sessions examined' }];
  }
  if (name === 'deadweight') {
    // `unused_servers`, not `dead_servers`: the analyzer renamed the field
    // because "dead" asserted a judgment about the server while the finding is
    // a recency observation about the WINDOW (see DeadweightFinding). This
    // tile is the one reader of it that lives only on this branch, so nothing
    // renamed it for us — and reading the old name here does not throw, it
    // just returns no tile at all, which renders as a finding with no figures.
    if (!(fd.unused_servers || []).length) return [null, null];
    return [{ v: String(fd.unused_servers.length), l: 'unused MCP servers' }, { v: String(fd.configured_servers), l: 'configured servers' }];
  }
  return [null, null];
}

function OptimizeFinding({ name, opt, framing, proposals, onProposalChanged, onProposalDismiss, onProposalMark }) {
  const meta = ANALYZER_META[name] || { title: capitalize(name) };
  let body = null;
  // Fix-panel content this branch produces inline (resend's always-on
  // fix_compaction sentence + optional cache_control snippet; verbosity's
  // remedy-to-review sentence). Kept separate from `body` (which stays
  // evidence-only) so both can be restyled into their own design components
  // — the Evidence panel and the always-present Fix panel — without
  // reshuffling every branch's actual content.
  let inlineFix = null;
  // Caveat text this branch carries (`fd.caveat` / `dg.caveat` / `fd.friction`
  // / the first cluster's caveat for `reuse`) — a plain string, rendered once
  // in the shared Caveat box rather than inline per branch.
  let caveatText = null;
  if (name === 'downsize') {
    const dg = opt.downgrade;
    // A null typed slot means the analyzer ran and found no candidates, not
    // that it's missing (issue #126) — falls through to the shared shell
    // below (title/stats/Fix panel) exactly like every other analyzer's
    // empty state, rather than returning its own miniature section.
    body = !dg ? html`
      <div class="opt-line dim">No downsize candidates in this window; sessions don't match the smaller-model shape (small input/output, few tool calls).</div>`
      : html`
      ${/* Two DISJOINT populations feed this one finding (see
           model_downgrade.py): a premium model driving undelegated work
           (below) and structurally tiny sessions that match a candidate
           shape (further below). Each sentence is gated on its OWN
           population rather than always rendering both — a driver-role-only
           window has `candidate_sessions === 0`, and printing "0% ... 0 of
           N" next to the real dollar figure above claimed a different
           population than the one the tile actually sums (root anti-pattern
           22). Labelling each figure with the population it covers, per the
           same rule, beats merging them into one number that would overstate
           the tiny-session shape's own share. */ ''}
      ${dg.driver_sessions ? html`<div class="opt-line">${dg.driver_sessions} session(s) ran a premium model in the driver role, undelegated: ${fmtCost(dg.driver_recoverable_usd)} of the figure above.</div>` : null}
      ${dg.candidate_sessions ? html`<div class="opt-line">${dg.percent_of_sessions}% of sessions match a smaller-model candidate shape (${dg.candidate_sessions} of ${dg.total_sessions}).</div>` : null}
      ${dg.suggestions && Object.keys(dg.suggestions).length ? html`<div class="opt-line dim">Pattern: ${Object.entries(dg.suggestions).map(([k, v]) => k + ' → ' + v).join(', ')}</div>` : null}
      ${(dg.examples || []).length ? html`<div class="opt-sub">Examples</div>
        <div class="table-wrap"><table class="opt-table"><tbody>${dg.examples.map(ex => html`<tr><td class="mono">${(ex.trace_id || '').slice(0, 8)}…</td><td>${ex.tool_calls} tools</td><td class="mono">${ex.model}</td></tr>`)}</tbody></table></div>` : null}`;
    caveatText = dg && dg.caveat;
  } else if (name === 'placement') {
    // Batch API placement: unattended, cadence-regular workloads whose spend
    // could move to the Batch API's flat 50% rate. A sibling top-level branch
    // (not the generic `(opt.findings||{})[name]` path below) because
    // `analyze_batch_placement` drops the key from `findings` entirely rather
    // than carrying an empty-candidates finding when nothing qualifies (see
    // model_downgrade.py's `run()`) — same "null slot means ran, found
    // nothing" shape as `downsize`/`opt.downgrade` just above, so it falls
    // through to the shared shell rather than vanishing via the generic
    // `if (!fd) return null` a couple lines down.
    const fd = (opt.findings || {})[name];
    if (!fd) {
      body = html`
        <div class="opt-line dim">No unattended, cadence-regular workloads in this window <span class="dim">(≥${PLACEMENT_DEFAULT_MIN_SESSIONS} sessions on a regular cadence, ≥${fmtCost(PLACEMENT_DEFAULT_MIN_GROUP_COST_USD)} window spend)</span>. Lower <span class="mono">[optimize] min_sessions_for_cadence</span> / <span class="mono">min_group_cost_usd</span> in tj.toml to consider smaller workloads.</div>`;
    } else {
      // This number is a PRICE difference on the SAME tokens (batch bills the
      // same work at half rate, freeing nothing), never tokens freed — so
      // unlike every sibling card this branch renders its own footer line
      // below instead of the generic past-overspend one (see
      // `recUsd`/`recTok` suppression for this name further down), and gates
      // the dollar figure on `pricing_mode === 'api'` exactly, not just "not
      // suppressed" — the Batch API discount is an api-billed lever a
      // subscription/local/unknown plan cannot pull at all, mirroring the
      // CLI's `_render_placement` and `cost_proposals._placement_to_proposals`
      // (CLAUDE.md anti-pattern #22). Advise-only by design: batch adoption is
      // an architectural change (submit + poll) in the user's own application,
      // so this analyzer's mech badge is `read`, not `apply`/`snippet` — see
      // OPT_MECH — and its Fix panel never offers an apply action, only the
      // generic proposals block (data-driven off `hasProposal`) if one is
      // ever open, since that only ever points at the Review inbox.
      const n = fd.candidates.length;
      const isApi = framing && framing.pricing_mode === 'api';
      body = html`
        <div class="opt-line">${n} workload${n !== 1 ? 's' : ''} fit the batch shape <span class="dim">(regular cadence, no human turn after the first model call)</span>: <b>${fd.percent_of_window_cost}%</b> of window cost.</div>
        <div class="table-wrap"><table class="opt-table"><thead><tr><th>Agent</th><th>Cadence</th><th>Tokens</th>${isApi ? html`<th>Spend → batch rate</th>` : null}</tr></thead>
          <tbody>${fd.candidates.slice(0, 10).map(c => html`<tr><td class="mono">${c.agent_id}</td><td>${c.sessions} session${c.sessions !== 1 ? 's' : ''} every ${fmtCadence(c.median_gap_seconds)}</td><td>${fmtTokens(c.tokens)}</td>${isApi ? html`<td class="mono">${fmtCost(c.cost_usd)} → <span style="color:var(--success)">${fmtCost(c.cost_usd - c.estimated_batch_saving_usd)}</span></td>` : null}</tr>`)}</tbody></table></div>
        ${fd.candidates.length > 10 ? html`<div class="opt-line dim">…and ${fd.candidates.length - 10} more.</div>` : null}
        ${isApi && fd.past_overspend_usd != null ? html`
          <div class="opt-line" style="margin-top:8px"><span style="color:var(--success)">~${fmtCost(fd.past_overspend_usd)}</span> estimated price difference over this window <span class="price-diff-tag" title=${fd.estimate_basis}>price difference</span> <span class="dim">(the same work, billed at the Batch API's flat rate)</span></div>`
          : html`<div class="opt-line dim" style="margin-top:8px">The Batch API's discount is an api-billed price lever, so no dollar figure is shown for this plan. The workload sizes above still say how much work fits the shape.</div>`}`;
      caveatText = fd.friction;
    }
  } else {
    const fd = (opt.findings || {})[name];
    if (!fd) return null;
    if (name === 'cache') {
      body = html`
        ${(fd.flagged || []).length ? html`<div class="opt-line">${fd.flagged.length} (provider, model) row(s) below the efficacy threshold.</div>` : null}
        <div class="table-wrap"><table class="opt-table"><thead><tr><th>Provider/Model</th><th>Efficacy</th><th>Input</th><th>Cache</th></tr></thead>
          <tbody>${(fd.rows || []).map(r => html`<tr class=${r.flagged ? 'flagged' : ''}><td class="mono">${r.provider}/${r.model}</td><td>${(r.efficacy * 100).toFixed(0)}%</td><td>${fmtTokens(r.input_tokens)}</td><td>${fmtTokens(r.cache_tokens)}</td></tr>`)}</tbody></table></div>`;
    } else if (name === 'resend') {
      // Structural context re-send: how much of each turn's prompt was
      // already sent in a previous turn. Cross-persona (Claude Code + SDK
      // alike) — only the fix differs, so both fixes always render, labeled
      // by who acts on them. `repeat_share === null` is the below-threshold
      // empty state; name the reason from `notes` rather than an empty card.
      const usd = fd.past_overspend_usd, tok = fd.past_overspend_tokens;
      const median = fd.repeat_share_median, p90 = fd.repeat_share_p90;
      body = fd.repeat_share == null ? html`
        <div class="opt-line dim">${(fd.notes && fd.notes[0]) || 'Not enough data in this window to measure a repeat share.'}</div>`
        : html`
        <div class="opt-line">${(fd.repeat_share * 100).toFixed(1)}% of prompt tokens in this window were already sent in an earlier turn of the same session <span class="dim">(token-weighted aggregate, ${fd.sessions_examined} session${fd.sessions_examined !== 1 ? 's' : ''} · ${fd.turns_examined} turns)</span>.</div>
        ${median != null ? html`<div class="opt-line dim">Median session: ${(median * 100).toFixed(0)}%${p90 != null ? `, p90: ${(p90 * 100).toFixed(0)}%` : ''}. The aggregate above is token-weighted, so a handful of very long sessions can pull it well above what a typical session carries.</div>` : null}
        ${(fd.examples || []).length ? html`<div class="opt-sub">Heaviest sessions</div>
          <div class="table-wrap"><table class="opt-table"><thead><tr><th>Session</th><th>Turns</th><th>Repeat share</th><th>Repeat tokens</th><th>Provider/Model</th></tr></thead>
            <tbody>${fd.examples.map((ex, i) => html`<tr key=${i}><td class="mono">${(ex.session_id || '').slice(0, 12)}</td><td>${ex.turns}</td><td>${(ex.repeat_share * 100).toFixed(0)}%</td><td>${fmtTokens(ex.repeat_tokens)}</td><td class="mono">${ex.provider}/${ex.model}</td></tr>`)}</tbody></table></div>` : null}
        ${(fd.recurring_examples || []).length ? html`<div class="opt-sub">Why: recurring inclusions</div>
          <div class="table-wrap"><table class="opt-table"><thead><tr><th>What's re-included</th><th>Sessions</th><th>Occurrences</th><th>Fix</th></tr></thead>
            <tbody>${fd.recurring_examples.slice(0, 8).map((r, i) => html`<tr key=${i}><td class="mono" title=${r.label}>${shortPath(r.label)}</td><td>${r.sessions}</td><td>${r.occurrences}</td><td class="dim">${r.fix}</td></tr>`)}</tbody></table></div>`
          : (fd.notes && fd.notes[0] ? html`<div class="opt-line dim">${fd.notes[0]}</div>` : null)}
        ${(!dollarsSuppressed(framing) && usd == null && tok != null) ? html`<div class="opt-line dim">No dollar figure: no session in this window carries a priced, cache-capable model to estimate the cache_control-adoption saving from. The token estimate above still applies to the compaction lever, which is cache-agnostic.</div>` : null}`;
      inlineFix = fd.repeat_share == null ? null : html`
        <div class="opt-line">${fd.fix_compaction} <span class="dim">(agent-harness users, e.g. Claude Code)</span></div>
        ${fd.fix_cache_control ? html`
          <div style="margin-top:8px">
            <div class="opt-title" style="font-size:12.5px;margin-bottom:2px">
              <span>cache_control snippet</span>
              <${CopySnippetButton} text=${fd.fix_cache_control} />
            </div>
            <div style="margin:0 0 2px"><span class="dim" style="font-weight:400">SDK users, paste into your own call site</span></div>
            <div class="sz-copybox" style="margin-top:2px">${fd.fix_cache_control}</div>
          </div>` : null}`;
      caveatText = fd.caveat;
    } else if (name === 'cache-recommend') {
      // This analyzer is Anthropic-only by design (structural prefix
      // detection, not a cross-provider extension — see cache_recommend.py).
      // A non-Anthropic user must be told their calls were EXCLUDED, not left
      // to read a bare "no prefixes found" as "you have no repetition."
      const skippedProvider = fd.skipped_provider_count || 0;
      body = !fd.enabled ? html`<div class="opt-line dim">${fd.hint || 'Disabled. Set [capture] prompts = true to run this analyzer.'}</div>`
        : (fd.candidates || []).length ? html`<div class="opt-line">${fd.candidates.length} prefix candidate(s) for cache_control:</div>
          <div class="table-wrap"><table class="opt-table"><tbody>${fd.candidates.map(c => html`<tr><td class="mono">${(c.prefix_hash || '').slice(0, 8)}…</td><td>${c.occurrences}× shared</td><td>~${fmtTokens(c.estimated_cacheable_tokens)} cacheable</td></tr>`)}</tbody></table></div>`
        : html`<div class="opt-line dim">No stable prefixes shared across ≥3 Anthropic calls.${skippedProvider ? ` ${skippedProvider} call(s) on a non-Anthropic provider were excluded from this analysis: this analyzer only looks at Anthropic calls today.` : ''}</div>`;
    } else if (name === 'script') {
      body = (fd.clusters || []).length ? html`
        <div class="opt-line">${fd.clusters.length} deterministic-pattern cluster(s).</div>
        <div class="table-wrap"><table class="opt-table"><thead><tr><th>Instances</th><th>Signature</th><th>Avg cost</th></tr></thead>
          <tbody>${fd.clusters.map(c => html`<tr><td>${c.instances}×</td><td class="mono">${(c.signature || []).map(s => s.tool).join(' → ').slice(0, 60)}</td><td>${fmtPerItemCost(c.avg_cost_usd, c.avg_tokens, framing)}</td></tr>`)}</tbody></table></div>`
        : html`<div class="opt-line dim">No clusters above threshold (≥20 identical signatures).</div>`;
      caveatText = fd.caveat;
    } else if (name === 'trim') {
      // Per-prompt block, not a flat table (web card parity with the
      // CLI's `_render_trim`): each prompt can now carry a provenance line
      // (only when `source_path` cleared the verbatim-containment bar, see
      // prompt_bloat.py's module docstring) plus the flagged text itself —
      // more than fits one table row. Provenance is a bonus for a
      // harness-shaped workspace with a catalog file (CLAUDE.md, AGENTS.md,
      // ...), never the baseline: a pure-SDK caller never gets a
      // `source_path`, and for them the flagged-text block below is the
      // whole, complete answer, not a lesser version of it — so that block
      // renders unconditionally and the provenance line/Summarize pointer
      // render only when `source_path` is actually set.
      body = !fd.enabled ? html`<div class="opt-line dim">${fd.hint || 'Disabled: needs [capture] prompts = true and tokenjam[bloat].'}</div>`
        : (fd.per_prompt || []).length ? html`
          <div class="opt-line">${fd.prompts_scored} prompt(s) scored; ${fd.total_bloat_chars} of ${fd.total_chars} chars flagged.</div>
          ${fd.per_prompt.slice(0, 5).map((p, i) => html`
            <div key=${i} style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">
              <div class="opt-line"><span class="mono">${p.agent_id}</span> <span class="dim">${p.bloat_chars}/${p.prompt_chars} chars flagged, ~${p.estimated_token_reduction} tokens trimmable${!dollarsSuppressed(framing) && p.estimated_cost_reduction_usd != null ? ` (~${fmtCost(p.estimated_cost_reduction_usd)})` : ''}</span></div>
              ${p.source_path ? html`
                <div class="opt-line dim">Attributed to <span class="mono">${p.source_path}</span> (${p.source_basis}) <a class="sz-link" href="#/optimize/summarize">Review in Summarize →</a></div>` : null}
              ${(p.regions || []).length ? html`
                <div class="opt-line dim">Flagged text:</div>
                ${p.regions.slice(0, 3).map((r, j) => html`<div key=${j} class="opt-line dim" style="font-style:italic;margin-left:8px">"${(r.sample_chars || '').replace(/\n/g, ' ').trim()}…" <span class="dim">(${r.char_length} chars)</span></div>`)}
                ${p.regions.length > 3 ? html`<div class="opt-line dim" style="margin-left:8px">…and ${p.regions.length - 3} more region(s).</div>` : null}` : null}
            </div>`)}`
        : html`<div class="opt-line dim">No bloat regions above threshold.</div>`;
    } else if (name === 'reuse') {
      body = (fd.clusters || []).length ? html`
        <div class="opt-line">${fd.clusters.length} cluster${fd.clusters.length !== 1 ? 's' : ''} of repeated planning detected${captureModeNote(fd.capture_mode)}.</div>
        ${isDegradedCapture(fd.capture_mode) && fd.hint ? html`<div class="opt-line dim">${fd.hint}</div>` : null}
        <div class="table-wrap"><table class="opt-table"><thead><tr><th>Repeats</th><th>Signature</th><th>Reuse</th><th>Script</th></tr></thead>
          <tbody>${fd.clusters.slice(0, 5).map(c => html`<tr><td>${c.repetitions}×</td><td class="mono">${(c.tool_signature || []).join(' → ').slice(0, 60)}</td><td>${fmtFramedSavings(c.cache_reuse_recoverable_usd, c.cache_reuse_recoverable_tokens, framing)}</td><td>${fmtFramedSavings(c.script_replacement_recoverable_usd, c.script_replacement_recoverable_tokens, framing)}</td></tr>`)}</tbody></table></div>`
        : html`<div class="opt-line dim">No repeated planning detected above threshold (≥3 sessions sharing a skeleton).</div>
          ${fd.hint ? html`<div class="opt-line dim">${fd.hint}</div>` : null}`;
      caveatText = (fd.clusters || []).length ? fd.clusters[0].caveat : null;
    } else if (name === 'subagent') {
      body = fd.total_subagents ? html`
        <div class="opt-line">${fd.total_subagents} subagent${fd.total_subagents !== 1 ? 's' : ''} across ${fd.sessions_with_subagents} session${fd.sessions_with_subagents !== 1 ? 's' : ''}, ${(fd.percent_of_cost * 100).toFixed(0)}% of window cost (${fmtFramedSavings(fd.subagent_cost_usd, fd.subagent_tokens, framing)}).</div>
        ${(fd.flagged || []).length ? html`
          <div class="table-wrap"><table class="opt-table"><thead><tr><th>Session/Sub-agent</th><th>Model</th><th>Tools</th><th>Flags</th></tr></thead>
            <tbody>${fd.flagged.slice(0, 10).map(r => html`<tr><td class="mono">${(r.session_id || '').slice(0, 8)}…/${(r.sub_agent_id || '').slice(0, 10)}</td><td class="mono">${r.model}</td><td>${r.tool_calls}</td><td>${(r.flags || []).join(', ')}</td></tr>`)}</tbody></table></div>`
          : html`<div class="opt-line dim">No right-sizing candidates above thresholds.</div>`}`
        : html`<div class="opt-line dim">No subagent (Task-tool) activity in this window.</div>`;
      caveatText = fd.caveat;
    } else if (name === 'verbosity') {
      body = (fd.candidates || []).length ? html`
        <div class="opt-line">${fd.total_candidates || fd.candidates.length} high-verbosity candidate${(fd.total_candidates || fd.candidates.length) !== 1 ? 's' : ''} <span class="dim">(output well above the per-task-shape median)</span>.</div>
        <div class="table-wrap"><table class="opt-table"><thead><tr><th>Session</th><th>Output</th><th>vs baseline</th><th>Recoverable</th></tr></thead>
          <tbody>${fd.candidates.map(c => html`<tr><td class="mono">${(c.session_id || '').slice(0, 8)}…</td><td>${fmtTokens(c.output_tokens)}</td><td>${fmtTokens(c.baseline_output_tokens)} median, ${c.over_baseline_multiple}×</td><td>${fmtFramedSavings(c.recoverable_usd, c.over_baseline_tokens, framing)}</td></tr>`)}</tbody></table></div>`
        : html`<div class="opt-line dim">${fd.sessions_examined === 0 ? 'No LLM spans in this window.' : `Examined ${fd.sessions_examined} session${fd.sessions_examined !== 1 ? 's' : ''} across ${fd.cohorts_examined} task-shape cohort${fd.cohorts_examined !== 1 ? 's' : ''}; no session's output ran high enough vs its cohort median to flag.`}</div>`;
      inlineFix = fd.suggested_max_tokens ? html`<div class="opt-fix-empty">Remedy to review (not applied): a terse system-prompt line and/or a max_tokens cap near ~${fmtTokens(fd.suggested_max_tokens)}. tokenjam doesn't write this automatically — terser output is only a saving if the answer still holds.</div>` : null;
      caveatText = fd.caveat;
    } else if (name === 'deadweight') {
      // Plugin lane (Part D web parity): same three-state gating as the CLI
      // (`cmd_optimize._render_deadweight_plugins`) — `unused_plugins` gets
      // the priced row + disable text, `partial_use_no_fix` names which
      // components are unused and says plainly no fix is on offer (the
      // toggle is whole-plugin only), `insufficient_history` renders as "not
      // enough history yet", never a number, never a fix arrow. A plugin
      // with nothing priced never reaches any of these three (see
      // `PluginDeadweight.unused`'s vacuous-truth guard on the Python side),
      // so a $0 row with a disable arrow cannot render here either.
      const plugins = fd.plugins || [];
      const unusedPlugins = (fd.unused_plugins || []).filter(p => p.estimated_tax_tokens_window);
      const partialPlugins = plugins.filter(p => p.partial_use_no_fix);
      const insufficientPlugins = plugins.filter(p => p.resident && p.insufficient_history);
      const pluginBody = plugins.length ? html`
        <div class="opt-line dim">Plugins: ${fd.plugins_resident || 0} of ${plugins.length} installed are resident (the rest are disabled or scoped to one project and cost nothing).</div>
        ${unusedPlugins.length ? html`<div class="table-wrap"><table class="opt-table"><thead><tr><th>Plugin</th><th>Components</th><th>Tax (window)</th></tr></thead>
          <tbody>${unusedPlugins.map(p => html`<tr><td class="mono">${p.name}</td><td>${p.skills} skill${p.skills !== 1 ? 's' : ''}, ${p.agents} agent${p.agents !== 1 ? 's' : ''}</td><td>${p.estimated_tax_usd_window != null ? fmtCost(p.estimated_tax_usd_window) : ('~' + fmtTokens(p.estimated_tax_tokens_window) + ' tokens')}</td></tr>`)}</tbody></table></div>` : null}
        ${partialPlugins.length ? html`<div class="opt-line dim">${partialPlugins.length} plugin${partialPlugins.length !== 1 ? 's' : ''} have some components used and some not. Enable/disable is whole-plugin only, so no fix is offered — see each one's own components.</div>` : null}
        ${insufficientPlugins.length ? html`<div class="opt-line dim">Not enough session history yet to say whether ${insufficientPlugins.map(p => p.name).join(', ')} ${insufficientPlugins.length === 1 ? 'is' : 'are'} used.</div>` : null}
      ` : null;
      body = !fd.sessions_scanned ? html`<div class="opt-line dim">No Claude Code sessions in this window.</div>`
        : !fd.configured_servers ? html`<div class="opt-line dim">Scanned ${fd.sessions_scanned} session${fd.sessions_scanned !== 1 ? 's' : ''}; no MCP server is configured, so nothing is being injected.</div>${pluginBody}`
        : !(fd.unused_servers || []).length ? html`<div class="opt-line dim">${(fd.notes && fd.notes.length) ? fd.notes.join(' ') : `All ${fd.configured_servers} configured MCP server${fd.configured_servers !== 1 ? 's' : ''} were invoked at least once in this window.`}</div>${pluginBody}`
        : html`
          <div class="opt-line">${fd.unused_servers.length} unused MCP server${fd.unused_servers.length !== 1 ? 's' : ''} of ${fd.configured_servers} configured <span class="dim">(schemas injected every session, nothing fired recently)</span>.</div>
          <div class="table-wrap"><table class="opt-table"><thead><tr><th>Server</th><th>Sessions</th><th>Invocations</th><th>Tax (window)</th></tr></thead>
            <tbody>${fd.unused_servers.map(s => html`<tr><td class="mono">${s.name} <span class="dim">(${s.scope} · ${s.source})</span></td><td>${s.sessions_present}</td><td>${s.invocations}</td><td>${s.estimated_tax_usd_window != null ? fmtCost(s.estimated_tax_usd_window) : ('~' + fmtTokens(s.estimated_tax_tokens_window) + ' tokens')}</td></tr>`)}</tbody></table></div>
          ${pluginBody}`;
      caveatText = fd.caveat;
    }
  }
  // Recoverable estimate (when present). `placement` is excluded: its figure
  // is a price difference, not recoverable tokens, and its own branch above
  // renders its own inline line with the "price difference" label instead
  // (root anti-pattern 22: the generic past-overspend wording here would be
  // dishonest for a figure that frees no tokens at all) — its stat tile 1
  // below reads directly off `fd.past_overspend_usd` with that same distinct
  // label rather than off `rec`.
  const fd = name === 'downsize' ? opt.downgrade : (opt.findings || {})[name];
  const dg = name === 'downsize' ? fd : null;
  const recUsd = name === 'placement' ? null : (fd ? fd.past_overspend_usd : null);
  const recTok = name === 'placement' ? null : (fd ? fd.past_overspend_tokens : null);
  const rec = (recUsd != null || recTok != null) ? fmtFramedSavings(recUsd, recTok, framing) : null;
  const isApiPricing = framing && framing.pricing_mode === 'api';

  // Stat tile 1: past overspend for every analyzer except `placement` (its
  // own price-difference framing, gated the same way its inline line is —
  // an api-billed lever a subscription/local/unknown plan cannot read a
  // dollar figure for at all).
  const tile1 = name === 'placement'
    ? { v: (isApiPricing && fd && fd.past_overspend_usd != null) ? fmtCost(fd.past_overspend_usd) : '—', l: 'price difference, this window' }
    : { v: rec || '—', l: 'past overspend, this window' };
  const [stat2, stat3] = optDetailStats(name, fd, dg);

  const mechKind = OPT_MECH[name] || 'read';
  const cli = 'tj optimize ' + name;
  const basisText = fd && fd.estimate_basis;
  const hasProposals = !!(proposals && proposals.length);
  const hasInlineFix = !!inlineFix;

  return html`<section class="opt-section" id=${'opt-' + name}>
    <div class="opt-head-row">
      <div class="opt-title" style="margin-bottom:0">${meta.title}</div>
      <span class="opt-cli-chip">${cli}</span>
      <span class="opt-mech-badge opt-mech-${mechKind}">${OPT_MECH_LABEL[mechKind]}</span>
    </div>
    ${meta.hint ? html`<div class="opt-blurb">${meta.hint}</div>` : null}
    <div class="opt-stats">
      <div class="opt-stat-tile"><div class="opt-stat-v">${tile1.v}</div><div class="opt-stat-l">${tile1.l}</div></div>
      ${stat2 ? html`<div class="opt-stat-tile"><div class="opt-stat-v">${stat2.v}</div><div class="opt-stat-l">${stat2.l}</div></div>` : null}
      ${stat3 ? html`<div class="opt-stat-tile"><div class="opt-stat-v">${stat3.v}</div><div class="opt-stat-l">${stat3.l}</div></div>` : null}
    </div>
    <div class="opt-body-grid">
      <div class="panel">
        <div class="panel-head">Evidence · the sessions this figure came from</div>
        <div class="panel-body">${body}</div>
      </div>
      <div class="opt-side">
        <div class="panel">
          <div class="panel-head">The fix</div>
          <div class="panel-body">
            ${hasProposals ? html`
              <div style=${hasInlineFix ? 'margin-bottom:12px' : ''}>
                ${proposals.map(p => html`<${CostProposalCard} key=${p.signature} prop=${p} embedded=${true} busy=${false}
                  onMark=${onProposalMark} onDismiss=${onProposalDismiss} onChanged=${onProposalChanged} />`)}
              </div>` : null}
            ${hasInlineFix ? inlineFix : null}
            ${(!hasProposals && !hasInlineFix) ? html`<div class="opt-fix-empty">No fix available right now. ${OPT_NO_FIX_REASON[name] || 'Nothing is currently offered for this finding.'}</div>` : null}
          </div>
        </div>
        ${caveatText ? html`
          <div class="opt-box opt-box-caveat">
            <div class="opt-box-label">Caveat</div>
            <div class="opt-box-body">${proseParagraphs(caveatText)}</div>
          </div>` : null}
        ${basisText ? html`
          <div class="opt-box">
            <div class="opt-box-label">How this figure is computed</div>
            <div class="opt-box-body">${proseParagraphs(basisText)}</div>
          </div>` : null}
      </div>
    </div>
  </section>`;
}

// The not-yet-known state for the whole Optimize read, in one place so the
// initial mount and every question change (persona, window, agent, comparison)
// reset to exactly the same thing. Every field is a NULL-ish "no answer", never
// a zero or an empty report: `proposalsScoped` starts true only because nothing
// renders off it while `loading` holds, and `bk: []` is never read as a known
// empty because the block that reads it is behind the same gate.
function optEmptyState() {
  return {
    loading: true, error: null, opt: null, cmp: null, comp: null, bk: [],
    proposalAnalyzers: new Set(), proposals: [], proposalsScoped: true,
  };
}

// THE QUESTION the Optimize reads answer. Every one of these four scopes the
// server-side reads, so a change to any of them means the figures on screen
// answer something the reader is no longer asking. Kept as one value so there
// is a single definition of "same question" rather than four comparisons that
// can drift apart.
function optQuestionKey(since, agentId, compare, persona) {
  return JSON.stringify([since || '', agentId || '', compare || '', persona || '']);
}

// What the page shows WHILE a read is in flight, which is the entire
// stale-vs-skeleton decision in one pure function (root anti-pattern 22a).
//
//   same question  -> KEEP the held answer. A 30s poll tick, the Refresh
//                     button and an apply-a-fix reload all re-ask the same
//                     thing, and the last complete answer is still the best
//                     available truth about it. Blanking it would make the page
//                     flicker every half minute for no gain.
//   question moved -> DROP it. The previous persona's analyzer rows, dollar
//                     figures and gated-analyzer set under the new persona's
//                     label are not stale truth, they are a fresh lie; same for
//                     last window's numbers under this window's picker. Not-yet-
//                     known is a skeleton, never a number and never a "no X".
function optPendingState(prev, questionChanged) {
  if (questionChanged) return optEmptyState();
  return { ...prev, loading: !prev.opt, error: null };
}

// The Optimize page's skeleton, shaped like the page it stands in for: a spend
// bar, the two summary cards, then the analyzer rows. A single 200px shimmer
// used to stand in for a screen several times that tall, so every resolution
// yanked the scroll position and the whole page jumped — most visibly on a
// persona switch, which now correctly passes THROUGH this state rather than
// holding the previous persona's numbers. Reserving roughly the real height is
// what makes the switch read as a load instead of a glitch.
function OptimizeSkeleton({ rows = 6 }) {
  return html`<div aria-busy="true" aria-label="Loading">
    <div class="shimmer" style="height:150px;border-radius:var(--radius-panel)"></div>
    <div class="opt-cards">
      <div class="shimmer" style="height:190px;border-radius:var(--radius-panel)"></div>
      <div class="shimmer" style="height:190px;border-radius:var(--radius-panel)"></div>
    </div>
    <div style="margin-top:var(--stack-gap);display:grid;gap:8px">
      ${Array.from({ length: rows }).map((_, i) => html`
        <div key=${i} class="shimmer" style="height:56px;border-radius:var(--radius-panel)"></div>`)}
    </div>
  </div>`;
}

function OptimizeView({ params, navParam, persona }) {
  // `navParam` is the path segment after `#/optimize/` (e.g. `downsize`).
  // summarize/rules/guide route to their OWN primary views (see primaryKeyFor),
  // so any navParam that reaches here is an ANALYZER name and means "render only
  // that analyzer's detail sub-page". Null → the summary landing.
  const detailName = navParam || null;
  const DEFAULTS = { since: DEFAULT_SINCE, agent_id: '', compare: '', finding: '' };
  const since = readParam(params, 'since', DEFAULTS.since, validSince);
  const agentId = readParam(params, 'agent_id', DEFAULTS.agent_id);
  const compare = readParam(params, 'compare', DEFAULTS.compare, v => ['previous', 'last-week', 'last-month', 'last-7d', 'last-30d'].includes(v));
  const focus = readParam(params, 'finding', DEFAULTS.finding);
  const setFilter = (k, v) => navigate('optimize', { since, agent_id: agentId, compare, finding: focus, [k]: v }, DEFAULTS);

  // `proposalsScoped` starts TRUE only because nothing has been fetched yet and
  // nothing renders off it until `loading` clears; once a fetch answers it is
  // the server's own `persona_scoped`, and a false there withholds every inline
  // fix card rather than showing corpus-wide dollars under a persona label.
  const [st, setSt] = useState(optEmptyState());
  // Locally-dismissed proposal signatures (same lock-free browser store the old
  // Review-actions page used). A dismissed fix withdraws its OFFER only; the
  // analyzer's figure is untouched (Critical Rule 32).
  const [dismissed, setDismissed] = useState(() => loadDismissedRelearns());

  // Generation counter + the question the data on screen answers, the same two
  // refs DashboardView's recoverable-waste read carries (`optRun`,
  // `optPersonaRef`). This page had NEITHER, which cost it both halves of the
  // contract:
  //   - no generation guard, so a slow settle for the persona the reader has
  //     already switched AWAY from wrote itself into the new persona's view.
  //     The reads are fast on a warm daemon, so this is a race rather than a
  //     certainty — which is exactly the kind that ships.
  //   - `loading: !s.opt` held the last answer across EVERY reload, including
  //     the reloads that change the question. A persona switch therefore left
  //     the previous persona's analyzer rows, dollar figures and gated-analyzer
  //     set rendered under the new persona's label until the read landed. That
  //     is correct for the 30s poll (same question, keep the last true answer)
  //     and a fresh lie for a switch, exactly as useTriageRead's deps rule says.
  const runRef = useRef(0);
  const questionRef = useRef(null);

  const load = useCallback(async () => {
    // The whole question, not just the persona: `since`, `agent_id` and the
    // comparison window scope these reads too, so each of them invalidates the
    // held answer for the same reason a persona switch does.
    const question = optQuestionKey(since, agentId, compare, persona);
    const changed = questionRef.current !== null && questionRef.current !== question;
    questionRef.current = question;
    const g = ++runRef.current;
    setSt(s => optPendingState(s, changed));
    try {
      // ONE round trip's worth of wall clock, not six. These six reads have no
      // data dependency on each other, and awaiting them in sequence made the
      // not-yet-known window the SUM of their latencies — the window a persona
      // switch spends on skeletons is now the slowest single read instead.
      // They still settle as one answer: this page publishes the analyzer rows,
      // the spend bar and the fix cards together, and two of those covering
      // different personas is the defect the whole surface exists to avoid.
      const [opt, cmp, comp, bk, cp] = await Promise.all([
        // `persona` is the SELECTED one, not the corpus's dominant one. The route
        // gates the analyzer set for what was asked, so the cards, the ranked
        // list and the gated-analyzer state below all describe the persona the
        // reader is actually looking at.
        api('/optimize', { since, agent_id: agentId || undefined, persona }),
        // SAME persona again. This comparison sits beside the analyzer rows as
        // part of one answer, so an unscoped delta here would put the whole
        // corpus's spend movement next to one persona's findings.
        compare ? api('/cost/compare', { since, compare, agent_id: agentId || undefined, persona }).catch(() => null) : null,
        // Cost-by-component + recoverable-waste overlay (#211). Best-effort: a
        // failure must not blank the Optimize screen.
        // SAME persona as the /optimize read above. These two render as one
        // answer on this screen — the analyzer rows and, right above them, the
        // "biggest single cause" line drawn from this overlay. Scoping only one
        // of them named an analyzer the row list had correctly dropped.
        api('/cost/components', { since, agent_id: agentId || undefined, persona }).catch(() => null),
        // Applied summaries (for the Summarize box's applied-vs-outstanding progress).
        api('/summarize/backups').then(r => r.backups || []).catch(() => []),
        api('/relearn/cost-proposals', { persona }).catch(() => null),
      ]);
      // The open cost proposals — the applyable fix for each analyzer, now
      // rendered inline on the analyzer's own detail page (the retired
      // Review-actions page's job moved here). Best-effort: a failed or empty
      // fetch just means a detail page shows no fix, never an error state.
      // SAME persona. These are the inline "apply this fix" cards on every
      // analyzer detail page, and their dollar figures are the ones the reader
      // acts on. `persona_scoped: false` means the stored ledger predates
      // per-persona proposals and cannot answer — the cards are then withheld
      // rather than shown with corpus-wide money under this persona's label.
      const proposalsScoped = !cp || cp.persona_scoped !== false;
      const proposals = (proposalsScoped && cp && cp.proposals) || [];
      const proposalAnalyzers = new Set(proposals.map(p => p.analyzer));
      // Only the settle whose generation is still current may write. A read
      // issued for the persona (or window) the reader has since moved off is a
      // complete, well-formed answer to a question nobody is asking any more.
      if (runRef.current !== g) return;
      setSt({ loading: false, error: null, opt, cmp, comp, bk, proposalAnalyzers, proposals, proposalsScoped });
    } catch (e) {
      if (runRef.current !== g) return;
      setSt(s => ({ ...s, loading: false, error: e.message || String(e) }));
    }
    // `persona` is a real dependency, not decoration: switching the picker has
    // to re-read, or the page keeps rendering the previous persona's analyzer
    // set under the new persona's name.
  }, [since, agentId, compare, persona]);

  useEffect(() => {
    load();
    // Bump the generation on teardown so a settle from the question this effect
    // asked cannot write into the one that replaced it — the same cleanup
    // useTriageRead and DashboardView's optimize read both use.
    return () => { runRef.current++; };
  }, [load]);

  // The open, non-dismissed cost proposals for one analyzer — the fixes rendered
  // inline on that analyzer's detail page. An analyzer can carry more than one
  // (downsize commonly has a driver-role card plus a per-project model-oversizing
  // card each), so this returns ALL of them, not just the first. `relearn` is
  // excluded (it is a rollup participant, not a per-analyzer card — see
  // cost_proposals).
  const proposalsFor = useCallback((name) => (st.proposals || []).filter(
    p => p.analyzer === name && p.analyzer !== 'relearn' && !dismissed.has(p.signature)
  ), [st.proposals, dismissed]);
  const dismissProposal = useCallback((sig) => {
    const next = new Set([...dismissed, sig]);
    setDismissed(next); saveDismissedRelearns(next);
  }, [dismissed]);
  const markProposal = useCallback(async (prop) => {
    try {
      await apiPostOrDetail('/relearn/cost-proposals/apply', { proposal_id: prop.proposal_id });
      await load();
    } catch (e) { /* surfaced on next refresh; keep the card in place */ }
  }, [load]);

  // Same stored artifact the Dashboard band reads, so the two screens state one
  // computed-at and cannot disagree about whether anything has been scanned.
  // `st.opt` is deliberately kept across a SAME-QUESTION reload (see
  // `optPendingState`), so a rescan in flight keeps the last completed findings
  // on screen. A question change drops it instead.
  const scan = scanState(st.opt);
  const {
    busy: rescanning, error: rescanError, declined: rescanDeclined,
    declinedDetail: rescanDeclinedDetail, rescan: doRescan,
  } = useRescan(load);
  useAutoRefresh(scan, load);

  // Scroll the focused finding into view + highlight it (deep-link from Overview).
  useEffect(() => {
    if (!focus || st.loading) return;
    const el = document.getElementById('opt-' + focus);
    if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); el.classList.add('opt-focus'); }
  }, [focus, st.loading, st.opt]);

  const framing = st.opt ? st.opt.framing : null;
  // relearn and summarize are deliberately excluded here — relearn has its
  // own full surface in the Review inbox, summarize its own bespoke box
  // below and its own screen (SummarizeView); giving them a second,
  // thinner card here would just duplicate that richer treatment.
  // Analyzers the server's persona gate never ran, because they have no fix
  // this user can apply (`persona_disabled_analyzers` on the /optimize
  // payload; see core/optimize/runner.py). They must VANISH, not render an
  // empty state: `placement` (and `downsize`) deliberately show a "ran, found
  // nothing" card when their finding is absent, which for a gated analyzer
  // would be a row pointing at a lever the reader does not have. Filtering the
  // order list here covers every such branch at once, including future ones.
  const personaGated = new Set((st.opt && st.opt.persona_disabled_analyzers) || []);
  // The THIRD state (see PERSONA_UNANSWERED_HINT): a lever exists for this
  // persona but no pass has computed it. Kept out of `personaGated` on purpose
  // — these rows stay, they just cannot claim a result yet.
  const personaUnanswered = new Set((st.opt && st.opt.persona_unanswered_analyzers) || []);
  const order = OPT_DETAIL_ORDER.filter(n => !personaGated.has(n));
  const compFraming = st.comp ? st.comp.framing : framing;
  // LOCAL only -- subscription no longer suppresses (product decision: tj
  // does not differentiate subscription-billed from API-billed users).
  const useTokens = !!compFraming && compFraming.pricing_mode === 'local';
  const wasteFmtY = useTokens ? fmtTokens : fmtCost;

  // Summarize (Track A) box — the honest DEC-032 tile set (files · est tokens
  // recoverable/call · avg prose reduction), rendered straight from the filesystem
  // finding so it shows even when there's no telemetry for the cost chart. Tokens-
  // first (no $: the finding leaves usd None by design); every figure is "estimated".
  const sf = st.opt && st.opt.findings ? st.opt.findings.summarize : null;
  const sfCands = sf && sf.candidates ? [...sf.candidates].sort((a, b) => b.est_tokens_saved - a.est_tokens_saved) : [];
  const sfTok = sfCands.reduce((s, c) => s + (c.est_tokens_saved || 0), 0);
  // Prose-reduction %s come from the analyzer (#423) — single source of truth;
  // the UI renders them and never re-derives chars/CHARS_PER_TOKEN in JS.
  const sfAvgPct = sf && sf.reduction_pct != null ? sf.reduction_pct : 0;
  // Applied vs outstanding. The scan (sfTok) is the STILL-recoverable opportunity —
  // it drops already-applied files by design. Applied savings come from the backup
  // meta (est_tokens_saved recorded at apply). % applied = applied / (applied + outstanding).
  // Applied is cumulative across runs (backups are global); outstanding is this scan.
  const sfApplied = (st.bk || []).reduce((s, b) => s + (b.est_tokens_saved || 0), 0);
  const sfAppliedN = (st.bk || []).filter(b => (b.est_tokens_saved || 0) > 0).length;
  const sfTotal = sfApplied + sfTok;
  const sfPctApplied = sfTotal > 0 ? Math.round(sfApplied / sfTotal * 100) : 0;

  // Which analyzers have their OWN detail sub-page (a real finding), in rank
  // order. Drives the summary landing's ranked link list AND validates a
  // `#/optimize/<name>` deep link — an analyzer with no finding gets no page.
  const detailNames = st.opt ? optimizeDetailAnalyzers(st.opt) : [];
  const detailSet = new Set(detailNames);
  // Same tiles, kept as full objects (not just names) so the footer "Next
  // biggest" nav can show an amount without re-deriving one — biggest-waste-
  // first order already matches `detailNames` above (both come from the same
  // `recoverableTiles` call over the same predicate).
  const detailTiles = st.opt ? recoverableTiles(st.opt).filter(t => t.state === 'actionable' && DETAIL_ANALYZER_NAMES.has(t.name)) : [];

  // Unified "Recommended actions" rows — one digestible section that replaces the
  // chart's per-analyzer waste-list and the old Findings list. One row per
  // analyzer: a short hint, its figure, and a Review button when there is a
  // detail page to act on, biggest-waste-first via recoverableTiles'
  // finding_rank. A check that ran and came back quiet keeps its row (never
  // hidden — that is how an unrun check becomes indistinguishable from a clean
  // one) but is dimmed rather than ranked against the rows carrying money.
  //
  // Rules and Summarize are NOT rows here any more. Neither carries a
  // per-window dollar, so both rendered in the figure column as a blank or a
  // token estimate sitting under a row of dollar amounts — reading as an
  // analyzer that found nothing. They are file-write actions with their own
  // surfaces, and they close the page as their own cards instead.
  const actRows = recoverableTiles(st.opt)
    .filter(t => order.indexOf(t.name) !== -1)
    .map(t => {
      const m = ANALYZER_META[t.name] || { title: capitalize(t.name), hint: '' };
      const actionable = t.state === 'actionable';
      const fig = actionable ? fmtFramedSavings(t.usd, t.tokens, framing)
        : t.state === 'at_ceiling' ? ('✓ ' + t.metric)
        : t.state === 'no_findings' ? 'No candidates' : 'Not ready';
      return {
        key: t.name, title: m.title,
        hint: (t.state === 'not_ready' && t.hint) ? t.hint : m.hint,
        fig, figDim: !actionable, quiet: !actionable,
        href: (actionable && detailSet.has(t.name)) ? ('#/optimize/' + t.name) : null,
      };
    });

  // DETAIL SUB-PAGE (`#/optimize/<analyzer>`): render THAT analyzer's section
  // alone, reusing the exact OptimizeFinding card the summary used to stack. A
  // name with no finding this window (stale link, or scanned-away) falls through
  // to a small "back to Optimize" notice rather than a blank page.
  if (detailName) {
    const meta = ANALYZER_META[detailName] || { title: capitalize(detailName) };
    const backLink = html`<div style="margin:0 0 16px"><a class="sz-back-link" href="#/optimize">← Back to Optimize</a></div>`;
    if (st.loading && !st.opt) {
      return html`${backLink}<${OptimizeSkeleton} rows=${2} />`;
    }
    if (st.error) {
      return html`${backLink}<div class="chart-card" style="border-color:var(--error)"><div style="color:var(--error);font-size:13px;margin-bottom:10px">Couldn't load: ${st.error}</div><button class="btn" onClick=${load}>Retry</button></div>`;
    }
    // Breadcrumb chip nav over the analyzers that RUN for the selected persona
    // (`order`, the same filtered list the summary's row list uses, so the two
    // surfaces cannot offer different sets). An analyzer with no page-worthy
    // figure this window keeps its chip: it ran, and "ran and found nothing" is
    // a real, reachable page.
    //
    // A persona-gated analyzer gets NO chip. This strip is an offer to go
    // somewhere useful, and a chip for an analyzer that has no lever under this
    // persona is an offer the product cannot honour, so it stops being made.
    // THE PAGE IS NOT REMOVED WITH THE CHIP: `#/optimize/<gated>` still routes
    // and still lands on the persona-disabled explanation below, so a deep
    // link, a bookmark and a link from another persona's screen all keep
    // working and say why. Withdrawing the offer is not the same as denying the
    // page exists.
    const crumbs = html`
      <div class="opt-crumbs">
        <a class="sz-back-link" href="#/optimize">← Back to Optimize</a>
        <div class="opt-crumb-div"></div>
        <div class="opt-crumb-list">
          ${order.map(n => {
            const m = ANALYZER_META[n] || { title: capitalize(n) };
            return html`<a key=${n} href=${'#/optimize/' + n} class=${'opt-crumb-chip' + (n === detailName ? ' active' : '')}>${m.title}</a>`;
          })}
        </div>
      </div>`;
    // Persona-disabled is a THIRD state, distinct from "ran, found nothing"
    // (root anti-pattern 22): the analyzer was never invoked for this
    // persona's window (`PERSONA_DISABLED_ANALYZERS`, runner.py), so there is
    // no `fd` to read a real empty state from. Checked BEFORE `hasCard` below
    // so a gated analyzer never falls into that generic branch, which would
    // misreport a true absence-of-lever as "may have been resolved, or this
    // window has no candidates" — a claim the analyzer never got to test.
    if (personaGated.has(detailName)) {
      return html`
        ${crumbs}
        <div class="page-title" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px">
          <${PersonaPicker} bare=${true} /> <${PlanBadge} framing=${framing} />
        </div>
        <div class="opt-persona-gated">This analyzer doesn't run for the selected persona — no lever exists for it here, so tokenjam skips the scan rather than showing a diagnostic there's nothing you can act on. <a class="sz-link" href="#/optimize">Back to Optimize →</a></div>
      `;
    }
    // NOT-YET-KNOWN, checked immediately after the gated branch and before
    // `hasCard` for the same reason: this analyzer DOES apply to the selected
    // persona, but the stored pass never ran it, so there is no finding to
    // read an empty state from. Falling through would print "may have been
    // resolved, or this window has no candidates" — a result claim for a scan
    // that never happened.
    if (personaUnanswered.has(detailName)) {
      return html`
        ${crumbs}
        <div class="page-title" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px">
          <${PersonaPicker} bare=${true} /> <${PlanBadge} framing=${framing} />
        </div>
        <div class="opt-persona-gated">${PERSONA_UNANSWERED_HINT} This analyzer does apply to the selected persona, so this is not "nothing found" — it is "not measured yet". <a class="sz-link" href="#/optimize">Back to Optimize →</a></div>
      `;
    }
    const hasCard = st.opt && (detailName === 'downsize'
      ? true
      : detailName === 'placement'
        ? true
        : !!(st.opt.findings || {})[detailName]);
    // Footer "next biggest" nav: cycles through the analyzers that actually
    // carry a figure this window (`detailTiles`, already rank-sorted
    // biggest-first), wrapping past the end. An analyzer with no current
    // figure (this one, or every other detail page, when only one or zero
    // carry a figure) gets no footer rather than a nonsensical self-link.
    const tileIdx = detailTiles.findIndex(t => t.name === detailName);
    const nextTile = tileIdx !== -1 && detailTiles.length > 1 ? detailTiles[(tileIdx + 1) % detailTiles.length] : null;
    const nextMeta = nextTile ? (ANALYZER_META[nextTile.name] || { title: capitalize(nextTile.name) }) : null;
    return html`
      ${crumbs}
      <div class="page-title" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px">
        <${PersonaPicker} bare=${true} /> <${PlanBadge} framing=${framing} />
      </div>
      ${scan.known && scan.windowDays ? html`<div class="sz-note" style="font-size:12px;margin-bottom:12px">Computed over the last ${scan.windowDays} days by the background scan.</div>` : null}
      ${hasCard
        ? html`<${OptimizeFinding} name=${detailName} opt=${st.opt} framing=${framing} proposals=${proposalsFor(detailName)} onProposalChanged=${load} onProposalDismiss=${dismissProposal} onProposalMark=${markProposal} />`
        : html`<div class="chart-card"><div class="opt-line dim">No <b>${meta.title}</b> finding in the latest scan. It may have been resolved, or this window has no candidates. <a class="sz-link" href="#/optimize">Back to Optimize →</a></div></div>`}
      ${nextTile ? html`
        <div class="opt-footer-nav">
          <div class="opt-footer-cap">Next biggest: ${nextMeta.title} · ${fmtFramedSavings(nextTile.usd, nextTile.tokens, framing)}</div>
          <a class="opt-next-btn" href=${'#/optimize/' + nextTile.name}>Next fix →</a>
        </div>` : null}
    `;
  }

  return html`
    ${/* The contextual "What do these checks mean?" link that used to sit
          beside this title is gone. The FAQ is still a top-level Improve entry
          in the sidebar, which is what makes it reachable from anywhere; this
          second, in-title entry point was noise on the heading. */ ''}
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px">
      <div class="page-title" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:0">
        Optimize <${PersonaPicker} bare=${true} /> <${PlanBadge} framing=${framing} />
      </div>
      <${ScanBar} scan=${scan} busy=${rescanning} error=${rescanError} declined=${rescanDeclined} declinedDetail=${rescanDeclinedDetail} onRescan=${doRescan} loading=${st.loading && !st.opt} />
    </div>
    ${/* What this page is, in one line. Deliberately carries no total: the
          per-analyzer figures below overlap (two checks can price the same
          session), so adding them into a headline here would publish a
          different, larger number than the netted one the Dashboard and the
          Review inbox both read off the server. */ ''}
    <div class="opt-blurb" style="margin:0 0 16px;max-width:660px">
      Every analyzer your setup can act on, and what each one found. The ones
      carrying a figure are ranked biggest first; the rest ran and came back
      quiet.
    </div>
    <div class="filters">
      <select value=${since} onChange=${e => setFilter('since', e.target.value)}>
        ${windowOptionsWithCurrent(st.opt && st.opt.data_span ? st.opt.data_span.available_days : null, since)
          .filter(w => w.value !== '24h')
          .map(w => html`<option value=${w.value}>${w.label}</option>`)}
      </select>
      <select value=${compare} onChange=${e => setFilter('compare', e.target.value)}>
        <option value="">No comparison</option>
        <option value="previous">vs previous</option>
        <option value="last-week">vs last week</option>
        <option value="last-month">vs last month</option>
      </select>
      ${agentId ? html`<button class="btn" onClick=${() => setFilter('agent_id', '')}>agent: ${agentId} ✕</button>` : null}
      <button class="btn" onClick=${load}>Refresh</button>
    </div>
    ${/* The picker above scopes the SPEND chart; the analyzer findings come
          from the background scan's own window. Saying so beats letting a 7d
          picker imply the findings were measured over 7 days. */ ''}
    ${scan.known && scan.windowDays ? html`<div class="sz-note" style="font-size:12px">Analyzer findings were computed over the last ${scan.windowDays} days by the background scan. The spend bar below is drawn over that same window, so the picker above does not move it.</div>` : null}

    ${st.error ? html`<div class="chart-card" style="border-color:var(--error)"><div style="color:var(--error);font-size:13px;margin-bottom:10px">Couldn't load: ${st.error}</div><button class="btn" onClick=${load}>Retry</button></div>` : null}
    ${st.loading ? html`<${OptimizeSkeleton} />` : null}
    ${/* Cold store: no findings exist, and an empty set of analyzer cards would
          read as "we looked and found nothing". Say what is true instead. */ ''}
    ${!st.loading && !st.error && scan.cold ? html`
      <div class="chart-card">
        <div style="font-size:13px">${scan.computing ? 'Scanning for optimization candidates. On a large history this can take several minutes.'
          : scan.status === 'error' ? html`The last analyzer scan failed${scan.lastError ? ': ' + scan.lastError : ''}. Nothing has been measured yet; this is not a report of zero waste.`
          : 'No analyzer scan has completed yet. tj serve runs one at startup and on a schedule.'}</div>
        <div style="margin-top:10px"><button class="btn" onClick=${doRescan} disabled=${rescanning || scan.computing}>${rescanning || scan.computing ? 'Scanning\u2026' : 'Scan now'}</button></div>
      </div>` : null}

    ${!st.loading && scan.known && st.opt ? html`
      ${/* ONE BAR. The whole width is measured spend over the ANALYZER SCAN's
            window (not the window picker's — see `basis` below); the
            shaded region inside it is the overspend ceiling. It replaces the
            segmented input/output/cache-read/cache-write composition chart:
            that answered "what did the money go on", which is a question the
            per-analyzer list below already answers in the only terms that lead
            anywhere, an actual fix.

            THE CLAIM THIS BAR MUST NOT MAKE. `recoverable_additive` is false:
            the per-analyzer estimates are computed from overlapping angles on
            the same sessions, so the total is a CEILING across analyzers rather
            than a slice of spend anyone could bank. Drawing it as a filled
            portion of a total makes it look like a measured sub-amount, so the
            server's own overlap note sits directly under the bar rather than
            somewhere the eye skips, and the legend names the region "ceiling"
            rather than a recoverable amount. The largest single line is the one
            entry that IS honest standalone (it is not a sum of anything), so it
            stays one click away as the safest number to act on first. */ ''}
      ${(() => {
        const c = st.comp;
        // Gated on the OVERLAY's own state, never on the page. The component
        // total is a live query and is known as soon as this read lands; the
        // recoverable figure comes from the stored analyzer report and can be
        // cold long after. Two sources, two states, and only one of them may
        // license a claim about waste.
        // BOTH figures read the same basis. A local-pricing reader sees tokens
        // rather than dollars (framing), and taking the total from the dollar
        // field while formatting it as tokens would print a spend figure under
        // a token label — the two are not interchangeable and the payload
        // carries both.
        const totalField = useTokens ? 'total_tokens' : 'total_cost_usd';
        const overField = useTokens ? 'total_recoverable_tokens' : 'total_recoverable_usd';
        const recKnown = !!(c && c.recoverable_available && c[overField] != null);
        const recPending = !!c && !recKnown
          && (c.recoverable_status === 'never_run' || c.recoverable_status === 'computing'
              || c.recoverable_status === 'error' || c.recoverable_available === false);
        // THE DENOMINATOR IS THE CEILING'S OWN, NEVER THE PAGE'S. `total_cost_usd`
        // answers the window in the picker above; the ceiling comes from the
        // stored analyzer scan and answers the scan's window over every agent.
        // Dividing one by the other published two populations as one ratio: a
        // 7-day total under a 30-day ceiling shaded 73% of a week's spend as
        // overspend, and narrower windows trend past 100%. `recoverable_basis_*`
        // is measured spend over the SCAN's window and agents, so numerator and
        // denominator now cover one population. It is null when the scan never
        // recorded its bounds, and null is not zero: a share we cannot compute
        // is shown as unknown, never as 0%.
        const basisField = useTokens ? 'recoverable_basis_tokens' : 'recoverable_basis_cost_usd';
        const basis = (c && c[basisField] != null) ? c[basisField] : null;
        const basisKnown = recKnown && basis != null && basis > 0;
        // What the "Total spend" legend names. With a ceiling on screen it is
        // the ceiling's basis or nothing; with no ceiling there is no ratio to
        // get wrong, so the page's own window is both honest and the more useful
        // thing to show while the scan is still running.
        const total = recKnown ? (basisKnown ? basis : null) : (c ? (c[totalField] || 0) : 0);
        if (!c) return null;
        if (!recKnown && total <= 0) return null;
        // The FIGURE is never clamped; only the WIDTH is. The ceiling sums
        // overlapping per-analyzer estimates, so it can legitimately come out
        // larger than its window's measured spend — and when it does, that is
        // the single most important thing this surface can say about how much
        // the estimates overlap. Clamping the number would hide it and, worse,
        // would print a value the data never produced under a measured label.
        const over = recKnown ? Math.max(0, c[overField]) : 0;
        // A shaded WIDTH is a share, so it may only be drawn when the share is
        // known. Ceiling-without-basis renders the figure and no proportion.
        const overPct = basisKnown ? Math.min(100, (over / basis) * 100) : 0;
        const overExceedsSpend = basisKnown && over > basis;
        return html`
        <div class="section-band">Where your spend went<span class="hint">· ${useTokens ? 'tokens' : 'measured spend'}, ${recKnown ? 'analyzer scan window' : 'this window'}</span></div>
        <div class="panel">
          <div class="panel-body">
            ${/* UNRESOLVED renders a flat skeleton bar with NO shaded region and
                  NO figure. It must not render a zero-width portion or a $0.00,
                  because an unshaded bar reads as "no waste found", which is the
                  most reassuring thing this surface could possibly say and the
                  one it has no evidence for. */ ''}
            <div class=${'opt-spendbar' + (basisKnown ? '' : ' is-skeleton')}>
              ${basisKnown && over > 0 ? html`<span class="opt-spendbar-over"
                style=${'width:' + overPct + '%'}
                title=${'Overspend ceiling: ' + wasteFmtY(over) + ' of ' + wasteFmtY(basis)}></span>` : null}
            </div>
            <div class="opt-spendbar-legend">
              <span><span class="swatch" style="background:var(--tone-1)"></span>
                Total spend <b>${total == null ? UNKNOWN_FIGURE : wasteFmtY(total)}</b></span>
              ${recKnown ? html`
                <span><span class="swatch" style="background:var(--warn)"></span>
                  Overspend ceiling <b>${wasteFmtY(over)}</b>
                  <span class="pct">${!basisKnown ? 'share of spend unknown'
                    : overExceedsSpend ? 'exceeds measured spend'
                    : (overPct < 1 && over > 0 ? '<1' : overPct.toFixed(0)) + '%'}</span></span>`
              : html`
                <span><span class="swatch" style="background:var(--surface2)"></span>
                  Overspend ceiling <b>${UNKNOWN_FIGURE}</b>
                  <span class="pct">${recPending ? 'not measured yet' : 'unknown'}</span></span>`}
            </div>
            ${/* THE DISCLOSURE TRAVELS WITH THE PAIR. Both notes come off the
                  payload beside the figures they qualify: the overlap note (the
                  ceiling is not additive) and the basis note (which window and
                  which agents both figures cover, and that the persona picker
                  changes the lever set rather than the traffic). Neither is
                  optional decoration; the window mismatch this bar used to
                  carry was invisible precisely because nothing said which
                  window the shaded region came from. */ ''}
            ${recKnown ? html`
              <div class="opt-spendbar-foot">
                The shaded part is a ceiling across every analyzer, not a slice of the total you could bank.${c.recoverable_overlap_note ? ' ' + c.recoverable_overlap_note : ''}${overExceedsSpend ? ' Here that ceiling is larger than its window\u2019s measured spend, which is only possible because the estimates overlap; treat it as an upper bound, not an amount.' : ''}
              </div>
              ${c.recoverable_basis_note ? html`
              <div class="opt-spendbar-foot" style="margin-top:4px">${c.recoverable_basis_note}</div>` : null}` : html`
              <div class="opt-spendbar-foot">
                ${c.recoverable_status === 'computing' ? 'The analyzer scan is still running, so no overspend figure exists for this window yet.'
                  : c.recoverable_status === 'error' ? 'The last analyzer scan failed, so nothing has been measured. This is not a report of zero waste.'
                  : 'No analyzer scan has completed yet, so no overspend figure exists for this window. This is not a report of zero waste.'}
              </div>`}
            ${recKnown && c.largest_recoverable_analyzer ? html`
              <div class="opt-spendbar-foot" style="margin-top:4px">
                Biggest single cause: <b style="color:var(--text)">${fmtFramedSavings(c.largest_recoverable_usd, c.largest_recoverable_tokens, compFraming)}</b> (<a class="sz-link" href=${optimizeFindingHref(c.largest_recoverable_analyzer, since)}>${(ANALYZER_META[c.largest_recoverable_analyzer] && ANALYZER_META[c.largest_recoverable_analyzer].title) || capitalize(c.largest_recoverable_analyzer)}</a>). It isn't a sum of anything else, so it's the safest number to act on first.
              </div>` : null}
          </div>
        </div>`;
      })()}

      ${/* ONE unified action list. Each analyzer/action is a compact row —
            title, one-line hint, its figure, and a Review button that opens the
            full evidence + fix on the analyzer's own detail page. Money analyzers
            rank biggest-waste-first (recoverableTiles' finding_rank); Summarize
            and Rules follow as the two file-write actions with no per-window
            dollar of their own. Rows without an actionable finding stay listed
            for transparency (cache at ceiling, ran-found-nothing) but carry no
            Review button. Replaces the old waste-list + Rules/Summarize/Findings
            sections, which listed the same analyzers three times. */ ''}
      <div class="section-band">Recommended actions<span class="hint">· biggest first</span></div>
      <section class="panel" id="opt-actions">
        <div class="opt-act-list">
          ${actRows.map(r => html`
            <div class=${'opt-act-row' + (r.quiet ? ' quiet' : '')} key=${r.key}>
              <span class="opt-act-name">${r.title}</span>
              <span class="opt-act-hint">${r.hint}</span>
              <span class=${r.figDim ? 'opt-act-fig dim' : 'opt-act-fig'}>${r.fig}</span>
              <span class="opt-act-btncell">${r.href ? html`<a class="opt-review-btn" href=${r.href}>Review →</a>` : null}</span>
            </div>`)}
        </div>
      </section>

      ${/* The two file-write actions plus the applied ledger, as their own
            cards. Each states what it holds rather than borrowing the action
            list's dollar column, which neither of them has anything to put in.
            Every count gates on its own fetch: `sf` null is "the summarize scan
            has not resolved", which renders no number at all rather than a 0
            that would read as "nothing to compress" (root anti-pattern 22). */ ''}
      <div class="opt-cards">
        <div class="opt-card">
          <div class="opt-card-title">Relearn</div>
          <div class="opt-card-body">
            Recurring findings that end in a permanent instruction-file rule.
            Each one is a diff you approve before anything is written.
          </div>
          <div class="opt-card-acts">
            <a class="opt-card-link" href="#/optimize/rules">Open Relearn →</a>
            <span class="opt-card-note">tj rules list</span>
          </div>
        </div>
        <div class="opt-card">
          <div class="opt-card-title">Summarize</div>
          ${/* Three states, gating on the summarize finding's own read. A scan
                that ran and found nothing gets a sentence, not a row of zeros:
                "0 files · ~0 tokens · 0%" is technically the known-empty truth
                but it reads as a broken tile, and empty-state copy is the only
                honest home for that state (root anti-pattern 22a). */ ''}
          ${!sf ? html`<div class="opt-card-stats">
              <div class="shimmer" style="height:44px;width:100%"></div>
            </div>`
            : (sf.files || 0) === 0 ? html`
              <div class="opt-card-body">
                No instruction file is over budget in this scan. Nothing to
                compress right now.
              </div>`
            : html`
              <div class="opt-card-stats">
                <div><div class="v">${sf.files}</div><div class="l">files over budget</div></div>
                <div><div class="v">~${fmtTokens(sfTok)}</div><div class="l">est. tokens per call</div></div>
                <div><div class="v">${sfAvgPct}%</div><div class="l">avg prose reduction</div></div>
              </div>`}
          <div class="opt-card-acts">
            <a class="opt-card-link" href="#/optimize/summarize">Curate →</a>
            <span class="opt-card-note">every figure is an estimate</span>
          </div>
        </div>
        <div class="opt-card">
          <div class="opt-card-title">Applied so far</div>
          ${/* No skeleton branch here: this whole block only renders once
                `st.loading` is false, and `load()` resolves the backups read in
                the same pass as the report — so by the time this paints, an
                empty list is a KNOWN empty, which is the only state allowed to
