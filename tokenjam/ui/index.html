// (tests/unit/test_lens_dashboard_states.py, same extraction trick as
// test_lens_select_all_behaviour.py) rather than only string-matched.

// What the "Past overspend" band renders, from its read's outcome.
//   phase — 'loading' | 'ready' | 'timeout' | 'error' (see DashboardView)
//   data  — the last COMPLETE /optimize payload we hold, or null for none ever
// Returns one of:
//   'tiles'    — complete answer, candidates to show
//   'none'     — complete answer, nothing recoverable. The ONLY state permitted
//                to state that there is nothing here.
//   'stale'    — we hold a complete answer AND the latest refresh did not land;
//                show the old tiles, labelled as the last complete result.
//   'scanning' — no answer yet and still waiting.
//   'timeout'  — stopped waiting without an answer. Unknown, not empty.
//   'failed'   — the read errored. Unknown, not empty.
function recoverableBandState(phase, data, tileCount) {
  // A COLD store is checked before anything else, because it is the one case
  // that looks like a complete answer and isn't. The read succeeded; the store
  // it described holds nothing. Falling through would reach `tileCount > 0`,
  // find 0, and return 'none' — "we scanned and found nothing" — for a scan
  // that has never run. See scanState().
  if (data && data.report_available === false) {
    return data.status === 'computing' ? 'scanning' : 'cold';
  }
  // A held answer always wins over the absence of a fresh one: showing the last
  // complete result (labelled) beats blanking a band we do have numbers for.
  if (data) {
    if (phase === 'timeout' || phase === 'error') return 'stale';
    return tileCount > 0 ? 'tiles' : 'none';
  }
  if (phase === 'timeout') return 'timeout';
  if (phase === 'error') return 'failed';
  return 'scanning';
}

// Why a tile has no figure, in its own words. A tile inherits its source's
// outcome, so it can be specific: "still scanning" (the read is outstanding past
// the band's wait) is a different fact from "couldn't load" (it failed), and
// telling the user which one it is decides whether waiting is worth anything.
const HEALTH_UNKNOWN_SUB = {
  loading: 'checking',
  timeout: 'still scanning',
  error: "couldn't load",
  // The store answered and holds nothing yet. Distinct from every entry above:
  // nothing is in flight and nothing failed, there has simply never been a scan.
  cold: 'not scanned yet',
};

// What goes in a health tile's number slot. 'loading' returns null, meaning the
// caller renders a shimmer there instead; anything other than an answered read
// returns the unknown mark. A caller cannot get a number out of this function
// for a source that did not answer, which is the point: the zero it would
// otherwise have derived from an empty fallback is the dangerous placeholder.
// 'timeout' does NOT return null — an indefinite shimmer would read as progress
// past the point where we have admitted we do not know.
function healthValueFor(status, value) {
  if (status === 'ready') return String(value);
  if (status === 'loading') return null;
  return UNKNOWN_FIGURE;
}

// `status` decides what the tile may SAY, independently of `value`:
//   'ready'   — the source answered; render the figure and let `attention` and
//               `sub` speak
//   'loading' — no answer yet; shimmer in the number slot, "checking" sub-line
//   'timeout' — outstanding past the band's wait; "?" and "still scanning"
//   'error'   — the source failed; "?" and "couldn't load"
function HealthTile({ label, value, attention, href, sub, status = 'ready' }) {
  const shown = healthValueFor(status, value);
  const unknown = status !== 'ready';
  return html`<a class="health-tile ${!unknown && attention ? 'attn' : ''}" href=${href}>
    ${shown === null
      ? html`<div class="shimmer health-value-skel" title="still checking"></div>`
      : html`<div class="health-value ${unknown ? 'unknown' : ''}">${shown}</div>`}
    <div class="health-label">${label}</div>
    ${/* The sub-line is where the unknown states explain themselves. An answered
          tile keeps whatever caption the caller gave it; an unanswered one
          replaces it, because that caption ("all clear", "within baseline") is
          exactly the claim we have no basis for. */ ''}
    ${unknown
      ? html`<div class="health-sub">${HEALTH_UNKNOWN_SUB[status] || HEALTH_UNKNOWN_SUB.error}</div>`
      : (sub ? html`<div class="health-sub">${sub}</div>` : null)}
  </a>`;
}

// ---- Optimize detail screen ----
function OptimizeFinding({ name, opt, framing, hasProposal }) {
  const meta = ANALYZER_META[name] || { title: capitalize(name) };
  let body = null;
  if (name === 'downsize') {
    const dg = opt.downgrade;
    // Always render the section — a null typed slot means the analyzer ran and
    // found no candidates, not that it's missing (issue #126).
    if (!dg) {
      return html`<section class="opt-section" id="opt-downsize">
        <div class="opt-title">Downsize</div>
        <div class="opt-line dim">No downsize candidates in this window; sessions don't match the smaller-model shape (small input/output, few tool calls).</div>
      </section>`;
    }
    body = html`
      <div class="opt-line">${dg.percent_of_sessions}% of sessions match a smaller-model candidate shape (${dg.candidate_sessions} of ${dg.total_sessions}).</div>
      ${dg.suggestions && Object.keys(dg.suggestions).length ? html`<div class="opt-line dim">Pattern: ${Object.entries(dg.suggestions).map(([k, v]) => k + ' → ' + v).join(', ')}</div>` : null}
      ${(dg.examples || []).length ? html`<div class="opt-sub">Examples</div>
        <table class="opt-table"><tbody>${dg.examples.map(ex => html`<tr><td class="mono">${(ex.trace_id || '').slice(0, 8)}…</td><td>${ex.tool_calls} tools</td><td class="mono">${ex.model}</td></tr>`)}</tbody></table>` : null}
      ${dg.caveat ? html`<div class="opt-caveat">! ${dg.caveat}</div>` : null}`;
  } else if (name === 'placement') {
    // Batch API placement: unattended, cadence-regular workloads whose spend
    // could move to the Batch API's flat 50% rate. A sibling top-level branch
    // (not the generic `(opt.findings||{})[name]` path below) because
    // `analyze_batch_placement` drops the key from `findings` entirely rather
    // than carrying an empty-candidates finding when nothing qualifies (see
    // model_downgrade.py's `run()`) — same "null slot means ran, found
    // nothing" shape as `downsize`/`opt.downgrade` just above, so it gets the
    // same explicit empty-state treatment (issue #126) instead of vanishing
    // via the generic `if (!fd) return null` a couple lines down.
    const fd = (opt.findings || {})[name];
    if (!fd) {
      return html`<section class="opt-section" id="opt-placement">
        <div class="opt-title">Batch placement</div>
        <div class="opt-line dim">No unattended, cadence-regular workloads in this window <span class="dim">(≥${PLACEMENT_DEFAULT_MIN_SESSIONS} sessions on a regular cadence, ≥${fmtCost(PLACEMENT_DEFAULT_MIN_GROUP_COST_USD)} window spend)</span>. Lower <span class="mono">[optimize] min_sessions_for_cadence</span> / <span class="mono">min_group_cost_usd</span> in tj.toml to consider smaller workloads.</div>
      </section>`;
    }
    // This number is a PRICE difference on the SAME tokens (batch bills the
    // same work at half rate, freeing nothing), never tokens freed — so
    // unlike every sibling card this branch renders its own footer line
    // below instead of the generic past-overspend one (see
    // `recUsd`/`recTok` suppression for this name further down), and gates
    // the dollar figure on `pricing_mode === 'api'` exactly, not just "not
    // suppressed" — the Batch API discount is an api-billed lever a
    // subscription/local/unknown plan cannot pull at all, mirroring the
    // CLI's `_render_placement` and `cost_proposals._placement_to_proposals`
    // (CLAUDE.md anti-pattern #22). Advise-only by design: batch adoption is
    // an architectural change (submit + poll) in the user's own application,
    // so this card offers no apply action — the generic "fix is ready" link
    // rendered below (data-driven off `hasProposal`) still applies, since it
    // only ever points at the Review inbox, never an apply button.
    const n = fd.candidates.length;
    const isApi = framing && framing.pricing_mode === 'api';
    body = html`
      <div class="opt-line">${n} workload${n !== 1 ? 's' : ''} fit the batch shape <span class="dim">(regular cadence, no human turn after the first model call)</span>: <b>${fd.percent_of_window_cost}%</b> of window cost.</div>
      <table class="opt-table"><thead><tr><th>Agent</th><th>Cadence</th><th>Tokens</th>${isApi ? html`<th>Spend → batch rate</th>` : null}</tr></thead>
        <tbody>${fd.candidates.slice(0, 10).map(c => html`<tr><td class="mono">${c.agent_id}</td><td>${c.sessions} session${c.sessions !== 1 ? 's' : ''} every ${fmtCadence(c.median_gap_seconds)}</td><td>${fmtTokens(c.tokens)}</td>${isApi ? html`<td class="mono">${fmtCost(c.cost_usd)} → <span style="color:var(--success)">${fmtCost(c.cost_usd - c.estimated_batch_saving_usd)}</span></td>` : null}</tr>`)}</tbody></table>
      ${fd.candidates.length > 10 ? html`<div class="opt-line dim">…and ${fd.candidates.length - 10} more.</div>` : null}
      ${isApi && fd.past_overspend_usd != null ? html`
        <div class="opt-line" style="margin-top:8px"><span style="color:var(--success)">~${fmtCost(fd.past_overspend_usd)}</span> estimated price difference over this window <span class="price-diff-tag" title=${fd.estimate_basis}>price difference</span> <span class="dim">(the same work, billed at the Batch API's flat rate)</span></div>`
        : html`<div class="opt-line dim" style="margin-top:8px">The Batch API's discount is an api-billed price lever, so no dollar figure is shown for this plan. The workload sizes above still say how much work fits the shape.</div>`}
      ${fd.friction ? html`<div class="opt-caveat">! ${fd.friction}</div>` : null}`;
  } else {
    const fd = (opt.findings || {})[name];
    if (!fd) return null;
    if (name === 'cache') {
      body = html`
        ${(fd.flagged || []).length ? html`<div class="opt-line">${fd.flagged.length} (provider, model) row(s) below the efficacy threshold.</div>` : null}
        <table class="opt-table"><thead><tr><th>Provider/Model</th><th>Efficacy</th><th>Input</th><th>Cache</th></tr></thead>
          <tbody>${(fd.rows || []).map(r => html`<tr class=${r.flagged ? 'flagged' : ''}><td class="mono">${r.provider}/${r.model}</td><td>${(r.efficacy * 100).toFixed(0)}%</td><td>${fmtTokens(r.input_tokens)}</td><td>${fmtTokens(r.cache_tokens)}</td></tr>`)}</tbody></table>`;
    } else if (name === 'resend') {
      // Structural context re-send: how much of each turn's prompt was
      // already sent in a previous turn. Cross-persona (Claude Code + SDK
      // alike) — only the fix differs, so both fixes always render, labeled
      // by who acts on them. `repeat_share === null` is the below-threshold
      // empty state; name the reason from `notes` rather than an empty card.
      const usd = fd.past_overspend_usd, tok = fd.past_overspend_tokens;
      const median = fd.repeat_share_median, p90 = fd.repeat_share_p90;
      body = fd.repeat_share == null ? html`
        <div class="opt-line dim">${(fd.notes && fd.notes[0]) || 'Not enough data in this window to measure a repeat share.'}</div>`
        : html`
        <div class="opt-line">${(fd.repeat_share * 100).toFixed(1)}% of prompt tokens in this window were already sent in an earlier turn of the same session <span class="dim">(token-weighted aggregate, ${fd.sessions_examined} session${fd.sessions_examined !== 1 ? 's' : ''} · ${fd.turns_examined} turns)</span>.</div>
        ${median != null ? html`<div class="opt-line dim">Median session: ${(median * 100).toFixed(0)}%${p90 != null ? `, p90: ${(p90 * 100).toFixed(0)}%` : ''}. The aggregate above is token-weighted, so a handful of very long sessions can pull it well above what a typical session carries.</div>` : null}
        ${(fd.examples || []).length ? html`<div class="opt-sub">Heaviest sessions</div>
          <table class="opt-table"><thead><tr><th>Session</th><th>Turns</th><th>Repeat share</th><th>Repeat tokens</th><th>Provider/Model</th></tr></thead>
            <tbody>${fd.examples.map((ex, i) => html`<tr key=${i}><td class="mono">${(ex.session_id || '').slice(0, 12)}</td><td>${ex.turns}</td><td>${(ex.repeat_share * 100).toFixed(0)}%</td><td>${fmtTokens(ex.repeat_tokens)}</td><td class="mono">${ex.provider}/${ex.model}</td></tr>`)}</tbody></table>` : null}
        ${(fd.recurring_examples || []).length ? html`<div class="opt-sub">Why: recurring inclusions</div>
          <table class="opt-table"><thead><tr><th>What's re-included</th><th>Sessions</th><th>Occurrences</th><th>Fix</th></tr></thead>
            <tbody>${fd.recurring_examples.slice(0, 8).map((r, i) => html`<tr key=${i}><td class="mono">${r.label}</td><td>${r.sessions}</td><td>${r.occurrences}</td><td class="dim">${r.fix}</td></tr>`)}</tbody></table>`
          : (fd.notes && fd.notes[0] ? html`<div class="opt-line dim">${fd.notes[0]}</div>` : null)}
        <div class="opt-sub">Fixes</div>
        <div class="opt-line">${fd.fix_compaction} <span class="dim">(agent-harness users, e.g. Claude Code)</span></div>
        ${fd.fix_cache_control ? html`
          <div style="margin-top:8px">
            <div class="opt-title" style="font-size:12.5px;margin-bottom:2px">
              <span>cache_control snippet</span>
              <${CopySnippetButton} text=${fd.fix_cache_control} />
            </div>
            <div style="margin:0 0 2px"><span class="dim" style="font-weight:400">SDK users, paste into your own call site</span></div>
            <div class="sz-copybox" style="margin-top:2px">${fd.fix_cache_control}</div>
          </div>` : null}
        ${(!dollarsSuppressed(framing) && usd == null && tok != null) ? html`<div class="opt-line dim">No dollar figure: no session in this window carries a priced, cache-capable model to estimate the cache_control-adoption saving from. The token estimate above still applies to the compaction lever, which is cache-agnostic.</div>` : null}
        ${fd.caveat ? html`<div class="opt-caveat">! ${fd.caveat}</div>` : null}`;
    } else if (name === 'cache-recommend') {
      // This analyzer is Anthropic-only by design (structural prefix
      // detection, not a cross-provider extension — see cache_recommend.py).
      // A non-Anthropic user must be told their calls were EXCLUDED, not left
      // to read a bare "no prefixes found" as "you have no repetition."
      const skippedProvider = fd.skipped_provider_count || 0;
      body = !fd.enabled ? html`<div class="opt-line dim">${fd.hint || 'Disabled. Set [capture] prompts = true to run this analyzer.'}</div>`
        : (fd.candidates || []).length ? html`<div class="opt-line">${fd.candidates.length} prefix candidate(s) for cache_control:</div>
          <table class="opt-table"><tbody>${fd.candidates.map(c => html`<tr><td class="mono">${(c.prefix_hash || '').slice(0, 8)}…</td><td>${c.occurrences}× shared</td><td>~${fmtTokens(c.estimated_cacheable_tokens)} cacheable</td></tr>`)}</tbody></table>`
        : html`<div class="opt-line dim">No stable prefixes shared across ≥3 Anthropic calls.${skippedProvider ? ` ${skippedProvider} call(s) on a non-Anthropic provider were excluded from this analysis: this analyzer only looks at Anthropic calls today.` : ''}</div>`;
    } else if (name === 'script') {
      body = (fd.clusters || []).length ? html`
        <div class="opt-line">${fd.clusters.length} deterministic-pattern cluster(s).</div>
        <table class="opt-table"><thead><tr><th>Instances</th><th>Signature</th><th>Avg cost</th></tr></thead>
          <tbody>${fd.clusters.map(c => html`<tr><td>${c.instances}×</td><td class="mono">${(c.signature || []).map(s => s.tool).join(' → ').slice(0, 60)}</td><td>${fmtPerItemCost(c.avg_cost_usd, c.avg_tokens, framing)}</td></tr>`)}</tbody></table>
        ${fd.caveat ? html`<div class="opt-caveat">! ${fd.caveat}</div>` : null}`
        : html`<div class="opt-line dim">No clusters above threshold (≥20 identical signatures).</div>`;
    } else if (name === 'trim') {
      // Per-prompt block, not a flat table (web card parity with the
      // CLI's `_render_trim`): each prompt can now carry a provenance line
      // (only when `source_path` cleared the verbatim-containment bar, see
      // prompt_bloat.py's module docstring) plus the flagged text itself —
      // more than fits one table row. Provenance is a bonus for a
      // harness-shaped workspace with a catalog file (CLAUDE.md, AGENTS.md,
      // ...), never the baseline: a pure-SDK caller never gets a
      // `source_path`, and for them the flagged-text block below is the
      // whole, complete answer, not a lesser version of it — so that block
      // renders unconditionally and the provenance line/Summarize pointer
      // render only when `source_path` is actually set.
      body = !fd.enabled ? html`<div class="opt-line dim">${fd.hint || 'Disabled: needs [capture] prompts = true and tokenjam[bloat].'}</div>`
        : (fd.per_prompt || []).length ? html`
          <div class="opt-line">${fd.prompts_scored} prompt(s) scored; ${fd.total_bloat_chars} of ${fd.total_chars} chars flagged.</div>
          ${fd.per_prompt.slice(0, 5).map((p, i) => html`
            <div key=${i} style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">
              <div class="opt-line"><span class="mono">${p.agent_id}</span> <span class="dim">${p.bloat_chars}/${p.prompt_chars} chars flagged, ~${p.estimated_token_reduction} tokens trimmable${!dollarsSuppressed(framing) && p.estimated_cost_reduction_usd != null ? ` (~${fmtCost(p.estimated_cost_reduction_usd)})` : ''}</span></div>
              ${p.source_path ? html`
                <div class="opt-line dim">Attributed to <span class="mono">${p.source_path}</span> (${p.source_basis}) <a class="sz-link" href="#/optimize/summarize">Review in Summarize →</a></div>` : null}
              ${(p.regions || []).length ? html`
                <div class="opt-line dim">Flagged text:</div>
                ${p.regions.slice(0, 3).map((r, j) => html`<div key=${j} class="opt-line dim" style="font-style:italic;margin-left:8px">"${(r.sample_chars || '').replace(/\n/g, ' ').trim()}…" <span class="dim">(${r.char_length} chars)</span></div>`)}
                ${p.regions.length > 3 ? html`<div class="opt-line dim" style="margin-left:8px">…and ${p.regions.length - 3} more region(s).</div>` : null}` : null}
            </div>`)}`
        : html`<div class="opt-line dim">No bloat regions above threshold.</div>`;
    } else if (name === 'reuse') {
      body = (fd.clusters || []).length ? html`
        <div class="opt-line">${fd.clusters.length} cluster${fd.clusters.length !== 1 ? 's' : ''} of repeated planning detected${captureModeNote(fd.capture_mode)}.</div>
        ${isDegradedCapture(fd.capture_mode) && fd.hint ? html`<div class="opt-line dim">${fd.hint}</div>` : null}
        <table class="opt-table"><thead><tr><th>Repeats</th><th>Signature</th><th>Reuse</th><th>Script</th></tr></thead>
          <tbody>${fd.clusters.slice(0, 5).map(c => html`<tr><td>${c.repetitions}×</td><td class="mono">${(c.tool_signature || []).join(' → ').slice(0, 60)}</td><td>${fmtFramedSavings(c.cache_reuse_recoverable_usd, c.cache_reuse_recoverable_tokens, framing)}</td><td>${fmtFramedSavings(c.script_replacement_recoverable_usd, c.script_replacement_recoverable_tokens, framing)}</td></tr>`)}</tbody></table>
        ${fd.clusters[0].caveat ? html`<div class="opt-caveat">! ${fd.clusters[0].caveat}</div>` : null}`
        : html`<div class="opt-line dim">No repeated planning detected above threshold (≥3 sessions sharing a skeleton).</div>
          ${fd.hint ? html`<div class="opt-line dim">${fd.hint}</div>` : null}`;
    } else if (name === 'subagent') {
      body = fd.total_subagents ? html`
        <div class="opt-line">${fd.total_subagents} subagent${fd.total_subagents !== 1 ? 's' : ''} across ${fd.sessions_with_subagents} session${fd.sessions_with_subagents !== 1 ? 's' : ''}, ${(fd.percent_of_cost * 100).toFixed(0)}% of window cost (${fmtFramedSavings(fd.subagent_cost_usd, fd.subagent_tokens, framing)}).</div>
        ${(fd.flagged || []).length ? html`
          <table class="opt-table"><thead><tr><th>Session/Sub-agent</th><th>Model</th><th>Tools</th><th>Flags</th></tr></thead>
            <tbody>${fd.flagged.slice(0, 10).map(r => html`<tr><td class="mono">${(r.session_id || '').slice(0, 8)}…/${(r.sub_agent_id || '').slice(0, 10)}</td><td class="mono">${r.model}</td><td>${r.tool_calls}</td><td>${(r.flags || []).join(', ')}</td></tr>`)}</tbody></table>`
          : html`<div class="opt-line dim">No right-sizing candidates above thresholds.</div>`}
        ${fd.caveat ? html`<div class="opt-caveat">! ${fd.caveat}</div>` : null}`
        : html`<div class="opt-line dim">No subagent (Task-tool) activity in this window.</div>`;
    } else if (name === 'verbosity') {
      body = (fd.candidates || []).length ? html`
        <div class="opt-line">${fd.total_candidates || fd.candidates.length} high-verbosity candidate${(fd.total_candidates || fd.candidates.length) !== 1 ? 's' : ''} <span class="dim">(output well above the per-task-shape median)</span>.</div>
        <table class="opt-table"><thead><tr><th>Session</th><th>Output</th><th>vs baseline</th><th>Recoverable</th></tr></thead>
          <tbody>${fd.candidates.map(c => html`<tr><td class="mono">${(c.session_id || '').slice(0, 8)}…</td><td>${fmtTokens(c.output_tokens)}</td><td>${fmtTokens(c.baseline_output_tokens)} median, ${c.over_baseline_multiple}×</td><td>${fmtFramedSavings(c.recoverable_usd, c.over_baseline_tokens, framing)}</td></tr>`)}</tbody></table>
        ${fd.suggested_max_tokens ? html`<div class="opt-line dim">Remedy to review (not applied): a terse system-prompt line and/or a max_tokens cap near ~${fmtTokens(fd.suggested_max_tokens)}.</div>` : null}
        ${fd.caveat ? html`<div class="opt-caveat">! ${fd.caveat}</div>` : null}`
        : html`<div class="opt-line dim">${fd.sessions_examined === 0 ? 'No LLM spans in this window.' : `Examined ${fd.sessions_examined} session${fd.sessions_examined !== 1 ? 's' : ''} across ${fd.cohorts_examined} task-shape cohort${fd.cohorts_examined !== 1 ? 's' : ''}; no session's output ran high enough vs its cohort median to flag.`}</div>`;
    } else if (name === 'deadweight') {
      body = !fd.sessions_scanned ? html`<div class="opt-line dim">No Claude Code sessions in this window.</div>`
        : !fd.configured_servers ? html`<div class="opt-line dim">Scanned ${fd.sessions_scanned} session${fd.sessions_scanned !== 1 ? 's' : ''}; no MCP server is configured, so nothing is being injected.</div>`
        : !(fd.dead_servers || []).length ? html`<div class="opt-line dim">${(fd.notes && fd.notes.length) ? fd.notes.join(' ') : `All ${fd.configured_servers} configured MCP server${fd.configured_servers !== 1 ? 's' : ''} were invoked at least once in this window.`}</div>`
        : html`
          <div class="opt-line">${fd.dead_servers.length} dead MCP server${fd.dead_servers.length !== 1 ? 's' : ''} of ${fd.configured_servers} configured <span class="dim">(schemas injected every session, never called)</span>.</div>
          <table class="opt-table"><thead><tr><th>Server</th><th>Sessions</th><th>Invocations</th><th>Tax (window)</th></tr></thead>
            <tbody>${fd.dead_servers.map(s => html`<tr><td class="mono">${s.name} <span class="dim">(${s.scope} · ${s.source})</span></td><td>${s.sessions_present}</td><td>${s.invocations}</td><td>${s.estimated_tax_usd_window != null ? fmtCost(s.estimated_tax_usd_window) : ('~' + fmtTokens(s.estimated_tax_tokens_window) + ' tokens')}</td></tr>`)}</tbody></table>
          ${fd.caveat ? html`<div class="opt-caveat">! ${fd.caveat}</div>` : null}`;
    }
  }
  // Recoverable estimate line (when present). `placement` is excluded: its
  // figure is a price difference, not recoverable tokens, and its own branch
  // above renders its own footer with the "price difference" label instead
  // (root anti-pattern 22: the generic past-overspend wording
  // below would be dishonest for a figure that frees no tokens at all).
  const fd = name === 'downsize' ? opt.downgrade : (opt.findings || {})[name];
  const recUsd = name === 'placement' ? null : (fd ? fd.past_overspend_usd : null);
  const recTok = name === 'placement' ? null : (fd ? fd.past_overspend_tokens : null);
  const rec = (recUsd != null || recTok != null) ? fmtFramedSavings(recUsd, recTok, framing) : null;

  return html`<section class="opt-section" id=${'opt-' + name}>
    <div class="opt-title">${meta.title}
      ${rec ? html`<span class="opt-rec" title=${(fd && fd.estimate_basis) || ''}>${rec}</span>` : null}
    </div>
    ${body}
    ${hasProposal ? html`<div class="opt-line" style="margin-top:10px"><a class="sz-link" href=${reviewProposalHref(name)}>A fix for this is ready. Review it in the Review inbox →</a></div>` : null}
  </section>`;
}

// Recommendation-outcome ledger: did recommendations get acted on, and
// what did they actually recover? Keeps measured-recovered strictly separate
// from estimated-recoverable (honesty discipline, Rule 14) — the measured column
// is an observed post-recommendation span-mix shift (correlation), never a
// projected figure and never "tokenjam saved you".
function RecommendationsPanel({ rec }) {
  const estTok = rec.past_overspend_tokens || 0;
  const estUsd = rec.past_overspend_usd || 0;
  const measTok = rec.measured_recovered_tokens || 0;
  const measUsd = rec.measured_recovered_usd || 0;
  const rows = (rec.rows || []).slice(0, 12);
  return html`
    <section class="opt-section" id="opt-recommendations">
      <div class="opt-title"><span>Recommendations acted on <span class="dim" style="font-weight:400;font-size:12px">· measured recovery vs estimate</span></span></div>
      <div class="sz-tiles">
        <div class="sz-tile"><div class="sz-tile-v" style="color:var(--accent)">~${fmtTokens(estTok)}${estUsd ? ' (~' + fmtCost(estUsd) + ')' : ''}</div><div class="sz-tile-l">past overspend</div></div>
        <div class="sz-tile"><div class="sz-tile-v" style="color:var(--success)">${fmtTokens(measTok)}${measUsd ? ' (' + fmtCost(measUsd) + ')' : ''}</div><div class="sz-tile-l">measured recovered</div></div>
        <div class="sz-tile"><div class="sz-tile-v">${rec.adopted || 0} / ${rec.ignored || 0}</div><div class="sz-tile-l">adopted / ignored</div></div>
      </div>
      <table class="opt-table" style="margin-top:12px">
        <thead><tr><th>When</th><th>What</th><th>Status</th><th style="text-align:right">recovered / est.</th></tr></thead>
        <tbody>
          ${rows.map((o, i) => html`<tr key=${i}>
            <td class="dim" style="font-size:11px">${String(o.ts || '').slice(0, 10)}</td>
            <td>${String(o.kind || '').replace(/_/g, ' ')}</td>
            <td class=${o.status === 'adopted' ? '' : 'dim'} style="font-size:12px">${o.status}</td>
            <td class="mono" style="text-align:right">${o.measured
              ? (o.recovered_tokens ? html`<span style="color:var(--success)">${fmtTokens(o.recovered_tokens)} measured</span>` : html`<span class="dim">0</span>`)
              : html`<span style="color:var(--accent)">~${fmtTokens(o.estimated_tokens || 0)} est.</span>`}</td>
          </tr>`)}
        </tbody>
      </table>
      <div class="sz-note" style="font-size:12px;margin-top:12px">Measured = observed shift in real spans after a recommendation (a correlation, not proof tokenjam caused it). Estimated = projected at recommendation time. <span class="estimated-tag">honest split</span></div>
    </section>`;
}

function OptimizeView({ params, navParam }) {
  // `navParam` is the path segment after `#/optimize/` (e.g. `downsize`).
  // summarize/rules/guide route to their OWN primary views (see primaryKeyFor),
  // so any navParam that reaches here is an ANALYZER name and means "render only
  // that analyzer's detail sub-page". Null → the summary landing.
  const detailName = navParam || null;
  const DEFAULTS = { since: DEFAULT_SINCE, agent_id: '', compare: '', finding: '' };
  const since = readParam(params, 'since', DEFAULTS.since, validSince);
  const agentId = readParam(params, 'agent_id', DEFAULTS.agent_id);
  const compare = readParam(params, 'compare', DEFAULTS.compare, v => ['previous', 'last-week', 'last-month', 'last-7d', 'last-30d'].includes(v));
  const focus = readParam(params, 'finding', DEFAULTS.finding);
  const setFilter = (k, v) => navigate('optimize', { since, agent_id: agentId, compare, finding: focus, [k]: v }, DEFAULTS);

  const [st, setSt] = useState({ loading: true, error: null, opt: null, cmp: null, comp: null, bk: [], rec: null, proposalAnalyzers: new Set() });

  const load = useCallback(async () => {
    setSt(s => ({ ...s, loading: !s.opt, error: null }));
    try {
      const opt = await api('/optimize', { since, agent_id: agentId || undefined });
      let cmp = null;
      if (compare) cmp = await api('/cost/compare', { since, compare, agent_id: agentId || undefined }).catch(() => null);
      // Cost-by-component + recoverable-waste overlay (#211). Best-effort: a
      // failure must not blank the Optimize screen.
      const comp = await api('/cost/components', { since, agent_id: agentId || undefined }).catch(() => null);
      // Applied summaries (for the Summarize box's applied-vs-outstanding progress).
      const bk = await api('/summarize/backups').then(r => r.backups || []).catch(() => []);
      // Recommendation-outcome ledger: measured-recovered vs estimated-recoverable.
      // Best-effort — must not blank the Optimize screen.
      const rec = await api('/recommendations').catch(() => null);
      // Which analyzers currently have an open Review-inbox proposal — drives
      // the card → Review-inbox link below. Best-effort: a failed or empty
      // fetch just means no card offers the link, never an error state.
      const cp = await api('/relearn/cost-proposals').catch(() => null);
      const proposalAnalyzers = new Set((cp && cp.proposals || []).map(p => p.analyzer));
      setSt({ loading: false, error: null, opt, cmp, comp, bk, rec, proposalAnalyzers });
    } catch (e) { setSt(s => ({ ...s, loading: false, error: e.message || String(e) })); }
  }, [since, agentId, compare]);

  useEffect(() => { load(); }, [load]);

  // Same stored artifact the Dashboard band reads, so the two screens state one
  // computed-at and cannot disagree about whether anything has been scanned.
  // `st.opt` is deliberately kept across a reload (`loading: !s.opt` above), so
  // a rescan in flight keeps the last completed findings on screen.
  const scan = scanState(st.opt);
  const {
    busy: rescanning, error: rescanError, declined: rescanDeclined,
    declinedDetail: rescanDeclinedDetail, rescan: doRescan,
  } = useRescan(load);
  useAutoRefresh(scan, load);

  // Scroll the focused finding into view + highlight it (deep-link from Overview).
  useEffect(() => {
    if (!focus || st.loading) return;
    const el = document.getElementById('opt-' + focus);
    if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); el.classList.add('opt-focus'); }
  }, [focus, st.loading, st.opt]);

  const framing = st.opt ? st.opt.framing : null;
  // relearn and summarize are deliberately excluded here — relearn has its
  // own full surface in the Review inbox, summarize its own bespoke box
  // below and its own screen (SummarizeView); giving them a second,
  // thinner card here would just duplicate that richer treatment.
  // Analyzers the server's persona gate never ran, because they have no fix
  // this user can apply (`persona_disabled_analyzers` on the /optimize
  // payload; see core/optimize/runner.py). They must VANISH, not render an
  // empty state: `placement` (and `downsize`) deliberately show a "ran, found
  // nothing" card when their finding is absent, which for a gated analyzer
  // would be a row pointing at a lever the reader does not have. Filtering the
  // order list here covers every such branch at once, including future ones.
  const personaGated = new Set((st.opt && st.opt.persona_disabled_analyzers) || []);
  const order = ['downsize', 'resend', 'cache', 'cache-recommend', 'script', 'trim', 'reuse', 'subagent', 'verbosity', 'deadweight', 'placement']
    .filter(n => !personaGated.has(n));
  const compFraming = st.comp ? st.comp.framing : framing;
  // LOCAL only -- subscription no longer suppresses (product decision: tj
  // does not differentiate subscription-billed from API-billed users).
  const useTokens = !!compFraming && compFraming.pricing_mode === 'local';
  const compIsApi = !!compFraming && compFraming.pricing_mode === 'api';
  const waste = buildComponentWaste(st.comp, useTokens, compIsApi);
  const wasteFmtY = useTokens ? fmtTokens : fmtCost;
  const wasteDominant = waste ? dominantSplit(waste.costSegs) : null;

  // Summarize (Track A) box — the honest DEC-032 tile set (files · est tokens
  // recoverable/call · avg prose reduction), rendered straight from the filesystem
  // finding so it shows even when there's no telemetry for the cost chart. Tokens-
  // first (no $: the finding leaves usd None by design); every figure is "estimated".
  const sf = st.opt && st.opt.findings ? st.opt.findings.summarize : null;
  const sfCands = sf && sf.candidates ? [...sf.candidates].sort((a, b) => b.est_tokens_saved - a.est_tokens_saved) : [];
  const sfTok = sfCands.reduce((s, c) => s + (c.est_tokens_saved || 0), 0);
  // Prose-reduction %s come from the analyzer (#423) — single source of truth;
  // the UI renders them and never re-derives chars/CHARS_PER_TOKEN in JS.
  const sfAvgPct = sf && sf.reduction_pct != null ? sf.reduction_pct : 0;
  // Applied vs outstanding. The scan (sfTok) is the STILL-recoverable opportunity —
  // it drops already-applied files by design. Applied savings come from the backup
  // meta (est_tokens_saved recorded at apply). % applied = applied / (applied + outstanding).
  // Applied is cumulative across runs (backups are global); outstanding is this scan.
  const sfApplied = (st.bk || []).reduce((s, b) => s + (b.est_tokens_saved || 0), 0);
  const sfAppliedN = (st.bk || []).filter(b => (b.est_tokens_saved || 0) > 0).length;
  const sfTotal = sfApplied + sfTok;
  const sfPctApplied = sfTotal > 0 ? Math.round(sfApplied / sfTotal * 100) : 0;

  // Which analyzers have their OWN detail sub-page (a real finding), in rank
  // order. Drives the summary landing's ranked link list AND validates a
  // `#/optimize/<name>` deep link — an analyzer with no finding gets no page.
  const detailNames = st.opt ? optimizeDetailAnalyzers(st.opt) : [];
  const detailSet = new Set(detailNames);

  // DETAIL SUB-PAGE (`#/optimize/<analyzer>`): render THAT analyzer's section
  // alone, reusing the exact OptimizeFinding card the summary used to stack. A
  // name with no finding this window (stale link, or scanned-away) falls through
  // to a small "back to Optimize" notice rather than a blank page.
  if (detailName) {
    const meta = ANALYZER_META[detailName] || { title: capitalize(detailName) };
    const backLink = html`<div style="margin:0 0 16px"><a class="sz-back-link" href="#/optimize">← Back to Optimize</a></div>`;
    if (st.loading && !st.opt) {
      return html`${backLink}<div class="shimmer" style="height:200px"></div>`;
    }
    if (st.error) {
      return html`${backLink}<div class="chart-card" style="border-color:var(--error)"><div style="color:var(--error);font-size:13px;margin-bottom:10px">Couldn't load: ${st.error}</div><button class="btn" onClick=${load}>Retry</button></div>`;
    }
    const hasCard = st.opt && (detailName === 'downsize'
      ? true
      : detailName === 'placement'
        ? true
        : !!(st.opt.findings || {})[detailName]);
    return html`
      ${backLink}
      <div class="page-title" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px">
        ${meta.title} <${PlanBadge} framing=${framing} />
      </div>
      ${scan.known && scan.windowDays ? html`<div class="sz-note" style="font-size:12px;margin-bottom:12px">Computed over the last ${scan.windowDays} days by the background scan.</div>` : null}
      ${hasCard
        ? html`<${OptimizeFinding} name=${detailName} opt=${st.opt} framing=${framing} hasProposal=${st.proposalAnalyzers.has(detailName)} />`
        : html`<div class="chart-card"><div class="opt-line dim">No <b>${meta.title}</b> finding in the latest scan. It may have been resolved, or this window has no candidates. <a class="sz-link" href="#/optimize">Back to Optimize →</a></div></div>`}
    `;
  }

  return html`
    ${/* The contextual "What do these checks mean?" link that used to sit
          beside this title is gone. The FAQ is still a top-level Improve entry
          in the sidebar, which is what makes it reachable from anywhere; this
          second, in-title entry point was noise on the heading. */ ''}
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px">
      <div class="page-title" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:0">
        Optimize <${PlanBadge} framing=${framing} />
      </div>
      <${PersonaPicker} />
      <${ScanBar} scan=${scan} busy=${rescanning} error=${rescanError} declined=${rescanDeclined} declinedDetail=${rescanDeclinedDetail} onRescan=${doRescan} />
    </div>
    <div class="filters">
      <select value=${since} onChange=${e => setFilter('since', e.target.value)}>
        ${windowOptionsWithCurrent(st.opt && st.opt.data_span ? st.opt.data_span.available_days : null, since)
          .filter(w => w.value !== '24h')
          .map(w => html`<option value=${w.value}>${w.label}</option>`)}
      </select>
      <select value=${compare} onChange=${e => setFilter('compare', e.target.value)}>
        <option value="">No comparison</option>
        <option value="previous">vs previous</option>
        <option value="last-week">vs last week</option>
        <option value="last-month">vs last month</option>
      </select>
      ${agentId ? html`<button class="btn" onClick=${() => setFilter('agent_id', '')}>agent: ${agentId} ✕</button>` : null}
      <button class="btn" onClick=${load}>Refresh</button>
    </div>
    ${/* The picker above scopes the SPEND chart; the analyzer findings come
          from the background scan's own window. Saying so beats letting a 7d
          picker imply the findings were measured over 7 days. */ ''}
    ${scan.known && scan.windowDays ? html`<div class="sz-note" style="font-size:12px">Analyzer findings were computed over the last ${scan.windowDays} days by the background scan; the picker above scopes the spend chart.</div>` : null}

    ${st.error ? html`<div class="chart-card" style="border-color:var(--error)"><div style="color:var(--error);font-size:13px;margin-bottom:10px">Couldn't load: ${st.error}</div><button class="btn" onClick=${load}>Retry</button></div>` : null}
    ${st.loading ? html`<div class="shimmer" style="height:200px"></div>` : null}
    ${/* Cold store: no findings exist, and an empty set of analyzer cards would
          read as "we looked and found nothing". Say what is true instead. */ ''}
    ${!st.loading && !st.error && scan.cold ? html`
      <div class="chart-card">
        <div style="font-size:13px">${scan.computing ? 'Scanning for optimization candidates. On a large history this can take several minutes.'
          : scan.status === 'error' ? html`The last analyzer scan failed${scan.lastError ? ': ' + scan.lastError : ''}. Nothing has been measured yet; this is not a report of zero waste.`
          : 'No analyzer scan has completed yet. tj serve runs one at startup and on a schedule.'}</div>
        <div style="margin-top:10px"><button class="btn" onClick=${doRescan} disabled=${rescanning || scan.computing}>${rescanning || scan.computing ? 'Scanning\u2026' : 'Scan now'}</button></div>
      </div>` : null}

    ${!st.loading && scan.known && st.opt ? html`
      ${waste ? html`
        <div class="chart-card">
          <div class="chart-head">
            <div class="chart-title">Spend by component + past overspend ${useTokens ? '(tokens)' : ''}</div>
            <div class="chart-meta">
              <span class="chart-total">${useTokens ? (fmtTokens(st.comp.total_tokens || 0) + ' tokens') : fmtFramedDollar(st.comp.total_cost_usd || 0, compFraming)}</span>
            </div>
          </div>
          <${ComponentWasteChart} costSegs=${waste.costSegs} recSegs=${waste.recSegs} fmtY=${wasteFmtY} height=${220} />
          <div class="chart-foot">
            <span class="dim">Left bar = measured spend split by token component. Right bar = <b>what you already overspent</b>, stacked by analyzer: money the window has already been billed for, not a projection of future savings.${st.comp && st.comp.recoverable_overlap_note ? ' ' + st.comp.recoverable_overlap_note : ''}</span>
          </div>
          ${st.comp && st.comp.largest_recoverable_analyzer ? html`
          <div class="chart-foot" style="margin-top:2px">
            <span class="dim">Biggest single cause: <b>${fmtFramedSavings(st.comp.largest_recoverable_usd, st.comp.largest_recoverable_tokens, compFraming)}</b> (<a class="sz-link" href=${optimizeFindingHref(st.comp.largest_recoverable_analyzer, since)}>${(ANALYZER_META[st.comp.largest_recoverable_analyzer] && ANALYZER_META[st.comp.largest_recoverable_analyzer].title) || capitalize(st.comp.largest_recoverable_analyzer)}</a>). It isn't a sum of anything else on this list, so it's the safest number to act on first.</span>
          </div>` : null}
          ${waste.recSegs.length ? html`
            <div class="waste-list">
              ${waste.recSegs.map(r => {
                const ov = WASTE_LEGEND_OVERRIDE[r.analyzer];
                return html`
                <div class="waste-row">
                  <span class="waste-name">${r.title === 'Summarize'
                    ? html`<a class="sz-link" href="#/optimize/summarize">${r.title}</a>`
                    : detailSet.has(r.analyzer)
                      ? html`<a class="sz-link" href=${'#/optimize/' + r.analyzer}>${r.title}</a>`
                      : r.title} <span class="dim">→ ${r.component === 'call' ? 'whole-call' : r.component.replace('_', '-')}</span></span>
                  <span class="waste-rec">${fmtFramedSavings(r.usd, r.tokens, compFraming)}${ov ? html` <span class=${ov.tagClass} title=${r.caveat || r.basis}>${ov.tagText}</span>` : null}${r.title === 'Summarize' ? html` <a class="sz-link" href="#/optimize/summarize" style="font-weight:400;font-size:11px;border:1px solid rgba(var(--accent-rgb),0.4);border-radius:4px;padding:1px 7px">Review →</a>` : null}</span>
                </div>
                ${(r.caveat || r.basis) ? html`<div class="waste-caveat dim">${r.caveat || r.basis}</div>` : null}
              `;})}
            </div>` : html`<div class="waste-none"><span class="check">✓</span> No overspend found in this window by any analyzer.</div>`}
          ${wasteDominant ? html`<div class="waste-split">${wasteDominant.label} is ${wasteDominant.pct}% of measured ${useTokens ? 'tokens' : 'spend'} this window.</div>` : null}
        </div>` : null}

      <section class="opt-section" id="opt-rules">
        <div class="opt-title">
          <span>Rules <span class="dim" style="font-weight:400;font-size:12px">· permanent CLAUDE.md rules, and which projects they land in</span></span>
          <a class="sz-link" href="#/optimize/rules" style="font-size:13px">Review →</a>
        </div>
        <div class="opt-line dim">
          Four analyzers end in the same fix: a rule written into a CLAUDE.md.
          The Rules screen shows each one with the project files it would be
          written into, one diff per file, applied selectively.
        </div>
      </section>

      ${sf ? html`
        <section class="opt-section" id="opt-summarize">
          <div class="opt-title">
            <span>Summarize <span class="dim" style="font-weight:400;font-size:12px">· structure-aware prompt summaries</span></span>
            <a class="sz-link" href="#/optimize/summarize" style="font-size:13px">Review →</a>
          </div>
          ${sf.files > 0 ? html`
            <div class="sz-tiles">
              <div class="sz-tile"><div class="sz-tile-v">${sf.files}</div><div class="sz-tile-l">summarizable file${sf.files === 1 ? '' : 's'}</div></div>
              <div class="sz-tile"><div class="sz-tile-v">~${fmtTokens(sfTok)}</div><div class="sz-tile-l">est. tokens recoverable / call</div></div>
              <div class="sz-tile"><div class="sz-tile-v">${sfAvgPct}%</div><div class="sz-tile-l">avg prose reduction</div></div>
            </div>
            ${sfApplied > 0 ? html`<div style="margin:14px 0 2px">
              <div class="sz-prog" style="height:10px"><div style=${'width:' + sfPctApplied + '%;background:var(--success)'}></div></div>
              <div class="sz-note" style="font-size:12px;margin-top:6px"><b>${sfPctApplied}% applied</b>: ~${fmtTokens(sfApplied)} tok/call recovered across ${sfAppliedN} file(s); ~${fmtTokens(sfTok)} still recoverable here. <span class="dim">Applied counts every run; still-recoverable is this scan.</span></div>
            </div>` : null}
            <table class="opt-table" style="margin-top:12px">
              <thead><tr><th>File</th><th>Scope</th><th>Loads</th><th style="text-align:right">~tok/call</th><th style="text-align:right">reduction</th></tr></thead>
              <tbody>
                ${sfCands.slice(0, 6).map((c, i) => html`<tr key=${i}>
                  <td class="mono" title=${c.path}>${c.path.split('/').slice(-2).join('/')}</td>
                  <td class="dim" style="font-size:11px">${c.scope}</td>
                  <td class="dim" style="font-size:11px" title=${(c.load_class && c.load_class !== 'always') ? 'Frontmatter is always in context; the body arrives only when this ' + c.load_class + ' is invoked' + (c.invocations != null ? ' (' + c.invocations + ' observed this window)' : '')  : 'Re-sent at the head of every session that loads it'}>${(!c.load_class || c.load_class === 'always') ? 'always-on' : 'on demand'}</td>
                  <td class="mono" style="text-align:right;color:var(--accent)">~${c.est_tokens_saved}</td>
                  <td class="mono" style="text-align:right">${c.reduction_pct != null ? c.reduction_pct : 0}%</td>
                </tr>`)}
                ${sfCands.length > 6 ? html`<tr><td colspan="5" class="dim" style="font-size:11px">+${sfCands.length - 6} more · <a class="sz-link" href="#/optimize/summarize">see all →</a></td></tr>` : null}
              </tbody>
            </table>
            <div class="sz-note" style="font-size:12px;margin-top:12px">Estimated per-call token reduction from a filesystem scan; advisory, review each rewrite before applying. An "on demand" file realizes that reduction only on the calls that follow an invocation, not on every call. <span class="estimated-tag" title=${sf.estimate_basis}>estimated · tokens</span></div>
          ` : html`<div class="opt-line dim">No summarizable prompt files in this scan. <a class="sz-link" href="#/optimize/summarize">Open Summarize →</a></div>`}
        </section>` : null}

      ${st.rec && st.rec.rows && st.rec.rows.length ? html`<${RecommendationsPanel} rec=${st.rec} />` : null}
      ${st.cmp ? html`<div class="chart-card"><div class="chart-title">Window comparison (${compare})</div>
        <div class="opt-line">Cost ${st.cmp.cost_delta_usd >= 0 ? '▲' : '▼'} ${fmtFramedDollar(Math.abs(st.cmp.cost_delta_usd), framing)} ${st.cmp.cost_delta_pct != null ? '(' + st.cmp.cost_delta_pct.toFixed(1) + '%)' : ''} · Tokens ${st.cmp.tokens_delta >= 0 ? '▲' : '▼'} ${fmtTokens(Math.abs(st.cmp.tokens_delta))}</div></div>` : null}
      ${/* Ranked analyzer list — the summary landing no longer stacks every
            analyzer's full detail section (heaviest-sessions tables, fix
            snippets, caveats). Each row links to that analyzer's own detail
            sub-page (#/optimize/<name>) where the full card lives. Rows with a
            real finding (a detail page) are links; ran-found-nothing / not-ready
            rows stay listed for transparency but are not clickable — the same
            has-data-vs-empty split the Dashboard tiles use (optimizeDetailAnalyzers).
            Ordered biggest-waste-first via recoverableTiles' finding_rank. */ ''}
      <section class="opt-section" id="opt-findings">
        <div class="opt-title"><span>Findings <span class="dim" style="font-weight:400;font-size:12px">· open one for its evidence and fix</span></span></div>
        <div class="opt-find-list">
          ${recoverableTiles(st.opt).filter(t => order.indexOf(t.name) !== -1).map(t => {
            const m = ANALYZER_META[t.name] || { title: capitalize(t.name), hint: '' };
            const hasPage = t.state === 'actionable' && detailSet.has(t.name);
            const fig = t.state === 'actionable' ? fmtFramedSavings(t.usd, t.tokens, framing)
              : t.state === 'at_ceiling' ? ('✓ ' + t.metric)
              : t.state === 'no_findings' ? 'No candidates' : 'Not ready';
            const figCls = t.state === 'actionable' ? 'opt-find-fig' : 'opt-find-fig dim';
            const hint = t.state === 'not_ready' && t.hint ? t.hint : m.hint;
            const inner = html`
              <span class="opt-find-name">${m.title}</span>
              <span class=${figCls}>${fig}</span>
              ${hint ? html`<span class="opt-find-hint dim">${hint}</span>` : null}`;
            return hasPage
              ? html`<a class="opt-find-row link" href=${'#/optimize/' + t.name}>${inner}</a>`
              : html`<div class="opt-find-row">${inner}</div>`;
          })}
        </div>
      </section>
      ${(st.opt.budgets || []).length ? html`<section class="opt-section" id="opt-budget-projection">
        <div class="opt-title"><span>Budget projection <span class="forecast-tag" title="A forecast of spend against your configured ceiling, not a measurement of waste. There is nothing here to apply.">forecast</span></span></div>
        ${st.opt.budgets.map(b => html`<div class="opt-line">
          <a class="sz-link" href=${'#/budget?provider=' + encodeURIComponent(b.provider)} title="Edit this provider's monthly ceiling on the Budget screen">${b.provider}</a>:
          run rate ${fmtFramedDollar(b.monthly_run_rate_usd, framing)}/mo vs
          ${fmtFramedDollar(b.budget_usd, framing)}/cycle ceiling
          (<a class="sz-link" href=${'#/budget?provider=' + encodeURIComponent(b.provider)}>configured for ${b.provider}</a>, cycle resets day ${b.cycle_start_day})
          ${b.over_budget ? html`<span style="color:var(--error)">· projected ${fmtFramedDollar(b.projected_overage_usd, framing)} over ceiling</span>` : html`<span style="color:var(--text-dim)">· projected within ceiling</span>`}
        </div>`)}
        <div class="opt-caveat">! This projects your current run rate forward against the ceiling you set for that provider on the <a class="sz-link" href="#/budget">Budget screen</a>, not the per-agent daily/session caps shown there. It identifies exposure, not recoverable spend. There is nothing to apply here; the fix is to spend less or raise the ceiling.</div>
        ${st.opt.budgets.some(b => b.over_budget) && st.comp && st.comp.largest_recoverable_analyzer ? html`
        <div class="opt-line" style="margin-top:6px">Biggest single cause: <b>${fmtFramedSavings(st.comp.largest_recoverable_usd, st.comp.largest_recoverable_tokens, compFraming)}</b> via <a class="sz-link" href=${optimizeFindingHref(st.comp.largest_recoverable_analyzer, since)}>${(ANALYZER_META[st.comp.largest_recoverable_analyzer] && ANALYZER_META[st.comp.largest_recoverable_analyzer].title) || capitalize(st.comp.largest_recoverable_analyzer)}</a>. The fastest way to bring the projection back under ceiling.</div>` : null}
      </section>` : null}
    ` : null}
  `;
}

// ============================
// FAQ (formerly Optimize ▸ Guide) — what each check looks for, in plain language.
// ============================
// This page exists for one question that kept getting asked: how are `downsize`
// and `subagent` different? They sit next to each other on the Optimize screen,
// both talk about models and workers, and nothing on either card says where the
// line is. A reader who finishes this page still unsure which check covers
// which mistake means the page has failed, so that contrast is stated first,
// before any per-check text.
//
// TWO SOURCES, KEPT SEPARATE ON PURPOSE.
//   * WHICH checks apply is the server's answer, read from
//     `/optimize/analyzers` (derived from the analyzer registry and the
//     persona gate in core/optimize/runner.py). There is no gating in this
//     file: no name list, no persona conditional deciding what runs. A JS copy
//     of that map is exactly the thing that silently desyncs the first time
//     Python changes, which is why the endpoint exists.
//   * WHAT each check means is prose, and prose has to live somewhere. This map
//     is keyed by analyzer name and carries nothing but words; if a key is
//     absent from the server's list it simply never renders, and if the server
//     lists a name this map does not cover the guide says so out loud rather
//     than quietly omitting a check the reader was told runs.
//
// PERSONA. The structure is per-persona because the gate is per-persona and the
// right explanation genuinely differs by setup. Exactly one persona is written
// today. An unwritten persona gets an honest banner naming the gap, never
// invented copy: text describing an SDK user's levers, written from a corpus of
// interactive coding sessions, would be fabrication.
// Per-check prose: one heading, one description (a few paragraphs of flowing
// text). Deliberately no numbers, no field names, no thresholds: those live on
// the cards, which is where a reader can see them against their own data.
//
// Downsize and Subagent used to share a separate callout card stating the
// distinction between them (WHERE the work happened vs. WHO did it); that
// card is gone, and the distinction is written into each of their own
// descriptions instead, so either section stands alone. The WHERE/WHO framing
// and the "a session can only trip one of them" claim are grounded in how
// `model_downgrade.py`'s driver-role case and `subagent_rightsizing.py` are
// actually scoped: the driver-role case (the bulk of what Downsize flags) only
// admits sessions that never dispatched a subagent at all, and
// `subagent_rightsizing` only ever reads spans already tagged with a
// `sub_agent_id` (i.e. already dispatched to a worker), so the two describe
// disjoint populations for the flagship detection each card reports on.
//
// This is a card for every analyzer whose check ends in a fix a user could
// apply -- NOT every name in `ANALYZER_REGISTRY` (`core/optimize/`). Those
// are different lists: `budget-projection` and `stream-usage` both live in
// the registry, but neither ends in anything to change (budget-projection is
// a spend forecast against a ceiling; stream-usage corrects a spend FIGURE,
// it recovers nothing), so neither gets a card. The other 6 gated-off names
// below (cache, cache-recommend, reuse, script, trim, verbosity) DO end in a
// fix in the abstract -- they are gated off for Claude Code specifically
// (no lever that persona can reach, or the check cannot fire for it), which
// is a different, narrower kind of exclusion than "has no fix at all". A
// newly-registered analyzer must be triaged against this same rule by a
// human before it gets a card here; see
// `test_analyzer_guide_covers_the_reviewed_user_facing_analyzer_list` in

// analyzer) when a registry name is in neither this object's `order` nor its
// own explicit excluded list, rather than silently doing nothing or
// silently adding a card.
//
// `order` below lists the live-for-Claude-Code ones first, then the ones
// gated off for Claude Code, and the two groups are never interleaved. The
// live/gated split and the reasoning inside each gated entry's description
// are grounded in `.claude/product-state/ANALYZER-PERSONA-MATRIX.md` (the

// ============================
// Optimize ▸ Summarize (Track B) — curate → run → review/apply.
// ============================
// The Optimize dashboard SHOWS the recoverable signal (the Track A `summarize`
// analyzer); THIS screen DOES the work. Its reason to exist vs. `tj summarize`
// on the CLI is granularity (DEC-034): the CLI applies all-or-nothing, here you
// pick a subset, run the structure-aware summarizer per file, review each diff,
// and apply individually. Every write goes through core `apply_staged` (owner +
// content-hash-drift + symlink guards, gzip backup, dry-run until an explicit
// per-file Apply — no flag bypasses a guard). All data comes from
// /api/v1/summarize/* (core in-process; the run route is `tj serve`'s first
// outbound LLM caller — capabilities-gated so dead engines are disabled).
function diffLine(ln, i) {
  let col = 'var(--text-faint)';
  if (ln.startsWith('+')) col = 'var(--success)';
  else if (ln.startsWith('-')) col = 'var(--error)';
  return html`<div key=${i} style=${'color:' + col}>${ln || ' '}</div>`;
}

// Group a unified diff into per-hunk "blocks" so the review shows the change
// block-by-block instead of one wall of @@ noise. Drops the ---/+++ file headers
// and the cryptic @@ hunk header; each hunk becomes a block with +/- line counts.
function diffBlocks(diffText) {
  const out = [];
  let cur = null;
  for (const ln of (diffText || '').split('\n')) {
    if (ln.startsWith('--- ') || ln.startsWith('+++ ')) continue;
    if (ln.startsWith('@@')) { cur = { add: 0, del: 0, lines: [] }; out.push(cur); continue; }
    if (!cur) { cur = { add: 0, del: 0, lines: [] }; out.push(cur); }
    if (ln.startsWith('+')) cur.add++;
    else if (ln.startsWith('-')) cur.del++;
    cur.lines.push(ln);
  }
  return out.filter(b => b.lines.some(l => l.trim()));
}

// Optimize ▸ Rules — the placed rule-write surface.
//
// Four analyzers (downsize, resend, subagent, relearn) end in the same
// artifact: a rule appended to a CLAUDE.md. The backend now decides WHICH
// files each one lands in, from the working directories the sessions recorded.
// A Review-inbox card can express one write; it cannot express "this rule,
// into these 4 of your 11 projects, here is each diff, apply selectively" —
// which is what a placed rule is, and why this screen exists beside the inbox.
//
// Single compute path: every number, destination, verdict and blocked-reason
// on this screen is read verbatim from /api/v1/rules*. Nothing here re-derives
// placement, netting, or which analyzers write rules — extend the endpoint, not
// this component.
function RulesView() {
  const [rules, setRules] = useState(null);       // null = not yet known
  // The delivery-mechanism registry, read from the server. Appending markdown
  // to a CLAUDE.md is one way to get a rule in front of the agent, not the
  // only one, so the label comes from the endpoint rather than a second copy
  // of the list in JS (single compute path).
  const [deliveryKinds, setDeliveryKinds] = useState({});
  const [staged, setStaged] = useState(null);
  const [applied, setApplied] = useState(null);
  const [err, setErr] = useState(null);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);
  const [open, setOpen] = useState(null);         // signature whose detail is expanded
  const [preview, setPreview] = useState(null);   // { signature, applied, skipped }
  const [tab, setTab] = useState('open');         // 'open' | 'applied'

  // Each panel gates on ITS OWN fetch. `null` is "not yet known" and renders a
  // skeleton; `[]` is "known and empty" and is the only state allowed to say
  // "no rules". A count or a "none" claim painted before its fetch resolves is
  // the recurring defect this product has (root anti-pattern 22) — zero is the
  // worst placeholder, because "no waste" reads as reassurance.
  const load = async () => {
    try {
      const [r, s, a] = await Promise.all([
        api('/rules'), api('/rules/staged'), api('/rules/applied'),
      ]);
      setRules(r.rules || []);
      setDeliveryKinds(r.delivery_kinds || {});
      setStaged(s.staged || []);
      setApplied(a.applied || []);
      setErr(null);
    } catch (e) { setErr(String(e && e.message || e)); }
  };
  useEffect(() => { load(); }, []);

  const stagedBySig = {};
  (staged || []).forEach(s => {
    (stagedBySig[s.signature] = stagedBySig[s.signature] || []).push(s);
  });

  // The two tab populations, split ONCE. "In place" is either route to done:
  // tokenjam applied it (a ledger knows, exactly) or the user already had it
  // (`already_present`, resolved by the model on the analyzer pass). Everything
  // else is open. Split here rather than filtered inline at each render site, so
  // the counts on the tabs and the rows inside them cannot disagree — and the
  // predicate matches the server's own `open_count`/`in_place_count` derivation.
  const allRules = rules || [];
  const inPlaceRules = allRules.filter(r => r.already_applied || r.already_present);
  const openRules = allRules.filter(r => !r.already_applied && !r.already_present);

  const doStage = async (sig) => {
    setBusy(true); setMsg(null);
    try {
      await apiPostOrDetail('/rules/stage', { signature: sig });
      await load();
      setMsg('Staged. Review each diff below, then Apply.');
    } catch (e) { setMsg(String(e && e.message || e)); }
    setBusy(false);
  };
  const doPreview = async (sig) => {
    setBusy(true); setMsg(null);
    try {
      const res = await apiPostOrDetail('/rules/apply', { signature: sig, go: false });
      setPreview({ signature: sig, ...res });
    } catch (e) { setMsg(String(e && e.message || e)); }
    setBusy(false);
  };
  const doApply = async (sig) => {
    setBusy(true); setMsg(null);
    try {
      const res = await apiPostOrDetail('/rules/apply', { signature: sig, go: true });
      setPreview(null);
      await load();
      const n = (res.applied || []).length, k = (res.skipped || []).length;
      // The skipped count is never dropped: "3 of 4 written" is the honest
      // result, and reporting only the successes would state the rule landed
      // everywhere it was meant to.
      setMsg(`Wrote ${n} file(s)` + (k ? `, skipped ${k} (see reasons below)` : '') + '.');
    } catch (e) { setMsg(String(e && e.message || e)); }
    setBusy(false);
  };
  const doDismiss = async (sig, undo) => {
    setBusy(true); setMsg(null);
    try {
      await apiPostOrDetail(undo ? '/rules/undismiss' : '/rules/dismiss', { signature: sig });
      await load();
      setMsg(undo ? 'Brought back.' : 'Dismissed. What it already cost is still reported.');
    } catch (e) { setMsg(String(e && e.message || e)); }
    setBusy(false);
  };
  const doUndo = async (sig, path) => {
    setBusy(true); setMsg(null);
    try {
      await apiPostOrDetail('/rules/undo', { signature: sig, path, go: true });
      await load();
      setMsg('Reverted.');
    } catch (e) { setMsg(String(e && e.message || e)); }
    setBusy(false);
  };

  return html`
    <div class="view">
      <div class="page-title">Rules</div>
      ${/* No "back to Optimize" link: Rules is a nav-child of Optimize, so the
            sidebar already shows its parent one line above it whenever this
            page is open. A second route back was noise trailing the
            description. */ ''}
      <div class="opt-line dim">
        Permanent CLAUDE.md rules the analyzers propose, and the project files
        each one would be written into.
      </div>
      ${err ? html`<div class="panel"><div class="panel-body opt-line" style="color:var(--error)">${err}</div></div>` : null}
      ${msg ? html`<div class="panel"><div class="panel-body opt-line">${msg}</div></div>` : null}

      ${/* TWO POPULATIONS, TWO TABS. This page used to be one "On offer" zone
            listing every rule, including the ones the write budget refused, each
            explaining its refusal: "below the $5 floor", "would cost more to keep
            than it recovers", "your instruction files already carry more standing
            context than the budget allows to grow". Individually honest;
            collectively a page of things the product declined to do, shown to a
            user who came looking for something to apply.

            The gate moved below this surface, so there is no refusal prose left
            to render. What remains splits cleanly: something to do, or something
            already done. Counts come from the server (`open_count` /
            `in_place_count`) rather than being re-derived here, and they are held
            back until the fetch resolves — a "(0)" painted mid-flight reads as a
            settled "you have nothing", which is the worst thing this page can
            say wrongly (root anti-pattern 22). */ ''}
      <div class="tabs" role="tablist">
        <button class="tab ${tab === 'open' ? 'active' : ''}" role="tab" aria-selected=${tab === 'open'} onClick=${() => setTab('open')}>
          Open ${rules === null
            ? html`<span class="shimmer" style="display:inline-block;width:20px;height:9px;vertical-align:middle;border-radius:3px"></span>`
            : html`(${openRules.length})`}
        </button>
        <button class="tab ${tab === 'applied' ? 'active' : ''}" role="tab" aria-selected=${tab === 'applied'} onClick=${() => setTab('applied')}>
          Applied ${rules === null
            ? html`<span class="shimmer" style="display:inline-block;width:20px;height:9px;vertical-align:middle;border-radius:3px"></span>`
            : html`(${inPlaceRules.length})`}
        </button>
      </div>

      ${tab === 'open' ? html`
      ${rules === null
          ? html`<div class="opt-line dim">Loading…</div>`
          : openRules.length === 0
            ? html`<div class="empty compact">${
                inPlaceRules.length > 0
                  ? 'Nothing left to write. Every rule the analyzers derived is already in your files.'
                  : 'No permanent rules to write. Run an optimize pass, then reload.'
              }</div>`
            : openRules.map(r => {
                const dests = r.destinations || [];
                const st = stagedBySig[r.signature] || [];
                return html`<div key=${r.signature} class="opt-section inbox-row" style="display:block">
                  <div style="display:flex;align-items:center;gap:10px">
                    <b>${r.title || r.signature}</b>
                    <span class="dim" style="font-size:12px">${r.analyzer} · ${
                      (deliveryKinds[r.delivery] && deliveryKinds[r.delivery].label)
                        || deliveryLabel(r.delivery)}</span>
                    <span style="margin-left:auto">
                      ${r.past_overspend_usd == null
                        ? html`<span class="dim">—</span>`
                        : html`<span>${fmtUsd(r.past_overspend_usd)}</span>`}
                    </span>
                  </div>
                  <div class="opt-line dim">
                    ${dests.length === 0
                      ? 'No destination resolved: no session it was derived from recorded a working directory that still exists.'
                      : dests.length === 1
                        ? html`Writes into <span class="mono" title=${dests[0].path}>${shortPath(dests[0].path)}</span> <span class="dim">(${dests[0].scope})</span>`
                        : html`Writes into ${dests.length} project files`}
                  </div>
                  ${dests.length > 1 ? html`<div class="opt-line dim">
                    ${dests.map(d => html`<div class="mono" title=${d.path}>· ${shortPath(d.path)}${d.sessions ? ` (${d.sessions} session${d.sessions === 1 ? '' : 's'})` : ''}</div>`)}
                  </div>` : null}
                  ${r.placement_basis ? html`<div class="opt-line dim">${r.placement_basis}</div>` : null}
                  ${r.placement_coverage_note ? html`<div class="opt-line dim">${r.placement_coverage_note}</div>` : null}
                  ${/* No "Not on offer: <reason>" line any more. A rule the budget
                        declined is not in this list at all — the gate sits below
                        the surface now — so the only state worth stating here is
                        the user's own: they dismissed it. */ ''}
                  ${r.dismissed
                    ? html`<div class="opt-line dim"><b>Dismissed.</b> ${r.blocked_reason}</div>`
                    : null}
                  <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
                    <button class="cur-btn" onClick=${() => setOpen(open === r.signature ? null : r.signature)}>
                      ${open === r.signature ? 'Hide rule text' : 'Show rule text'}
                    </button>
                    ${r.offered && !r.dismissed && dests.length ? html`
                      <button class="cur-btn" disabled=${busy} onClick=${() => doStage(r.signature)}>Stage diffs</button>` : null}
                    ${r.dismissed
                      ? html`<button class="cur-btn" disabled=${busy} onClick=${() => doDismiss(r.signature, true)}>Bring back</button>`
                      : html`<button class="cur-btn" disabled=${busy} onClick=${() => doDismiss(r.signature, false)}>Dismiss</button>`}
                    ${st.length ? html`
                      <button class="cur-btn" disabled=${busy} onClick=${() => doPreview(r.signature)}>Preview (${st.length})</button>
                      <button class="cur-btn primary" disabled=${busy} onClick=${() => doApply(r.signature)}>Apply</button>` : null}
                  </div>
                  ${open === r.signature ? html`<pre class="sz-copybox" style="margin-top:10px">${r.artifact_text}</pre>` : null}
                  ${st.length ? html`<div class="opt-line dim" style="margin-top:6px">
                    ${st.map(s => html`<div class="mono" title=${s.path}>
                      ${s.applyable ? '✓' : '!'} ${shortPath(s.path)}${s.applyable ? '' : `: ${s.reason}`}
                    </div>`)}
                  </div>` : null}
                </div>`;
              })}

      ${preview ? html`<div class="panel">
        <div class="panel-head"><h2>Preview: nothing written</h2></div>
        <div class="panel-body">
          ${(preview.applied || []).map(a => html`<div class="sz-diffblock" key=${a.path}>
            <div class="sz-diffblock-h">${a.path}${a.created_file ? ' (new file)' : ''}</div>
            <div class="rev-diff">${a.diff}</div>
          </div>`)}
          ${(preview.skipped || []).map(s => html`<div class="opt-line" style="color:var(--warn)" key=${s.path}>${s.path}: ${s.reason}</div>`)}
          <div style="margin-top:8px;display:flex;gap:8px">
            <button class="cur-btn primary" disabled=${busy} onClick=${() => doApply(preview.signature)}>Write these</button>
            <button class="cur-btn" onClick=${() => setPreview(null)}>Close</button>
          </div>
        </div>
      </div>` : null}
      ` : null}

      ${tab === 'applied' ? html`
      ${/* IN PLACE, BY EITHER ROUTE. Two ways a rule ends up here and the row
            says which: tokenjam wrote it (an apply ledger knows, exactly), or the
            user already had it (the model read their file and quoted back the
            words that cover it). The second is the one that was missing, and it
            is the reason a machine whose instruction files are full of these
            rules used to see a page of refusals instead of a page of checkmarks.

            Both keep their figure. What the recurrence cost before it was fixed
            is what it cost (Critical Rule 32) — being fixed now does not un-spend
            it, and for an already-present rule that still recurs the figure is
            the interesting part, since it says the wording is not working. */ ''}
      ${rules === null
          ? html`<div class="opt-line dim">Loading…</div>`
          : inPlaceRules.length === 0
            ? html`<div class="empty compact">No rules are in place yet. Nothing here has been written, and nothing matching was found in your instruction files.</div>`
            : inPlaceRules.map(r => html`
                <div key=${r.signature} class="opt-section inbox-row" style="display:block">
                  <div style="display:flex;align-items:center;gap:10px">
                    <b>${r.title || r.signature}</b>
                    <span class="dim" style="font-size:12px">${r.analyzer}</span>
                    <span style="margin-left:auto">
                      ${r.past_overspend_usd == null
                        ? html`<span class="dim">—</span>`
                        : html`<span>${fmtUsd(r.past_overspend_usd)}</span>`}
                    </span>
                  </div>
                  ${r.already_applied
                    ? html`<div class="opt-line" style="color:var(--success)">✓ Applied by tokenjam.</div>`
                    : html`<div class="opt-line" style="color:var(--success)">
                        ✓ Already in your instruction files${r.presence_path ? html` · <span class="mono" title=${r.presence_path}>${shortPath(r.presence_path)}</span>` : null}
                      </div>
                      ${/* The model's own evidence, shown rather than summarised:
                            this verdict is an inference, and a reader who did not
                            make it needs the file's words to check it against. */ ''}
                      ${r.presence_evidence ? html`<div class="opt-line dim">Found: ${r.presence_evidence}</div>` : null}`}
                  <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
                    <button class="cur-btn" onClick=${() => setOpen(open === r.signature ? null : r.signature)}>
                      ${open === r.signature ? 'Hide rule text' : 'Show rule text'}
                    </button>
                  </div>
                  ${open === r.signature ? html`<pre class="sz-copybox" style="margin-top:10px">${r.artifact_text}</pre>` : null}
                </div>`)}

      ${/* The file-level undo surface, kept beneath the rows. It answers a
            different question — which FILES tokenjam has written into and can
            still restore — so it is not merged with the rule rows above. */ ''}
      ${applied === null
          ? null
          : applied.length === 0
            ? null
            : html`<div class="rules-zone">Written by tokenjam · undo</div>
              ${applied.map(a => html`<div class="opt-section inbox-row opt-line" key=${a.source_path + a.signature}>
                <span class="mono" title=${a.source_path}>${shortPath(a.source_path)}</span>
                <span class="dim"> · ${a.applied_at}</span>
                ${a.undoable
                  ? html` <button class="cur-btn" disabled=${busy} onClick=${() => doUndo(a.signature, a.source_path)}>Undo</button>`
                  : html` <span class="dim">(${a.reason})</span>`}
              </div>`)}`}
      ` : null}
    </div>`;
}

function SummarizeView({ params }) {
  // Flow: curate (landing — candidates load immediately, no tool choice) →
  // run → review. Looking is free; the engine is only demanded inline, at
  // the Finish/Approve step, the moment a rewrite is actually requested.
  const [phase, setPhase] = useState('curate');
  const [engine, setEngine] = useState(null);          // 'api' | 'claude-p' | 'manual'; chosen at Approve time
  const [caps, setCaps] = useState(null);
  const [capErr, setCapErr] = useState(null);

  // Scan + staged data (read-only reads).
  const [scan, setScan] = useState(null);              // ScanResult.to_dict
  const [staged, setStaged] = useState([]);            // staged records (CheckVerdict + source_sha256)
  const [backups, setBackups] = useState([]);          // applied files that still have a gzip backup (undo surface)
  const [dataErr, setDataErr] = useState(null);
  // Starts true: the mount effect always kicks off a scan, so the very first
  // render must show the loading treatment, never an unearned "no candidates".
  const [loading, setLoading] = useState(true);
  const [recursive, setRecursive] = useState(false);
  const [repoScope, setRepoScope] = useState(false);
  const scanSeq = useRef(0);   // discards a slower earlier scan's response (out-of-order landing)
  const scanOpts = useRef({ recursive: false, repo: false });   // synchronous source of truth for the toggles (no stale closure)

  // Curator.
  const [checked, setChecked] = useState(() => new Set());
  const [added, setAdded] = useState(() => new Set());
  const [kind, setKind] = useState('all');
  const [scope, setScope] = useState('all');
  const [status, setStatus] = useState('all');
  const [query, setQuery] = useState('');
  const [modal, setModal] = useState(null);            // 'review' | 'approve'
  const [mQuery, setMQuery] = useState('');

  // Run.
  const [runList, setRunList] = useState([]);          // ordered basket snapshot
  const [runState, setRunState] = useState(null);      // api/claude-p batch progress
  const [tick, setTick] = useState(0);                 // 1s ticker so the in-flight run row shows live elapsed
  const [manIdx, setManIdx] = useState(0);             // manual per-file stepper
  const [manPrep, setManPrep] = useState(null);
  const [manSummary, setManSummary] = useState('');
  const [manBusy, setManBusy] = useState(false);
  const [manErr, setManErr] = useState(null);

  // Review.
  const [revChecked, setRevChecked] = useState(() => new Set());
  const [revModal, setRevModal] = useState(null);      // staged path whose diff is open
  const [rvState, setRvState] = useState('all');
  const [rvKind, setRvKind] = useState('all');
  const [rvScope, setRvScope] = useState('all');
  const [rvQuery, setRvQuery] = useState('');
  const [fileStates, setFileStates] = useState({});    // path -> 'applied' | 'rejected' (client overlay)
  const [applyMsg, setApplyMsg] = useState(null);
  const [busy, setBusy] = useState(false);

  // The scan omits already-summarized files by design; a file that's been run
  // but not yet applied is still a candidate AND has a staged record → 'staged'.
  const cands = scan ? scan.candidates : [];
  const stagedPaths = new Set(staged.map(s => s.path));
  const candByPath = {};
  cands.forEach(c => { candByPath[c.path] = c; });
  const statusOf = c => stagedPaths.has(c.path) ? 'staged' : 'candidate';

  // ---- loaders (all core in-process) ----
  const loadCaps = async () => {
    try { setCaps(await api('/summarize/capabilities')); }
    catch (e) { setCapErr(e.message || String(e)); }
  };
  const loadScan = async (opts) => {
    // Merge the toggle into a ref SYNCHRONOUSLY: a second toggle handled before the
    // re-render must not rebuild the other value from a stale closure (the seq guard
    // would otherwise make that stale-but-later request authoritative).
    if (opts) scanOpts.current = { ...scanOpts.current, ...opts };
    const { recursive: rec, repo: rp } = scanOpts.current;
    const seq = ++scanSeq.current;
    setLoading(true); setDataErr(null);
    try {
