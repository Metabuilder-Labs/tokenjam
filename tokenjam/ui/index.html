            <button class="cur-btn" disabled=${wbusy || !target.trim()} onClick=${() => applyWorkspace(false)}>${wbusy ? 'working…' : 'Preview note'}</button>
            <button class="cur-btn primary" disabled=${wbusy || !target.trim()} onClick=${() => applyWorkspace(true)}>Apply note →</button>
            <span class="sz-link" style="color:var(--text)" onClick=${() => onDismiss(prop.signature)}>Dismiss</span>
          </div>
          ${preview ? html`<pre class="rev-diff" style="margin:8px 0 0;white-space:pre-wrap;font-size:11.5px">${preview}</pre>` : null}
          ${werr ? html`<div style="color:var(--error);font-size:12px;margin-top:6px">${werr}</div>` : null}
        </div>
      `) : prop.analyzer === 'summarize' ? html`
        ${/* summarize's real fix lives in its own curate -> diff -> apply
              lifecycle, which already tracks what's staged/applied — "Mark
              applied" here would be a second, disconnected ledger for the
              same state. The card's one affordance is the link to that
              surface, worded as a review action, never a claimable "Apply". */ ''}
        <div style="display:flex;gap:12px;align-items:center;justify-content:flex-end;margin-top:12px">
          <a class="cur-btn primary" style="text-decoration:none" href=${(prop.target_key && prop.target_key.href) || '#/optimize/summarize'}>Review in Summarize →</a>
          <span class="sz-link" style="color:var(--text)" onClick=${() => onDismiss(prop.signature)}>Dismiss</span>
        </div>
      ` : hasSnippet ? html`
        ${/* The snippet block above IS this card's fix; "Mark applied" is the
              follow-up that records having done it, not the fix itself. */ ''}
        <div style="display:flex;gap:12px;align-items:center;justify-content:flex-end;margin-top:12px">
          <button class="cur-btn primary" disabled=${busy} onClick=${() => onMark(prop)}>${busy ? 'Marking…' : 'Mark applied'}</button>
          ${/* Dismiss is the secondary, discarding action: plain text, so the
                blue belongs to the one action the card is asking for. */ ''}
          <span class="sz-link" style="color:var(--text)" onClick=${() => onDismiss(prop.signature)}>Dismiss</span>
        </div>
      ` : html`
        ${/* No apply path, no snippet, and not summarize's own review flow. This
              branch used to fall through to "Mark applied", which asked the
              reader to confirm having applied a fix the card never showed them.
              Point at the one surface that has more: the analyzer's own detail
              card.

              No invented "there is no fix" sentence here. The refusal, where
              there is one, is already stated above in the server's own words
              (`blockedReason`), and a generic restatement underneath it would
              say less while sounding like more. The generic line survives only
              for a row that carries no reason at all, where silence would leave
              a blank action area reading as a bug. */ ''}
        <div style="margin-top:12px">
          ${!blockedReason && !description ? html`<div class="sz-note" style="font-size:12px">There is no ready-made change to apply here yet. What this cost is measured; the fix is not something tokenjam can hand over.</div>` : null}
          <div style="display:flex;gap:12px;align-items:center;justify-content:flex-end">
            <a class="sz-link" href=${optimizeFindingHref(prop.analyzer)}>See the full analysis →</a>
            <span class="sz-link" style="color:var(--text)" onClick=${() => onDismiss(prop.signature)}>Dismiss</span>
          </div>
        </div>
      `}
    </div>`;
}

// The headline band + the FIXES APPLIED tile.
//
// The headline used to be an estimated-recoverable-per-month tile summed in JS
// across both open tabs. It is now the server's own past-overspend block
// (`PastOverspendTile`), for two reasons that are not stylistic:
//   * TENSE. What the product leads with is now what the flagged behaviours
//     ALREADY cost, not what a fix might return. The past figure is checkable
//     against a bill the user has already paid; the forward one asks them to
//     trust a projection of a month that hasn't happened.
//   * SOURCE. It is read from `GET /relearn/cost-proposals`'s `past_overspend`
//     block rather than reduced over the rendered cards, so it is the same
//     number the Dashboard hero shows, by construction. A locally-dismissed
//     card changes one person's view; it does not change what was spent.
// The applied tile below still reports each fix's own estimate at apply time
// — a different claim about a different set (see requirement #7 note below),
// deliberately left on its own basis rather than folded into the headline.
//
// Tile 2 (requirement #7, REVISED — supersedes an earlier "verified saved"
// draft of this tile). This repo deliberately removed its post-hoc verify/
// receipts measurement layer in commit c0316aba ("refactor: remove unbounded
// verify/receipts layer") because it made unsupportable realized-savings
// claims (perpetual ledger, ever-growing window, live re-pricing, no
// confounder control). Do NOT reintroduce any after-the-fact measurement
// here, and never render a "verified" claim or chip — this tile sums each
// applied fix's ORIGINAL estimate (the same `est.` figure AppliedItemRow
// shows per row), never a live re-measurement of what happened afterward. A
// bounded verify redesign is a separate, later product decision — see
// c0316aba before building one.
// `excluded` (from GET /relearn/cost-proposals's past_overspend.excluded) is
// waste this page's own totals deliberately do NOT sum in — currently only
// `summarize`, which keeps its own curate/diff review surface rather than a
// peer card here (see COST_ANALYZERS's docstring server-side). Left unstated
// it reads as "the biggest figure the product computes doesn't exist"; this
// renders it as an explicit line with a link to where it lives, never folded
// into the headline band's own number (a different review flow, not a peer
// figure to add).
//
// Reads the WINDOW figure (`past_overspend_usd`), not the projected
// monthly one: it sits under a past-tense headline, and mixing a "/mo"
// projection into that band would put two time bases side by side under one
// tense. `summarize`'s window figure is itself an observed window overspend
// (its per-call reduction priced over the calls that were actually made), so
// the past tense is honest for it.
function ExcludedWasteNote({ excluded }) {
  const entries = Object.values(excluded || {}).filter(e => e && e.past_overspend_usd != null);
  if (entries.length === 0) return null;
  return html`
    <div class="dim" style="font-size:12px;margin-top:6px">
      ${entries.map(e => html`
        A further ${fmtUsd(e.past_overspend_usd)} went on ${e.label || 'Summarize'} over the same window (its own review surface, not summed above) ·
        <a class="sz-link" href=${e.href || '#/optimize/summarize'}>Review it →</a>
      `)}
    </div>`;
}

// `appliedKnown` is deliberately a SEPARATE parameter from `loading`, not derived
// from it. The two tiles are fed by different reads with wildly different
// latencies — the avoided figure is a cheap lookup of a stored block, while
// `/relearn/applied` is the slowest of the four inbox reads (measured at 72.8s on
// this corpus) — so one band-level flag cannot describe both. It did not: the band
// stopped being a skeleton as soon as the cost read landed, and the applied tile
// then printed "0" and "most recent unknown" for the next minute, which is a
// settled claim of absence made before its own data existed. Absence is the most
// dangerous thing to guess wrong, because it reads as reassurance.
// The applied estimate, demoted to the count tile's tooltip. It was the tile's
// hero figure; the count replaced it there (see the note at the render site), and
// this keeps the number reachable instead of deleting it. Returns '' when nothing
// applied carries an estimate — never a fabricated "$0"/"0 tok" standing in for
// "no data", which is the whole reason this is a hint and not a headline.
// `suppressed` is load-bearing, not cosmetic: under local framing there is no
// marginal cost to price, so a dollar figure must not appear even in a tooltip.
// The old hero-figure derivation honoured it and this has to as well.
function appliedEstimateHint(appliedEstimates, suppressed) {
  const estimates = appliedEstimates || [];
  const priceable = estimates.filter(i => i.usd != null);
  const usd = priceable.reduce((s, i) => s + i.usd, 0);
  const toks = estimates.reduce((s, i) => s + (i.tokens || 0), 0);
  const figure = !suppressed && priceable.length > 0 && priceable.length * 2 >= estimates.length
    ? fmtUsd(usd)
    : toks > 0 ? '~' + fmtTokens(toks) + ' tok' : null;
  if (!figure) return '';
  return figure + ' estimated across these fixes — each one\'s own estimate at the '
    + 'moment it was applied, never re-measured afterward';
}

function InboxStatTiles({ openItems, appliedEstimates, appliedCount, appliedKnown, lastAppliedAt, suppressed, excluded, pastOverspend, loading }) {
  const hasExcluded = Object.keys(excluded || {}).length > 0;
  // Whether the server's block actually has something to state. Checked here
  // rather than inside the band so the excluded-waste note has a home when it
  // doesn't (see below).
  const hasOpenOverspend = !!(pastOverspend
    && ((pastOverspend.proposal_count || 0) > 0 || pastOverspend.past_overspend_tokens));
  // While the page does not yet know its own numbers, the tiles hold their final
  // positions as placeholders. Returning null here (the old behaviour) made the
  // whole band appear only once data landed, so the tab bar and the list jumped
  // down the page at that moment. A placeholder cannot be mistaken for a figure,
  // whereas an absent tile plus a "0" count read as a clean inbox.
  if ((loading || !appliedKnown) && openItems.length === 0 && appliedCount === 0 && !hasExcluded) {
    return html`
      <div style="margin:10px 0 18px;display:flex;gap:14px;flex-wrap:wrap" aria-hidden="true">
        ${[0, 1].map(i => html`
          <div key=${i} class="opt-section opt-tile">
            <div class="shimmer" style="height:11px;width:44%"></div>
            <div class="shimmer" style="height:24px;width:38%;margin-top:6px"></div>
            <div class="shimmer" style="height:12px;width:66%;margin-top:6px"></div>
          </div>`)}
      </div>`;
  }
  if (openItems.length === 0 && appliedKnown && appliedCount === 0 && !hasExcluded) return null;
  return html`
    <div style="margin:10px 0 18px">
    ${/* Both figures now sit in ONE tile row: what was avoidable (past tense,
          observed, server-computed) beside what has been applied. The old
          full-width band above this row was removed — see
          `PastOverspendTile`. The two tiles remain different claims about
          different sets, so neither caption restates the other and nothing
          invites adding them together. */ ''}
    <div style="display:flex;gap:14px;flex-wrap:wrap">
      ${hasOpenOverspend ? html`<${PastOverspendTile} block=${pastOverspend} />` : null}
      <div class="opt-section opt-tile">
        <div class="dim" style="font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--success)">Fixes</div>
        ${/* The green belongs to the label, not the figure: the number reads as
              a plain fact, matching the blue tile where the figure is also
              body-coloured rather than tinted. */ ''}
        ${/* Skeleton, never a zero. Same geometry as the real figure so the tile
              does not resize when the read lands. */ ''}
        ${/* THE COUNT IS THE FIGURE. It used to be a token/dollar estimate
              (`appliedBig`), which put an estimated quantity in the hero slot of a
              tile whose subject is "how many fixes are in place" — two different
              claims, and the estimate is the weaker one (each figure is a
              point-in-time snapshot taken at apply and never re-measured). The
              count is a fact the ledger knows exactly. Founder call.

              Still gated: a skeleton, never a zero. `appliedCount` excludes
              reverted records, which is what lets the caption below say
              "successfully" without overclaiming. */ ''}
        ${appliedKnown
          ? html`<div style="font-size:24px;font-weight:600;margin-top:4px" title=${appliedEstimateHint(appliedEstimates, suppressed)}>${appliedCount}</div>`
          : html`<div class="shimmer" style="height:24px;width:38%;margin-top:6px"></div>`}
        ${/* The sub-line never restates the number above it. When the big
              figure is an estimate, the line dates it to apply time (the same
              honesty the old "not re-measured" carried, without leading with a
              negation). When the big figure is only the count fallback there is
              no claim to qualify, so the line spends itself on recency instead
              of apologising for a missing estimate. */ ''}
        ${/* "most recent unknown" is a settled value too, and it was rendering
              before the read that would have supplied the date. Held back with
              the figure. */ ''}
        ${/* Lowercase on purpose (founder call) — the uppercase label above it is
              the tile's name, this is its sentence. It states what the number
              MEANS rather than restating the number, and it carries the recency
              the old estimate caption did. */ ''}
        ${appliedKnown
          ? html`<div class="dim" style="font-size:12px;margin-top:2px">successfully applied${
              daysAgoLabel(lastAppliedAt) ? ' · most recent ' + daysAgoLabel(lastAppliedAt) : ''}</div>`
          : html`<div class="shimmer" style="height:12px;width:66%;margin-top:6px"></div>`}
      </div>
    </div>
    ${/* Below the row, not inside a tile: this names waste the page's own
          totals deliberately do NOT sum in (currently `summarize`, which keeps
          its own review surface). It used to hang off the removed band's
          `note` slot and would have disappeared with it — the one thing that
          must survive the band's removal, since leaving it unstated reads as
          "the biggest figure the product computes doesn't exist". */ ''}
    <${ExcludedWasteNote} excluded=${excluded} />
    </div>`;
}

function ReviewInboxView({ params }) {
  // Deep-link from an Optimize detail card's "review it" link
  // (reviewProposalHref): lands on the open list and highlights the matching
  // card(s). It used to land on a separate Cost-advisories tab, which no longer
  // exists; the destination is now the one open list, so the hop needs no tab
  // vocabulary of its own and cannot rot the next time the tabs change.
  const analyzerFocus = readParam(params, 'analyzer', '');
  // TWO tabs. The open list is no longer split by which analyzer produced a
  // row (see `inboxMechanism`): one list ranked by money, with the mechanism on
  // the row. 'Applied' stays its own tab because it answers a different
  // question, about work already done.
  const [tab, setTab] = useState('open');   // 'open' | 'applied'
  const [d, setD] = useState({ loading: true, error: null, status: 'never_run', computedAt: null, clusters: [] });
  // Fetched but no longer used to decide dollar-vs-tokens on this page — the
  // always-dollars carve-out (see `suppressed` below) means this page ignores
  // dollarsSuppressed() entirely. Kept in case a future qualifier note wants
  // the raw framing block.
  const [relearnFraming, setRelearnFraming] = useState(null);
  // Full-corpus dominant persona (`/relearn/proposals`'s own `persona` key,
  // mirroring `opt.persona` on the Optimize payload — see runner.py). Used
  // ONLY to disclose why the mistakes tab is empty for an SDK-dominant
  // window; never to change routing.
  const [reviewPersona, setReviewPersona] = useState('unknown');
  const [dismissed, setDismissed] = useState(() => loadDismissedRelearns());
  const [checked, setChecked] = useState(() => new Set());
  const [modalSig, setModalSig] = useState(null);
  const [reviewQueue, setReviewQueue] = useState([]);
  const [reviewTotal, setReviewTotal] = useState(0);
  const [applied, setApplied] = useState([]);
  const [appliedSigs, setAppliedSigs] = useState(() => new Set());   // hide from pending immediately
  const [costProps, setCostProps] = useState([]);          // advise-only cost proposals
  const [costStatus, setCostStatus] = useState('never_run');
  const [costDegraded, setCostDegraded] = useState(false); // a recompute failed even though a good result still renders
  const [costLastError, setCostLastError] = useState(null);
  const [costFraming, setCostFraming] = useState(null);    // plan-tier framing for the cost-advisory dollars
  const [costExcluded, setCostExcluded] = useState({});    // #326: waste NOT summed into the headline (e.g. summarize)
  // The server's past-overspend block, rendered verbatim as this page's
  // headline and by the Dashboard hero. Never re-derived from the cards.
  const [costPastOverspend, setCostPastOverspend] = useState(null);
  const [costApplied, setCostApplied] = useState([]);      // marked-applied cost proposals
  // Has each fetch ANSWERED once? Distinct from `status`, which is the server's
  // scan state and arrives WITH data. `costStatus` cannot stand in for this: it
  // initialises to 'never_run', which is indistinguishable from a real never_run,
  // so a fresh page load looked like a fresh install.
  const [costLoaded, setCostLoaded] = useState(false);
  const [appliedLoaded, setAppliedLoaded] = useState(false);
  // `/relearn/cost-applied` is the SECOND half of the applied count and had no
  // flag of its own, so a count could be published over the relearn ledger alone.
  const [costAppliedLoaded, setCostAppliedLoaded] = useState(false);
  const [marking, setMarking] = useState(null);            // signature currently being marked applied

  const load = useCallback(async () => {
    try {
      const r = await api('/relearn/proposals');
      const f = r.finding || {};
      setD({
        loading: false, error: null, status: r.status, computedAt: r.computed_at,
        // Cycle-wide in-flight + build provenance, carried through to the
        // header's ScanBar. `status` above is this store's own leg of the pass.
        cycleComputing: r.cycle_computing === true,
        computedBuild: r.computed_build || null,
        build: r.build || null,
        clusters: f.clusters || [], sessionsScanned: f.sessions_scanned,
        failuresExamined: f.failures_examined,
        // Kept on the finding state even though the per-row span caption was
        // removed: `sessionsScanned` feeds the loading note, and these two are the
        // scan's own description of its corpus, which the header still reports.
        windowDays: f.window_days,
        corpusBasis: f.corpus_basis,
      });
      setRelearnFraming(r.framing || null);
      setReviewPersona(r.persona || 'unknown');
    } catch (e) {
      setD(s => ({ ...s, loading: false, error: e.message || String(e) }));
    }
  }, []);

  const loadApplied = useCallback(async () => {
    try {
      const r = await api('/relearn/applied');
      setApplied(r.applied || []);
    } catch (e) { /* the pending list is the load-bearing view; degrade quietly */ }
    finally { setAppliedLoaded(true); }
  }, []);

  const loadCost = useCallback(async () => {
    try {
      const r = await api('/relearn/cost-proposals');
      setCostProps(r.proposals || []);
      setCostStatus(r.status || 'never_run');
      setCostDegraded(!!r.degraded);
      setCostLastError(r.last_error || null);
      setCostFraming(r.framing || null);
      setCostExcluded((r.past_overspend && r.past_overspend.excluded) || {});
      setCostPastOverspend(r.past_overspend || null);
    } catch (e) { /* the relearn list is load-bearing; degrade quietly */ }
    finally { setCostLoaded(true); }
    try {
      const r = await api('/relearn/cost-applied');
      setCostApplied(r.applied || []);
    } catch (e) { /* degrade quietly */ }
    finally { setCostAppliedLoaded(true); }
  }, []);

  useEffect(() => {
    load(); loadApplied(); loadCost();
    // Light poll while a background pass may be computing (or right after a
    // manual refresh) so the empty/computing state resolves without a reload.
    const timer = setInterval(() => {
      if (document.visibilityState === 'visible') { load(); loadCost(); }
    }, 8000);
    return () => clearInterval(timer);
  }, [load, loadApplied, loadCost]);

  // Land on the open list and scroll the matching card(s) into view once
  // they've loaded (deep-link from an Optimize detail card). Highlighting every
  // match for this analyzer is handled per-card below (rev-focus).
  useEffect(() => {
    if (!analyzerFocus) return;
    setTab('open');
    const el = document.querySelector(`[data-analyzer="${CSS.escape(analyzerFocus)}"]`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, [analyzerFocus, costProps]);

  // ONE rescan press, every analyzer store — the same endpoint the Dashboard's
  // and Optimize's Rescan press. This used to POST relearn's and the
  // cost-advisory's own refresh endpoints (two of the three stores), while
  // `/optimize/rescan` refreshed the report (the third). So "Rescan" meant a
  // different thing on each screen, and the figures those stores feed could
  // age apart with nothing disclosing it. The server side now fans one request
  // out to all three (`core/optimize/scan_cycle.py`).
  //
  // A refused POST is still not swallowed — the shared ScanBar control needs an
  // honest error to show (Critical Rule: a rescan that failed must not look
  // like one that succeeded).
  //
  // Through `useRescan` like the other two surfaces, rather than a second
  // hand-rolled copy of the same busy/error/timing behaviour. It already POSTs
  // the same endpoint they do; keeping a private copy meant the declined-rescan
  // and in-flight handling had to be fixed here a second time, and two copies
  // of one derivation are free to disagree the moment only one is touched.
  const reloadInbox = useCallback(() => { load(); loadCost(); }, [load, loadCost]);
  const {
    busy: refreshing, error: refreshError, declined: refreshDeclined,
    declinedDetail: refreshDeclinedDetail, rescan: doRefresh,
  } = useRescan(reloadInbox);

  // A scan-state shape ScanBar can render, built from the inbox's own two
  // reads rather than from `/optimize` — same control, different store. The
  // relearn cache's own computed_at is the header's provenance (it already
  // was, before this reused the shared component); `degraded`/`lastError`
  // come from the cost-advisory half, since that is the one that already
  // tracked a failed-but-not-fatal recompute.
  const inboxScan = {
    fetchFailed: false,
    computedAt: d.computedAt,
    windowDays: null,
    // Both stores' own flags OR the cycle's. The two `status` fields drop as
    // each store's leg of the pass lands, and the report's leg — which neither
    // of them covers — runs first, so on its own this went quiet while the rows
    // below were still the previous pass's. `cycleComputing` is the pass.
    computing: d.status === 'computing' || costStatus === 'computing' || d.cycleComputing === true,
    // The relearn cache's build, since its `computed_at` is this header's
    // provenance. Same three cases ScanBar's `buildQualifier` resolves.
    computedBuild: d.computedBuild,
    build: d.build,
    degraded: costDegraded,
    lastError: costLastError,
    status: (d.status === 'never_run' && costStatus === 'never_run')
      ? 'never_run'
      : (d.status === 'error' || costStatus === 'error' ? 'error' : 'ready'),
  };

  const markCostApplied = useCallback(async (prop) => {
    setMarking(prop.signature);
    try {
      // Only the ID: the server resolves the proposal's content (and its
      // estimate) from its own store, so the ledger records what was detected.
      await apiPostOrDetail('/relearn/cost-proposals/apply', { proposal_id: prop.proposal_id });
      await loadCost();
    } catch (e) { /* surfaced on next refresh; keep the card in place */ }
    finally { setMarking(null); }
  }, [loadCost]);

  // `appliedSigs` is session-local (it hides a row the instant you approve it,
  // before the ledger refetches) and starts EMPTY on every page load, so on its
  // own it let already-applied clusters return as open proposals after a
  // reload. Approving one then tried to rewrite the hook its own earlier
  // approval created, and only relearn_apply's file-ownership guard stopped the
  // double write. Seed from the server ledger too, exactly as the cost side
  // does with costAppliedSigs. A reverted fix is deliberately NOT filtered: it
  // is open again by definition.
  const appliedSigsAll = new Set([
    ...appliedSigs,
    ...(applied || []).filter(r => r.state !== 'reverted').map(r => r.signature),
  ]);
  const visible = (d.clusters || []).filter(c => !dismissed.has(c.signature) && !appliedSigsAll.has(c.signature));

  const toggle = sig => setChecked(s => { const n = new Set(s); n.has(sig) ? n.delete(sig) : n.add(sig); return n; });
  const dismissMany = (sigs) => {
    const next = new Set([...dismissed, ...sigs]);
    setDismissed(next); saveDismissedRelearns(next);
    setChecked(s => { const n = new Set(s); sigs.forEach(sig => n.delete(sig)); return n; });
  };
  // Bulk-mark-applied for a collapsed tail (requirement 3) only ever covers
  // the plain "mark applied" cards: a proposal tj can apply keeps its own
  // target-path confirmation (requirement 9), so bulk never skips it, and a
  // relearn cluster is excluded outright because the cost-apply marker endpoint
  // cannot record one. Filtered here rather than at the call site so a future
  // caller cannot hand this a mixed list and quietly POST the wrong ledger.
  const markManyApplied = async (props) => {
    for (const p of props.filter(x => x.kind !== 'relearn' && !x.apply_capable)) {
      try { await apiPostOrDetail('/relearn/cost-proposals/apply', { proposal_id: p.proposal_id }); }
      catch (e) { /* keep going; surfaced on next refresh */ }
    }
    await loadCost();
  };
  const modalCluster = modalSig ? (d.clusters || []).find(c => c.signature === modalSig) : null;
  // Review queue: the signatures still to visit AFTER the open one. Opening a
  // single row leaves it empty, so the modal shows no queue chrome.
  const startReview = (sigs) => {
    if (!sigs.length) return;
    setModalSig(sigs[0]);
    setReviewQueue(sigs.slice(1));
    setReviewTotal(sigs.length);
  };
  const nextInReview = () => {
    const [next, ...rest] = reviewQueue;
    setModalSig(next || null);
    setReviewQueue(rest);
  };
  const endReview = () => { setModalSig(null); setReviewQueue([]); };
  const queuePos = reviewTotal > 1 && modalSig
    ? { index: reviewTotal - reviewQueue.length, total: reviewTotal }
    : null;
  const costAppliedSigs = new Set((costApplied || []).filter(r => r.state !== 'reverted').map(r => r.signature));
  // The `relearn` cost proposal is a ROLLUP participant, not a card. relearn
  // reaches the aggregate surfaces through it (past_overspend_rollup and the
  // Dashboard hero were structurally blind to the whole self-improve loop
  // before it existed — see cost_proposals._relearn_to_proposals), but this
  // page already renders every relearn CLUSTER individually, with a richer
  // treatment than a cost card can give. Showing the aggregate card too would
  // put the same money on the page twice and re-fill the inbox this page was
  // just downsized to keep clear.
  const visibleCost = (costProps || []).filter(p =>
    p.analyzer !== 'relearn' && !dismissed.has(p.signature) && !costAppliedSigs.has(p.signature));

  const onApplied = (record) => {
    setAppliedSigs(s => new Set([...s, record.signature]));
    loadApplied();
  };

  // One local dismiss for both ledgers: the dismissed-signature set was always
  // shared (a cost card and a relearn cluster have distinct signatures), and on
  // one list the two halves must not diverge in what "Dismiss" means.
  const dismissOne = (sig) => {
    const next = new Set([...dismissed, sig]);
    setDismissed(next); saveDismissedRelearns(next);
  };

  // Founder-approved carve-out, scoped to THIS page only: the Review inbox's
  // dollar figures are a savings/waste comparison ("what would this cost me
  // to keep paying for"), not a billed-amount claim, so it shows them
  // unconditionally rather than falling back to tokens the way every OTHER
  // dollar figure in the app does for a LOCAL account (no marginal cost to
  // price at all -- requirement #9, core/framing.py's dollarsSuppressed() —
  // left completely untouched and still governs Overview/Optimize/etc).
  // Genuinely unpriced items (no computable rate at all, or the resend/TRIM
  // not-a-savings-claim exclusion above) still fall back to tokens on their
  // own terms; this constant only removes the EXTRA plan-tier gate on top of
  // that, it never invents a dollar figure where none exists.
  const suppressed = false;

  // --- ONE open list -------------------------------------------------------
  //
  // The two ledgers are merged here and then treated identically. Rows are
  // stamped with the `kind` discriminator the Applied tab already uses, because
  // the two carry different field names and different spans; nothing else about
  // the render branches on which ledger a row came from, and the ORDER never
  // does.
  const openItems = [
    ...visible.map(c => ({ ...c, kind: 'relearn' })),
    ...visibleCost,                                   // already carry kind: 'cost'
  ];

  // --- What the page KNOWS, versus what the server is DOING -----------------
  //
  // Two different questions that used to be conflated, which is what made the
  // loading state lie. `firstLoad` is "has this page had an answer yet"; `scanning`
  // is "is a recompute in flight", and a recompute arrives WITH the cached result,
  // so it must never blank anything.
  const firstLoad = d.loading || !costLoaded;
  const scanning = d.status === 'computing' || costStatus === 'computing';
  // A count is printed only once BOTH ledgers have answered. A partial count is
  // as wrong as a zero: it would be replaced a moment later, which is the layout
  // jump this rule exists to prevent.
  const openCountKnown = !firstLoad;
  // BOTH applied reads, because `combinedApplied` merges both ledgers. Gated on
  // the reads themselves rather than on `firstLoad`: `/relearn/applied` is by far
  // the slowest of the four, so a page-wide flag clears long before it answers.
  const appliedCountKnown = appliedLoaded && costAppliedLoaded;
  // Nothing cached AND nothing to show yet: the only state that earns skeletons.
  // With cached rows in hand the list renders, whatever the scan is doing.
  const showSkeleton = openItems.length === 0 && (firstLoad || (scanning && d.status !== 'never_run'));

  // The sub-$5 noise floor (see INBOX_MIN_USD), now once over the whole list
  // instead of once per tab. A deep-linked card is exempt so an Optimize page's
  // "review it →" always resolves to something, even when that card is small;
  // exempting only the FOCUSED analyzer, rather than switching the floor off
  // wholesale while a focus is set, keeps the rest of the list filtered.
  const isFocused = i => !!analyzerFocus && i.analyzer === analyzerFocus;
  const floorItems = openItems.filter(i => belowInboxFloor(i) && !isFocused(i));
  const shownItems = openItems.filter(i => !belowInboxFloor(i) || isFocused(i));

  // Observed figures rank; everything else is structurally unable to (see
  // `partitionByObservedOverspend`). The split happens BEFORE the sort, so an
  // unranked row cannot land between two ranked ones under any comparator.
  const { ranked, unobserved } = partitionByObservedOverspend(shownItems);
  const sortedOpen = sortByPastOverspend(ranked);
  // Deep-linking to a specific analyzer skips the collapse: a highlighted card
  // must never be hidden inside a folded tail.
  const { top: topOpen, tail: tailOpen } = analyzerFocus
    ? { top: sortedOpen, tail: [] } : splitTopAndTail(sortedOpen);

  // Bulk scope: exactly the rows tj can apply AND the review queue can actually
  // drive, which is the write-capable relearn clusters. Two reasons it is not
  // simply "every write-capable row": the queue opens `RelearnApplyModal`, which
  // resolves a cluster out of `d.clusters`, and a write-capable COST card needs
  // its own per-card target confirmation that no bulk action may skip. So the
  // checkbox appears on precisely the rows a bulk action can reach, and when
  // that set is empty (the SDK persona offers no relearn write at all) the
  // select-all and the bulk bar are not rendered rather than sitting there
  // governing nothing.
  const bulkRelearn = shownItems.filter(
    i => i.kind === 'relearn' && inboxCanApply(i));
  const selectedVisible = bulkRelearn.filter(c => checked.has(c.signature));
  const selectedCount = selectedVisible.length;
  // Clicking a fully-selected box clears it; anything else selects the lot.
  const toggleAll = () => setChecked(
    prev => nextSelectAllSelection(bulkRelearn.map(c => c.signature), prev));
  // How many open rows tokenjam can write for you vs. the copy-and-apply rest
  // (issue #656). Two rows are visually distinct classes: an auto-apply row
  // carries a checkbox + Approve; every other row is a copyable fix you apply
  // yourself. The count line makes that split legible ("1 of 6 can be applied
  // automatically") instead of implying the whole list is selectable, and the
  // bulk Select-all only earns its place when there is more than one to select.
  const autoApplyCount = bulkRelearn.length;
  const openTotal = shownItems.length;
  const showBulkSelect = autoApplyCount > 1;
  const dismissChecked = () => {
    // Only the selected rows that are actually listed: a stale signature left in
    // `checked` after its row was approved must not be swept along silently.
    const next = new Set([...dismissed, ...bulkRelearn.filter(c => checked.has(c.signature)).map(c => c.signature)]);
    setDismissed(next); saveDismissedRelearns(next);
    setChecked(new Set());
  };

  // One renderer for the list, dispatching on `kind` in exactly one place so
  // the top rows, the collapsed tail and the unobserved group cannot drift into
  // three slightly different row treatments.
  const renderRow = (i) => (i.kind === 'relearn'
    ? html`<${RecurringMistakeRow} key=${'r:' + i.signature} cluster=${i}
        checked=${checked.has(i.signature)} onToggle=${() => toggle(i.signature)}
        onExpand=${() => startReview([i.signature])}
        onDismiss=${() => dismissOne(i.signature)} suppressed=${suppressed} />`
    : html`<${CostProposalCard} key=${'c:' + i.signature} prop=${i}
        busy=${marking === i.signature} focused=${i.analyzer === analyzerFocus}
        onMark=${markCostApplied} onDismiss=${dismissOne}
        onChanged=${() => { loadCost(); loadApplied(); }} suppressed=${suppressed} />`);

  const combinedApplied = [
    ...(applied || []).map(r => ({ ...r, kind: 'relearn' })),
    ...(costApplied || []).map(r => ({ ...r, kind: 'cost' })),
  ].sort((a, b) => (b.applied_at || '').localeCompare(a.applied_at || ''));
  const appliedOpenCount = combinedApplied.filter(r => r.state !== 'reverted').length;
  // Each non-reverted applied item's own estimate (requirement #7's honest
  // "Fixes applied" tile — never a live re-measurement).
  const appliedOpen = combinedApplied.filter(r => r.state !== 'reverted');
  const appliedEstimates = appliedOpen.map(appliedEstimate);
  // combinedApplied is sorted newest-first, so the head is the most recent.
  const lastAppliedAt = appliedOpen.length ? appliedOpen[0].applied_at : null;

  return html`
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap">
      <div class="page-title" style="margin-bottom:0">Inbox</div>
      ${/* Scan provenance belongs beside the control that re-runs it, not in a
            per-tab header: it describes the whole inbox, and the shared
            rescan control (ScanBar, also on the Dashboard and Optimize
            screens) is already the one place that reports scan state. */ ''}
      <span style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
        ${d.sessionsScanned != null ? html`<span class="scan-provenance">${d.sessionsScanned} sessions scanned</span>` : null}
        <${PersonaPicker} />
      <${ScanBar} scan=${inboxScan} busy=${refreshing} error=${refreshError} declined=${refreshDeclined} declinedDetail=${refreshDeclinedDetail} onRescan=${doRefresh} />
      </span>
    </div>
    <div class="sz-note">Waste you're paying for more than once: mistakes your agents keep repeating, and cost fixes ready to apply.</div>

    <${InboxStatTiles} openItems=${openItems} appliedEstimates=${appliedEstimates} appliedCount=${appliedOpenCount} appliedKnown=${appliedCountKnown} lastAppliedAt=${lastAppliedAt} suppressed=${suppressed} excluded=${costExcluded} pastOverspend=${costPastOverspend} loading=${firstLoad} />

    ${/* TWO tabs. The open list is one list; "Applied" answers a different
          question and keeps its own. */ ''}
    <div class="tab-bar" role="tablist">
      ${/* A count the page does not know yet is not rendered as 0. A shimmer chip
            holds the digits' width so the label does not reflow when the real
            number arrives. */ ''}
      <button class="tab ${tab === 'open' ? 'active' : ''}" role="tab" aria-selected=${tab === 'open'} onClick=${() => setTab('open')}>Open ${openCountKnown ? html`(${shownItems.length})` : html`<span class="shimmer" style="display:inline-block;width:20px;height:9px;vertical-align:middle;border-radius:3px"></span>`}</button>
      <button class="tab ${tab === 'applied' ? 'active' : ''}" role="tab" aria-selected=${tab === 'applied'} onClick=${() => setTab('applied')}>Applied ${appliedCountKnown ? html`(${appliedOpenCount})` : html`<span class="shimmer" style="display:inline-block;width:20px;height:9px;vertical-align:middle;border-radius:3px"></span>`}</button>
    </div>

    ${tab === 'open' ? html`
      ${/* Kept to one line, and it now has to cover BOTH mechanisms rather than
            just the write, since the write is a minority of rows. Each row still
            names its own action; these are the two consequences a row cannot
            state for itself. */ ''}
      <div class="sz-note" style="margin:12px 0 10px"><b>Approve</b> writes the fix to a file or config, effective on the next run — not live enforcement; a copyable fix is yours to apply. <b>Dismiss</b> only hides a row in this browser.</div>
      ${/* The appliable-count line: it names how many of the open rows tokenjam
            can write for you vs. the copy-and-apply rest, so "Open (6)" next to
            a single checkbox stops reading as "5 rows you forgot to select"
            (issue #656). Rendered only once the count is known. */ ''}
      ${openCountKnown && openTotal > 0 ? html`
        <div class="dim" style="font-size:12px;margin:0 2px 10px">
          ${autoApplyCount === 0
            ? html`None of the ${openTotal} open ${openTotal === 1 ? 'row' : 'rows'} can be applied automatically — each is a copy-and-apply fix.`
            : autoApplyCount === openTotal
              ? html`<b>${autoApplyCount}</b> ${autoApplyCount === 1 ? 'row' : 'rows'} can be applied automatically.`
              : html`<b>${autoApplyCount} of ${openTotal}</b> can be applied automatically — the rest are copy-and-apply.`}
        </div>` : null}
      ${/* The degraded warning is the one thing the header's Rescan link cannot
            say: the last cost refresh FAILED and these rows are the last good
            result. */ ''}
      ${costDegraded ? html`
        <div class="dim" style="font-size:12px;margin-bottom:8px">
          <span style="color:var(--warn)" title=${costLastError || ''}>⚠ the last refresh failed; showing the last good result</span>
        </div>` : null}
      ${/* A relearn fetch failure is a BANNER, not a replacement, whenever the
            list has rows from the other ledger. It used to replace the whole
            tab, which was correct while that tab held relearn clusters and
            nothing else: the failure took out everything the tab could show. On
            one merged list the same gate would blank the cost cards too, so a
            failure in one half would hide the other half's data for no reason.
            The two fetches degrade independently, exactly as the cost half
            already did (`costDegraded`). */ ''}
      ${d.error && openItems.length > 0 ? html`
        <div class="dim" style="font-size:12px;margin-bottom:8px">
          <span style="color:var(--warn)" title=${d.error}>⚠ couldn't load recurring mistakes; the rows below are the cost proposals only</span>
        </div>` : null}
      ${/* Select-all and the bulk bar render ONLY when there is something they
            can act on (see `bulkRelearn`). On a persona with no relearn write on
            offer that set is empty, and an always-present select-all governing
            nothing is worse than no select-all: it implies the list is
            selectable when it is not. */ ''}
      ${showBulkSelect ? html`
        <label style="display:flex;align-items:center;gap:8px;margin:0 2px 6px;font-size:12.5px;cursor:pointer;width:fit-content">
          <${SelectAllCheckbox} total=${bulkRelearn.length} selected=${selectedCount} onToggle=${toggleAll} />
          <span class="dim">Select all ${bulkRelearn.length} tokenjam can apply${selectedCount ? ` · ${selectedCount} selected` : ''}</span>
        </label>` : null}
      <div>
        ${/* The empty states are reached only when the list is ACTUALLY empty, so
              a partial failure never hides rows that did load, and a recompute
              NEVER does: `status: "computing"` arrives together with the cached
              result, which is precisely what the old gate got wrong.

              Ordered most-specific first: a hard error, then the two states that
              legitimately have nothing yet (still fetching, or a genuinely first
              scan in flight) which get skeletons, then never-scanned, then a
              completed-but-empty result. */ ''}
        ${openItems.length === 0 ? (
          d.error && costStatus === 'error'
            ? html`<div class="empty compact err">Couldn't load the inbox: ${d.error}. <span class="sz-link" onClick=${doRefresh}>Try again</span>.</div>`
          : d.error
            ? html`<div class="empty compact err">Couldn't load proposals: ${d.error}</div>`
          : showSkeleton
            ? html`
                <${InboxLoadingNote} scanning=${!firstLoad && scanning} sessionsScanned=${d.sessionsScanned} />
                ${[0, 1, 2, 3].map(i => html`<${InboxSkeletonRow} key=${i} />`)}`
          : costStatus === 'error'
            ? html`<div class="empty compact err">The last scan failed${costLastError ? ': ' + costLastError : ''}. <span class="sz-link" onClick=${doRefresh}>Try again</span>.</div>`
          : d.status === 'never_run' && costStatus === 'never_run'
            ? html`<div class="empty compact">No scan has run yet. Click <span class="sz-link" onClick=${doRefresh}>Rescan now</span> to kick one off.</div>`
            : html`<div class="empty compact">Nothing open. The last scan found nothing worth a row (or you've dismissed or applied everything).</div>`
        ) : null}
        ${topOpen.map(renderRow)}
        ${/* The tail's own line is stated in the same tense as the rows it
              hides. It adds up the payload figures of the items in THIS
              collapse group (a subset only the client knows about, since the
              split point is a rendering decision); it never re-derives a
              figure, and the page's headline still comes from the server. */ ''}
        <${CollapsedTailRow} tail=${tailOpen} suppressed=${suppressed}
          summary=${combinedObservedCost(tailOpen)}
          onDismissAll=${() => dismissMany(tailOpen.map(i => i.signature))}
          onMarkAllApplied=${tailOpen.some(i => i.kind !== 'relearn' && !i.apply_capable) ? () => markManyApplied(tailOpen) : null}
          renderItem=${renderRow} />
        ${/* Below the fold, and structurally unable to interleave with the
              ranked list above: a row with no OBSERVED figure has nothing to be
              ranked by, and letting it sort to position zero on a `|| 0`
              fallback would put an unmeasured row above a measured one. Empty on
              every payload seen so far, which is why it renders nothing rather
              than an empty heading. */ ''}
        <${CollapsedTailRow} tail=${unobserved} suppressed=${suppressed}
          summary="not ranked: no observed figure to rank them by"
          onDismissAll=${() => dismissMany(unobserved.map(i => i.signature))}
          renderItem=${renderRow} />
        <${BelowFloorNote} items=${floorItems} label=${pluralItems(floorItems.length)} />
      </div>
      ${showBulkSelect ? html`
        <div style="display:flex;gap:10px;align-items:center;margin-top:10px">
          <button class="cur-btn primary" disabled=${selectedCount === 0}
            onClick=${() => startReview(selectedVisible.map(c => c.signature))}
            title="Open each checked row in turn; you still approve them one at a time">${selectedCount ? `Review ${selectedCount} checked` : 'Review checked'}</button>
          <button class="cur-btn" disabled=${selectedCount === 0} onClick=${dismissChecked}
            title="Hides these rows locally: this browser only; it is not sent to the server, so clearing site data brings them back">${selectedCount ? `Dismiss ${selectedCount} checked` : 'Dismiss checked'}</button>
        </div>` : null}
    ` : null}

    ${tab === 'applied' ? html`
      ${/* ONE disclosure for the whole section, replacing the per-row `est.`
            badge that repeated it on every line.
            It is not optional and it is not a tooltip. A green plus-signed dollar
            figure with no qualifier reads as a measured saving; this product
            removed an unbounded verify layer precisely because it was making
            claims it could not support, and shipped this figure as estimates-only
            with an explicit label as the replacement. Deleting the label without
            replacing it would have rebuilt the claim by accident.
            Worded as an estimate and a point in time. Never verified, measured,
            confirmed or realized. */ ''}
      ${/* It says "each figure below", so it only renders when there ARE figures
            below: above a skeleton it points at nothing, and above an empty state
            it qualifies a claim nobody made. Same rule as the empty state it sits
            over, applied to a disclosure rather than to an absence. */ ''}
      ${/* Gated on a FIGURE being present, not on a row being present. Rows and
            figures are not the same population: a reverted row renders the word
            instead of a number, and a record can carry no estimate at all (on a
            real corpus, four applied hooks and a trim record all arrive with
            usd and tokens null). With rows but no figures this line qualified
            nothing, which is the same dangling-claim shape as the absences
            above, one level over. */ ''}
      ${appliedCountKnown && combinedApplied.some(r => {
        if (r.state === 'reverted') return false;
        const e = appliedEstimate(r);
        return e.usd != null || e.tokens != null;
      }) ? html`
        <div class="sz-note" style="margin:12px 0 10px">Each figure below is that row's own estimate from the moment it was applied. Nothing here is re-measured afterwards.</div>` : null}
      <div class="cur-listbox">
        ${/* THREE distinguishable states, and the middle one was missing.
              "Nothing applied yet." was gated on the array being empty and on
              nothing else, so it rendered as a settled absence for as long as
              `/relearn/applied` took to answer — the slowest of the four inbox
              reads. An absence claim is the most dangerous thing to guess wrong
              because it reads as reassurance, and the page KNEW it did not know:
              the tab count beside it was already a shimmer.
              Gated on both applied reads, never on a page-wide flag, since this
              panel's data is the slow one. */ ''}
        ${!appliedCountKnown
          ? html`${[0, 1, 2].map(i => html`<${AppliedSkeletonRow} key=${i} />`)}`
          : combinedApplied.length === 0
            ? html`<div class="empty compact">Nothing applied yet.</div>`
            : combinedApplied.map(rec => html`<${AppliedItemRow} key=${rec.kind + ':' + rec.id} rec=${rec} suppressed=${suppressed} onChanged=${() => { loadApplied(); loadCost(); }} />`)}
      </div>
    ` : null}

    <${RelearnApplyModal} cluster=${modalCluster} onClose=${endReview} onApplied=${onApplied} queuePos=${queuePos} onNext=${reviewQueue.length ? nextInReview : null} />
  `;
}

// How long the recoverable-waste band waits before it admits it does not know.
// Measured against a real 794MB corpus over a 30-day window: 356s idle, 480s
// while the page was also polling, both HTTP 200 with findings. The cap sits
// above the worse of those with headroom, so an answer that IS coming still
// lands in the normal state and the notice never cries wolf on a scan that was
// simply slow. A cap that is too LOW is the failure mode to avoid here: the
// request is not cancelled at the cap, so a late answer still fills the band in,
// and the only cost of waiting longer is a shimmer nobody can read a claim into.
const OPTIMIZE_WAIT_MS = 10 * 60 * 1000;
const OPTIMIZE_WAIT_MIN = Math.round(OPTIMIZE_WAIT_MS / 60000);
// Skeleton tiles held during the sweep. Six, because that is what the band
// settles into on a claude-code corpus once the persona gate has dropped the
// analyzers with no fix for it (measured: resend, summarize, downsize,
// deadweight, subagent, relearn), so the grid keeps the same row count from the
// placeholder through to the answer.
const REC_SKELETON_TILES = [0, 1, 2, 3, 4, 5];

// Candidate windows, ascending, for every screen with a window selector. Only
// entries whose day count fits within the store's actually-available data
// span (core/data_span.py, `available_days` -- served on /drift,
// /relearn/proposals, /cost, /traces and /optimize) are ever offered -- a
// corpus with two months of data should not offer 90d (nothing behind it),
// and a corpus with 120 days should be able to reach past 90d. Originally
// Dashboard-only (`DASHBOARD_STANDARD_WINDOWS`/`dashboardWindowOptions`);
// generalised so Cost, Traces and Optimize derive their own selectors from the
// same one list instead of each hardcoding its own 24h/7d/30d/90d options —
// which is what let those three screens offer a window the machine had no
// data for while being unable to offer its actual full span.
//
// These are the ALWAYS-candidate base rungs (clamped to the span below);
// 90d+ live in INTERMEDIATE_RUNG_DAYS instead -- see standardWindowOptions.
const STANDARD_WINDOWS = [
  { value: '24h', label: 'Last 24h', days: 1 },
  { value: '7d', label: 'Last 7d', days: 7 },
  { value: '30d', label: 'Last 30d', days: 30 },
];

// Candidate rungs for the ONE intermediate option between the 30d base rung
// and the exact-span option. Only the LARGEST candidate STRICTLY BELOW the
// span is ever added -- never every candidate under the span. That distinction
// is load-bearing: a naive "every standard rung under the span" reading would
// offer 24h/7d/30d/60d/90d/112d on a 112-day corpus, when the operator's own
// worked example wants 24h/7d/30d/90d/112d (no 60d) -- 112 has TWO qualifying
// candidates (60 and 90) and only the larger one may render.
const INTERMEDIATE_RUNG_DAYS = [60, 90, 120, 180, 365];

// The window <option> list for a selector, derived from the data span rather
// than hardcoded. `availableDays` is null (or non-positive -- a measurement
// that can't back up even the 24h floor) while the span hasn't been read yet
// or isn't usable -- in that not-yet-known state only the always-safe floor
// (24h) is offered, so the selector never asserts an option set it can't yet
// back up (the same not-yet-known / known-and-empty / known-and-populated
// distinction the rest of this file uses for other panels).
//
// Once known: every base rung (24h/7d/30d) at or under the span; below 30
// days that means fewer than three base rungs survive at all (e.g. a 12-day
// corpus offers only 24h/7d, then the exact span -- never a rung with nothing
// behind it, which was the original defect). Then the one largest
// INTERMEDIATE_RUNG_DAYS candidate strictly below the span, if any (worked
// examples: 67 days -> ...,30d,60d,67d; 112 days -> ...,30d,90d,112d, not
// both 60d and 90d; 42 days -> ...,30d,42d, no intermediate at all since 42
// clears no INTERMEDIATE_RUNG_DAYS candidate). Finally the exact span itself,
// unless a rung already landed on that exact day count (never a duplicate
// entry for a span that lands exactly on 30d, 60d, ...).
function standardWindowOptions(availableDays) {
  if (availableDays == null || availableDays <= 0) return [STANDARD_WINDOWS[0]];
  const options = STANDARD_WINDOWS.filter(w => w.days <= availableDays);
  const intermediateDays = INTERMEDIATE_RUNG_DAYS.filter(d => d < availableDays).pop();
  if (intermediateDays != null) {
    options.push({ value: `${intermediateDays}d`, label: `Last ${intermediateDays}d`, days: intermediateDays });
  }
  const largest = options[options.length - 1];
  if (!largest || largest.days !== availableDays) {
    options.push({ value: `${availableDays}d`, label: `Last ${availableDays}d`, days: availableDays });
  }
  return options;
}

// The currently-selected window (from the URL) may predate the span answer,
// or may no longer fit a freshly-measured span -- always keep it selectable
// so a <select> built from `standardWindowOptions` never silently snaps to a
// different value out from under a read that already used it.
function windowOptionsWithCurrent(availableDays, since) {
  const options = standardWindowOptions(availableDays);
  return options.some(w => w.value === since)
    ? options
    : options.concat([{ value: since, label: `Last ${since}` }]);
}

/** Shown when the reader has switched to a persona this machine has no data for.
 *
 * The distinction this exists to protect: "you have no SDK workflows here" and
 * "your SDK workflows cost nothing" are different statements, and every tile on
 * this page would otherwise render the second while the truth is the first. It
 * renders only once the persona read has ANSWERED (`known`) and reports a hard
 * zero; an unanswered or failed read says nothing at all, because a zero we do
 * not have is not a measurement.
 */
// True once the persona read has ANSWERED and reports a hard zero for this
// persona. `null` means "not answered / failed" (a zero we do not have is not a
// measurement), so callers gate on `=== true`, never on falsiness. Reads the
// context App() already populates from its single `/persona` fetch rather than
// issuing its own — so the gate and the switcher can never disagree, and there
// is one request, not one per view.
function usePersonaHasNoData(persona) {
  const ctx = useContext(PersonaCtx);
  if (!ctx || !ctx.known || !ctx.counts) return null;
  return (ctx.counts[persona] || 0) === 0;
}

// The banner shown IN PLACE OF a page's body when the reader has switched to a
// persona this machine has no data for. It carries no header of its own — the
// shared gate (`PersonaEmptyGate`) renders the page's normal header above it,
// so this sits in the content region, never above the header.
//
// The distinction this exists to protect: "you have no SDK workflows here" and
// "your SDK workflows cost nothing" are different statements, and every tile a
// page would otherwise render states the second while the truth is the first.
function PersonaNoDataNotice({ persona }) {
  const ctx = useContext(PersonaCtx);
  const label = persona === 'sdk' ? 'SDK workflows' : 'Claude Code sessions';
  const other = persona === 'sdk' ? 'Claude Code' : 'SDK workflows';
  const otherKey = persona === 'sdk' ? 'claude-code' : 'sdk';
  // "Switch back to <other>" is a real control: it makes the SAME persona state
  // change the "Viewing as" <select> does (App()'s setPersona, threaded through
  // context), never a page reload. A button styled inline as a link so it reads
  // as prose but is keyboard-focusable and does the state change.
  const switchBack = html`<button type="button" class="link-inline"
      onClick=${() => ctx && ctx.onChange && ctx.onChange(otherKey)}>Switch back to ${other}</button>`;
  return html`
    <div class="band-msg" style="margin:0 0 18px">
      <b>No ${label} on this machine.</b>
      <p>
        ${switchBack} to see what this machine actually has, or point an SDK
        workload at the collector and it will show up here.
      </p>
    </div>`;
}

// The shared empty-state gate every primary view honors (issue: SDK persona on
// a Claude-Code-only machine). Renders the page's normal HEADER above, then —
// when this persona has no data — the banner IN PLACE OF the page's body, so a
// page shows its normal header then the banner instead of its overspend tiles /
// chart / analyzer cards. When data exists (or the read is unanswered) it
// renders the children untouched, so the gate is a no-op on the common path.
//
// One place, not per-page copy: App() wraps the active view in this, passing a
// header node the gate always shows and the view's own body as children. A view
// that already renders its own header inside its body passes an empty header
// here and keeps rendering it as before on the non-empty path — the gate only
// SUPPRESSES the body, it never has to reproduce a page's header.
function PersonaEmptyGate({ persona, header, children }) {
  const noData = usePersonaHasNoData(persona);
  if (noData !== true) return children;
  return html`
    ${header || null}
    <${PersonaNoDataNotice} persona=${persona} />`;
}

// The standard header the gate renders above the banner: page title + the
// persona switcher, in the same `.ov-head` row the Dashboard uses, so an
// SDK-empty page looks like a normal page with an empty body rather than a
// bare banner. Titles keyed by primary-view key.
const VIEW_TITLES = {
  dashboard: 'Dashboard', review: 'Review inbox', optimize: 'Optimize',
  summarize: 'Summarize', rules: 'Rules', traces: 'Traces', cost: 'Cost',
  alerts: 'Alerts', drift: 'Drift', budget: 'Budget', faq: 'FAQ',
};
function PersonaEmptyHeader({ viewKey }) {
  return html`
    <div class="ov-head">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <div class="page-title" style="margin:0">${VIEW_TITLES[viewKey] || ''}</div>
        <${PersonaPicker} bare=${true} />
      </div>
    </div>`;
}

function DashboardView({ params, persona }) {
  const since = readParam(params, 'since', DEFAULT_SINCE, validSince);
  // Preserve the explorer's params (metric/group_by/stack/chart/filters) when
  // only the window changes, so the hero keeps its slice across window switches.
  const setWin = v => navigate('dashboard', { ...Object.fromEntries(params.entries()), since: v }, { since: DEFAULT_SINCE });

  // A retired #/analytics link lands here (primaryKeyFor aliases it to
  // 'dashboard') with its metric/group_by/stack/chart/since params intact, but
  // the explorer it deep-links to is below the triage band, not at the top of
  // the page. Scroll straight to it so an old bookmark still opens "the same
  // view it used to" rather than a triage band the link never promised. Reads
  // location.hash directly (not route state, which DashboardView never
  // receives) and re-checks on every params change since this view stays
  // mounted (keep-alive) across navigations.
  useEffect(() => {
    const isAnalyticsAlias = location.hash.replace(/^#\/?/, '').split(/[?/]/)[0] === 'analytics';
    if (!isAnalyticsAlias) return;
    const el = document.getElementById('dash-explore');
    if (el) el.scrollIntoView({ block: 'start' });
  }, [params]);

  // ---- One read per source, never one load flag for the page ---------------- //
  // These six reads used to be awaited together in a single Promise.all, which
  // made every panel on the page as slow as the slowest of them. Measured against
  // a real 794MB corpus: /traces and /status answer in ~13.6s, /cost in 27.0s,
  // and the analyzer sweep behind /optimize in 356s. Batched, the four Health
  // tiles that never touch /cost still appeared 27 seconds late, and while the
  // whole batch was outstanding the page had nothing to show at all. Each read
  // now settles on its own and the panel it feeds paints the moment ITS answer
  // lands. /optimize keeps a richer state machine of its own below, because it is
  // the only one slow enough to need a bounded wait.
  const costRead = useTriageRead(() => api('/cost', { since, group_by: 'day' }), [since]);
  const statusRead = useTriageRead(() => api('/status'), []);
  const alertsRead = useTriageRead(() => api('/alerts', { since, unread: 'true' }), [since]);
  // These two used to send no window and depend on nothing, so the selector
  // above visibly governed three tiles and silently did nothing to the other
  // two: the same clusters and the same drift count came back for 24h and 90d.
  // A control that governs part of a page is worse than none, because a reader
  // cannot tell which figures moved. Both endpoints report the window they
  // actually applied.
  const driftRead = useTriageRead(() => api('/drift', { since }), [since]);
  const tracesRead = useTriageRead(() => api('/traces', { since, limit: 6 }), [since]);
  const relearnRead = useTriageRead(() => api('/relearn/proposals', { since }), [since]);

  // ---- The recoverable-waste read, on its own state machine ---------------- //
  // GET /optimize runs the analyzer sweep server-side. Measured against a real
  // 794MB local corpus over a 30-day window it answered HTTP 200 with five
  // findings after 356s idle and 480s while the page was also polling.
  // `fast=true` only drops `trim`, which is persona-disabled on a claude-code
  // corpus anyway, so the flag buys nothing here. That cost is a server-side
  // problem tracked separately and is not what this code fixes. What this code
  // fixes is the UI's account of it:
  // the band must never turn a non-answer into a claim of absence, and must stay
  // honest for the several minutes an answer can legitimately take without
  // reading as frozen.
  //
  // `phase` is the single source of truth for what the band may say:
  //   'loading' — a sweep is in flight; we do not know yet
  //   'ready'   — a response arrived; `data` is what it said
  //   'timeout' — we stopped waiting; still unknown
  //   'error'   — the read failed; still unknown
  // 'timeout' and 'error' stay distinct because the user's next move differs
  // (keep waiting on something still running, vs. retry something that broke),
  // and neither may ever be rendered as 'ready' with an empty report.
  const [optState, setOptState] = useState({ phase: 'loading', data: null, error: null });
  // A sweep that is still running server-side even though we stopped waiting for
  // it. Tracked separately from `phase` precisely because 'timeout' does NOT
  // mean the request went away.
  const optInFlight = useRef(false);
  const optRun = useRef(0);       // generation counter; stale settles are dropped
  const optTimer = useRef(null);

  const armOptWait = useCallback(() => {
    const run = optRun.current;
    clearTimeout(optTimer.current);
    optTimer.current = setTimeout(() => {
      // Only a still-'loading' read of THIS generation may time out; a sweep that
      // already answered (or was superseded) is untouched.
      setOptState(s => (optRun.current === run && s.phase === 'loading'
        ? { phase: 'timeout', data: s.data, error: null } : s));
    }, OPTIMIZE_WAIT_MS);
  }, []);

  const loadOptimize = useCallback(() => {
    // Never more than ONE sweep in flight. The 30s poll below used to re-enter
    // this read unconditionally; with a 45s response cache in front of an
    // endpoint that takes minutes, every other poll opened ANOTHER concurrent
    // sweep over the same DuckDB file, so the page got slower the longer it
    // stayed open. That contention is why the same request measured 356s idle
    // and 480s with the page polling.
    if (optInFlight.current) return;
    const run = ++optRun.current;
    optInFlight.current = true;
    // Keep any answer we already hold while refreshing: a slow refresh must not
    // blank numbers that are still the last complete result.
    setOptState(s => ({ phase: 'loading', data: s.data, error: null }));
    armOptWait();

    const resolve = (next) => {
      optInFlight.current = false;
      clearTimeout(optTimer.current);
      setOptState(s => (optRun.current === run ? next(s) : s));
    };
    // The request is deliberately NOT abandoned when the wait runs out: it is a
    // read whose answer is still worth having whenever it lands, so this handler
    // stays attached past the timeout and fills the band in on its own. The page
    // recovers without the user doing anything, rather than stranding them on a
    // timeout notice for an answer that did eventually arrive.
    api('/optimize', { since, fast: 'true' }).then(
      data => resolve(() => ({ phase: 'ready', data, error: null })),
      err => resolve(s => ({ phase: 'error', data: s.data, error: err.message || String(err) })),
    );
  }, [since, armOptWait]);

  // Two different next moves behind one control, because the two unknown states
  // have two different causes. On a TIMEOUT the sweep is still running, so the
  // useful action is to go back to waiting and let it land; firing a second
  // sweep would only add another minutes-long scan of the same DB and slow the
  // first one down. On an ERROR nothing is in flight, so it issues a fresh read.
  const retryOptimize = () => {
    if (optInFlight.current) {
      setOptState(s => ({ phase: 'loading', data: s.data, error: null }));
      armOptWait();
      return;
    }
    loadOptimize();
  };

  useEffect(() => {
    loadOptimize();
    return () => {
      // Invalidate this generation so a late settle cannot write into a view
      // that has moved to a different window.
      optRun.current++;
      optInFlight.current = false;
      clearTimeout(optTimer.current);
    };
  }, [loadOptimize]);

  // Every read refreshes on the same 30s cadence, but each one refreshes ITSELF:
  // useTriageRead's in-flight guard makes a tick a no-op for any read still
  // working, so a slow endpoint is simply polled less often than a fast one
  // instead of holding the fast ones back or stacking queries behind itself.
  // The live reads (/status, /traces, /alerts, /drift) are excluded from the GET
  // cache so each tick refetches them fresh; /cost, /optimize and /relearn honor
  // the short cache TTL (refresh within ~45s).
  //
  // The tick callback is reached through a ref rather than closed over by the
  // effect, so the interval is installed ONCE. Listing the six refresh callbacks
  // as effect deps would tear down and reinstall the timer on every window change
  // (and any render that changed one of their identities), which on a page whose
  // reads take tens of seconds means a 30s timer that can keep being reset before
  // it ever fires.
  const pollRef = useRef(null);
  pollRef.current = () => {
    costRead.refresh(); statusRead.refresh(); alertsRead.refresh();
    driftRead.refresh(); tracesRead.refresh(); relearnRead.refresh();
    // The sweep is polled too, so a wait that timed out still gets picked back
    // up without the user asking; loadOptimize's own in-flight guard makes this
    // a no-op while one is running, so the poll can never stack sweeps.
    loadOptimize();
  };
  useEffect(() => {
    const tick = () => { if (document.visibilityState === 'visible') pollRef.current(); };
    const timer = setInterval(tick, 30000);
    document.addEventListener('visibilitychange', tick);
    return () => { clearInterval(timer); document.removeEventListener('visibilitychange', tick); };
  }, []);

  // Both /drift and /relearn/proposals carry the same `data_span` block
  // (core/data_span.py runs once server-side); take whichever has answered
  // first rather than waiting on both.
  const dataSpan = (driftRead.data && driftRead.data.data_span)
    || (relearnRead.data && relearnRead.data.data_span) || null;
  const availableDays = dataSpan ? dataSpan.available_days : null;
  const winPicker = html`
    <select value=${since} onChange=${e => setWin(e.target.value)}>
      ${windowOptionsWithCurrent(availableDays, since).map(w => html`<option value=${w.value}>${w.label}</option>`)}
    </select>`;

  // Everything derived from /cost is derived from the ANSWER, never from an empty
  // object standing in for one. `costData` is null until the read lands, and each
  // consumer below checks it: framing (so PlanBadge stays absent rather than
  // asserting a plan we have not read), the window total, and the run-rate
  // caption.
  const costData = costRead.data;
  const cost = costData || {};
  const framing = costData ? (cost.framing || null) : null;
  // LOCAL only -- subscription no longer suppresses (product decision: tj
  // does not differentiate subscription-billed from API-billed users).
  const useTokens = !!framing && framing.pricing_mode === 'local';
  // Series only used to gate the run-rate projection (the chart itself is the
  // explorer's now — spend de-dup); window total drives the run-rate caption.
  const series = costData ? buildCostSeries(cost, 'total', useTokens) : null;
  const cyc = cycleRemaining(cost.cycle);
  let projection = null;
  if (series && series.data[1] && series.data[1].length) {
    const windowTotal = useTokens ? (cost.total_tokens || 0) : (cost.total_cost_usd || 0);
    const projected = runRateProjection(windowTotal, since, 1) * cyc.days;
    projection = useTokens ? (fmtTokens(Math.round(projected)) + ' tokens') : fmtFramedDollar(projected, framing, fmtDashUsd);
  }

  // ---- The front door's own claim ------------------------------------------ //
  // "No data yet. TokenJam is listening." asserts that this user has recorded
  // nothing, so all three of its inputs must have ANSWERED before it may be
  // shown. A /cost, /status or /traces read that is outstanding or failed means
  // "we could not check", never "you have none"; while any of them is unknown the
  // page renders the normal bands, which state their own uncertainty, instead of
  // telling a user with a full history that nothing has been recorded.
  const statusAgents = (statusRead.data && statusRead.data.agents) || [];
  const traceList = (tracesRead.data && tracesRead.data.traces) || [];
  const hasCost = !!costData && ((cost.total_cost_usd || 0) > 0 || (cost.total_tokens || 0) > 0);
  const emptyKnown = !!costData && !!statusRead.data && !!tracesRead.data;
  const isEmpty = emptyKnown && !hasCost && !statusAgents.length && !traceList.length;

  // Tiles are derived ONLY from an answer we actually hold. Passing an absent
  // report into recoverableTiles() is the original bug in one line: a missing
  // report and an empty report both flatten to [], and the band then printed
  // "No recoverable candidates." for a read that had simply not come back.
  const optData = optState.data;
  const tiles = optData ? recoverableTiles(optData) : [];
  const bandState = recoverableBandState(optState.phase, optData, tiles.length);
  // The compute-layer view of the SAME payload the phase machine above tracks.
  // One read, one stored artifact, so the recoverable band and the budgets tile
  // below cannot disagree about how fresh their figures are or whether anything
  // has been computed at all.
  const scan = scanState(optData);
  const {
    busy: rescanning, error: rescanError, declined: rescanDeclined,
    declinedDetail: rescanDeclinedDetail, rescan: doRescan,
  } = useRescan(loadOptimize);
  useAutoRefresh(scan, loadOptimize);

  // Budgets ride on the same /optimize payload, so the "Budgets at risk" tile
  // inherits that read's outcome: 0 with the caption "none configured" is a
  // claim about the user's config, and an unanswered sweep cannot make it.
  const budgets = (scan.known && optData.budgets) || [];
  const budgetAttn = budgets.filter(b => b.over_budget || (b.budget_usd > 0 && b.projected_cycle_total / b.budget_usd > 0.8)).length;
  // Mirrors the band's own phase rather than flattening to "failed": a sweep
  // still running past the wait says "still scanning", one that errored says it
  // couldn't load, and the two must not be reported as the same thing. A COLD
  // store is a third case that answered its request while holding nothing:
  // `optData` is truthy, so the old `optData ? 'ready'` would have printed a
  // confident `0` under "none configured" — a claim about the user's config
  // that an un-run scan cannot make.
  const budgetStatus = scan.known ? 'ready' : (optData ? 'cold' : optState.phase);

  // Each remaining health figure comes from its OWN read, and readStatus() is
  // what decides whether the figure may be shown at all. Each tile therefore
  // paints as soon as its own endpoint answers: /alerts and /drift no longer wait
  // behind the 27-second /cost read they have nothing to do with.
  const alertList = (alertsRead.data && alertsRead.data.alerts) || [];
  const relearnClusters = (relearnRead.data && relearnRead.data.finding
    && relearnRead.data.finding.clusters) || [];
  const driftN = driftSignalCount(driftRead.data);
  const errTraces = traceList.filter(t => t.status_code === 'error').length;

  // Run-rate projection folded into a one-line caption under the explorer's KPI
  // row — the dashboard's single spend headline lives there, not as a separate
  // chart (de-dup). Framed: tokens for LOCAL (no marginal cost to price at
  // all), the dollar figure (via fmtFramedDollar, fmtDashUsd's 2dp) for
  // api/subscription/unknown. Requires `projection`, which requires
  // `costData`, so this caption cannot be built from an unanswered read.
  // Run-rate caption removed from the Dashboard (founder review, 2026-07-30).
  const kpiCaption = null;

  return html`
    <div class="ov-head">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <div class="page-title" style="margin:0">Dashboard</div>
        <${PersonaPicker} bare=${true} />
        <${PlanBadge} framing=${framing} />
      </div>
      <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:8px">
          <span class="persona-bar-label">Viewing</span>
          <div class="filters" style="margin:0">${winPicker}</div>
        </div>
        <${ScanBar} scan=${scan} busy=${rescanning} error=${rescanError} declined=${rescanDeclined} declinedDetail=${rescanDeclinedDetail} onRescan=${doRescan} />
      </div>
    </div>
    ${/* A past-overspend hero band rendered here once. Removed: it read as heavy
          at the top of the page, and the figure now lives as a compact tile on
          the Review inbox, which is the surface you act on it from.

          The rules if it is ever re-added here, which are the reason this note
          survives the code: it is a PAST-TENSE diagnosis of money already spent,
          so it must not sit inside the triage band, whose tiles are
          forward-looking opportunity figures in accent-blue. Different row,
          different colour treatment, different tense; a reader must never be
          able to add the two together. And the number must come from
          GET /relearn/cost-proposals' own `past_overspend` block, the same one
          the inbox headline reads, so the two surfaces state one figure computed
          once server-side, never a client-side reduction over whatever cards
          happen to be rendered.

          The Dashboard's own fetch of that endpoint is gone. It set state no
          band read, so it cost a request per mount and rendered nothing. On a
          page where the reads take tens of seconds, an unrendered one does not
          earn its place; re-add the fetch WITH the band, not before it. */ ''}

    ${isEmpty ? html`<div class="card" style="max-width:560px"><div class="card-header">No data yet. TokenJam is listening.</div><p style="color:var(--text-dim);font-size:13px;margin:8px 0 0">Run an agent (or <code>tj demo retry-loop</code>) and the recurring mistakes, spend, and health show up here.</p></div>`
      : html`
        <!-- Triage band: recoverable waste + health. Spend is NOT shown here —
             it lives once, in the explorer's Spend KPI tile + chart below. -->
        ${/* No blanket "the whole band is loading" shimmer any more. That single
              90px grey rectangle stood in for BOTH bands until the slowest read
              in the batch resolved, which on a large corpus meant several
              minutes of an anonymous grey box that named nothing it was waiting
              for. Each band now renders its own labelled structure immediately
              and each tile states its own read's status, so the page is
              legible from the first paint. */ ''}
        ${/* A /cost failure is reported as a SCOPED banner, not by replacing the
              bands. It used to blank the whole triage row ("Couldn't load
              triage"), which threw away five health tiles whose reads had
              nothing to do with /cost and may well have succeeded. The banner
              names what is missing (the spend framing and the run-rate caption)
              and everything else keeps rendering. */ ''}
        ${costRead.phase === 'error' && !costData ? html`
          <div class="band-msg err" style="margin-bottom:14px">
            <b>Couldn't load spend for this window.</b>
            <p>${costRead.error}</p>
            <p>The plan badge and the run-rate caption are missing because of it; everything else on this page is unaffected.</p>
            <button class="btn" onClick=${costRead.refresh}>Try again</button>
          </div>` : null}
        ${html`
            <div class="dash-triage">
              <div class="dash-col">
                ${/* The band states its OWN window, beside the figures rather
                      than only in the provenance bar at the top of the page.
                      These tiles come from a stored analyzer pass, so the
                      window is the one that pass ran at — NOT the `since` the
                      page's own picker is set to, which re-scopes the live
                      spend chart below and nothing here. Two surfaces published
                      this metric under two windows and neither said so; the
                      windows are one seam now (core/optimize/report_window.py)
                      and each surface still names it, because a figure whose
