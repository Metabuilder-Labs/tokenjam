              "Nothing applied yet." was gated on the array being empty and on
              nothing else, so it rendered as a settled absence for as long as
              `/relearn/applied` took to answer — the slowest of the four inbox
              reads. An absence claim is the most dangerous thing to guess wrong
              because it reads as reassurance, and the page KNEW it did not know:
              the tab count beside it was already a shimmer.
              Gated on both applied reads, never on a page-wide flag, since this
              panel's data is the slow one. */ ''}
        ${!appliedCountKnown
          ? html`${[0, 1, 2].map(i => html`<${AppliedSkeletonRow} key=${i} />`)}`
          : combinedApplied.length === 0
            ? html`<div class="empty compact">Nothing applied yet.</div>`
            : combinedApplied.map(rec => html`<${AppliedItemRow} key=${rec.kind + ':' + rec.id} rec=${rec} suppressed=${suppressed} onChanged=${() => { loadApplied(); loadCost(); }} />`)}
      </div>
    ` : null}

    <${RelearnApplyModal} cluster=${modalCluster} onClose=${endReview} onApplied=${onApplied} queuePos=${queuePos} onNext=${reviewQueue.length ? nextInReview : null} />
  `;
}

// How long the recoverable-waste band waits before it admits it does not know.
// Measured against a real 794MB corpus over a 30-day window: 356s idle, 480s
// while the page was also polling, both HTTP 200 with findings. The cap sits
// above the worse of those with headroom, so an answer that IS coming still
// lands in the normal state and the notice never cries wolf on a scan that was
// simply slow. A cap that is too LOW is the failure mode to avoid here: the
// request is not cancelled at the cap, so a late answer still fills the band in,
// and the only cost of waiting longer is a shimmer nobody can read a claim into.
const OPTIMIZE_WAIT_MS = 10 * 60 * 1000;
const OPTIMIZE_WAIT_MIN = Math.round(OPTIMIZE_WAIT_MS / 60000);
// Skeleton tiles held during the sweep. Six, because that is what the band
// settles into on a claude-code corpus once the persona gate has dropped the
// analyzers with no fix for it (measured: resend, summarize, downsize,
// deadweight, subagent, relearn), so the grid keeps the same row count from the
// placeholder through to the answer.
// 7 placeholders, matching the 7 real tiles (the Total tile plus the six
// breakdown analyzers) so the skeleton's width and row-count match what
// lands, and the row doesn't reflow when the real data arrives.
const REC_SKELETON_TILES = [0, 1, 2, 3, 4, 5, 6];

// Candidate windows, ascending, for every screen with a window selector. Only
// entries whose day count fits within the store's actually-available data
// span (core/data_span.py, `available_days` -- served on /drift,
// /relearn/proposals, /cost, /traces and /optimize) are ever offered -- a
// corpus with two months of data should not offer 90d (nothing behind it),
// and a corpus with 120 days should be able to reach past 90d. Originally
// Dashboard-only (`DASHBOARD_STANDARD_WINDOWS`/`dashboardWindowOptions`);
// generalised so Cost, Traces and Optimize derive their own selectors from the
// same one list instead of each hardcoding its own 24h/7d/30d/90d options —
// which is what let those three screens offer a window the machine had no
// data for while being unable to offer its actual full span.
//
// These are the ALWAYS-candidate base rungs (clamped to the span below);
// 90d+ live in INTERMEDIATE_RUNG_DAYS instead -- see standardWindowOptions.
const STANDARD_WINDOWS = [
  { value: '24h', label: 'Last 24h', days: 1 },
  { value: '7d', label: 'Last 7d', days: 7 },
  { value: '30d', label: 'Last 30d', days: 30 },
];

// Candidate rungs for the ONE intermediate option between the 30d base rung
// and the exact-span option. Only the LARGEST candidate STRICTLY BELOW the
// span is ever added -- never every candidate under the span. That distinction
// is load-bearing: a naive "every standard rung under the span" reading would
// offer 24h/7d/30d/60d/90d/112d on a 112-day corpus, when the operator's own
// worked example wants 24h/7d/30d/90d/112d (no 60d) -- 112 has TWO qualifying
// candidates (60 and 90) and only the larger one may render.
const INTERMEDIATE_RUNG_DAYS = [60, 90, 120, 180, 365];

// The window <option> list for a selector, derived from the data span rather
// than hardcoded. `availableDays` is null (or non-positive -- a measurement
// that can't back up even the 24h floor) while the span hasn't been read yet
// or isn't usable -- in that not-yet-known state only the always-safe floor
// (24h) is offered, so the selector never asserts an option set it can't yet
// back up (the same not-yet-known / known-and-empty / known-and-populated
// distinction the rest of this file uses for other panels).
//
// Once known: every base rung (24h/7d/30d) at or under the span; below 30
// days that means fewer than three base rungs survive at all (e.g. a 12-day
// corpus offers only 24h/7d, then the exact span -- never a rung with nothing
// behind it, which was the original defect). Then the one largest
// INTERMEDIATE_RUNG_DAYS candidate strictly below the span, if any (worked
// examples: 67 days -> ...,30d,60d,67d; 112 days -> ...,30d,90d,112d, not
// both 60d and 90d; 42 days -> ...,30d,42d, no intermediate at all since 42
// clears no INTERMEDIATE_RUNG_DAYS candidate). Finally the exact span itself,
// unless a rung already landed on that exact day count (never a duplicate
// entry for a span that lands exactly on 30d, 60d, ...).
function standardWindowOptions(availableDays) {
  if (availableDays == null || availableDays <= 0) return [STANDARD_WINDOWS[0]];
  const options = STANDARD_WINDOWS.filter(w => w.days <= availableDays);
  const intermediateDays = INTERMEDIATE_RUNG_DAYS.filter(d => d < availableDays).pop();
  if (intermediateDays != null) {
    options.push({ value: `${intermediateDays}d`, label: `Last ${intermediateDays}d`, days: intermediateDays });
  }
  const largest = options[options.length - 1];
  if (!largest || largest.days !== availableDays) {
    options.push({ value: `${availableDays}d`, label: `Last ${availableDays}d`, days: availableDays });
  }
  return options;
}

// The currently-selected window (from the URL) may predate the span answer,
// or may no longer fit a freshly-measured span -- always keep it selectable
// so a <select> built from `standardWindowOptions` never silently snaps to a
// different value out from under a read that already used it.
function windowOptionsWithCurrent(availableDays, since) {
  const options = standardWindowOptions(availableDays);
  return options.some(w => w.value === since)
    ? options
    : options.concat([{ value: since, label: `Last ${since}` }]);
}

/** Shown when the reader has switched to a persona this machine has no data for.
 *
 * The distinction this exists to protect: "you have no SDK workflows here" and
 * "your SDK workflows cost nothing" are different statements, and every tile on
 * this page would otherwise render the second while the truth is the first. It
 * renders only once the persona read has ANSWERED (`known`) and reports a hard
 * zero; an unanswered or failed read says nothing at all, because a zero we do
 * not have is not a measurement.
 */
// True once the persona read has ANSWERED and reports a hard zero for this
// persona. `null` means "not answered / failed" (a zero we do not have is not a
// measurement), so callers gate on `=== true`, never on falsiness. Reads the
// context App() already populates from its single `/persona` fetch rather than
// issuing its own — so the gate and the switcher can never disagree, and there
// is one request, not one per view.
function usePersonaHasNoData(persona) {
  const ctx = useContext(PersonaCtx);
  if (!ctx || !ctx.known || !ctx.counts) return null;
  return (ctx.counts[persona] || 0) === 0;
}

// The banner shown IN PLACE OF a page's body when the reader has switched to a
// persona this machine has no data for. It carries no header of its own — the
// shared gate (`PersonaEmptyGate`) renders the page's normal header above it,
// so this sits in the content region, never above the header.
//
// The distinction this exists to protect: "you have no SDK workflows here" and
// "your SDK workflows cost nothing" are different statements, and every tile a
// page would otherwise render states the second while the truth is the first.
function PersonaNoDataNotice({ persona }) {
  const ctx = useContext(PersonaCtx);
  const label = persona === 'sdk' ? 'SDK workflows' : 'Claude Code sessions';
  const other = persona === 'sdk' ? 'Claude Code' : 'SDK workflows';
  const otherKey = persona === 'sdk' ? 'claude-code' : 'sdk';
  // "Switch back to <other>" is a real control: it makes the SAME persona state
  // change the "Viewing as" <select> does (App()'s setPersona, threaded through
  // context), never a page reload. A button styled inline as a link so it reads
  // as prose but is keyboard-focusable and does the state change.
  const switchBack = html`<button type="button" class="link-inline"
      onClick=${() => ctx && ctx.onChange && ctx.onChange(otherKey)}>Switch back to ${other}</button>`;
  return html`
    <div class="band-msg" style="margin:0 0 18px">
      <b>No ${label} on this machine.</b>
      <p>
        ${switchBack} to see what this machine actually has, or point an SDK
        workload at the collector and it will show up here.
      </p>
    </div>`;
}

// The shared empty-state gate every primary view honors (issue: SDK persona on
// a Claude-Code-only machine). Renders the page's normal HEADER above, then —
// when this persona has no data — the banner IN PLACE OF the page's body, so a
// page shows its normal header then the banner instead of its overspend tiles /
// chart / analyzer cards. When data exists (or the read is unanswered) it
// renders the children untouched, so the gate is a no-op on the common path.
//
// One place, not per-page copy: App() wraps the active view in this, passing a
// header node the gate always shows and the view's own body as children. A view
// that already renders its own header inside its body passes an empty header
// here and keeps rendering it as before on the non-empty path — the gate only
// SUPPRESSES the body, it never has to reproduce a page's header.
function PersonaEmptyGate({ persona, header, children }) {
  const noData = usePersonaHasNoData(persona);
  if (noData !== true) return children;
  return html`
    ${header || null}
    <${PersonaNoDataNotice} persona=${persona} />`;
}

// The standard header the gate renders above the banner: page title + the
// persona switcher, in the same `.ov-head` row the Dashboard uses, so an
// SDK-empty page looks like a normal page with an empty body rather than a
// bare banner. Titles keyed by primary-view key.
const VIEW_TITLES = {
  dashboard: 'Dashboard', optimize: 'Optimize',
  summarize: 'Summarize', rules: 'Relearn', traces: 'Traces', cost: 'Cost',
  alerts: 'Alerts', budget: 'Budget', faq: 'FAQ',
};
function PersonaEmptyHeader({ viewKey }) {
  return html`
    <div class="ov-head">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <div class="page-title" style="margin:0">${VIEW_TITLES[viewKey] || ''}</div>
        <${PersonaPicker} bare=${true} />
      </div>
    </div>`;
}

function DashboardView({ params, persona }) {
  const since = readParam(params, 'since', DEFAULT_SINCE, validSince);
  // Preserve the explorer's params (metric/group_by/stack/chart/filters) when
  // only the window changes, so the hero keeps its slice across window switches.
  const setWin = v => navigate('dashboard', { ...Object.fromEntries(params.entries()), since: v }, { since: DEFAULT_SINCE });

  // A retired #/analytics link lands here (primaryKeyFor aliases it to
  // 'dashboard') with its metric/group_by/stack/chart/since params intact, but
  // the explorer it deep-links to is below the triage band, not at the top of
  // the page. Scroll straight to it so an old bookmark still opens "the same
  // view it used to" rather than a triage band the link never promised. Reads
  // location.hash directly (not route state, which DashboardView never
  // receives) and re-checks on every params change since this view stays
  // mounted (keep-alive) across navigations.
  useEffect(() => {
    const isAnalyticsAlias = location.hash.replace(/^#\/?/, '').split(/[?/]/)[0] === 'analytics';
    if (!isAnalyticsAlias) return;
    const el = document.getElementById('dash-explore');
    if (el) el.scrollIntoView({ block: 'start' });
  }, [params]);

  // ---- One read per source, never one load flag for the page ---------------- //
  // These six reads used to be awaited together in a single Promise.all, which
  // made every panel on the page as slow as the slowest of them. Measured against
  // a real 794MB corpus: /traces and /status answer in ~13.6s, /cost in 27.0s,
  // and the analyzer sweep behind /optimize in 356s. Batched, the four Health
  // tiles that never touch /cost still appeared 27 seconds late, and while the
  // whole batch was outstanding the page had nothing to show at all. Each read
  // now settles on its own and the panel it feeds paints the moment ITS answer
  // lands. /optimize keeps a richer state machine of its own below, because it is
  // the only one slow enough to need a bounded wait.
  //
  // EVERY read below carries `persona`, and every dependency list names it.
  // These panels are stacked on one screen under one "Viewing as" label, so a
  // read that drops it publishes the whole corpus's figures beside its
  // neighbours' scoped ones — and the reader has no way to tell which tile
  // answered the picker. `persona` is therefore a dependency of each read, not
  // just a parameter on it: without that, switching the picker re-labels the
  // page and leaves every figure on it unchanged.
  const costRead = useTriageRead(() => api('/cost', { since, group_by: 'day', persona }), [since, persona]);
  const statusRead = useTriageRead(() => api('/status', { persona }), [persona]);
  const alertsRead = useTriageRead(() => api('/alerts', { since, unread: 'true', persona }), [since, persona]);
  // These two used to send no window and depend on nothing, so the selector
  // above visibly governed three tiles and silently did nothing to the other
  // two: the same clusters and the same drift count came back for 24h and 90d.
  // A control that governs part of a page is worse than none, because a reader
  // cannot tell which figures moved. Both endpoints report the window they
  // actually applied.
  const driftRead = useTriageRead(() => api('/drift', { since, persona }), [since, persona]);
  const tracesRead = useTriageRead(() => api('/traces', { since, limit: 6, persona }), [since, persona]);
  const relearnRead = useTriageRead(() => api('/relearn/proposals', { since, persona }), [since, persona]);
  // The hero band's own read, on its own state machine, same as every other
  // panel here. `past_overspend` (`cost_proposals.past_overspend_rollup`,
  // gathered across cost proposals AND relearn clusters by
  // `inbox_contribution.gather_rollup_population`) is the ONE server-computed,
  // netted cross-analyzer total the Review inbox headline reads too — the
  // hero and the Total opportunity tile below both render `rollupFig`
  // (derived once, just below) instead of summing the six analyzer tiles'
  // own figures client-side, which is what used to double-count once `reuse`
  // and `script` (both cluster on the identical repeated-tool-sequence shape)
  // were left enabled together for one persona (`sdk`).
  const costProposalsRead = useTriageRead(() => api('/relearn/cost-proposals', { since, persona }), [since, persona]);
  const rollupFig = rollupFigure(costProposalsRead);

  // ---- The recoverable-waste read, on its own state machine ---------------- //
  // GET /optimize runs the analyzer sweep server-side. Measured against a real
  // 794MB local corpus over a 30-day window it answered HTTP 200 with five
  // findings after 356s idle and 480s while the page was also polling.
  // `fast=true` only drops `trim`, which is persona-disabled on a claude-code
  // corpus anyway, so the flag buys nothing here. That cost is a server-side
  // problem tracked separately and is not what this code fixes. What this code
  // fixes is the UI's account of it:
  // the band must never turn a non-answer into a claim of absence, and must stay
  // honest for the several minutes an answer can legitimately take without
  // reading as frozen.
  //
  // `phase` is the single source of truth for what the band may say:
  //   'loading' — a sweep is in flight; we do not know yet
  //   'ready'   — a response arrived; `data` is what it said
  //   'timeout' — we stopped waiting; still unknown
  //   'error'   — the read failed; still unknown
  // 'timeout' and 'error' stay distinct because the user's next move differs
  // (keep waiting on something still running, vs. retry something that broke),
  // and neither may ever be rendered as 'ready' with an empty report.
  const [optState, setOptState] = useState({ phase: 'loading', data: null, error: null });
  // A sweep that is still running server-side even though we stopped waiting for
  // it. Tracked separately from `phase` precisely because 'timeout' does NOT
  // mean the request went away.
  const optInFlight = useRef(false);
  const optRun = useRef(0);       // generation counter; stale settles are dropped
  const optTimer = useRef(null);
  // The persona the data currently on screen was fetched AS, so a switch can be
  // told from a plain refresh (see loadOptimize).
  const optPersonaRef = useRef(persona);

  const armOptWait = useCallback(() => {
    const run = optRun.current;
    clearTimeout(optTimer.current);
    optTimer.current = setTimeout(() => {
      // Only a still-'loading' read of THIS generation may time out; a sweep that
      // already answered (or was superseded) is untouched.
      setOptState(s => (optRun.current === run && s.phase === 'loading'
        ? { phase: 'timeout', data: s.data, error: null } : s));
    }, OPTIMIZE_WAIT_MS);
  }, []);

  const loadOptimize = useCallback(() => {
    // Never more than ONE sweep in flight. The 30s poll below used to re-enter
    // this read unconditionally; with a 45s response cache in front of an
    // endpoint that takes minutes, every other poll opened ANOTHER concurrent
    // sweep over the same DuckDB file, so the page got slower the longer it
    // stayed open. That contention is why the same request measured 356s idle
    // and 480s with the page polling.
    if (optInFlight.current) return;
    const run = ++optRun.current;
    optInFlight.current = true;
    // Keep any answer we already hold while refreshing: a slow refresh must not
    // blank numbers that are still the last complete result.
    //
    // EXCEPT across a persona switch, where the answer we hold is an answer to
    // a different question. Keeping it would leave the previous persona's
    // figures on screen under the new persona's label until the read lands —
    // a populated surface asserting something its data does not support. A
    // persona switch is therefore a NOT-YET-KNOWN state (skeletons), not a
    // stale-but-shown one.
    const personaChanged = optPersonaRef.current !== persona;
    optPersonaRef.current = persona;
    setOptState(s => ({ phase: 'loading', data: personaChanged ? null : s.data, error: null }));
    armOptWait();

    const resolve = (next) => {
      optInFlight.current = false;
      clearTimeout(optTimer.current);
      setOptState(s => (optRun.current === run ? next(s) : s));
    };
    // The request is deliberately NOT abandoned when the wait runs out: it is a
    // read whose answer is still worth having whenever it lands, so this handler
    // stays attached past the timeout and fills the band in on its own. The page
    // recovers without the user doing anything, rather than stranding them on a
    // timeout notice for an answer that did eventually arrive.
    // AS THE SELECTED PERSONA — the Dashboard's tiles used to ignore the picker
    // entirely, so a reader viewing as SDK saw a recoverable-waste band built
    // from the claude-code gate.
    api('/optimize', { since, fast: 'true', persona }).then(
      data => resolve(() => ({ phase: 'ready', data, error: null })),
      err => resolve(s => ({ phase: 'error', data: s.data, error: err.message || String(err) })),
    );
  }, [since, persona, armOptWait]);

  // Two different next moves behind one control, because the two unknown states
  // have two different causes. On a TIMEOUT the sweep is still running, so the
  // useful action is to go back to waiting and let it land; firing a second
  // sweep would only add another minutes-long scan of the same DB and slow the
  // first one down. On an ERROR nothing is in flight, so it issues a fresh read.
  const retryOptimize = () => {
    if (optInFlight.current) {
      setOptState(s => ({ phase: 'loading', data: s.data, error: null }));
      armOptWait();
      return;
    }
    loadOptimize();
  };

  useEffect(() => {
    loadOptimize();
    return () => {
      // Invalidate this generation so a late settle cannot write into a view
      // that has moved to a different window.
      optRun.current++;
      optInFlight.current = false;
      clearTimeout(optTimer.current);
    };
  }, [loadOptimize]);

  // Every read refreshes on the same 30s cadence, but each one refreshes ITSELF:
  // useTriageRead's in-flight guard makes a tick a no-op for any read still
  // working, so a slow endpoint is simply polled less often than a fast one
  // instead of holding the fast ones back or stacking queries behind itself.
  // The live reads (/status, /traces, /alerts, /drift) are excluded from the GET
  // cache so each tick refetches them fresh; /cost, /optimize and /relearn honor
  // the short cache TTL (refresh within ~45s).
  //
  // The tick callback is reached through a ref rather than closed over by the
  // effect, so the interval is installed ONCE. Listing the seven refresh
  // callbacks as effect deps would tear down and reinstall the timer on every
  // window change (and any render that changed one of their identities),
  // which on a page whose reads take tens of seconds means a 30s timer that
  // can keep being reset before it ever fires.
  const pollRef = useRef(null);
  pollRef.current = () => {
    costRead.refresh(); statusRead.refresh(); alertsRead.refresh();
    driftRead.refresh(); tracesRead.refresh(); relearnRead.refresh();
    costProposalsRead.refresh();
    // The sweep is polled too, so a wait that timed out still gets picked back
    // up without the user asking; loadOptimize's own in-flight guard makes this
    // a no-op while one is running, so the poll can never stack sweeps.
    loadOptimize();
  };
  useEffect(() => {
    const tick = () => { if (document.visibilityState === 'visible') pollRef.current(); };
    const timer = setInterval(tick, 30000);
    document.addEventListener('visibilitychange', tick);
    return () => { clearInterval(timer); document.removeEventListener('visibilitychange', tick); };
  }, []);

  // Both /drift and /relearn/proposals carry the same `data_span` block
  // (core/data_span.py runs once server-side); take whichever has answered
  // first rather than waiting on both.
  const dataSpan = (driftRead.data && driftRead.data.data_span)
    || (relearnRead.data && relearnRead.data.data_span) || null;
  const availableDays = dataSpan ? dataSpan.available_days : null;
  const winPicker = html`
    <select value=${since} onChange=${e => setWin(e.target.value)}>
      ${windowOptionsWithCurrent(availableDays, since).map(w => html`<option value=${w.value}>${w.label}</option>`)}
    </select>`;

  // Everything derived from /cost is derived from the ANSWER, never from an empty
  // object standing in for one. `costData` is null until the read lands, and each
  // consumer below checks it: framing (so PlanBadge stays absent rather than
  // asserting a plan we have not read), the window total, and the run-rate
  // caption.
  const costData = costRead.data;
  const cost = costData || {};
  const framing = costData ? (cost.framing || null) : null;
  // LOCAL only -- subscription no longer suppresses (product decision: tj
  // does not differentiate subscription-billed from API-billed users).
  const useTokens = !!framing && framing.pricing_mode === 'local';
  // Series only used to gate the run-rate projection (the chart itself is the
  // explorer's now — spend de-dup); window total drives the run-rate caption.
  const series = costData ? buildCostSeries(cost, 'total', useTokens) : null;
  const cyc = cycleRemaining(cost.cycle);
  let projection = null;
  if (series && series.data[1] && series.data[1].length) {
    const windowTotal = useTokens ? (cost.total_tokens || 0) : (cost.total_cost_usd || 0);
    const projected = runRateProjection(windowTotal, since, 1) * cyc.days;
    projection = useTokens ? (fmtTokens(Math.round(projected)) + ' tokens') : fmtFramedDollar(projected, framing, fmtDashUsd);
  }

  // ---- The front door's own claim ------------------------------------------ //
  // "No data yet. TokenJam is listening." asserts that this user has recorded
  // nothing, so all three of its inputs must have ANSWERED before it may be
  // shown. A /cost, /status or /traces read that is outstanding or failed means
  // "we could not check", never "you have none"; while any of them is unknown the
  // page renders the normal bands, which state their own uncertainty, instead of
  // telling a user with a full history that nothing has been recorded.
  const statusAgents = (statusRead.data && statusRead.data.agents) || [];
  const traceList = (tracesRead.data && tracesRead.data.traces) || [];
  const hasCost = !!costData && ((cost.total_cost_usd || 0) > 0 || (cost.total_tokens || 0) > 0);
  const emptyKnown = !!costData && !!statusRead.data && !!tracesRead.data;
  const isEmpty = emptyKnown && !hasCost && !statusAgents.length && !traceList.length;

  // Tiles are derived ONLY from an answer we actually hold. Passing an absent
  // report into recoverableTiles() is the original bug in one line: a missing
  // report and an empty report both flatten to [], and the band then printed
  // "No recoverable candidates." for a read that had simply not come back.
  const optData = optState.data;
  const tiles = optData ? recoverableTiles(optData) : [];
  const bandState = recoverableBandState(optState.phase, optData, tiles.length);
  // The compute-layer view of the SAME payload the phase machine above tracks.
  // One read, one stored artifact, so the recoverable band and the budgets tile
  // below cannot disagree about how fresh their figures are or whether anything
  // has been computed at all.
  const scan = scanState(optData);
  const {
    busy: rescanning, error: rescanError, declined: rescanDeclined,
    declinedDetail: rescanDeclinedDetail, rescan: doRescan,
  } = useRescan(loadOptimize);
  useAutoRefresh(scan, loadOptimize);

  // Budgets ride on the same /optimize payload, so the "Budgets at risk" tile
  // inherits that read's outcome: 0 with the caption "none configured" is a
  // claim about the user's config, and an unanswered sweep cannot make it.
  const budgets = (scan.known && optData.budgets) || [];
  const budgetAttn = budgets.filter(b => b.over_budget || (b.budget_usd > 0 && b.projected_cycle_total / b.budget_usd > 0.8)).length;
  // Mirrors the band's own phase rather than flattening to "failed": a sweep
  // still running past the wait says "still scanning", one that errored says it
  // couldn't load, and the two must not be reported as the same thing. A COLD
  // store is a third case that answered its request while holding nothing:
  // `optData` is truthy, so the old `optData ? 'ready'` would have printed a
  // confident `0` under "none configured" — a claim about the user's config
  // that an un-run scan cannot make.
  const budgetStatus = scan.known ? 'ready' : (optData ? 'cold' : optState.phase);

  // Each remaining health figure comes from its OWN read, and readStatus() is
  // what decides whether the figure may be shown at all. Each tile therefore
  // paints as soon as its own endpoint answers: /alerts and /drift no longer wait
  // behind the 27-second /cost read they have nothing to do with.
  const alertList = (alertsRead.data && alertsRead.data.alerts) || [];
  // Guarded on the read's OWN scope answer, not just on the finding being
  // present: an unscoped ledger returns `finding: null`, and `[]` from that is
  // "we have not measured", not "no recurring mistakes". `readStatus` keeps the
  // tile in its skeleton for exactly that case, so this length is never
  // published as a count.
  const relearnClusters = (relearnRead.data && relearnRead.data.persona_scoped !== false
    && relearnRead.data.finding && relearnRead.data.finding.clusters) || [];
  const errTraces = traceList.filter(t => t.status_code === 'error').length;

  // Run-rate projection folded into a one-line caption under the explorer's KPI
  // row — the dashboard's single spend headline lives there, not as a separate
  // chart (de-dup). Framed: tokens for LOCAL (no marginal cost to price at
  // all), the dollar figure (via fmtFramedDollar, fmtDashUsd's 2dp) for
  // api/subscription/unknown. Requires `projection`, which requires
  // `costData`, so this caption cannot be built from an unanswered read.
  // Run-rate caption removed from the Dashboard (founder review, 2026-07-30).
  const kpiCaption = null;

  return html`
    <div class="ov-head">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <div class="page-title" style="margin:0">Dashboard</div>
        <${PersonaPicker} bare=${true} />
        <${PlanBadge} framing=${framing} />
      </div>
      <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
        <${ScanBar} scan=${scan} busy=${rescanning} error=${rescanError} declined=${rescanDeclined} declinedDetail=${rescanDeclinedDetail} onRescan=${doRescan} />
      </div>
    </div>
    ${isEmpty ? html`<div class="card" style="max-width:560px"><div class="card-header">No data yet. TokenJam is listening.</div><p style="color:var(--text-dim);font-size:13px;margin:8px 0 0">Run an agent (or <code>tj demo retry-loop</code>) and the recurring mistakes, spend, and health show up here.</p></div>`
      : html`
        <!-- The hero: the ONE past-tense "recoverable now" headline. A hero
             band used to sit here, was removed ("read as heavy at the top of
             the page"), and now ships again on explicit founder direction —
             lead with one clubbed avoidable-dollar figure, then the fix path.
             The two rules the removal note left behind still hold and are
             why this stays a SEPARATE band rather than folding into the
             triage row below: it is a PAST-TENSE diagnosis of money already
             spent, so it must not sit inside the triage band, whose tiles
             are forward-looking opportunity figures in accent-blue —
             different row, different colour treatment, different tense, so
             a reader can never add the two together. And its number is the
             ONE server-computed, netted rollup (rollupFig, sourced from the
             GET /relearn/cost-proposals past_overspend block) shared
             verbatim with the Total opportunity tile in the triage row below
             — never a client-side reduction over whatever cards happen to be
             rendered on this page. -->
        <${HeroBand} fig=${rollupFig} framing=${framing} cost=${costData} />
        <!-- Triage band: recoverable waste + health. Spend is NOT shown here —
             it lives once, in the explorer's Spend KPI tile + chart below. -->
        ${/* No blanket "the whole band is loading" shimmer any more. That single
              90px grey rectangle stood in for BOTH bands until the slowest read
              in the batch resolved, which on a large corpus meant several
              minutes of an anonymous grey box that named nothing it was waiting
              for. Each band now renders its own labelled structure immediately
              and each tile states its own read's status, so the page is
              legible from the first paint. */ ''}
        ${/* A /cost failure is reported as a SCOPED banner, not by replacing the
              bands. It used to blank the whole triage row ("Couldn't load
              triage"), which threw away five health tiles whose reads had
              nothing to do with /cost and may well have succeeded. The banner
              names what is missing (the spend framing and the run-rate caption)
              and everything else keeps rendering. */ ''}
        ${costRead.phase === 'error' && !costData ? html`
          <div class="band-msg err" style="margin-bottom:14px">
            <b>Couldn't load spend for this window.</b>
            <p>${costRead.error}</p>
            <p>The plan badge and the run-rate caption are missing because of it; everything else on this page is unaffected.</p>
            <button class="btn" onClick=${costRead.refresh}>Try again</button>
          </div>` : null}
        ${html`
            <div class="dash-triage">
              <div class="dash-col">
                ${/* The band states its OWN window, beside the figures rather
                      than only in the provenance bar at the top of the page.
                      These tiles come from a stored analyzer pass, so the
                      window is the one that pass ran at — NOT the `since` the
                      page's own picker is set to, which re-scopes the live
                      spend chart below and nothing here. Two surfaces published
                      this metric under two windows and neither said so; the
                      windows are one seam now (core/optimize/report_window.py)
                      and each surface still names it, because a figure whose
                      window the reader cannot see is not auditable. */ ''}
                <div class="section-band">Opportunities to optimize token efficiency${scan.windowDays ? html`<span class="hint">· over the last ${scan.windowDays}d</span>` : null}</div>
                ${/* recoverableBandState() decided which of the six states this
                      is; the branches below only render. The ONE branch allowed
                      to say there is nothing recoverable is 'none', which
                      requires a completed response. */ ''}
                ${bandState === 'scanning' ? html`
                  <div class="tile-grid compact opp-grid">
                    ${/* Mirrors the answered tile below: name line, amount line,
                          two clamped hint lines, inside the real .rec-tile box.
                          Same bar-height-tracks-font-size convention the Review
                          inbox's skeletons use, so the two pages read as one. */ ''}
                    ${REC_SKELETON_TILES.map(i => html`
                      <div class="rec-tile rec-skel" key=${i} aria-hidden="true">
                        <div class="shimmer" style="height:12px;width:52%"></div>
                        <div class="shimmer" style="height:15px;width:64%;margin-top:8px"></div>
                        <div class="shimmer" style="height:10px;width:100%;margin-top:8px"></div>
                        <div class="shimmer" style="height:10px;width:78%;margin-top:4px"></div>
                      </div>`)}
                  </div>
                  <div class="band-note">Scanning your history for optimization opportunities. On a large history this can take several minutes; the tiles fill in as soon as the scan answers.</div>` : null}
                ${bandState === 'cold' ? html`
                  <div class="band-msg">
                    <b>No scan has run yet.</b>
                    <p>Analyzer results are computed in the background by <code>tj serve</code>, not on page load. Nothing has been measured for this history yet, so this band is showing you nothing rather than a zero; an un-run scan is not an all-clear.</p>
                    ${scan.status === 'error' && scan.lastError ? html`<p>The last attempt failed: ${scan.lastError}</p>` : null}
                    <button class="btn" onClick=${doRescan} disabled=${rescanning}>${rescanning ? 'Scanning\u2026' : 'Scan now'}</button>
                  </div>` : null}
                ${bandState === 'timeout' ? html`
                  <div class="band-msg warn">
                    <b>Still scanning after ${OPTIMIZE_WAIT_MIN} minutes.</b>
                    <p>We don't know yet whether there is overspend in this window. The scan hasn't answered; that is not the same as an all-clear, so this band is showing you nothing rather than a zero.</p>
                    <button class="btn" onClick=${retryOptimize}>Keep waiting</button>
                  </div>` : null}
                ${bandState === 'failed' ? html`
                  <div class="band-msg err">
                    <b>Couldn't scan for optimization opportunities.</b>
                    <p>${optState.error || 'The request failed.'}</p>
                    <p>Until this succeeds there is no basis for saying whether overspend exists here, so no figure is shown.</p>
                    <button class="btn" onClick=${retryOptimize}>Try again</button>
                  </div>` : null}
                ${bandState === 'stale' ? html`
                  <div class="band-stale">
                    ⚠ the latest scan ${optState.phase === 'timeout' ? 'has not answered yet' : 'failed'}; these are the last complete results
                    <span class="sz-link" onClick=${retryOptimize}>${optState.phase === 'timeout' ? 'keep waiting' : 'try again'}</span>
                  </div>` : null}
                ${bandState === 'tiles' || bandState === 'none' || bandState === 'stale' ? html`
                <div class="tile-grid compact opp-grid">
                  ${tiles.length === 0 ? html`<div class="empty">No overspend found.</div>`
                    : html`<${TotalOpportunityTile} fig=${rollupFig} framing=${framing} />${(() => {
                      // Share-of-recoverable bar, rank-ordered: `tiles` already arrives
                      // biggest-waste-first (rankTiles/finding_rank, server-side), so a
                      // tile's RANK among the tiles that actually carry a figure is just
                      // its position in that filtered subset — never re-derived from the
                      // dollar amount, which would fight the server's own tie-breaking.
                      // Reuses totalOpportunityFigure's contributor sum (same rounding as
                      // the Total tile) so a share can never disagree with what the Total
                      // tile displays it summing into. Color comes from the rank/tone
                      // ramp (--tone-1..7, biggest = whitest), clamped at 7 — the same
                      // convention as every other rank-ordered visual in this app.
                      const fig = totalOpportunityFigure(tiles);
                      let rank = 0;
                      return tiles.map(t => {
                        const meta = ANALYZER_META[t.name] || { title: capitalize(t.name), hint: '' };
                        // ONLY a tile with a real finding is clickable (Option B,
                        // founder-approved): it routes straight to that analyzer's
                        // own detail sub-page (#/optimize/<name>), where the
                        // number's evidence and fix live. Empty-state tiles
                        // ("No candidates" / "Not ready") and the positive
                        // at-ceiling tile stay rendered for transparency but are
                        // NOT links — no href, no pointer, no hover — because there
                        // is no detail page for them to open. Has-data is decided by
                        // the SAME predicate the submenu + summary list use
                        // (state === 'actionable' + a known detail analyzer).
                        const hasPage = t.state === 'actionable' && DETAIL_ANALYZER_NAMES.has(t.name);
                        const href = '#/optimize/' + t.name;
                        const isContributor = t.state === 'actionable' && t.usd != null;
                        const amount = t.state === 'actionable' ? fmtFramedSavings(t.usd, t.tokens, framing, fmtDashUsd)
                          : t.state === 'at_ceiling' ? ('✓ ' + t.metric)
                          : t.state === 'no_findings' ? 'No candidates' : 'Not ready';
                        const cls = t.state === 'actionable' ? 'rec-tile' : (t.state === 'at_ceiling' ? 'rec-tile ok static' : 'rec-tile muted static');
                        const amtCls = t.state === 'actionable' ? 'rec-amount' : (t.state === 'at_ceiling' ? 'rec-amount ok' : 'rec-amount dim');
                        // Brief context so the tile says what the number means,
                        // not just how big it is — the specific
                        // not-ready reason when there is one, else what the
                        // analyzer measures.
                        const explain = t.state === 'not_ready' && t.hint ? t.hint : meta.hint;
                        let share = null;
                        if (isContributor) {
                          rank += 1;
                          const tone = 'var(--tone-' + Math.min(rank, 7) + ')';
                          const pct = fig.totalUsd > 0 ? (roundToCents(t.usd) / fig.totalUsd) * 100 : 0;
                          share = html`
                            <div class="rec-share"><span style="width:${pct}%;background:${tone}"></span></div>
                            <div class="rec-share-label">${pct.toFixed(0)}% of recoverable</div>`;
                        }
                        const inner = html`
                          <div class="rec-name">${meta.title}</div>
                          <div class=${amtCls}>${amount}</div>
                          ${share}
                          ${explain ? html`<div class="rec-hint">${explain}</div>` : null}`;
                        return hasPage
                          ? html`<a class=${cls} href=${href}>${inner}<span class="rec-go" aria-hidden="true">→</span></a>`
                          : html`<div class=${cls}>${inner}</div>`;
                      });
                    })()}`}
                </div>` : null}
              </div>
              <div class="dash-col health-glance">
                <div class="section-band">Health at a glance</div>
                ${/* Every tile below carries the status of the read it is derived
                      from. Each one used to take its figure from a `.catch(() =>
                      <empty>)` fallback, so a failed read published a 0 with a
                      reassuring caption: "0 unread alerts / all clear",
                      "0 agents drifting / within baseline", "0 budgets at risk /
                      none configured". Those are the worst possible lies on a
                      health band, because a zero here reads as "you are fine".
                      An unanswered read now renders a shimmer or a "?" and says
                      which it is. Each `status` names the tile's OWN read, which
                      is also why the tiles no longer appear together: each one
                      paints when its own endpoint answers. */ ''}
                <div class="tile-grid compact">
                  <${HealthTile} label="Pending fixes" value=${relearnClusters.length} attention=${relearnClusters.length > 0} href="#/optimize/rules"
                    status=${readStatus(relearnRead)} sub="recurring mistakes → rules" />
                  <${HealthTile} label="Unread alerts" value=${alertList.length} attention=${alertList.length > 0}
                    status=${readStatus(alertsRead)}
                    href="#/alerts?unread=true" sub=${alertList.length ? alertList[0].severity : 'all clear'} />
                  ${/* The "Agents drifting" tile is GONE from this band by
                        founder decision, along with every other way in. The
                        read behind it (`driftRead`) stays: it is this page's
                        source for `data_span`, and `driftSignalCount` is still
                        defined. Nothing renders its figure, and nothing links
                        to #/drift. See UNSURFACED_VIEWS. */ ''}
                  <${HealthTile} label="Budgets at risk" value=${budgetAttn} attention=${budgetAttn > 0} href="#/budget"
                    status=${budgetStatus}
                    sub=${budgets.length ? (budgetAttn ? 'over / near ceiling' : 'within ceiling') : 'none configured'} />
                  <${HealthTile} label="Recent activity" value=${traceList.length} attention=${errTraces > 0} href=${tracesHrefForWindow(since)}
                    status=${readStatus(tracesRead)} sub=${errTraces ? (errTraces + ' with errors') : 'last sessions'} />
                </div>
              </div>
            </div>`}

        <!-- The HERO: the embedded Analytics pivot explorer. Spend lives here
             once (Spend KPI tile + chart); the run-rate projection is the caption. -->
        <div id="dash-explore" class="section-band" style="margin-top:28px;padding-top:22px;border-top:1px solid var(--border)">Spend exploration <span class="hint">· slice and dice by model, agent, tool, provider and more</span></div>
        <div style="display:flex;align-items:center;gap:8px;margin:10px 0 2px"><span class="persona-bar-label">Window</span><div class="filters" style="margin:0">${winPicker}</div></div>
        <${AnalyticsView} params=${params} route="dashboard" embedded=${true} kpiCaption=${kpiCaption} />`}
  `;
}

// ============================
// App Router — keep-alive
// ============================
// Each PRIMARY sidebar view mounts once and then STAYS mounted; navigation
// toggles visibility (display:none) instead of unmounting, so a view's
// component state + already-fetched data survive navigation and returning to a
// page is instant with no re-fetch spinner. The registry is the single source
// of truth for view → component wiring (it replaced the switch-and-unmount
// router). Detail/param views (session/trace/run detail) are NOT kept alive —
// they mount fresh per id via detailNodeFor (a brief load on drill-in is
// expected and fine).
const PRIMARY_VIEWS = [
  ['dashboard', DashboardView],
  ['sessions',  StatusView],
  ['traces',    TracesListView],
  ['cost',      CostView],
  ['optimize',  OptimizeView],
  ['summarize', SummarizeView],
  ['rules',     RulesView],
  ['faq',       AnalyzerGuideView],
];
// AlertsView / DriftView / BudgetView are deliberately NOT primary views any
// more: primaryKeyFor resolves their routes to 'sessions', and StatusView
// renders them inside its SDK-services zone. Leaving them here would mount
// three panes the router can never activate, each firing its own boot fetch.
const PRIMARY_KEYS = new Set(PRIMARY_VIEWS.map(([k]) => k));
const EMPTY_PARAMS = new URLSearchParams();
const WARM_STAGGER_MS = 120;   // gap between mounting each warmed-on-boot view

// Map a raw route to the keep-alive primary key that frames it. #/overview and
// #/analytics are retired aliases for the Dashboard (the standalone Analytics
// screen was the same AnalyticsView the Dashboard already embeds as its
// "Explore" section, so the separate route was a second door to one room);
// #/status and #/runs are silent aliases for Sessions (they render the same
// StatusView); #/optimize/summarize is the Summarize sub-view. The FAQ (nee
// analyzer guide) is a TOP-LEVEL route (#/faq) — it was briefly a sub-view of
// Optimize, which made its sidebar entry a nav-child and therefore invisible
// from every other screen; `#/optimize/guide` and `#/guide` both survive as
// silent aliases so any link that already points at an old hash keeps working
// (the effect in App() rewrites the address bar to the canonical form).
// Anything else is its own view key.
function primaryKeyFor(route) {
  const v = route.view;
  // The Review-actions page was retired (its apply lifecycle moved onto the
  // Optimize detail pages, its summary onto the Dashboard ACTIONS band). A stale
  // #/review deep-link aliases to the Dashboard rather than 404ing.
  if (v === 'overview' || v === 'analytics' || v === 'review') return 'dashboard';
  if (v === 'status' || v === 'runs') return 'sessions';
  // Alerts / Budget are TABS of the Sessions screen's SDK-services zone, not
  // screens of their own — neither is per-session (budget is spend caps, alerts
  // fire across agents), so they attach to the zone rather than to a session
  // card. Their own hashes survive as the tab's address, which keeps every
  // existing deep link and bookmark working; StatusView reads route.view to
  // pick the open tab.
  if (SESSIONS_SDK_TAB_VIEWS.has(v)) return 'sessions';
  // An UN-SURFACED view's hash must not resolve to that surface. #/drift is a
  // live route in every old bookmark and in this file's own history, so it
  // aliases to Sessions rather than 404ing or reaching DriftView, which is
  // still present in the bundle (see UNSURFACED_VIEWS).
  if (UNSURFACED_VIEWS.has(v)) return 'sessions';
  if (v === 'optimize' && route.param === 'summarize') return 'summarize';
  if (v === 'optimize' && route.param === 'rules') return 'rules';
  if (v === 'optimize' && route.param === 'guide') return 'faq';
  if (v === 'guide') return 'faq';
  return v;
}

// True for the retired `#/optimize/guide` and `#/guide` hashes only. Kept as a
// named predicate so the alias is stated once and both the router and the
// canonicalising effect read the same rule.
function isLegacyGuideRoute(route) {
  return (route.view === 'optimize' && route.param === 'guide') || route.view === 'guide';
}

// Detail overlay for an id-keyed drill-in (mounts fresh per id), else null.
// Only session/trace/run detail are id-keyed; summarize is a kept-alive
// sub-view (in PRIMARY_VIEWS), not a per-id detail.
function detailNodeFor(route) {
  const id = route.param;
  if (!id) return null;
  if (route.view === 'sessions' || route.view === 'status') return html`<${SessionDetailView} sessionId=${id} />`;
  if (route.view === 'traces') return html`<${TraceDetailView} traceId=${id} />`;
  if (route.view === 'runs') return html`<${RunDetailView} runId=${id} />`;
  return null;
}

// Which views each persona is offered. A coding-agent user (Claude Code, and
// Codex once it is supported) is not shown the observability suite at all: none
// of it ends in an edit they can make. An SDK user keeps it.
//
// This is a VIEW filter over one dataset, never a claim about the data. It
// hides pages; it never changes a number, and it never implies the hidden
// pages found nothing.
// (Plain arrays, not Sets keyed by persona: a persona-keyed `new Set(...)`
// literal is the shape the analyzer gate map would take if someone ever
// duplicated it into JS, and a regression test forbids that shape outright.
// These are VIEW names, an entirely different concern from the analyzer gate,
// but the guard is worth keeping blunt.)
//
// `alerts` / `drift` / `budget` are ABSENT from both lists and that is not an
// oversight: they are no longer top-level views at all. None of them is
// per-session (drift is per-agent baselines, budget is spend caps, alerts fire
// across agents), so they live inside the Sessions page's SDK-services zone,
// which is itself SDK-only — see SESSIONS_SDK_TABS and primaryKeyFor. Their
// visibility is therefore decided by that zone, not here.
const PERSONA_HIDDEN_VIEWS = {
  'claude-code': ['traces', 'cost'],
  'sdk': ['cost'],
};

// A view hidden under EVERY persona key is reachable by nobody, and that state
// is indistinguishable from the defect where a list was copied to a second
// persona by mistake — the next reader "fixes" it back. So a view hidden
// everywhere ON PURPOSE has to record WHY here, and a regression test fails if
// one is hidden under every key without an entry.
const PERSONA_HIDDEN_DELIBERATE = {
  cost: 'Spend (and the Budget cap it pairs with) stays hidden for both '
      + 'personas for now: it reports what was spent rather than terminating in '
      + 'a fix, which is the bar every surface in this product has to clear. '
      + 'The screens are built and routed — this is a product decision to keep '
      + 'them out of the nav, not a page that does not work.',
};

// `known` is the third state and it is why this takes three arguments. Until
// the persona read lands, the answer is NOT-YET-KNOWN, and hiding on an
// unresolved read applies a real persona's rules to a reader who may not be
// that persona — the page silently loses entries it should have. Hiding
// nothing is the honest default: a view that appears and then goes away is
// recoverable, a view the reader never learns exists is not.
// THE VIEWS NO RESOLUTION CAN MAKE REACHABLE: hidden under EVERY persona key.
// DERIVED from the lists rather than written out, so removing an entry from one
// of them moves a view out of this set automatically instead of leaving a
// hardcoded copy hiding a row that is now legitimately reachable.
//
// This is the third state the nav was missing. `personaHides` answers "does
// THIS persona hide it", and correctly answers no while the persona is unknown
// (see its note). But a view every persona hides is not a question the persona
// read can settle: whichever way it lands, the row goes. Showing it meanwhile
// asserts a route the reader can click and get nothing from, which is the same
// over-claim as any other surface stating more than its data supports; hiding
// it costs nothing, because there is no answer under which it should return.
//
// `App()` resolves `persona` to a key of PERSONA_HIDDEN_VIEWS in every case (an
// unclassified corpus falls back to `claude-code`), so an intersection over
// those keys really is "under every persona a reader can end up as".
const PERSONA_HIDDEN_EVERYWHERE = (() => {
  const lists = Object.keys(PERSONA_HIDDEN_VIEWS).map(k => PERSONA_HIDDEN_VIEWS[k]);
  if (!lists.length) return new Set();
  return new Set(lists[0].filter(v => lists.every(l => l.indexOf(v) !== -1)));
})();

// Hidden under SOME persona but not all, so the persona read genuinely decides
// it. These are the rows that get the not-yet-known treatment while it is in
// flight: present, but visibly unsettled rather than asserted.
function personaMayHide(view) {
  return Object.keys(PERSONA_HIDDEN_VIEWS).some(
    k => PERSONA_HIDDEN_VIEWS[k].indexOf(view) !== -1,
  );
}

function personaHides(persona, view, known) {
  if (!known) return false;
  const hidden = PERSONA_HIDDEN_VIEWS[persona];
  return !!(hidden && hidden.indexOf(view) !== -1);
}

// The Sessions page's SDK-only sub-tabs. Each is a real route (so a deep link
// and a bookmark keep working) that primaryKeyFor resolves to the Sessions
// page, where it renders inside the SDK-services zone rather than as a
// top-level nav entry of its own.
const SESSIONS_SDK_TABS = [
  ['services', 'Sessions'],
  ['alerts', 'Alerts'],
  ['budget', 'Budget'],
];
const SESSIONS_SDK_TAB_VIEWS = new Set(['alerts', 'budget']);

// THE BASELINE-COMPARISON SURFACE IS UN-SURFACED, NOT DELETED (founder
// decision). `DriftView`, `driftSignalCount`, the `/drift` endpoint, the
// detector and its baselines all still exist and are still covered by their
// tests. What was removed is every way a reader can ARRIVE at it: no nav entry,
// no tab, no health tile, no link, and `#/drift` is now a silent alias for the
// Sessions screen (see primaryKeyFor) so an old bookmark lands somewhere real
// instead of resolving to the surface. Re-surfacing is a wiring change, not a
// rebuild: add the entry back to the two lists above and render the component
// in StatusView's SDK zone.
const UNSURFACED_VIEWS = new Set(['drift']);

// Whether a ROUTE is unreachable for this persona — the superset of
// personaHides, covering the Sessions sub-tabs too. Those are not top-level
// views, so they are not in PERSONA_HIDDEN_VIEWS; they are reachable exactly
// when the SDK-services zone that hosts them is, i.e. not for claude-code.
// Same not-yet-known rule: an unresolved persona redirects nobody.
function personaHidesRoute(persona, view, known) {
  if (!known) return false;
  if (SESSIONS_SDK_TAB_VIEWS.has(view)) return persona === 'claude-code';
  return personaHides(persona, view, known);
}

/** The persona switcher, pinned above every page.
 *
 * View-only by design: it defaults to whatever the corpus looks like and
 * resets on reload, so it can never drift out of sync with the ingested data
 * the way a stored preference would. Both personas are always offered, even
 * one with no data — someone evaluating the SDK view should be told plainly
 * that this machine has no SDK workflows rather than find the option missing
 * and be left guessing whether it is supported.
 */
const PersonaCtx = createContext(null);

// The switcher itself, position-free. Rendered by whichever container owns the
// spot: a page's own header-right group when it has one, otherwise the floated
// fallback below. Reads context rather than props so a page can place it
// without every view having to thread persona state down to its header.
function PersonaPicker({ bare } = {}) {
  const ctx = useContext(PersonaCtx);
  if (!ctx) return null;
  const { persona, detected, known, counts, onChange } = ctx;
  const opts = [['claude-code', 'Claude Code'], ['sdk', 'SDK workflows']];
  // `bare` (the Dashboard heading) renders just the dropdown, no "Viewing as"
  // label — it sits next to the "Dashboard" title, where the context is obvious.
  // Until the read lands there is no persona to name, so the picker must not
  // name one. It renders a neutral placeholder rather than the fallback value:
  // asserting "Claude Code" on an SDK-dominant corpus and swapping a moment
  // later is the same not-yet-known-rendered-as-known defect the nav had. It
  // stays ENABLED throughout, because an explicit pick is how a reader answers
  // the question early, and `onChange` marks the context settled.
  const select = html`
    <select class=${'persona-select' + (known ? '' : ' persona-select-pending')}
            aria-label="Persona" aria-busy=${known ? null : 'true'}
            value=${known ? persona : ''} onChange=${(e) => onChange(e.currentTarget.value)}>
      ${known ? null : html`
        <option value="" disabled selected>Detecting workflow...</option>`}
      ${opts.map(([value, label]) => html`
        <option key=${value} value=${value} selected=${known && persona === value}>${label}</option>`)}
    </select>`;
  return html`
    <span class="persona-pick">
      ${/* No id + for pairing here. App keeps every visited primary view
            MOUNTED (hidden with display:none), so several of them render their
            own picker at once and a fixed id would be duplicated across the
            document. The label wraps its control instead, which associates the
            two without needing a global identifier. */''}
      ${bare ? select : html`<label class="persona-bar-label">Viewing as ${select}</label>`}
    </span>`;
}

// THE views that show the persona picker, and the ONLY ones. Each renders it
// itself, in its own header beside the page title.
//
// This used to be a list of views with a header slot, with every OTHER view
// getting a floated fallback bar instead — which put the same control top-LEFT
// beside the title on some pages and top-RIGHT on others, so it moved as the
// reader navigated. The fallback is deleted rather than restyled: a control
// that has to be positioned twice will drift twice.
//
// Membership is decided by whether the persona changes what the page SHOWS, not
// by whether the page has somewhere convenient to put a dropdown. FAQ, Relearn
// and Summarize read no persona and render identically for either one, so a
// picker there is a control that changes nothing — worse than an inconsistent
// one, because it invites the reader to believe the page responded. Spend is
// absent for the same reason plus a stronger one: it is hidden from both
// personas (see PERSONA_HIDDEN_DELIBERATE).
//
// `traces` earns its place by the same test: `GET /traces` takes a persona and
// scopes the rows, the total count and the outlier quartiles to it, so the page
// genuinely shows something different for each. It was excluded while it read
// no persona — correctly, on this rule — and the rule is what moved it, not an
// exception to it.
//
// `review` was in the predecessor of this list and is gone: that route has
// aliased to the Dashboard since the Review page was retired, so the entry
// matched no view at all.
const PERSONA_PICKER_VIEWS = new Set(['dashboard', 'optimize', 'sessions', 'traces']);

// Reconcile the sidebar to the current route + persona: active-highlight, reveal
// the active section's nav-children, and keep the lens pill in sync. Module-level
// so both the route-sync effect and the nav-child injection effect (which adds
// Optimize children mid-session) can re-apply the same rules to the DOM as it
// stands right now. Pure DOM work — reads no React state beyond its args.
function syncNavState(view, param, persona, personaKnown) {
  const sidebar = document.querySelector('.sidebar');
  // EMPTY until the persona is settled, so every `[data-persona="..."]` CSS
  // hide rule fails to match and the nav shows everything. The same
  // not-yet-known rule personaHides follows, applied to the half of the gating
  // that lives in CSS — a placeholder persona must not silently remove rows.
  const personaAttr = personaKnown ? persona : '';
  if (sidebar) sidebar.dataset.persona = personaAttr;
  document.body.dataset.persona = personaAttr;
  document.querySelectorAll('.nav-link').forEach(el => {
    const v = el.dataset.view || '';
    // Independent of `personaKnown` on purpose, and the ONE hide that is: a view
    // every persona hides has no answer under which it comes back, so waiting
    // for the read buys nothing and showing it meanwhile advertises a route that
    // renders nothing when clicked.
    el.dataset.personaUnreachable = PERSONA_HIDDEN_EVERYWHERE.has(v) ? '1' : '0';
    if (el.classList.contains('nav-child')) {
      // "Click Optimize → expand": show a child only while its section is active.
      // A child gated out for the current persona (data-optimize-hidden, set by
      // App()'s submenu effect — e.g. Summarize/Rules on a no-data persona, #671)
      // stays hidden regardless of the active section, so re-running this on a
      // route change can't reveal a child the persona has no content for.
      const gated = el.dataset.optimizeHidden === '1';
      el.style.display = (!gated && v === view) ? 'flex' : 'none';
      el.classList.toggle('active', !gated && v === view && (el.dataset.param || '') === param);
    } else {
      // A parent yields the highlight to a child that matches the current param.
      const childActive = v === view && param !== '' &&
        !!document.querySelector('.nav-child[data-view="' + v + '"][data-param="' + param + '"]');
      // `data-view-alt` lets ONE row cover a second view that has no row of its
      // own — Spend covers Budget, which is a tab of that screen rather than a
      // sibling entry. Without it the sidebar goes dark on the Budget tab and
      // the reader loses where they are.
      // `data-view-alt` is a COMMA LIST, not one name: Sessions now covers
      // alerts / drift / budget, which are tabs of that screen rather than
      // sibling entries. A single-value comparison went dark on every one of
      // them and the reader lost where they were.
      const alt = (el.dataset.viewAlt || '').split(',').filter(Boolean);
      el.classList.toggle('active', (v === view && !childActive) || alt.indexOf(view) !== -1);
      // NOT-YET-KNOWN, for the rows the persona read actually decides. `traces`
      // is hidden for claude-code and shown for sdk, so until the read lands
      // neither rendering it normally nor removing it is honest: one advertises
      // a route that may vanish, the other removes one the reader may be
      // entitled to. It renders present but visibly unsettled instead, the same
      // third state the Optimize submenu's own pending entries use.
      const pending = !personaKnown && el.dataset.personaUnreachable !== '1'
        && personaMayHide(v);
      el.classList.toggle('nav-link-pending', pending);
      if (pending) el.setAttribute('aria-busy', 'true');
      else el.removeAttribute('aria-busy');
    }
  });
}

function App() {
  const [route, setRoute] = useState(getRoute());

  // Persona: detected from the corpus, overridable for the session only.
  // `known:false` until the read lands, so nothing downstream renders a count
  // or a "you have none of these" claim off an unanswered fetch.
  const [personaInfo, setPersonaInfo] = useState({ known: false, detected: 'unknown', counts: null });
  const [personaOverride, setPersonaOverride] = useState(null);
  // WHETHER the persona is settled, tracked separately from WHAT it is. The
  // picker needs a concrete value to render at all times, so `persona` still
  // falls back to a real key before the read lands — but that fallback must
  // never be allowed to HIDE anything, because it is a placeholder rather than
  // an answer. Everything that gates on persona takes `personaKnown` alongside
  // it and treats false as "hide nothing" (see personaHides). An explicit user
  // choice is settled by definition, whether or not the fetch has landed.
  const personaKnown = personaOverride != null || personaInfo.known;
  const persona = personaOverride
    || (personaInfo.known && PERSONA_HIDDEN_VIEWS[personaInfo.detected] ? personaInfo.detected : 'claude-code');
  const setPersona = (p) => setPersonaOverride(p);

  useEffect(() => {
    let cancelled = false;
    api('/persona')
      .then(d => { if (!cancelled && d) setPersonaInfo(d); })
      .catch(() => {});
    return () => { cancelled = true; };
  }, []);

  // The Optimize submenu must mirror what the Optimize VIEW shows for the
  // CURRENTLY SELECTED persona, not a mount-time snapshot of the data-dominant
  // one (#671). Two things make it persona-aware:
  //   1. It re-derives whenever `persona` changes (the toggle is client-side,
  //      so nothing else re-triggers this).
  //   2. When the selected persona has NO data on this machine (the same
  //      `usePersonaHasNoData` signal the view's empty gate uses), the submenu
  //      is EMPTY — no analyzer children and no Summarize/Rules — because "you
  //      have no SDK workflows here" is a different statement from "your SDK
  //      workflows cost nothing", and every child would otherwise assert the
  //      second. This also covers analyzers gated for the persona (e.g. Subagent
  //      under SDK), since a no-data persona yields no children at all.
  //   3. It asks the SERVER for the report AS the selected persona
  //      (`GET /optimize?persona=...`), so the analyzer set it derives from is
  //      gated for what the reader is looking at rather than for whichever
  //      persona happens to dominate the corpus.
  // The dynamic analyzer children come from the SAME stored /optimize artifact
  // every other surface reads (optimizeDetailAnalyzers already drops
  // persona_disabled_analyzers + non-actionable findings), so the submenu, the
  // summary landing, and the Dashboard tiles cannot disagree. Best-effort: a
  // failed read leaves an empty dynamic set, never an error.
  const personaHasNoData = personaInfo.known && personaInfo.counts
    ? (personaInfo.counts[persona] || 0) === 0
    : null;
  // `pending` is the submenu's not-yet-known state. The entries are an
  // ANALYZER SET, which is persona-specific: switching to Claude Code left
  // "Batch placement" and "Cache" sitting in the sidebar under the new
  // persona's Optimize section for as long as the read took, naming analyzers
  // that persona has no lever for. Blanking them instead would be the opposite
  // false claim ("this persona has no analyzer pages"), so the honest third
  // state is to keep them visibly unsettled until the read answers.
  const [optNav, setOptNav] = useState({ dynamic: [], showSummarize: false, showRules: false, pending: true });
  useEffect(() => {
    // No data for the selected persona → empty submenu. Wait for the persona
    // read to answer (personaHasNoData === null) before deciding, so we don't
    // blank a real submenu on the first paint.
    if (personaHasNoData === true) { setOptNav({ dynamic: [], showSummarize: false, showRules: false, pending: false }); return; }
    let cancelled = false;
    setOptNav(s => (s.pending ? s : { ...s, pending: true }));
    api('/optimize', { fast: 'true', persona })
      .then(d => {
        if (cancelled) return;
        if (!d) { setOptNav(s => ({ ...s, pending: false })); return; }
        // No mismatch check any more, and none is needed: the request names the
        // SELECTED persona, and the route gates the analyzer set for THAT
        // persona rather than for the corpus's dominant one. The workaround
        // this replaced could only blank the submenu on a mismatch — it had no
        // way to compute the right entries, so a machine with data for both
        // personas showed nothing at all for the non-dominant one.
        // Summarize earns its child only when the scan found candidates;
        // Rules is gated on the persona having data (its own /rules content is
        // fetched by RulesView — the nav only needs "does this persona have a
        // page"). A no-data persona was already handled above.
        const sf = d.findings && d.findings.summarize;
        const hasSummarize = !!(sf && sf.candidates && sf.candidates.length);
        setOptNav({
          dynamic: optimizeDetailAnalyzers(d),
          showSummarize: hasSummarize,
          // `usePersonaHasNoData` returns null while `/persona` has not
          // answered (or answered `known:false`), and `null === false` is
          // false — so an unresolved read HID the Rules entry outright. Hiding
          // a nav row is a claim that this persona has no rules to write, which
          // is exactly the claim a not-yet-known state may not make (root
          // anti-pattern 22); the honest default for a route that exists is to
          // show it. Only a positive "this persona has no data" hides it now.
          showRules: personaHasNoData !== true,
          pending: false,
        });
      })
      .catch(() => { if (!cancelled) setOptNav({ dynamic: [], showSummarize: false, showRules: false, pending: false }); });
    return () => { cancelled = true; };
  }, [persona, personaHasNoData]);

  // Inject/refresh the analyzer nav-children in the sidebar (before the static
  // Summarize/Rules children). The sidebar is server-rendered static HTML, so we
  // reconcile it imperatively here rather than owning the whole nav in Preact:
  // create one <a class="nav-link nav-child"> per finding, tagged
  // data-optimize-dyn so a re-run can clear its own previous set without
  // touching the two static children. The route-sync effect below then handles
  // active-highlight + show/hide exactly as it does for any nav-child.
  useEffect(() => {
    const sidebar = document.querySelector('.sidebar');
    if (!sidebar) return;
    sidebar.querySelectorAll('a.nav-child[data-optimize-dyn]').forEach(el => el.remove());
    const anchorBefore = sidebar.querySelector('a.nav-child[data-optimize-static="1"]');
    if (!anchorBefore) return;
    optNav.dynamic.forEach(name => {
      const meta = ANALYZER_META[name] || { title: capitalize(name) };
      const a = document.createElement('a');
      a.href = '#/optimize/' + name;
      // While the persona's own analyzer set is still being read, these entries
      // are last persona's answer: reachable (the pages exist and land on their
      // own persona-gated state), but not yet a claim about THIS persona.
      a.className = 'nav-link nav-child' + (optNav.pending ? ' nav-child-pending' : '');
      if (optNav.pending) a.setAttribute('aria-busy', 'true');
      a.dataset.view = 'optimize';
      a.dataset.param = name;
      a.dataset.optimizeDyn = '1';
      const icon = document.createElement('span');
      icon.className = 'icon';
      icon.innerHTML = '&#8627;';
      a.appendChild(icon);
      a.appendChild(document.createTextNode(' ' + meta.title));
      sidebar.insertBefore(a, anchorBefore);
    });
    // Gate the two STATIC children (Summarize, Rules) on having content for the
    // selected persona rather than injecting them unconditionally (#671). The
    // gate is a data-optimize-hidden flag that syncNavState honors, so a route
    // change can't reveal a child the persona has no content for.
    sidebar.querySelectorAll('a.nav-child[data-optimize-static="1"]').forEach(el => {
      const show = el.dataset.param === 'summarize' ? optNav.showSummarize : optNav.showRules;
      el.dataset.optimizeHidden = show ? '0' : '1';
    });
    // Re-apply active-highlight + show/hide to the freshly-injected children,
    // which the route-sync effect below computes but only over the DOM as it was
    // when it last ran. Cheap and idempotent; keeps a newly-injected child from
    // flashing in the wrong state until the next route change.
    syncNavState(route.view, route.param || '', persona, personaKnown);
  }, [optNav, persona, personaKnown]);

  useEffect(() => {
    const handler = () => setRoute(getRoute());
    window.addEventListener('hashchange', handler);
    return () => window.removeEventListener('hashchange', handler);
  }, []);

  // Reflect the default route in the URL bar without a render-time redirect.
  // getRoute() defaults to 'dashboard' (the lens-neutral triage front door,
  // issue #654), so the first render shows the Dashboard; this just makes the
  // address bar say so, so a refresh or a shared bare URL lands on the SAME
  // page that rendered. The default MUST match getRoute()'s — writing #/review
  // here (the old Improve home) desynced the page from the address bar and made
  // a reload open Review instead (Greptile P1). replaceState = no extra history
  // entry, no hashchange race that left the view blank — #132.
  useEffect(() => {
    if (!location.hash || location.hash === '#/') {
      history.replaceState(null, '', '#/dashboard');
    }
  }, []);

  // Canonicalise the retired `#/optimize/guide` and `#/guide` hashes to
  // `#/faq`. The router already renders the right view for any of the three
  // (primaryKeyFor), so this exists for the SIDEBAR: the FAQ nav entry keys on
  // `data-view="faq"`, and on either legacy hash the active view is still
  // `optimize` or `guide`, which would light up the wrong row (or none).
  // replaceState leaves no history entry (so Back does not bounce between the
  // spellings) and fires no hashchange, hence the explicit re-read.
  useEffect(() => {
    if (isLegacyGuideRoute(route)) {
      history.replaceState(null, '', '#/faq');
      setRoute(getRoute());
    }
  }, [route.view, route.param]);

  // Landing on a view this persona does not show (a deep link, a bookmark, or
  // switching persona while standing on one) leaves the reader on a page with
  // no nav entry pointing at it. Send them to the Dashboard instead of
  // rendering an orphan. replaceState so Back does not bounce them straight
  // into the same hidden view again.
  useEffect(() => {
    // A trace DETAIL (traces/<trace_id>) is a legitimate drill-in from a
    // session's Traces tab even for a persona whose sidebar hides the top-level
    // Traces LIST. Redirect only the hidden list pages, never a specific trace.
    if (personaHidesRoute(persona, route.view, personaKnown) && !(route.view === 'traces' && route.param)) {
      history.replaceState(null, '', '#/dashboard');
      setRoute(getRoute());
    }
  }, [persona, personaKnown, route.view]);

  // Update active nav link + reveal nested children of the active section.
  // The rules live in module-level syncNavState so the nav-child injection effect
  // can re-apply them to newly-added Optimize children. `persona` is a dependency
  // because syncNavState writes `data-persona` (which drives CSS nav gating);
  // without it the attribute would only refresh on a ROUTE change, leaving the
  // sidebar on the previous persona's pages after a persona switch alone.
  useEffect(() => {
    syncNavState(route.view, route.param || '', persona, personaKnown);
  }, [route.view, route.param, persona, personaKnown]);

  const primaryKey = primaryKeyFor(route);
  const detail = detailNodeFor(route);

  // Per-view params: only the ACTIVE primary view receives the live route
  // params; hidden views keep their last params so a param meant for one view
  // never perturbs another. The active view thus reacts to its OWN route param
  // change (a filter/preset in the hash → its load() deps change → refetch),
  // while a hidden view stays put until it's re-activated (then it revalidates
  // in the background, still showing its last data — never a spinner). Written
  // during render as a plain memo of "last params seen while active".
  const paramsByView = useRef({});
  if (!detail && PRIMARY_KEYS.has(primaryKey)) {
    paramsByView.current[primaryKey] = route.params;
  }

  // Warm-all-on-boot: start with ONLY the active view mounted so the first
  // paint isn't slowed by the others, then progressively mount the rest
  // (hidden) after first paint — staggered via requestIdleCallback so boot
  // doesn't fire every endpoint at once (a thundering herd). Once mounted, a
  // view stays mounted (keep-alive), so its on-mount fetch + poll keep its data
  // warm for an instant first visit.
  const [mounted, setMounted] = useState(() => new Set([primaryKey]));
  const mountedRef = useRef(mounted);
  mountedRef.current = mounted;

  // If the user navigates to a view before warming has reached it, mount it now.
  useEffect(() => {
    if (PRIMARY_KEYS.has(primaryKey) && !mountedRef.current.has(primaryKey)) {
      setMounted(prev => { const n = new Set(prev); n.add(primaryKey); return n; });
    }
  }, [primaryKey]);

  useEffect(() => {
    const idle = window.requestIdleCallback || (cb => setTimeout(cb, 1));
    let cancelled = false;
    let i = 0;
    const pump = () => {
      if (cancelled || i >= PRIMARY_VIEWS.length) return;
      const k = PRIMARY_VIEWS[i++][0];
      setMounted(prev => (prev.has(k) ? prev : new Set(prev).add(k)));
      setTimeout(() => idle(pump), WARM_STAGGER_MS);
    };
    idle(pump);
    return () => { cancelled = true; };
  }, []);

  // Keep-alive stack: every mounted primary view renders, but only the active
  // one is visible; the rest are display:none (kept mounted, state intact). A
  // detail drill-in (mounted fresh, keyed by id) overlays the hidden stack.
  const personaCtx = { persona, detected: personaInfo.detected, known: personaInfo.known,
                       counts: personaInfo.counts, onChange: setPersona };
  // No app-level picker of any kind. Each of PERSONA_PICKER_VIEWS renders its
  // own, in its own header beside its own title, so the control has exactly one
  // position in the product. A detail drill-in shows none: a session or trace is
