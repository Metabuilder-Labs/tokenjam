      const [sc, stg] = await Promise.all([
        api('/summarize/candidates', { recursive: rec || undefined, repo: rp || undefined }),
        api('/summarize/staged'),
      ]);
      if (seq !== scanSeq.current) return;   // a newer scan superseded this response — drop it
      setScan(sc); setStaged(stg.staged || []);
    } catch (e) { if (seq === scanSeq.current) setDataErr(e.message || String(e)); }
    if (seq === scanSeq.current) setLoading(false);
  };
  const loadStaged = async () => {
    try { const stg = await api('/summarize/staged'); setStaged(stg.staged || []); }
    catch (e) { setDataErr(e.message || String(e)); }
  };
  const loadBackups = async () => {
    try { const bk = await api('/summarize/backups'); setBackups(bk.backups || []); }
    catch (e) { /* backups are a convenience surface; don't block the screen on them */ }
  };

  // Mount: candidates (so the landing view is the list, not a gate), engine
  // capabilities (needed once the user reaches Approve), and any already-staged
  // work, so the screen can also offer "review N staged" WITHOUT forcing an
  // engine choice (reviewing/applying staged rewrites needs no LLM — only
  // running does; looking never needed one either).
  useEffect(() => { loadScan(); loadCaps(); loadStaged(); loadBackups(); }, []);

  // While a batch run is in flight, tick once a second so the in-flight row shows
  // live elapsed time (a claude-p file can take 30-90s; silence reads as "hung").
  const runActive = phase === 'run' && !!runState && runState.running;
  useEffect(() => {
    if (!runActive) return undefined;
    const id = setInterval(() => setTick(t => t + 1), 1000);
    return () => clearInterval(id);
  }, [runActive]);

  // Engine card renderer, shared by the inline picker inside the Approve
  // modal (the only place a tool is ever demanded — see the Finish/Approve
  // footer below). Picking a card just sets `engine`; the picker step and the
  // "run via X" confirm step stay separate clicks so an unavailable engine's
  // reason is visible before anything runs.
  const eng = (id, name, tag, desc) => {
    const cap = caps ? caps[id] : null;
    const avail = cap ? cap.available : false;
    const val = id === 'claude_p' ? 'claude-p' : id;
    return html`<button class="sz-engine" disabled=${!avail} onClick=${() => avail && setEngine(val)}>
      <div class="sz-eng-name">${name}</div>
      <div class="sz-eng-tag">${tag}</div>
      <div class="sz-eng-desc">${desc}</div>
      ${!avail && cap && cap.reason ? html`<div class="sz-eng-off badge badge-closed">${cap.reason}</div>` : null}
    </button>`;
  };

  // ---- curator ----
  const seg = (val, set, opts, label) => html`
    <div class="cur-seg"><span class="seg-label">${label}</span>
      ${opts.map(o => html`<button class=${val === o.v ? 'on' : ''} onClick=${() => set(o.v)}>${o.t}</button>`)}
    </div>`;
  const baseMatch = c =>
    (kind === 'all' || c.kind === kind) &&
    (scope === 'all' || c.scope === scope) &&
    (status === 'all' || statusOf(c) === status) &&
    (query === '' || c.path.toLowerCase().includes(query.toLowerCase()));
  const visible = cands.filter(baseMatch);
  const selectable = visible.filter(c => !added.has(c.path));
  const checkedCount = [...checked].filter(p => !added.has(p)).length;

  const toggle = p => setChecked(prev => { const n = new Set(prev); n.has(p) ? n.delete(p) : n.add(p); return n; });
  const checkShown = () => setChecked(prev => { const n = new Set(prev); selectable.forEach(c => n.add(c.path)); return n; });
  const uncheckShown = () => setChecked(prev => { const n = new Set(prev); visible.forEach(c => n.delete(c.path)); return n; });
  const doAdd = () => { setAdded(prev => { const n = new Set(prev); checked.forEach(p => n.add(p)); return n; }); setChecked(new Set()); };
  const removeAdded = p => setAdded(prev => { const n = new Set(prev); n.delete(p); return n; });
  const clearAll = () => setAdded(new Set());
  const clearShownModal = () => setAdded(prev => { const n = new Set(prev); [...prev].filter(p => mQuery === '' || p.toLowerCase().includes(mQuery.toLowerCase())).forEach(p => n.delete(p)); return n; });
  const openModal = m => { setMQuery(''); setModal(m); };

  const addedList = [...added].map(p => candByPath[p]).filter(Boolean);
  const addedTok = addedList.reduce((s, c) => s + (c.est_tokens_saved || 0), 0);
  const modalList = addedList.filter(c => mQuery === '' || c.path.toLowerCase().includes(mQuery.toLowerCase()));

  // Smart tally: individual chips while few; collapse to directory groups past a cap.
  const CHIP_CAP = 8;
  const dirOf = p => { const i = p.lastIndexOf('/'); return i < 0 ? './' : p.slice(0, i + 1); };
  let chipEls;
  if (addedList.length <= CHIP_CAP) {
    chipEls = addedList.map((c, i) => html`<span class="cur-chip" key=${i}>${c.path}</span>`);
  } else {
    const groups = {};
    addedList.forEach(c => { const k = dirOf(c.path); groups[k] = (groups[k] || 0) + 1; });
    const sorted = Object.entries(groups).sort((a, b) => b[1] - a[1]);
    chipEls = [
      ...sorted.slice(0, CHIP_CAP).map(([dir, n], i) => html`<span class="cur-chip" key=${i}>${dir} <span class="dim">×${n}</span></span>`),
      ...(sorted.length > CHIP_CAP ? [html`<span class="cur-chip more" key="more">+${sorted.length - CHIP_CAP} dirs</span>`] : []),
    ];
  }

  // ---- run transitions ----
  const approve = () => {
    const list = [...added];
    setRunList(list); setModal(null); setFileStates({}); setRevChecked(new Set()); setApplyMsg(null);
    if (engine === 'manual') {
      setManIdx(0); setManSummary(''); setManErr(null); setPhase('run'); prepFile(list[0]);
    } else {
      setPhase('run'); runBatch(list);
    }
  };
  const runBatch = async list => {
    setRunState({ total: list.length, done: 0, current: null, results: [], running: true });
    for (const path of list) {
      setRunState(s => ({ ...s, current: path, curStart: Date.now() }));
      try {
        const r = (await apiPostOrDetail('/summarize/run', { path, mode: engine, ratio: 0.5 })) || {};
        const ok = !!(r.verdict && r.verdict.staged);
        const note = r.skipped_note || (r.verdict && !r.verdict.structure_ok ? (r.verdict.reason || 'structure check did not pass') : '');
        setRunState(s => ({ ...s, done: s.done + 1, results: [...s.results, { path, ok, note, amortization: r.amortization, cost_unknown: r.cost_unknown }] }));
      } catch (e) {
        setRunState(s => ({ ...s, done: s.done + 1, results: [...s.results, { path, ok: false, error: true, note: e.message || String(e) }] }));
      }
    }
    setRunState(s => ({ ...s, current: null, running: false }));
    await loadStaged();
  };
  const prepFile = async path => {
    if (!path) { await loadStaged(); setPhase('review'); return; }
    setManBusy(true); setManErr(null); setManSummary('');
    try { setManPrep(await apiPostOrDetail('/summarize/prep', { path, ratio: 0.5 })); }
    catch (e) { setManErr(e.message || String(e)); setManPrep({ path, wrapped_prompt: '', system_rules: '', source_sha256: '', note: '', error: true }); }
    setManBusy(false);
  };
  const manNext = async () => {
    const next = manIdx + 1;
    if (next >= runList.length) { await loadStaged(); setPhase('review'); return; }
    setManIdx(next); await prepFile(runList[next]);
  };
  const manCheck = async () => {
    if (!manPrep || !manPrep.source_sha256) return;
    setManBusy(true); setManErr(null);
    try { await apiPostOrDetail('/summarize/check', { path: manPrep.path, summary: manSummary, source_hash: manPrep.source_sha256 }); }
    catch (e) { setManErr(e.message || String(e)); setManBusy(false); return; }
    await manNext();
    setManBusy(false);
  };

  // ---- review ----
  const revRows = staged.map(s => { const c = candByPath[s.path]; return { ...s, kind: c ? c.kind : 'other', scope: c ? c.scope : '—' }; });
  const stOf = p => fileStates[p] || 'staged';
  const rvMatch = r => {
    const st = stOf(r.path);
    return (rvState === 'all' || st === rvState) &&
      (rvKind === 'all' || r.kind === rvKind) &&
      (rvScope === 'all' || r.scope === rvScope) &&
      (rvQuery === '' || r.path.toLowerCase().includes(rvQuery.toLowerCase()));
  };
  const rvVisible = revRows.filter(rvMatch);
  const rvSelectable = rvVisible.filter(r => stOf(r.path) === 'staged');
  // Reject is a client-side dismiss (no write), so it filters nothing — any row can
  // be cleared from the view. Apply WRITES, so it excludes structure_ok===false
  // (defense-in-depth; core is the real guard — check() never stages a failed rewrite
  // and apply_staged re-skips one server-side).
  const rvCheckedReject = [...revChecked].filter(p => stOf(p) === 'staged');
  const rvCheckedStaged = rvCheckedReject.filter(
    p => !staged.some(s => s.path === p && s.structure_ok === false));
  const appliedCount = revRows.filter(r => stOf(r.path) === 'applied').length;
  const rejectedCount = revRows.filter(r => stOf(r.path) === 'rejected').length;
  const revertedCount = revRows.filter(r => stOf(r.path) === 'reverted').length;
  const stagedCount = revRows.length - appliedCount - rejectedCount - revertedCount;
  const rvToggle = p => setRevChecked(prev => { const n = new Set(prev); n.has(p) ? n.delete(p) : n.add(p); return n; });
  const rvCheckShown = () => setRevChecked(prev => { const n = new Set(prev); rvSelectable.forEach(r => n.add(r.path)); return n; });
  const rvUncheckShown = () => setRevChecked(prev => { const n = new Set(prev); rvVisible.forEach(r => n.delete(r.path)); return n; });
  const shortP = p => { const i = p.lastIndexOf('/'); return i < 0 ? p : '…/' + p.slice(i + 1); };
  const setMsg = (text, tone) => setApplyMsg({ text, tone: tone || 'ok' });

  // Apply writes via core apply_staged (go=true). Staging is NOT reloaded after —
  // applied files are cleared from disk on write, but we keep the row visible and
  // overlay 'applied' via fileStates so the review stays legible for this session.
  const applyPaths = async paths => {
    if (!paths.length) return;
    setBusy(true);
    const results = [];
    for (const path of paths) {
      try {
        const r = (await apiPostOrDetail('/summarize/apply', { path, go: true })) || {};
        if (r.applied && r.applied.length) { results.push({ path, ok: true }); setFileStates(s => ({ ...s, [path]: 'applied' })); }
        else { results.push({ path, ok: false, reason: (r.skipped && r.skipped[0]) ? r.skipped[0].reason : 'not applied' }); }
      } catch (e) { results.push({ path, ok: false, reason: e.message || String(e) }); }
    }
    setRevChecked(new Set()); setBusy(false);
    const okN = results.filter(r => r.ok).length;
    const fails = results.filter(r => !r.ok);
    setMsg('Applied ' + okN + ' file(s).' + (fails.length ? ' ' + fails.length + ' skipped: ' + fails.map(f => shortP(f.path) + ' (' + f.reason + ')').join('; ') : ''), fails.length ? 'warn' : 'ok');
    loadBackups();   // newly-applied files now have a backup → surface them as undoable
  };
  const applyChecked = () => applyPaths(rvCheckedStaged);
  const rejectChecked = () => {
    setFileStates(s => { const n = { ...s }; rvCheckedReject.forEach(p => n[p] = 'rejected'); return n; });
    setRevChecked(new Set());
  };
  // Undo restores an APPLIED file from its gzip backup via core `undo` (go=true).
  // Refuses (409) if the file changed since apply or the backup is gone — the
  // reason is surfaced. On success the row goes terminal 'reverted' (its staged
  // copy was already cleared at apply, so it can't be re-applied — re-run to redo).
  const undoPath = async path => {
    setBusy(true);
    try {
      await apiPostOrDetail('/summarize/undo', { path, go: true });
      setFileStates(s => ({ ...s, [path]: 'reverted' }));
      setBackups(bs => bs.filter(b => b.source_path !== path));   // no longer undoable (now == original)
      setMsg('Reverted ' + shortP(path) + '. Restored from backup.', 'ok');
    } catch (e) { setMsg('Undo failed for ' + shortP(path) + ': ' + (e.message || String(e)), 'warn'); }
    setBusy(false);
  };
  const reRun = async path => {
    if (engine === 'manual') return;
    setBusy(true);
    try {
      await apiPostOrDetail('/summarize/run', { path, mode: engine, ratio: 0.5 });
      const one = await api('/summarize/staged', { path });
      if (one.staged && one.staged.length) {
        setStaged(prev => prev.map(s => s.path === path ? one.staged[0] : s));
        setFileStates(s => { const n = { ...s }; delete n[path]; return n; });
      }
    } catch (e) { setMsg('Re-run failed for ' + shortP(path) + ': ' + (e.message || String(e)), 'warn'); }
    setBusy(false);
  };

  // ======================= RENDER =======================
  if (phase === 'run' && engine !== 'manual') {
    const rs = runState || { total: runList.length, done: 0, current: null, results: [], running: true };
    const pct = rs.total ? Math.round(rs.done / rs.total * 100) : 100;
    const okN = rs.results.filter(r => r.ok).length;
    const elapsed = rs.curStart ? Math.max(0, Math.round((Date.now() - rs.curStart) / 1000)) : 0;
    return html`
      <div class="page-title">Summarize <span class="sz-sub">· running via ${engine}</span></div>
      <div class="sz-note">Summarizing ${rs.total} file(s), one at a time${engine === 'claude-p' ? ' (~30-90s each via claude-p)' : ''}. Results are staged; <b>nothing is written yet</b>.</div>
      <div class="sz-prog"><div style=${'width:' + pct + '%'}></div></div>
      <div class="dim" style="font-size:12px;margin-bottom:10px">${rs.done} / ${rs.total} done${rs.running && rs.current ? ' · running ' + shortP(rs.current) + ' (' + elapsed + 's)' : (rs.running ? '' : ' · complete')}</div>
      <div class="cur-listbox" style="max-height:360px">
        ${rs.results.map((r, i) => html`<div class="sz-runrow" key=${i}>
          <span style=${'color:' + (r.ok ? 'var(--success)' : (r.error ? 'var(--error)' : 'var(--warn)'))}>${r.ok ? '✓' : (r.error ? '✕' : '—')}</span>
          <span style="flex:1;word-break:break-all">${r.path}</span>
          ${r.amortization ? html`<span class="dim">${fmtCost(r.amortization.rewrite_usd)}${r.amortization.break_even_calls != null ? ' · breaks even after ' + r.amortization.break_even_calls + ' calls' : ''}${r.amortization.rates_known ? '' : ' (est. rates)'}</span>`
            : (r.cost_unknown ? html`<span class="dim">cost unknown</span>` : null)}
          ${!r.ok && r.note ? html`<span class="dim" title=${r.note}>${r.note.length > 44 ? r.note.slice(0, 44) + '…' : r.note}</span>` : null}
        </div>`)}
        ${rs.running && rs.current ? html`<div class="sz-runrow">
          <span class="sz-spin">⟳</span>
          <span style="flex:1;word-break:break-all">${rs.current}</span>
          <span class="dim">summarizing${'.'.repeat((tick % 3) + 1)} · ${elapsed}s</span>
        </div>` : null}
        ${rs.results.length === 0 && !(rs.running && rs.current) ? html`<div class="empty compact">Starting…</div>` : null}
      </div>
      <div class="cur-addbar">
        <button class="cur-btn primary" disabled=${rs.running} onClick=${() => setPhase('review')}>Review ${okN} staged →</button>
        <button class="cur-btn" disabled=${rs.running} onClick=${() => setPhase('curate')}>← back to curator</button>
      </div>
    `;
  }

  if (phase === 'run' && engine === 'manual') {
    const total = runList.length;
    const path = runList[manIdx];
    const belowGate = manPrep && !manPrep.error && !manPrep.wrapped_prompt;
    const full = manPrep ? (manPrep.system_rules ? manPrep.system_rules + '\n\n' : '') + manPrep.wrapped_prompt : '';
    return html`
      <div class="page-title">Summarize <span class="sz-sub">· manual · file ${Math.min(manIdx + 1, total)} of ${total}</span></div>
      <div class="dim" style="font-size:12.5px;margin-bottom:10px;font-family:'Geist Mono',monospace">${path}</div>
      ${manBusy ? html`<div class="shimmer" style="height:120px"></div>` : null}
      ${manErr ? html`<div class="chart-card" style="border-color:var(--error)"><div style="color:var(--error);font-size:13px">${manErr}</div></div>` : null}
      ${!manBusy && manPrep && !manPrep.error && !belowGate ? html`
        <div class="sz-note">Paste this into a <b>new</b> Claude session, then paste the reply below and Check & stage.</div>
        <div style="font-size:12px;color:var(--text-faint);margin:8px 0">${manPrep.prose_words} prose words → target ~${manPrep.target_prose_words} · ${manPrep.protected_blocks} protected block(s)</div>
        <div class="sz-copybox">${full}</div>
        <button class="cur-btn" style="margin:8px 0" onClick=${() => navigator.clipboard && navigator.clipboard.writeText(full)}>Copy</button>
        <textarea class="sz-ta" placeholder="Paste Claude's summary here…" value=${manSummary} onInput=${e => setManSummary(e.target.value)}></textarea>
        <div class="cur-addbar">
          <button class="cur-btn primary" disabled=${manBusy || !manSummary.trim()} onClick=${manCheck}>Check & stage →</button>
          <button class="cur-btn" disabled=${manBusy} onClick=${manNext}>Skip this file</button>
          <button class="cur-btn" style="margin-left:auto" onClick=${() => setPhase('curate')}>← back to curator</button>
        </div>
      ` : null}
      ${!manBusy && belowGate ? html`
        <div class="opt-caveat">${manPrep.note || 'Below the prose gate; not worth summarizing.'}</div>
        <div class="cur-addbar"><button class="cur-btn primary" onClick=${manNext}>Skip →</button><button class="cur-btn" onClick=${() => setPhase('curate')}>← back to curator</button></div>
      ` : null}
    `;
  }

  if (phase === 'review') {
    const mf = revModal ? revRows.find(r => r.path === revModal) : null;
    const mst = mf ? stOf(mf.path) : null;
    const mfBlocks = mf ? diffBlocks(mf.diff) : [];
    return html`
      <div style="margin:0 0 4px"><span class="sz-link" onClick=${() => setPhase('curate')}>← back to curator</span></div>
      <div class="page-title">Summarize <span class="sz-sub">· review & apply</span></div>
      <div class="sz-note rev-note">${revRows.length} staged. Structure is guaranteed; <b>meaning may change</b>. Click a row for its diff. <b>Apply</b> writes the file (backs up first); <b>Reject</b> dismisses it here.</div>
      ${dataErr ? html`<div class="chart-card" style="border-color:var(--error)"><div style="color:var(--error);font-size:13px">${dataErr}</div></div>` : null}
      ${applyMsg ? html`<div class="opt-caveat" style=${'font-style:normal;color:' + (applyMsg.tone === 'warn' ? 'var(--warn)' : 'var(--success)')}>${applyMsg.text}</div>` : null}
      <div class="cur-filters">
        ${seg(rvState, setRvState, [{ v: 'all', t: 'All' }, { v: 'staged', t: 'Staged' }, { v: 'applied', t: 'Applied' }, { v: 'rejected', t: 'Rejected' }, { v: 'reverted', t: 'Reverted' }], 'State')}
        ${seg(rvKind, setRvKind, [{ v: 'all', t: 'All' }, { v: 'prompt', t: 'Prompt' }, { v: 'other', t: 'Other' }], 'Kind')}
        ${seg(rvScope, setRvScope, [{ v: 'all', t: 'All' }, { v: 'global', t: 'Global' }, { v: 'repo', t: 'Repo' }, { v: 'project', t: 'Project' }], 'Scope')}
        <input class="cur-search" placeholder="search files…" value=${rvQuery} onInput=${e => setRvQuery(e.target.value)} />
      </div>
      <div class="cur-listhead">
        <span>${rvVisible.length} shown · <b style="color:var(--warn)">${stagedCount}</b> staged · <b style="color:var(--success)">${appliedCount}</b> applied · <b>${rejectedCount}</b> rejected${revertedCount ? html` · <b>${revertedCount}</b> reverted` : null}</span>
        <span class="sz-link" onClick=${rvCheckShown}>Check shown</span>
        <span class="sz-link" onClick=${rvUncheckShown}>Uncheck shown</span>
      </div>
      <div class="cur-listbox">
        <table class="cur-table">
          <thead><tr><th style="width:26px"></th><th>File</th><th>Kind</th><th>Scope</th><th style="text-align:right">Saved</th><th>Structure</th><th>State</th></tr></thead>
          <tbody>
            ${rvVisible.map((r, i) => {
              const st = stOf(r.path);
              const term = st !== 'staged';
              return html`<tr class=${'cur-row' + (term ? ' added' : '')} key=${i}>
                <td>${term ? html`<span class="dim">—</span>` : html`<input type="checkbox" checked=${revChecked.has(r.path)} onChange=${() => rvToggle(r.path)} />`}</td>
                <td class="mono"><span class="sz-link" title="review the diff" onClick=${() => setRevModal(r.path)}>${r.path}</span></td>
                <td><span class="dim" style="font-size:12px">${r.kind}</span></td>
                <td><span class="dim" style="font-size:12px">${r.scope}</span></td>
                <td class="mono" style="text-align:right;color:var(--accent)">~${r.est_tokens_saved}</td>
                <td>${r.structure_ok ? html`<span class="badge badge-ok">ok</span>` : html`<span class="badge badge-error">fail</span>`}</td>
                <td><span class=${'rev-state ' + st}>${st}</span>${st === 'applied' ? html` <span class="sz-link" style="font-size:11px" title="restore this file from its backup" onClick=${() => undoPath(r.path)}>undo</span>` : null}</td>
              </tr>`;
            })}
            ${rvVisible.length === 0 ? html`<tr><td colspan="7" class="empty-cell">${revRows.length === 0 ? 'Nothing staged. Run the summarizer from the curator.' : 'No files match these filters.'}</td></tr>` : null}
          </tbody>
        </table>
      </div>
      <div class="cur-addbar">
        <button class="cur-btn primary" disabled=${busy || rvCheckedStaged.length === 0} onClick=${applyChecked}>Apply checked ${rvCheckedStaged.length ? '(' + rvCheckedStaged.length + ') ' : ''}→</button>
        <button class="cur-btn" disabled=${busy || rvCheckedReject.length === 0} onClick=${rejectChecked}>Reject checked</button>
        <span class="dim" style="font-size:12px">Click a row for its diff.</span>
        <a class="cur-btn" style="margin-left:auto;text-decoration:none" href="#/optimize">Done → Optimize</a>
      </div>
      ${revRows.length > 0 && stagedCount === 0 ? html`<div class="opt-caveat" style="font-style:normal;color:var(--success);margin-top:12px">✓ All ${revRows.length} rewrite(s) resolved: ${appliedCount} applied, ${rejectedCount} rejected${revertedCount ? ', ' + revertedCount + ' reverted' : ''}.${appliedCount ? ' Applied one you didn\'t want? Undo it below.' : ''} <a class="sz-link" href="#/optimize">Back to Optimize</a> · <span class="sz-link" onClick=${() => setPhase('curate')}>summarize more →</span></div>` : null}

      ${backups.length ? html`<div class="opt-section" style="margin:16px 0 4px">
        <div class="opt-title" style="font-size:14px;margin-bottom:2px">Applied earlier: undo</div>
        <div style="margin:0 0 4px"><span class="dim" style="font-weight:400;font-size:12px">restores the original from backup</span></div>
        ${backups.map((b, i) => html`<div class="sz-runrow" key=${i}>
          <span style="color:var(--success)">✓</span>
          <span class="mono" style="flex:1;word-break:break-all">${b.source_path}</span>
          ${b.applied_at ? html`<span class="dim" style="font-size:12px">${b.applied_at.slice(0, 16).replace('T', ' ')}</span>` : null}
          ${b.undoable
            ? html`<button class="cur-btn" disabled=${busy} onClick=${() => undoPath(b.source_path)}>Undo</button>`
            : html`<span class="dim" style="font-size:12px" title=${b.reason}>can't undo: ${b.reason}</span>`}
        </div>`)}
      </div>` : null}
      ${mf ? html`
        <div class="cur-overlay" onClick=${() => setRevModal(null)}>
          <div class="cur-modal" onClick=${e => e.stopPropagation()}>
            <div class="cur-modal-head">
              <span class="cur-modal-title mono">${mf.path}</span>
              <span class=${'rev-state ' + mst} style="margin-left:6px">${mst}</span>
              <button class="cur-modal-x" onClick=${() => setRevModal(null)} title="Close">✕</button>
            </div>
            <div class="cur-modal-body">
              <div style="font-size:12.5px;margin-bottom:8px">
                ${mf.structure_ok ? html`<span class="badge badge-ok">structure ok</span>` : html`<span class="badge badge-error">structure fail</span>`}
                <span class="dim"> ${mf.words_before.toLocaleString()} → ${mf.words_after.toLocaleString()} words · ~${mf.est_tokens_saved} tok/call saved${mf.produced_by ? ' · via ' + mf.produced_by : ''}</span>
              </div>
              ${(mf.must_keep_removed && mf.must_keep_removed.length) ? html`<div class="opt-caveat" style="margin-top:0">Must-keep phrases changed: ${mf.must_keep_removed.length} removed${mf.must_keep_added && mf.must_keep_added.length ? ', ' + mf.must_keep_added.length + ' added' : ''}. Check the diff before applying.</div>` : null}
              ${mf.note ? html`<div class="dim" style="font-size:12.5px">${mf.note}</div>` : null}
              <div class="sz-note" style="font-size:12px;margin:0 0 10px"><span style="color:var(--error)">−</span> lines removed · <span style="color:var(--success)">+</span> lines added · unchanged lines are kept verbatim (code, tables, ${'<tj-keep>'} blocks). Shown per changed block:</div>
              ${mfBlocks.length ? mfBlocks.map((b, i) => html`<div class="sz-diffblock" key=${i}>
                <div class="sz-diffblock-h">Block ${i + 1} · <span style="color:var(--error)">−${b.del}</span> <span style="color:var(--success)">+${b.add}</span> · ${b.del === 0 ? 'added' : (b.add === 0 ? 'removed' : 'prose rewritten')}</div>
                <pre class="rev-diff" style="margin:6px 0 0">${b.lines.map(diffLine)}</pre>
              </div>`) : html`<div class="dim" style="font-size:12.5px">No textual changes.</div>`}
            </div>
            <div class="cur-modal-foot">
              ${mst === 'staged' ? html`
                <button class="cur-btn primary" disabled=${busy || !mf.structure_ok} onClick=${() => { setRevModal(null); applyPaths([mf.path]); }}>Apply (writes, backs up)</button>
                <button class="cur-btn" disabled=${busy} onClick=${() => { setFileStates(s => ({ ...s, [mf.path]: 'rejected' })); setRevModal(null); }}>Reject</button>
                ${engine && engine !== 'manual' ? html`<button class="cur-btn" disabled=${busy} onClick=${() => { setRevModal(null); reRun(mf.path); }}>Re-run via ${engine}</button>` : null}
              ` : null}
              ${mst === 'applied' ? html`<button class="cur-btn" disabled=${busy} onClick=${() => { setRevModal(null); undoPath(mf.path); }}>Undo (restore backup)</button>` : null}
              <button class="cur-btn" style="margin-left:auto" onClick=${() => setRevModal(null)}>Close</button>
            </div>
          </div>
        </div>` : null}
    `;
  }

  // phase === 'curate': the landing view. Candidates are fetched on mount
  // (see the useEffect above) and shown here with no engine choice required:
  // looking is free, only producing a rewrite (Finish → Approve, below) asks
  // which tool to use.
  return html`
    <div style="margin:0 0 16px"><a class="sz-back-link" href="#/optimize">← Optimize</a></div>
    <div class="page-title">Summarize <span class="sz-sub">· structure-aware prompt summarization</span></div>
    <div class="sz-note">Rewrites prose only: code, tables, and <code>${'<tj-keep>'}</code> blocks stay verbatim. Nothing is written until you review each rewrite and Apply.</div>
    ${engine ? html`<div class="dim" style="font-size:12px;margin-top:4px">engine: ${engine} · <span class="sz-link" onClick=${() => setEngine(null)}>change</span></div>` : null}

    <div class=${'cur-tally' + (addedList.length ? '' : ' empty')} onClick=${() => addedList.length && openModal('review')}>
      <div class="cur-tally-head">
        <div class="cur-tally-count">${addedList.length} <small>file${addedList.length === 1 ? '' : 's'} added · ~${addedTok.toLocaleString()} tok/call saved (est.)</small></div>
        <div class="cur-tally-hint">${addedList.length ? 'click to review / remove' : 'check rows below, then Add →'}</div>
      </div>
      ${addedList.length ? html`<div class="cur-chips">${chipEls}</div>` : null}
    </div>

    ${staged.length ? html`<div class="opt-caveat" style="font-style:normal">${staged.length} file(s) already staged from an earlier run or the <code>tj summarize</code> CLI. <span class="sz-link" onClick=${() => setPhase('review')}>Review & apply →</span></div>` : null}
    ${backups.filter(b => b.undoable).length ? html`<div class="dim" style="font-size:12px;margin-top:4px">${backups.filter(b => b.undoable).length} applied summary(ies) can be undone: <span class="sz-link" onClick=${() => setPhase('review')}>review & undo →</span></div>` : null}

    <div class="cur-filters">
      ${seg(kind, setKind, [{ v: 'all', t: 'All' }, { v: 'prompt', t: 'Prompt' }, { v: 'other', t: 'Other' }], 'Kind')}
      ${seg(scope, setScope, [{ v: 'all', t: 'All' }, { v: 'global', t: 'Global' }, { v: 'repo', t: 'Repo' }, { v: 'project', t: 'Project' }], 'Scope')}
      ${seg(status, setStatus, [{ v: 'all', t: 'All' }, { v: 'candidate', t: 'Candidate' }, { v: 'staged', t: 'Staged' }], 'Status')}
      <input class="cur-search" list="sz-files" placeholder="search files…" value=${query} onInput=${e => setQuery(e.target.value)} />
      <datalist id="sz-files">${cands.map((c, i) => html`<option value=${c.path} key=${i}></option>`)}</datalist>
    </div>

    <div class="cur-cwd">
      ${scan ? html`scanning <code>${scan.root || 'catalog defaults (cwd prompts + ~/ globals)'}</code> · ${scan.count} candidate(s) · ${scan.globals_checked} global(s) checked${scan.recursive ? ' · recursive' : ''}${scan.walk_capped ? ' · walk capped' : ''}` : 'scanning…'}
      <label style="margin-left:12px"><input type="checkbox" checked=${recursive} onChange=${e => { setRecursive(e.target.checked); loadScan({ recursive: e.target.checked }); }} /> recursive</label>
      <label style="margin-left:8px"><input type="checkbox" checked=${repoScope} onChange=${e => { setRepoScope(e.target.checked); loadScan({ repo: e.target.checked }); }} /> repo</label>
      <span class="sz-link" style="margin-left:10px" onClick=${() => loadScan()}>Rescan</span>
    </div>
    ${scan && scan.note ? html`<div class="cur-cwd">${scan.note}</div>` : null}
    <div class="cur-cwd"><span class="dim"><b>Kind</b> = agent-file match vs other · <b>Scope</b> = where found (global / repo / project / path)</span></div>

    ${dataErr ? html`<div class="chart-card" style="border-color:var(--error)"><div style="color:var(--error);font-size:13px">Couldn't scan: ${dataErr}</div><button class="btn" onClick=${() => loadScan()}>Retry</button></div>` : null}
    ${loading ? html`<div class="shimmer" style="height:200px"></div>` : null}

    ${!loading ? html`
    <div class="cur-listhead">
      <span>${visible.length} shown${added.size ? ' · ' + added.size + ' in basket' : ''}</span>
      <span class="sz-link" onClick=${checkShown}>Check shown</span>
      <span class="sz-link" onClick=${uncheckShown}>Uncheck shown</span>
    </div>
    <div class="cur-listbox">
      <table class="cur-table">
        <thead><tr><th style="width:26px"></th><th>File</th><th title="prompt = catalog-matched agent file; else other">Kind</th><th title="global (~/) · repo (git root) · project (cwd) · path (explicit)">Scope</th><th style="text-align:right">Words</th><th style="text-align:right">Tok/call</th><th>Status</th></tr></thead>
        <tbody>
          ${visible.map((c, i) => {
            const isAdded = added.has(c.path);
            const st = statusOf(c);
            return html`<tr class=${'cur-row' + (isAdded ? ' added' : '')} key=${i}>
              <td>${isAdded ? html`<span class="dim" title="in basket">✓</span>` : html`<input type="checkbox" checked=${checked.has(c.path)} onChange=${() => toggle(c.path)} />`}</td>
              <td class="mono">${c.path}</td>
              <td><span class="dim" style="font-size:12px">${c.kind}</span></td>
              <td><span class="dim" style="font-size:12px">${c.scope}</span></td>
              <td class="mono" style="text-align:right">${c.prose_words.toLocaleString()}</td>
              <td class="mono" style="text-align:right;color:var(--accent)">~${c.est_tokens_saved}</td>
              <td class="dim" style="font-size:12px">${st}</td>
            </tr>`;
          })}
          ${visible.length === 0 ? html`<tr><td colspan="7" class="empty-cell">${cands.length === 0 ? 'No summarizable files found. Try recursive / repo, or open a project with prompt files.' : 'No files match these filters.'}</td></tr>` : null}
        </tbody>
      </table>
    </div>
    <div class="cur-addbar">
      <button class="cur-btn primary" disabled=${checkedCount === 0} onClick=${doAdd}>Add ${checkedCount ? checkedCount + ' ' : ''}→</button>
      <span class="dim" style="font-size:12px">Checked rows move to the basket.</span>
      <button class="cur-btn" style="margin-left:auto" disabled=${added.size === 0} onClick=${() => openModal('approve')}>Finish (${added.size}) →</button>
    </div>
    ` : null}

    <div class="sz-note" style="font-size:12px;margin-top:14px"><b>Finish → Approve</b> ${engine ? html`runs the summarizer${engine === 'manual' ? ' (you paste each result back)' : ' via ' + engine}` : 'asks which tool to use, then runs the summarizer'}. You review each rewrite before applying.</div>

    ${modal ? html`
      <div class="cur-overlay" onClick=${() => setModal(null)}>
        <div class="cur-modal" onClick=${e => e.stopPropagation()}>
          <div class="cur-modal-head">
            <span class="cur-modal-title">${modal === 'approve' ? (engine ? 'Approve ' + added.size + ' file' + (added.size === 1 ? '' : 's') + ' to summarize?' : 'How should we summarize ' + added.size + ' file' + (added.size === 1 ? '' : 's') + '?') : 'Basket · ' + added.size + ' file' + (added.size === 1 ? '' : 's')}</span>
            <button class="cur-modal-x" onClick=${() => setModal(null)} title="Close: go back and change">✕</button>
          </div>
          <div class="cur-modal-body">
            ${modal === 'approve' && !engine ? html`
              <div class="sz-note" style="margin:0 0 10px">Looking is free; producing a rewrite needs a tool. How to produce the summaries:</div>
              ${capErr ? html`<div class="chart-card" style="border-color:var(--error)"><div style="color:var(--error);font-size:13px">Couldn't load engine availability: ${capErr}</div></div>` : null}
              ${!caps && !capErr ? html`<div class="shimmer" style="height:140px"></div>` : null}
              ${caps ? html`<div class="sz-engines">
                ${eng('api', 'API', '$ at cost · your key', 'Calls Anthropic with your key. Billed per rewrite; the review shows cost and break-even.')}
                ${eng('claude_p', 'Claude CLI', 'against your Claude limits', html`Runs the local <code>claude</code> CLI against your Claude limits, with no dollar cost. Local host only.`)}
                ${eng('manual', 'Manual', 'no outbound calls', 'Copy a ready-made prompt into any Claude session, paste the reply back. Nothing leaves this machine.')}
              </div>` : null}
            ` : html`
              <input class="cur-search" style="width:100%;margin-bottom:10px" placeholder="search basket…" value=${mQuery} onInput=${e => setMQuery(e.target.value)} />
              ${modalList.length === 0
                ? html`<div class="empty compact">${added.size === 0 ? 'Basket is empty.' : 'No items match.'}</div>`
                : modalList.map((c, i) => html`<div class="cur-mrow" key=${i}>
                    <span class="path">${c.path}</span>
                    <span class="dim mono" style="font-size:12px">~${c.est_tokens_saved} tok/call</span>
                    <button class="rm" title="Remove from basket" onClick=${() => removeAdded(c.path)}>✕</button>
                  </div>`)}
            `}
          </div>
          <div class="cur-modal-foot">
            ${modal === 'approve' && !engine ? html`
              <button class="cur-btn" style="margin-left:auto" onClick=${() => setModal(null)}>Cancel</button>
            ` : html`
              <button class="cur-btn" disabled=${modalList.length === 0} onClick=${clearShownModal}>Clear shown</button>
              <button class="cur-btn" disabled=${added.size === 0} onClick=${clearAll}>Clear all</button>
              ${modal === 'approve'
                ? html`<button class="cur-btn primary" style="margin-left:auto" disabled=${added.size === 0} onClick=${approve}>${engine === 'manual' ? 'Approve ' + added.size + ': prep first →' : 'Approve ' + added.size + ': run via ' + engine + ' →'}</button>`
                : html`<button class="cur-btn primary" style="margin-left:auto" onClick=${() => setModal(null)}>Done</button>`}
            `}
          </div>
        </div>
      </div>` : null}
  `;
}

// ============================
// Analytics explorer (#210)
// ============================
// The single explorable pivot: metric × group_by × optional stack × chart-type,
// filters, KPI tiles, presets, URL state, CSV export. Renders entirely from the
// /api/v1/analytics response + its framing block (single compute path — the UI
// never re-derives plan-tier rules). Subsumes the cost-by-model / spend-over-
// time / leaderboard charts as presets (#214/#216).
const ANALYTICS_METRICS = [
  ['spend', 'Spend'], ['tokens', 'Tokens'], ['sessions', 'Sessions'], ['events', 'Events'],
];
const ANALYTICS_DIMENSIONS = [
  ['model', 'Model'], ['agent', 'Agent'], ['provider', 'Provider'], ['tool', 'Tool'],
  ['tool_category', 'Tool category'], ['kind', 'Span kind'], ['request_type', 'Request type'],
  ['day', 'Day'],
  // SDK cost-attribution dimensions (#SDK dashboard shape).
  ['tenant', 'Tenant'], ['feature', 'Feature'], ['environment', 'Environment'],
  ['prompt_version', 'Prompt version'],
];
const ANALYTICS_CHARTS = [['bar', 'Bars'], ['line', 'Lines'], ['hbar', 'Leaderboard']];
// Built-in presets (close #214 leaderboard + #216 multi-series as preset views).
const ANALYTICS_PRESETS = [
  { id: 'spend-by-model', label: 'Spend by model', q: { metric: 'spend', group_by: 'model', chart: 'line', stack: '' } },
  { id: 'leaderboard', label: 'Cost leaderboard', q: { metric: 'spend', group_by: 'model', chart: 'hbar', stack: '' } },
  { id: 'tokens-over-time', label: 'Tokens over time', q: { metric: 'tokens', group_by: 'day', chart: 'bar', stack: '' } },
  { id: 'tool-usage', label: 'Tool usage', q: { metric: 'events', group_by: 'tool_category', chart: 'hbar', stack: '' } },
];

// Pivot the analytics rows into a uPlot [xs, ...ys] time-series, one ys per
// top-N group (+ "other"), zero-filled across the window (reuses _windowGrid so
// the x-axis spans the full selected window, #133). `valueOf` picks cost vs
// tokens per plan-tier framing.
function buildAnalyticsSeries(resp, useTokens) {
  if (!resp || !resp.rows) return null;
  const grid = _windowGrid({ ...resp, series: resp.rows });
  if (!grid) return null;
  const { xs, idx, step, bucket, coarsened } = grid;
  const valueOf = r => (useTokens ? (r.tokens || 0) : (r.value || 0));
  // When group_by IS the time dimension (Day), time is already the x-axis, so
  // coloring by the day-bucket key produces a meaningless rainbow with raw epoch
  // legend labels (#227). The colored SERIES then come from stack_by (g2) if
  // present, otherwise a SINGLE series — never one-per-day-bucket.
  const timeGroup = resp.group_by === 'day';
  const keyOf = timeGroup ? (r => r.stack) : (r => r.group);
  const seriesKeys = timeGroup ? (resp.stacks || []) : (resp.groups || []);
  if (!seriesKeys.length) {
    const ys = xs.map(() => 0);
    resp.rows.forEach(r => {
      const b = Math.floor(r.bucket / step) * step;
      if (b in idx) ys[idx[b]] += valueOf(r);
    });
    return { data: [xs, ys], labels: ['Total'], bucket, coarsened, requestedBucket: grid.reqBucket };
  }
  const top = seriesKeys.slice(0, 5);
  const topSet = new Set(top);
  const hasOther = seriesKeys.length > top.length;
  const labels = hasOther ? [...top, 'other'] : [...top];
  const yss = labels.map(() => xs.map(() => 0));
  resp.rows.forEach(r => {
    const b = Math.floor(r.bucket / step) * step; if (!(b in idx)) return;
    const k = keyOf(r);
    const li = topSet.has(k) ? labels.indexOf(k) : (hasOther ? labels.length - 1 : -1);
    if (li >= 0) yss[li][idx[b]] += valueOf(r);
  });
  return { data: [xs, ...yss], labels, bucket, coarsened, requestedBucket: grid.reqBucket };
}

// Collapse the time dimension into per-group totals for the leaderboard (#214):
// sorted desc, each with a fraction-of-max for the inline magnitude bar.
function buildLeaderboard(resp, useTokens) {
  if (!resp || !resp.rows) return null;
  const totals = {};
  resp.rows.forEach(r => { totals[r.group] = (totals[r.group] || 0) + (useTokens ? (r.tokens || 0) : (r.value || 0)); });
  const entries = Object.keys(totals).map(g => ({ group: g, value: totals[g] }))
    .sort((a, b) => b.value - a.value);
  const max = entries.length ? Math.max(...entries.map(e => e.value), 0) : 0;
  entries.forEach(e => { e.frac = max > 0 ? e.value / max : 0; });
  return entries;
}

// CSV from the current pivot — built client-side from the response (offline,
// no server round-trip), downloaded via a Blob object URL.
function analyticsCsv(resp) {
  const framing = resp.framing || {};
  const mode = framing.pricing_mode || 'unknown';

  const head = [
    'bucket_epoch',
    'bucket_iso',
    resp.group_by,
    resp.stack_by || 'stack',
    'cost',
    'cycle_share_pct',
    'input_tokens',
    'output_tokens',
    'cache_read_tokens',
    'cache_write_tokens',
    'sessions',
    'events'
  ];

  const lines = [head.join(',')];

  (resp.rows || []).forEach(r => {
    const iso = new Date(r.bucket * 1000).toISOString();
    const cell = v => { const s = String(v == null ? '' : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };

    const rawCost = r.cost || 0;

    // Route through existing helper rather than inline mode derivation to prevent leaks
    const costVal = perItemUsesTokens(framing) ? '' : String(rawCost);
    
    let cycleShareVal = '';
    if (framing.pricing_mode === 'subscription' && framing.plan_monthly_usd > 0) {
      cycleShareVal = String((rawCost / framing.plan_monthly_usd) * 100.0);
    }

    const rowData = [
      r.bucket,
      iso,
      cell(r.group),
      cell(r.stack),
      costVal,
      cycleShareVal,
      r.input_tokens || 0,
      r.output_tokens || 0,
      r.cache_read_tokens || 0,
      r.cache_write_tokens || 0,
      r.sessions || 0,
      r.events || 0
    ];

    lines.push(rowData.join(','));
  });

  return lines.join('\n');
}

function downloadCsv(filename, text) {
  const blob = new Blob([text], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

// `route` lets the pivot live on another screen (the Dashboard reuses it under
// #/dashboard, which is now the ONLY way to reach this component: the
// standalone #/analytics route was retired, since it was a second nav entry
// for the exact same explorer the Dashboard already embeds. Old #/analytics
// links alias to the Dashboard instead of 404ing — see primaryKeyFor).
// `embedded` drops the standalone title + window picker so the host screen
// owns those. Default args keep this signature call-compatible even though
// nothing invokes it bare anymore.
// Four placeholders for the four KPI tiles the row settles into (Spend, Tokens,
// Sessions, Events), so the row occupies its final height from first paint. A
// LOCAL corpus (no marginal cost to price at all) drops the Spend tile, in
// which case the row narrows by one when the answer lands; holding four is still
// the closer guess than holding none.
const KPI_SKELETON_TILES = [0, 1, 2, 3];

function AnalyticsView({ params, route = 'analytics', embedded = false, kpiCaption = null }) {
  const DEFAULTS = { since: DEFAULT_SINCE, metric: 'spend', group_by: 'model', stack: '', chart: 'bar',
    agent_id: '', provider: '', model: '', tool: '' };
  const since = readParam(params, 'since', DEFAULTS.since, validSince);
  const metric = readParam(params, 'metric', DEFAULTS.metric, v => ANALYTICS_METRICS.some(m => m[0] === v));
  const groupBy = readParam(params, 'group_by', DEFAULTS.group_by, v => ANALYTICS_DIMENSIONS.some(d => d[0] === v));
  const stack = readParam(params, 'stack', DEFAULTS.stack, v => v === '' || ANALYTICS_DIMENSIONS.some(d => d[0] === v));
  const chart = readParam(params, 'chart', DEFAULTS.chart, v => ANALYTICS_CHARTS.some(c => c[0] === v));
  const fAgent = readParam(params, 'agent_id', '');
  const fProvider = readParam(params, 'provider', '');
  const fModel = readParam(params, 'model', '');
  const fTool = readParam(params, 'tool', '');
  const cur = { since, metric, group_by: groupBy, stack, chart, agent_id: fAgent, provider: fProvider, model: fModel, tool: fTool };
  const setFilter = (k, v) => navigate(route, { ...cur, [k]: v }, DEFAULTS);
  const applyPreset = (q) => navigate(route, { ...cur, ...q }, DEFAULTS);

  // #295: Stack only makes sense on the multi-series charts (bar/line). The
  // Leaderboard (hbar) collapses the time dimension into a single per-group
  // total and ignores stack entirely, so a stale stack there just strands the
  // view on an empty cross-tab ("No data"). Gate it: hide the Stack control AND
  // drop stack_by from the query for non-stacking charts. The chosen stack stays
  // in the URL, so it returns when the user switches back to a bar/line chart.
  const stackApplies = chart === 'bar' || chart === 'line';
  const effStack = stackApplies ? stack : '';

  const [st, setSt] = useState({ loading: true, error: null, resp: null });
  // Generation guard, same mechanism as useTriageRead: `load` has no polling
  // of its own, but a rapid pivot/window change (metric, group_by, stack,
  // since, or any filter) fires a NEW request while an OLDER one from the
  // previous selection can still be in flight. Without dropping a stale
  // settle, a slower earlier request (e.g. "By: Model", which groups more
  // rows) landing AFTER a faster later one ("By: Tenant") would silently
  // overwrite the current selection's chart/legend with the PREVIOUS
  // dimension's data — the chart would show tenant grouping while the legend
  // still lists model names, a rendered element outliving the data it
  // described. `gen` makes only the settle matching the CURRENT selection
  // allowed to write state.
  const gen = useRef(0);

  const load = useCallback(async () => {
    const g = ++gen.current;
    setSt(s => ({ ...s, loading: true, error: null }));
    try {
      const resp = await api('/analytics', {
        metric, group_by: groupBy, stack_by: effStack || undefined, since,
        agent_id: fAgent || undefined, provider: fProvider || undefined,
        model: fModel || undefined, tool: fTool || undefined,
      });
      if (gen.current === g) setSt({ loading: false, error: null, resp });
    } catch (e) {
      if (gen.current === g) setSt(s => ({ ...s, loading: false, error: e.message || String(e) }));
    }
  }, [metric, groupBy, stack, chart, since, fAgent, fProvider, fModel, fTool]);

  useEffect(() => {
    setSt(s => ({ ...s, loading: true, error: null }));
    load();
  }, [load]);

  const { loading, error, resp } = st;
  const framing = resp ? resp.framing : null;
  // Plan-tier framing: the spend metric switches to token volume for LOCAL
  // (dollars suppressed -- no marginal cost to price at all) — single
  // source, never re-derived. Subscription no longer suppresses (product
  // decision: tj does not differentiate subscription-billed from
  // API-billed users).
  const isSpend = metric === 'spend';
  const useTokens = isSpend && !!framing && framing.pricing_mode === 'local';
  const valueIsDollars = isSpend && !useTokens;
  // fmtDashUsd (at most 2dp), not fmtCost: this view only ever renders
  // embedded on the Dashboard (see the router's dashboard/analytics alias
  // note above), so its chart tooltip and leaderboard values follow the
  // Dashboard's precision rule.
  const fmtV = valueIsDollars ? fmtDashUsd : fmtTokens;
  const fmtVal = v => (metric === 'sessions' || metric === 'events') ? fmtTokens(v).replace(/ tokens$/, '') : fmtV(v);
  const axisFmt = valueIsDollars ? fmtAxisUsd : fmtTokens;

  const series = (chart === 'line' || chart === 'bar') ? buildAnalyticsSeries(resp, useTokens) : null;
  const board = chart === 'hbar' ? buildLeaderboard(resp, useTokens) : null;
  const kpis = resp ? resp.kpis : null;
  const filterChips = [['agent_id', fAgent], ['provider', fProvider], ['model', fModel], ['tool', fTool]].filter(x => x[1]);

  const metricSuffix = isSpend ? (useTokens ? ' (tokens)' : '') : '';

  // Tool spans carry no tokens/cost, so grouping spend/tokens BY tool (or tool
  // category) is structurally all-zeros (#268). Rather than render a wall of
  // zeros, show a helpful empty state with a one-click switch to Events.
  const toolDimNoMetric = (groupBy === 'tool' || groupBy === 'tool_category')
    && (metric === 'spend' || metric === 'tokens');

  // #295: a stacked breakdown can be structurally empty even when the metric has
  // plenty of data — e.g. Model × Tool category, since a span is either an LLM
  // call or a tool call, never both. Detect that so we can prompt the user to
  // clear the stack instead of stranding them on a bare "No data" chart. (Only
  // bar/line carry a stack — effStack is '' for the leaderboard.)
  const noRows = !!resp && Array.isArray(resp.rows) && resp.rows.length === 0;
  const emptyFromStack = !!effStack && noRows;
  const labelOf = dim => (ANALYTICS_DIMENSIONS.find(d => d[0] === dim) || [, dim])[1];

  // #313: surface the leaderboard's own total + item count (a ranked list with
  // no sum is confusing), and reconcile the gap when grouping by a PARTIAL
  // dimension — only some spans carry it (e.g. a tool), so the breakdown subtotal
  // is legitimately smaller than the all-events KPI and otherwise looks
  // contradictory. Purely additive: only the leaderboard (hbar) branch reads
  // these; nothing else changes.
  const boardTotal = board ? board.reduce((s, e) => s + (e.value || 0), 0) : 0;
  const boardCount = board ? board.length : 0;
  const dimName = (ANALYTICS_DIMENSIONS.find(d => d[0] === groupBy) || [, groupBy])[1].toLowerCase();
  const dimNamePlural = (/y$/.test(dimName) && !/[aeiou]y$/.test(dimName)) ? dimName.slice(0, -1) + 'ies' : dimName + 's';
  const countMetric = (metric === 'events' || metric === 'sessions') ? metric : null;
  const kpiCount = (countMetric && kpis) ? kpis[countMetric] : null;
  const boardGap = kpiCount != null && boardTotal > 0 && boardTotal < kpiCount;

  const getFilename = () => {
    if (!resp) return 'tokenjam-analytics.csv';
    const startStr = resp.window_start ? new Date(resp.window_start * 1000).toISOString().split('T')[0] : '';
    const endStr = resp.window_end ? new Date(resp.window_end * 1000).toISOString().split('T')[0] : '';
    return startStr && endStr ? `tokenjam-analytics_${startStr}_${endStr}.csv` : 'tokenjam-analytics.csv';
  };



  return html`
    ${embedded ? null : html`<div class="page-title" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      Analytics <${PlanBadge} framing=${framing} />
    </div>`}

    <div class="filters">
      <label class="ctl">Metric
        <select value=${metric} onChange=${e => setFilter('metric', e.target.value)}>
          ${ANALYTICS_METRICS.map(([v, l]) => html`<option value=${v}>${l}</option>`)}
        </select></label>
      <label class="ctl">By
        <select value=${groupBy} onChange=${e => setFilter('group_by', e.target.value)}>
          ${ANALYTICS_DIMENSIONS.map(([v, l]) => html`<option value=${v}>${l}</option>`)}
        </select></label>
      ${stackApplies ? html`<label class="ctl">Stack
        <select value=${stack} onChange=${e => setFilter('stack', e.target.value)}>
          <option value="">none</option>
          ${ANALYTICS_DIMENSIONS.filter(d => d[0] !== groupBy).map(([v, l]) => html`<option value=${v}>${l}</option>`)}
        </select></label>` : null}
      <label class="ctl">Chart
        <select value=${chart} onChange=${e => setFilter('chart', e.target.value)}>
          ${ANALYTICS_CHARTS.map(([v, l]) => html`<option value=${v}>${l}</option>`)}
        </select></label>
      ${embedded ? null : html`<select value=${since} onChange=${e => setFilter('since', e.target.value)}>
        <option value="24h">Last 24h</option><option value="7d">Last 7d</option>
        <option value="30d">Last 30d</option><option value="90d">Last 90d</option>
      </select>`}
      <button class="btn" onClick=${load}>Refresh</button>
      <button class="btn" onClick=${() => resp && downloadCsv(getFilename(), analyticsCsv(resp))} disabled=${loading}>Export CSV</button>
    </div>

    <div class="filters preset-row">
      <span class="dim" style="font-size:12px">Presets:</span>
      ${ANALYTICS_PRESETS.map(p => html`<button class="btn preset-btn" onClick=${() => applyPreset(p.q)}>${p.label}</button>`)}
      ${filterChips.map(([k, v]) => html`<button class="btn" onClick=${() => setFilter(k, '')}>${k.replace('_id', '')}: ${v} ✕</button>`)}
    </div>

    ${error ? html`<div class="chart-card" style="border-color:var(--error)"><div style="color:var(--error);font-size:13px;margin-bottom:10px">Couldn't load analytics: ${error}</div><button class="btn" onClick=${load}>Retry</button></div>` : null}

    ${!error && kpis ? (() => {
      // The Spend tile follows the server framing block (single source, never
      // re-derived). Under SUBSCRIPTION it shows an implied-value MULTIPLIER
      // ("43.5× plan value", #262) — NOT "% of cycle" and NOT raw tokens (which
      // duplicated the Tokens tile, #247). Its sparkline/delta still track SPEND
      // (cost_usd), since the multiplier is just spend rescaled by the plan fee
      // — so the trend/shape are identical to spend, never raw $. LOCAL / a
      // subscription with no declared fee have no denominator → the tile is
      // dropped rather than duplicate Tokens.
      const deltas = resp.kpi_deltas || {};
      const spend = spendTileDisplay(kpis.spend, framing);
      // A prior window with almost no activity makes period-over-period % a
      // misleading sliver (the ▲1682% on a fresh backfill, #262). Use the prior
      // window's session count as the universal "did anything happen" proxy.
      const prevThin = !!resp.kpi_prev && (resp.kpi_prev.sessions || 0) < 2;
      const onMetric = (k) => setFilter('metric', k);
      // #318: the ACTIVE count-metric tile shows the breakdown subtotal next to
      // the window total when grouping by a PARTIAL dimension (only some spans
      // carry it, e.g. tool), so the window-wide tile reconciles with the smaller
      // chart subtotal. Count metrics only (events/sessions — spend/tokens framing
      // is more complex); only when there's an actual gap.
      const breakdownTotal = (resp.rows || []).reduce((s, r) => s + (r.value || 0), 0);
      const breakdownDim = (ANALYTICS_DIMENSIONS.find(d => d[0] === groupBy) || [, groupBy])[1].toLowerCase();
      const activeSub = ((metric === 'events' || metric === 'sessions')
        && breakdownTotal > 0 && breakdownTotal < (kpis[metric] || 0))
        ? { value: fmtCount(breakdownTotal), label: `by ${breakdownDim}` } : null;
      // Founder request (2026-07-30): the Tokens card leads with the TOKEN
      // count, no dollar figure. On a subscription plan a raw $ spend is not a
      // figure the user actually pays (Rule 22 framing), and the card is
      // labelled "Tokens" -- so it shows the count, plain: no dollar headline,
      // no secondary line.
      const tiles = [];
      if (spend) {
        tiles.push({ key: 'spend', label: spend.label, cost: true, value: spend.value,
          series: kpiSparkValues(resp, 'spend'), delta: deltas.spend });
      }
      // kpiFigure, not the bare formatter: a field the payload omitted renders as
      // unknown rather than as fmtCount(null)'s "0" or fmtTokens(null)'s dash.
      tiles.push({ key: 'tokens', label: 'Tokens', cost: false,
        value: kpiFigure(kpis.tokens, fmtTokens),
        series: kpiSparkValues(resp, 'tokens'), delta: deltas.tokens });
      tiles.push({ key: 'sessions', label: 'Sessions', cost: false, value: kpiFigure(kpis.sessions, fmtCount),
        series: kpiSparkValues(resp, 'sessions'), delta: deltas.sessions });
      tiles.push({ key: 'events', label: 'Events', cost: false, value: kpiFigure(kpis.events, fmtCount),
        series: kpiSparkValues(resp, 'events'), delta: deltas.events });
      return html`
        <div class="kpi-row">
          ${tiles.map(t => html`<${KpiTile} label=${t.label} value=${t.value} active=${t.key === metric}
              series=${t.series} delta=${t.delta == null ? null : t.delta} cost=${t.cost}
              sub=${t.sub || (t.key === metric ? activeSub : null)}
              prevThin=${prevThin} onSelect=${() => onMetric(t.key)} />`)}
        </div>
        ${kpiCaption ? html`<div class="kpi-caption">${kpiCaption}</div>` : null}`;
    })() : null}

    ${/* The KPI row holds its final position while the numbers are unknown.
          Returning null here (the old behaviour) meant the row simply did not
          exist until /analytics answered, so on a large corpus the entire chart
          below it jumped down the page tens of seconds after first paint. Four
          placeholders, matching the four tiles that follow, in the app's own
          .shimmer; a placeholder cannot be mistaken for a figure, whereas the
          row's absence plus a chart sitting high on the page reads as a page
          that has finished loading. Not shown once `kpis` exists, and not shown
          on a REFRESH over numbers already on screen. */ ''}
    ${!error && !kpis ? html`
      <div class="kpi-row" aria-hidden="true">
        ${KPI_SKELETON_TILES.map(i => html`
          <div key=${i} class="kpi-tile">
            <div class="kpi-top">
              <div class="kpi-num" style="flex:1">
                <div class="shimmer" style="height:20px;width:56%"></div>
                <div class="shimmer" style="height:11px;width:38%;margin-top:6px"></div>
              </div>
              <div class="shimmer" style="height:24px;width:64px;flex-shrink:0;border-radius:3px"></div>
            </div>
            <div class="shimmer" style="height:11px;width:70px;margin-top:8px"></div>
          </div>`)}
      </div>` : null}

    ${!error ? html`
      <div class="chart-card" style=${loading ? 'opacity: 0.5; pointer-events: none; transition: opacity 0.2s' : 'transition: opacity 0.2s'}>
        <div class="chart-head">
          <div class="chart-title">${(ANALYTICS_METRICS.find(m => m[0] === metric) || [, metric])[1]} by ${(ANALYTICS_DIMENSIONS.find(d => d[0] === groupBy) || [, groupBy])[1]}${metricSuffix}</div>
        </div>
        ${toolDimNoMetric ? html`
          <div class="empty compact">
            <div style="font-size:13px;margin-bottom:12px">Tools don't carry ${metric === 'spend' ? 'cost' : 'tokens'}; those live on the LLM-call spans, not tool spans.</div>
            <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
              <button class="btn" onClick=${() => setFilter('metric', 'events')}>Switch to Events</button>
              <button class="btn" onClick=${() => setFilter('group_by', 'model')}>Group by Model</button>
              <button class="btn" onClick=${() => setFilter('group_by', 'agent')}>Group by Agent</button>
            </div>
          </div>`
          /* Same height the real chart renders at, so the switch to a chart
             moves nothing below it. */
          : loading && !resp ? html`<div class="shimmer" style="height:220px"></div>`
          : emptyFromStack ? html`
            <div class="empty compact">
              <div style="font-size:13px;margin-bottom:12px">No rows for ${labelOf(groupBy)} × ${labelOf(effStack)}. That breakdown is empty because a span carries only one of these: e.g. an LLM call has a model but no tool, a tool span has a tool but no model.</div>
              <button class="btn" onClick=${() => setFilter('stack', '')}>Clear stack</button>
            </div>`
          : chart === 'hbar'
            ? (board && board.length ? html`
              <div class="dim" style="font-size:12px;margin:2px 0 8px">Total: ${fmtVal(boardTotal)} · ${boardCount} ${boardCount === 1 ? dimName : dimNamePlural}</div>
              <div class="leaderboard">
                ${board.map((e, i) => {
                  const label = formatGroupLabel(e.group, groupBy);
                  return html`
                  <div class="lb-row">
                    <span class="lb-rank">${i + 1}</span>
                    <span class="lb-name" title=${label}>${label}</span>
                    <span class="lb-bar"><span class="lb-fill" style=${'width:' + (e.frac * 100).toFixed(1) + '%;background:' + colorFor(e.group)}></span></span>
                    <span class="lb-val">${fmtVal(e.value)}</span>
                  </div>`;
                })}
              </div>
              ${boardGap ? html`<div class="chart-foot"><span class="dim">Only ${fmtCount(boardTotal)} of ${fmtCount(kpiCount)} ${countMetric} have a ${dimName}; the rest aren't in this breakdown.</span></div>` : null}
              ` : html`<div class="empty compact">No data in this window.</div>`)
            : (series ? html`
              ${chart === 'line'
                ? html`<${SpendChart} data=${series.data} labels=${series.labels} height=${220} fmtY=${fmtV} axisFmtY=${axisFmt} showLegend=${series.labels.length > 1} bucket=${series.bucket} />`
                : html`<${StackedBarChart} data=${series.data} labels=${series.labels} height=${220} fmtY=${fmtV} axisFmtY=${axisFmt} bucket=${series.bucket} />`}
              ${series.coarsened ? html`<div class="chart-foot"><span class="dim">Showing ${series.bucket} buckets; this range is too long for ${series.requestedBucket}ly detail.</span></div>` : null}
            ` : html`<div class="empty compact">No data in this window.</div>`)}
      </div>` : null}
  `;
}

// ============================
// Merged Dashboard (#/dashboard) — the Improve lens's main triage front door.
// ============================
// Composes the triage front-door (spend hero + run-rate, compact
// recoverable-waste + health bands) with the Analytics pivot explorer as the
// hero canvas, reusing the existing helpers / components (SpendChart,
// recoverableTiles, HealthTile, AnalyticsView). The standalone Overview and
// Analytics screens this once sat alongside are both retired now: #/overview
// and #/analytics alias here (see primaryKeyFor) rather than 404ing.
// One window selector (header) drives BOTH the triage fetch and the embedded
// explorer (which reads `since` from the same URL params).
// ---- Review inbox (Improve lens home) ----
// The self-improve loop's Approve stage (self-improve-loop SPEC.md §12 /
// §8 reuse map): pending relearn fixes the cross-session relearn aggregator
// (core/optimize/analyzers/relearn.py, served from a background-refreshed
// cache at GET /relearn/proposals — see api/routes/relearn.py) land here for
// a human to review. Phase 2 wires Approve to a real write, routed by its
// delivery mechanism, through POST /relearn/apply (core.optimize.relearn_apply
// — git-commit or gzip-backup reversible, disabled-by-default for hooks).
// Dismiss stays a client-side-only hide (localStorage, never sent to the
// server). The chassis (listhead / listbox / addbar / cur-modal) is forked
// from Optimize ▸ Summarize's curate → diff → Apply/Reject screen
// (~6410-7040 above), per Phase A's scaffold.
const RELEARN_DISMISSED_KEY = 'tj_relearn_dismissed_v1';

function loadDismissedRelearns() {
  try {
    const raw = localStorage.getItem(RELEARN_DISMISSED_KEY);
    return raw ? new Set(JSON.parse(raw)) : new Set();
  } catch (e) { return new Set(); }
}

function saveDismissedRelearns(set) {
  try { localStorage.setItem(RELEARN_DISMISSED_KEY, JSON.stringify([...set])); } catch (e) { /* best-effort */ }
}

// Delivery mechanisms, mirroring core/rulewrite/kinds.py. A record from an
// older build carries no mechanism this build can name; it renders as unknown
// rather than as a guess, because the label is what tells a reader which
// artifact is about to be written where.
const DELIVERY_LABELS = {
  claude_md_rule: 'rule (CLAUDE.md)',
  path_scoped_rule: 'path-scoped rule',
  skill: 'skill / doc',
  executing_hook: 'hook (blocking guard)',
  injecting_hook: 'hook (context nudge)',
};
const UNKNOWN_DELIVERY_LABEL = 'unknown (legacy record)';
function deliveryLabel(name) {
  return DELIVERY_LABELS[String(name || '')] || UNKNOWN_DELIVERY_LABEL;
}
const ENFORCEMENT_DELIVERIES = new Set(['executing_hook', 'injecting_hook']);

// Verdict/recurrence-since-apply labels and the Compound-ledger summary that
// used to render here were the frontend half of the perpetual verify/receipts
// layer removed for making unsupportable realized-savings claims (see
// relearn_apply.py's AppliedFix.verify docstring) — nothing has populated
// them since, so they always rendered an inert "Not yet checked" placeholder.
// Replaced by the Applied tab's honest `est.` figure (InboxStatTiles /
// AppliedItemRow below), a bounded point-in-time snapshot taken at apply
// time, never a live re-measurement.

// The select-all state transition, kept pure and outside the component so it
// can be exercised directly rather than only asserted against as markup.
// `visibleSigs` is the RENDERED row set: clicking a fully-selected box clears
// exactly those rows from the selection, anything else adds them all. Rows the
// list is not showing are never touched in either direction.
function nextSelectAllSelection(visibleSigs, checkedSigs) {
  const next = new Set(checkedSigs);
  const all = visibleSigs.length > 0 && visibleSigs.every(sig => next.has(sig));
  for (const sig of visibleSigs) {
    if (all) next.delete(sig);
    else next.add(sig);
  }
  return next;
}

// The table's select-all box. `indeterminate` has no HTML attribute and cannot
// be expressed as a checked value, so it is assigned to the DOM node through a
// ref on every render — a two-state header box over a partial selection is a
// well-known source of accidental bulk actions.
function SelectAllCheckbox({ total, selected, onToggle }) {
  const ref = useRef(null);
  const all = total > 0 && selected === total;
  useEffect(() => {
    if (ref.current) ref.current.indeterminate = selected > 0 && selected < total;
  });
  return html`<input type="checkbox" ref=${ref} checked=${all} disabled=${total === 0}
    title=${all ? 'Clear selection' : 'Select all listed'}
    aria-label=${all ? 'Clear selection' : 'Select all listed'}
    onChange=${onToggle} />`;
}

// --- Inbox redesign: sort + long-tail collapse, badges, est./mo formatting
// (behavioral requirements #1-#4). Shared by both the Recurring-mistakes and
// Cost-advisories tabs so the two never drift on what "biggest first" means.

const INBOX_COLLAPSE_THRESHOLD = 8;

//: Noise floor for BOTH tabs. A card worth less than this is not worth a row:
//: acting on it costs the reader more attention than the fix returns, and on a
//: real corpus the sub-$5 tail is the bulk of the card count for a small
//: fraction of the money. Founder call, 2026-07-26.
//
// Two rules that keep this a display filter rather than a quiet write-off:
//   * ONLY A KNOWN FIGURE CAN BE JUDGED SMALL. An item with no dollar figure
//     is unpriced, not cheap, so the floor never hides it — hiding it would
//     turn "we could not price this" into "this did not matter", which is the
//     same inversion the analyzer gates already had to be corrected for.
//   * WHAT IS HIDDEN IS STATED. Each tab renders a line naming how many rows
//     the floor removed and what they cost combined, so the filter is never
//     silent shrinkage. The headline figure is untouched: it is the server's
//     own total over every open proposal, and it still counts these.
const INBOX_MIN_USD = 5;

// True only for an item whose OWN priced figure is under the floor. Reads the
// same `past_overspend_usd` the row renders, so what is filtered and what is
// displayed can never disagree.
function belowInboxFloor(item) {
  const usd = item && item.past_overspend_usd;
  return usd != null && usd < INBOX_MIN_USD;
}

// Founder-approved carve-out, scoped to the Review inbox ONLY: the resend
// ("TRIM") card's own dollar figure is a structural token-share measurement,
// not a savings claim (RESEND_HONESTY_CAVEAT in analyzers/context_resend.py
// says so explicitly), so this page treats it as unpriced for every
// dollar-first decision below even though its dollar field carries a real,
// non-null number. dollarsSuppressed() itself is NOT touched by this set — it
// still governs every other surface in the app unchanged.
const NOT_A_SAVINGS_CLAIM_ANALYZERS = new Set(['resend']);

// --- The mechanism axis: what tj can actually DO about a row ---------------
//
// This page used to be two tabs cut on WHICH ANALYZER produced a row: one fed
// by `relearn` alone, one by the other sixteen. That is a fact about our own
// module layout, not a decision the reader makes, and it put the largest
// figures the product computes on the second tab. One list ranked by money
// replaces both, so the axis that genuinely changes what the reader does next
// has to travel ON the row instead of being the tab they picked.
//
// TWO ORTHOGONAL FACTS, NOT ONE ENUM. This started as a three-valued enum
// (write / snippet / none) and that was wrong, because the two are not mutually
// exclusive and the card has never treated them as such: `CostProposalCard`
// renders `${prop.suggestion ? ...}` and `${prop.apply_capable ? ...}` as two
// INDEPENDENT conditionals, and `deadweight`'s mcp_remove proposal is exactly
// the overlap case, showing a copyable snippet AND a confirm-target apply
// control together. An enum has to pick one of those to report, so it
// necessarily lies about that row. Two booleans cannot.
//
//   inboxCanApply(item)    tj makes the change itself. RELEARN: the write
//                          budget offered a rule (`write_offered`) and the
//                          cluster is not advise-only, which is exactly
//                          `RelearnApplyModal`'s own gate, so a row tagged this
//                          way can never open a modal reading "nothing to
//                          approve". COST: `apply_capable`, the same flag the
//                          apply controls are gated on.
//                          Drives: checkbox eligibility, the primary action,
//                          and bulk scope.
//
//   inboxHasSnippet(item)  there is an exact change to hand over. COST:
//                          `suggestion`. RELEARN: `advise_snippet_offered`,
//                          stamped server-side
//                          (`relearn_proposals.advise_snippet_offered`), true
//                          when `proposed_fix` is a real derived recommendation
//                          rather than the "no fix template matched"
//                          placeholder.
//                          Drives: whether the copy box renders. The snippet IS
//                          the deliverable where there is no writer, so it gets
//                          a labelled box on the row, never a hover or a
//                          footnote.
//
// "Nothing actionable yet" is DERIVED from both being false, not a third peer
// value: `summarize` (its fix lives in its own curate/diff/apply lifecycle) and
// the clusters no fix template matched (the real next step is the example
// sessions). Stated in words; such a row must never be a blank space the reader
// is expected to interpret.
//
// Both predicates read the SAME flags their fix blocks gate on, so a tag can
// never advertise an action the card then refuses. Neither is keyed on analyzer
// identity: the day a `downsize` proposal becomes apply-capable its rows gain
// the apply control with no edit here.
function inboxCanApply(item) {
  if (!item) return false;
  if (item.kind === 'relearn') return !item.advise_only && item.write_offered !== false;
  return !!item.apply_capable;
}

function inboxHasSnippet(item) {
  if (!item) return false;
  if (item.kind === 'relearn') {
    return !!item.advise_snippet_offered && String(item.proposed_fix || '').trim() !== '';
  }
  return String(item.suggestion || '').trim() !== '';
}

// A `MechanismTags` component and its `MECHANISM_TAG_COPY` map used to render up
// to two badges here (TJ CAN APPLY / COPY THE FIX / NO FIX YET). Both are GONE, on
// founder call, and the reasoning is worth keeping because it generalises: THE
// ACTION BUTTON ALREADY SAYS WHAT PRESSING IT DOES. "Approve & write", "Remove
// entry", "Apply note", "Mark applied" and "Review in Summarize" are each
// unambiguous, so a badge restating them was chrome, and on the two rows that
// showed TJ CAN APPLY and then demanded a pasted path before the button would do
// anything, it was actively over-promising. With no label there is only one promise
// on the row and it is the button, which is wired to the real capability, so that
// whole class of mismatch cannot recur.
//
// `inboxNothingActionable` went with them: it existed only to pick the third badge
// and had no consumer in the render, so it is deleted rather than left stranded.
// The two predicates below still drive BEHAVIOUR (which button, whether the copy
// box renders) and are the reason removing the labels is safe.
//
// `inboxMechanismTag` survives, feeding only the row's `data-mechanism` attribute:
// a test and console hook, never anything a reader sees. It reports the OVERLAP
// ("apply snippet") rather than collapsing it, so the attribute cannot drift from
// what the two predicates decided.
function inboxMechanismTag(item) {
  const parts = [];
  if (inboxCanApply(item)) parts.push('apply');
  if (inboxHasSnippet(item)) parts.push('snippet');
  return parts.length ? parts.join(' ') : 'none';
}

// --- Ordering: observed money, and nothing that merely resembles it --------
//
// Rank on the OBSERVED past-overspend token figure, full stop. The previous
// key fell back to `estimated_monthly_tokens` when the observed figure was
// absent, which let a forward 30-day PROJECTION compete for position against
// past observations inside one sort: two different quantities, two different
// tenses, silently interleaved, and the reader has no way to tell which kind
// of number put a row where it is.
//
// This is a LATENT bug, not one anyone has seen: every cluster and proposal in
// the real payload carries `past_overspend_tokens`, so the fallback has never
// fired. It is fixed as a structural guard rather than as a repair — a row with
// no observed figure is now unable to enter the ranked list at all, because it
// goes to `unobserved` and renders in its own group below the fold.
//
// Tokens, not dollars: some rows have no dollar rate at all, and ordering them
// against priced rows would mean inventing a $/token rate to make the two
// comparable. The product forbids that, so the ranking runs on the one figure
// every row carries and dollars stay a per-row DISPLAY choice.
function observedRankTokens(item) {
  const t = item && item.past_overspend_tokens;
  return typeof t === 'number' && isFinite(t) ? t : null;
}

// Split BEFORE the sort, so an unranked row is structurally incapable of
// interleaving with ranked ones rather than merely sorting to the bottom.
function partitionByObservedOverspend(items) {
  return {
    ranked: items.filter(i => observedRankTokens(i) != null),
    unobserved: items.filter(i => observedRankTokens(i) == null),
  };
}

// THE ordering function, and it is upstream's, by name and by key. This branch
// had grown a second function computing the identical thing;
// upstream's `sortByPastOverspend` shipped first, so that duplicate is deleted
// rather than kept in parallel. Upstream's reasoning, preserved because it is the
// justification for the key: rank by TOKENS, the one figure every item carries,
// priced or not. Comparing a dollar-priced item against a tokens-only one would
// mean inventing a $/token rate to make them comparable, which the product
// forbids, so dollars stay a per-row DISPLAY choice decoupled from ranking. A
// relearn cluster now carries `past_overspend_tokens` on exactly the same basis a
// cost proposal does, so one function serves both.
function sortByPastOverspend(items) {
  return [...items].sort((a, b) => (observedRankTokens(b) || 0) - (observedRankTokens(a) || 0));
}

// What the noise floor removed, stated rather than silently dropped. Renders
// nothing when the floor caught nothing, so a small clean inbox stays clean.
//
// Deliberately NOT an expandable row: these are items the product has decided
// are not worth the reader's attention, and giving them a toggle re-creates
// the noise the floor exists to remove. The count and the combined figure are
// enough to prove nothing was swept under the rug — the headline above still
// counts them, and `tj optimize <analyzer> --json` still lists them in full.
function BelowFloorNote({ items, label }) {
  if (!items || items.length === 0) return null;
  const usd = items.reduce((s, i) => s + (i.past_overspend_usd || 0), 0);
  return html`
    <div class="dim" style="font-size:12px;padding:var(--pad-row-y) var(--inset-x);border-top:1px solid var(--border)">
      ${items.length} smaller ${label} under ${fmtUsd(INBOX_MIN_USD)} ${items.length === 1 ? 'is' : 'are'} hidden · ${fmtUsd(usd)} combined, still counted in the total above.
    </div>`;
}

// Top N normally, the remainder folded into one collapsible row (behavioral
// requirement #3) — a 42-tiny-fixes tail must read as one bundled decision,
// not 42 peers.
function splitTopAndTail(sorted, max = INBOX_COLLAPSE_THRESHOLD) {
  if (sorted.length <= max) return { top: sorted, tail: [] };
  return { top: sorted.slice(0, max), tail: sorted.slice(max) };
}

// --- Loading state: placeholders shaped like the rows they become -----------
//
// The bug this replaced was a correctness bug, not a styling one. Both endpoints
// serve their CACHED result immediately and merely flag `status: "computing"`
// when a refresh is in flight, so the page had 55 clusters and 16 proposals in
// hand while printing a bare "Loading…", omitting the avoided tile, and rendering
// the tab as "Open (0)". A zero is the single most misleading value this page can
// print: it reads as "you are all clear" on an inbox holding thousands of dollars.
//
// Three server states that used to collapse into one dead screen, now distinct:
//   * `computing` WITH cached rows -> render the rows, and let the header's own
//     "scanning…" be the quiet refreshing indicator. Never blank the list for a
//     recompute.
//   * `computing` with NOTHING cached -> a first scan really is running, so say so
//     and hold the geometry with skeletons.
//   * `never_run` / a completed-but-empty scan -> the existing empty states.
//
// The skeleton mirrors the real row's geometry (title line, the 3-line clamped
// description block, a fix block, an action row) so real content FILLS IN rather
// than replacing a differently-shaped block. Motion is the app's existing
// `.shimmer` and nothing else: no spinner, no bouncing dots, and above all no
