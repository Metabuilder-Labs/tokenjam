      <div class="mb-xaxis"><div class="mb-gutter mono">${mode === 'time' ? '0s' : 'step 1'}</div><div class="mb-ticks">
        ${ticks.map((t) => {
          // The final tick sits at x=100% — right-align it (no centering transform) so
          // it stays inside the lane instead of being clipped past the right edge.
          const pos = t.x >= 100 ? 'right:0;left:auto;transform:none' : (t.x <= 0 ? 'left:0;transform:none' : 'left:' + t.x + '%');
          return html`<div class="mb-tick" style=${pos}>${t.label}</div>`;
        })}
      </div></div>

      ${breaks.map((b) => html`<div class="mb-break" style=${'left:' + b.px.toFixed(1) + 'px'}></div>`)}
      ${breaks.map((b) => b.showLab ? html`<div class="mb-break-lab" title=${b.label} style=${'left:' + b.labLeft.toFixed(1) + 'px'}>⋯ ${b.label}</div>` : null)}

      <div class="mb-cross" ref=${crossRef}><div class="mb-crosslabel" ref=${crossLabelRef}></div></div>
      <div class="mb-tip" ref=${tipRef}></div>
    </div>

    <div class="mb-legend">
      <span><i style="background:var(--chart-1)"></i>Read</span>
      <span><i style="background:var(--chart-4)"></i>Grep/Glob</span>
      <span><i style="background:var(--chart-2)"></i>Edit/Write</span>
      <span><i style="background:var(--chart-3)"></i>Bash</span>
      <span><i style="background:var(--chart-5)"></i>Task</span>
      <span><i style="background:var(--chart-6)"></i>WebFetch</span>
      <span><i style="background:var(--text-dim)"></i>Other</span>
      <span><i style="background:var(--error)"></i>error</span>
      <span title="a dashed red outline on a bar or tick marks a retried step"><i style="background:transparent;border:1px dashed var(--error);box-sizing:border-box"></i>retry</span>
      <span title="phase-band tints alternate per phase to show boundaries; hover a band for its title"><i style=${'background:' + mbTint('--chart-1', 30)}></i>phase band</span>
      <span class="mb-hint">hover any lane for details · toggle re-spaces every lane</span>
    </div>

    ${territory ? html`
      <div class="mb-sec">
        <div class="mb-sec-h"><h3>Where the work landed</h3>
          <span class="mb-sec-cap">shade = touch intensity · ①=order · <span class="mb-edt">✎</span>=edited</span></div>
        <div class="mb-tree">
          <div class="mb-root">${territory.root}</div>
          <div class="mb-dirs">
            ${territory.dirs.map((d) => html`
              <div class="mb-dir" style=${'flex:' + Math.max(0.6, d.weight)}>
                <div class="mb-dh"><span class="mb-dh-nm" title=${d.full}>${d.label}</span> <span class="mb-meta">${d.totalTouches} touch${d.totalTouches === 1 ? '' : 'es'}</span></div>
                <div class="mb-files">
                  ${d.files.map((f) => {
                    const inten = territory.maxTouches > 0 ? f.touches / territory.maxTouches : 0;
                    const pct = (8 + inten * 30).toFixed(1);
                    const cvar = f.edited ? '--success' : '--brand';
                    const metaTxt = f.edits
                      ? (f.touches + '× · ' + f.edits + ' edit' + (f.edits === 1 ? '' : 's'))
                      : (f.reads + ' read' + (f.reads === 1 ? '' : 's'));
                    return html`<div class="mb-file" title=${f.path} style=${'background:' + mbTint(cvar, pct)}>
                      <span class="mb-ord">${f.rank}</span>
                      <span class="mb-nm">${f.base}</span>
                      ${f.edited ? html`<span class="mb-edt">✎</span>` : null}
                      <span class="mb-meta">${metaTxt}</span>
                    </div>`;
                  })}
                </div>
              </div>`)}
            ${territory.scratch ? html`
              <div class="mb-dir mb-scratch" title=${territory.scratch.title}>
                <div class="mb-dh"><span class="mb-dh-nm">temp / scratch</span> <span class="mb-meta">demoted</span></div>
                <div class="mb-meta">${territory.scratch.count} file${territory.scratch.count === 1 ? '' : 's'} · ${territory.scratch.reads} read${territory.scratch.reads === 1 ? '' : 's'}${territory.scratch.edits ? ' · ' + territory.scratch.edits + ' edit' + (territory.scratch.edits === 1 ? '' : 's') : ''} · hover for paths</div>
              </div>` : null}
          </div>
          <div class="mb-tcap">Cards are sized by edits over reads: edits (green, ✎) are where the work landed; reads sweep wide. Order badges show first-touch sequence; temp/scratch reads collapse into one muted card. Descriptive only: tj reports what happened, you judge the approach.</div>
        </div>
      </div>
    ` : null}
  `;
}

// The session-detail loading placeholder, shaped like the real layout below
// (back button, title, the two overview/cost cards' row geometry, the tab bar,
// a few table-row placeholders) so real content FILLS IN rather than replacing
// a bare centered "Loading session..." with a differently-shaped block -- the
// same convention `AppliedSkeletonRow` uses. Kept immediately above
// `SessionDetailView` so the two shapes are edited together; a skeleton that
// drifts from the layout it stands in for causes exactly the visible jump it
// exists to prevent.
function SessionDetailSkeleton({ backBtn }) {
  const cardRow = (labelW, valueW) => html`
    <div class="card-row">
      <span class="shimmer" style=${'display:inline-block;height:11px;width:' + labelW}></span>
      <span class="shimmer" style=${'display:inline-block;height:11px;width:' + valueW}></span>
    </div>`;
  return html`
    ${backBtn}
    <div class="shimmer" style="height:22px;width:220px;margin-top:12px"></div>
    <div class="shimmer" style="height:11px;width:160px;margin:8px 0 16px"></div>
    <div class="cards">
      <div class="card" aria-hidden="true">
        <div class="card-header"><span class="shimmer" style="display:inline-block;height:13px;width:70px"></span></div>
        ${cardRow('50px', '90px')}
        ${cardRow('60px', '70px')}
        ${cardRow('50px', '110px')}
        ${cardRow('70px', '60px')}
        ${cardRow('60px', '80px')}
      </div>
      <div class="card" aria-hidden="true">
        <div class="card-header"><span class="shimmer" style="display:inline-block;height:13px;width:100px"></span></div>
        ${cardRow('40px', '70px')}
        ${cardRow('80px', '60px')}
        ${cardRow('80px', '60px')}
        ${cardRow('70px', '50px')}
      </div>
    </div>
    <div class="tab-bar" aria-hidden="true">
      <span class="shimmer" style="display:inline-block;height:13px;width:110px"></span>
      <span class="shimmer" style="display:inline-block;height:13px;width:70px;margin-left:14px"></span>
      <span class="shimmer" style="display:inline-block;height:13px;width:60px;margin-left:14px"></span>
    </div>
    <div class="shimmer" style="height:200px;margin-top:16px"></div>
  `;
}

function SessionDetailView({ sessionId }) {
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);
  // Map/Approach/Timeline are drill-in evidence, not the landing tab
  // (self-improve-loop SPEC.md §12 — demoted from primary session tabs).
  const [tab, setTab] = useState('models');

  const load = useCallback(async () => {
    try {
      const d = await api('/sessions/' + sessionId);
      setData(d);
      setError(null);
    } catch (e) {
      setError(e && e.message ? e.message : 'Failed to load session');
    }
  }, [sessionId]);

  useEffect(() => { load(); const t = setInterval(load, 5000); return () => clearInterval(t); }, [load]);

  const backBtn = html`<button class="btn btn-back" onClick=${() => location.hash = '#/sessions'}>← Back to sessions</button>`;

  if (error) return html`<div>${backBtn}<div class="empty">Session not found.<code>${sessionId}</code></div></div>`;
  if (!data) return html`<${SessionDetailSkeleton} backBtn=${backBtn} />`;

  const s = data.session;
  const tools = data.tools || [];
  const alerts = data.alerts || [];
  const traces = data.traces || [];
  const drift = data.drift;
  const modelMix = data.model_mix || [];
  const contextSeries = data.context_series || [];
  const subagents = data.subagents || { rows: [], total: 0, cost_usd: 0, tokens: 0, flagged: 0 };
  const ctxMax = contextSeries.reduce((m, p) => Math.max(m, p.input_tokens || 0), 0);
  const isLocal = s.pricing_mode === 'local';
  const framing = data.framing || null;
  const title = s.label || s.agent_id;

  return html`
    ${backBtn}
    <div style="display:flex;align-items:center;gap:16px">
      <div class="page-title" style="margin-bottom:0">${title}</div>
      ${s.status !== 'active' && s.session_id ? html`<div style="margin-left:auto"><${RestoreButton} sessionId=${s.session_id} /></div>` : null}
    </div>
    <div style="font-size:12px;color:var(--text-dim);margin:6px 0 16px;font-family:'Geist Mono',monospace">Session ${s.session_id}</div>

    <div class="cards">
      <div class="card">
        <div class="card-header">
          <span class="status-dot ${s.status}"></span>
          Overview
          <span class="badge badge-${s.status}" style="margin-left:auto">${s.status}</span>
        </div>
        <div class="card-row"><span class="label">Agent</span><span class="value" style="font-family:'Geist Mono',monospace;font-size:12px">${s.agent_id}</span></div>
        ${s.namespace ? html`<div class="card-row"><span class="label">Project</span><span class="value">${s.namespace}</span></div>` : null}
        ${s.run_id ? html`<div class="card-row"><span class="label">Run</span><span class="value clickable" onClick=${() => location.hash = '#/runs/' + s.run_id} title=${'Run ' + s.run_id} style="cursor:pointer;color:var(--brand);font-family:'Geist Mono',monospace;font-size:12px">${s.run_id.slice(0, 12)} →</span></div>` : null}
        <div class="card-row"><span class="label">Plan</span><span class="value">${s.plan_tier}</span></div>
        ${s.duration_seconds != null ? html`<div class="card-row"><span class="label">Elapsed</span><span class="value">${fmtDurLong(s.duration_seconds * 1000)}</span></div>` : null}
        ${s.started_at ? html`<div class="card-row"><span class="label">Started</span><span class="value">${fmtAgo(s.started_at)}</span></div>` : null}
        ${s.last_span_time ? html`<div class="card-row"><span class="label">Last seen</span><span class="value">${fmtAgo(s.last_span_time)}</span></div>` : null}
        <div class="card-row"><span class="label">Conversations</span><span class="value">${s.conversation_count}</span></div>
        <div class="card-row"><span class="label">LLM calls</span><span class="value">${data.turn_count || 0}</span></div>
        ${s.active_alerts > 0 ? html`<div class="card-row"><span class="label">Alerts</span><span class="value" style="color:var(--error)">${s.active_alerts} active</span></div>` : null}
      </div>

      <div class="card">
        <div class="card-header">Cost & Tokens</div>
        ${isLocal
          ? html`<div class="card-row"><span class="label">Cost</span><span class="value">Local model, no API cost</span></div>`
          : html`<div class="card-row"><span class="label">Cost <span class="info-btn">i<span class="info-tip">Estimated from token usage at API list rates.</span></span></span><span class="value">${fmtFramedDollar(s.total_cost_usd, framing)}</span></div>`}
        <div class="card-row"><span class="label">Input tokens</span><span class="value">${fmtTokens(s.input_tokens)}</span></div>
        <div class="card-row"><span class="label">Output tokens</span><span class="value">${fmtTokens(s.output_tokens)}</span></div>
        ${s.cache_tokens ? html`<div class="card-row"><span class="label">Cache tokens</span><span class="value">${fmtTokens(s.cache_tokens)}</span></div>` : null}
        <div class="card-row"><span class="label">Tool calls</span><span class="value">${s.tool_call_count}${s.error_count ? ' (' + s.error_count + ' failed)' : ''}</span></div>
      </div>
    </div>

    <div class="tab-bar" role="tablist">
      <button class="tab ${tab === 'models' ? 'active' : ''}" role="tab" aria-selected=${tab === 'models'} onClick=${() => setTab('models')}>Models & context</button>
      ${subagents.total > 0 ? html`<button class="tab ${tab === 'subagents' ? 'active' : ''}" role="tab" aria-selected=${tab === 'subagents'} onClick=${() => setTab('subagents')}>Subagents${subagents.flagged ? ' (' + subagents.flagged + ')' : ''}</button>` : null}
      <button class="tab ${tab === 'alerts' ? 'active' : ''}" role="tab" aria-selected=${tab === 'alerts'} onClick=${() => setTab('alerts')}>Alerts</button>
      <button class="tab ${tab === 'traces' ? 'active' : ''}" role="tab" aria-selected=${tab === 'traces'} onClick=${() => setTab('traces')}>Traces</button>
      <button class="tab ${tab === 'loop' ? 'active' : ''}" role="tab" aria-selected=${tab === 'loop'} onClick=${() => setTab('loop')}>Loop</button>
      <span class="tab-sep">Evidence</span>
      <button class="tab ${tab === 'map' ? 'active' : ''}" role="tab" aria-selected=${tab === 'map'} onClick=${() => setTab('map')}>Map</button>
      <button class="tab ${tab === 'approach' ? 'active' : ''}" role="tab" aria-selected=${tab === 'approach'} onClick=${() => setTab('approach')}>Approach</button>
      <button class="tab ${tab === 'story' ? 'active' : ''}" role="tab" aria-selected=${tab === 'story'} onClick=${() => setTab('story')}>Timeline</button>
    </div>

    ${tab === 'map' ? html`<${MapBoardSection} sessionId=${sessionId} />` : null}

    ${tab === 'approach' ? html`<${ApproachSection} sessionId=${sessionId} />` : null}

    ${tab === 'story' ? html`<${StorySection} sessionId=${sessionId} />` : null}

    ${tab === 'models' ? html`
    ${(modelMix.length > 0 || contextSeries.length > 0) ? html`
      <div class="page-title" style="font-size:14px;margin-top:24px">Models & context</div>
      <div style="font-size:12px;color:var(--text-dim);margin:-14px 0 12px;font-family:'Geist Mono',monospace">How this session split across models${data.turn_count ? ' · ' + data.turn_count + ' LLM call' + (data.turn_count === 1 ? '' : 's') : ''}</div>
      ${modelMix.length > 0 ? html`
        <div class="table-wrap"><table>
          <thead><tr><th>Model</th><th>Calls</th><th>Input</th><th>Output</th><th>Cache</th><th>Cost <span class="info-btn">i<span class="info-tip">Estimated from token usage at API list rates.</span></span></th></tr></thead>
          <tbody>
            ${modelMix.map(m => html`
              <tr>
                <td class="mono">${m.model}</td>
                <td>${m.calls}</td>
                <td>${fmtTokens(m.input_tokens)}</td>
                <td>${fmtTokens(m.output_tokens)}</td>
                <td>${m.cache_tokens ? fmtTokens(m.cache_tokens) : '-'}</td>
                <td>${fmtCost(m.cost_usd)}</td>
              </tr>
            `)}
          </tbody>
        </table></div>
      ` : null}
      ${contextSeries.length > 0 ? html`
        <div style="margin-top:16px">
          <div style="display:flex;align-items:flex-end;gap:2px;height:80px;padding:4px 0;border-bottom:1px solid var(--border);overflow:hidden">
            ${contextSeries.map(p => html`
              <div style=${'flex:1 1 0;min-width:1px;background:var(--brand);opacity:0.7;height:' + (ctxMax > 0 ? Math.max(2, Math.round((p.input_tokens / ctxMax) * 100)) : 2) + '%'} title=${fmtTokens(p.input_tokens) + ' input tokens' + (p.t ? ' · ' + fmtAgo(p.t) : '')}></div>
            `)}
          </div>

// ============================
// Close-the-loop section (#53)
// ============================
// Annotate a run with a verdict + note, promote it into a stored expectation,
// record whether a rerun passed or regressed, and read the fix-history — the
// loop-closing half that pairs with tokenjam's capture half. All local-first;
// mirrors the `tj loop` CLI and the /annotations + /expectations API exactly.
const VERDICT_COLORS = { good: 'var(--success)', bad: 'var(--error)', mixed: 'var(--warn)', unknown: 'var(--text-dim)' };
const OUTCOME_COLORS = { pass: 'var(--success)', regress: 'var(--error)', unknown: 'var(--text-dim)' };

function LoopSection({ sessionId, agentId }) {
  const [annotations, setAnnotations] = useState([]);
  const [expectations, setExpectations] = useState([]);   // promoted from THIS run
  const [allExpectations, setAllExpectations] = useState([]);
  const [verdict, setVerdict] = useState('bad');
  const [note, setNote] = useState('');
  const [expName, setExpName] = useState('');
  const [expDesc, setExpDesc] = useState('');
  const [recordExp, setRecordExp] = useState('');
  const [flash, setFlash] = useState(null);
  const [busy, setBusy] = useState(false);

  const load = useCallback(async () => {
    try {
      const [a, e, all] = await Promise.all([
        api('/sessions/' + encodeURIComponent(sessionId) + '/annotations'),
        api('/expectations', { session_id: sessionId }),
        api('/expectations'),
      ]);
      setAnnotations(a.annotations || []);
      setExpectations(e.expectations || []);
      setAllExpectations(all.expectations || []);
    } catch (err) { setFlash('Failed to load loop data.'); }
  }, [sessionId]);

  useEffect(() => { load(); }, [load]);

  const saveAnnotation = async () => {
    if (!note.trim() || busy) return;
    setBusy(true);
    try {
      await apiPost('/sessions/' + encodeURIComponent(sessionId) + '/annotations', { note: note.trim(), verdict });
      setNote(''); setFlash('Annotation saved.'); await load();
    } catch (err) { setFlash('Save failed.'); } finally { setBusy(false); }
  };

  const promote = async () => {
    if (!expName.trim() || busy) return;
    setBusy(true);
    try {
      await apiPost('/expectations', { name: expName.trim(), description: expDesc.trim() || null, origin_session_id: sessionId, agent_id: agentId });
      setExpName(''); setExpDesc(''); setFlash('Expectation created.'); await load();
    } catch (err) { setFlash('Promote failed.'); } finally { setBusy(false); }
  };

  const recordRun = async (outcome) => {
    if (!recordExp || busy) return;
    setBusy(true);
    try {
      await apiPost('/expectations/' + encodeURIComponent(recordExp) + '/runs', { outcome, session_id: sessionId });
      setFlash('Recorded ' + outcome + ' against expectation.'); await load();
    } catch (err) { setFlash('Record failed.'); } finally { setBusy(false); }
  };

  const label = { fontSize: '12px', color: 'var(--text-dim)', fontFamily: "'Geist Mono',monospace" };
  return html`
    <div class="page-title" style="font-size:14px;margin-top:24px">Close the loop</div>
    <div style=${{ ...label, margin: '-14px 0 16px' }}>Annotate this run, turn it into an expectation, and track pass/regress across reruns. Verdicts are your judgment, not an automated score.</div>
    ${flash ? html`<div style="font-size:12px;color:var(--brand);margin-bottom:12px">${flash}</div>` : null}

    <div class="cards">
      <div class="card">
        <div class="card-header">Annotate this run</div>
        <div style="display:flex;gap:6px;margin:8px 0">
          ${['good', 'bad', 'mixed', 'unknown'].map(v => html`
            <button class="btn" style=${'flex:1;border-color:' + (verdict === v ? VERDICT_COLORS[v] : 'var(--border)') + ';color:' + (verdict === v ? VERDICT_COLORS[v] : 'var(--text-dim)')} onClick=${() => setVerdict(v)}>${v}</button>
          `)}
        </div>
        <textarea class="rename-input" style="width:100%;min-height:60px;resize:vertical" placeholder="What happened on this run?" value=${note} onInput=${e => setNote(e.target.value)}></textarea>
        <button class="btn" style="margin-top:8px" disabled=${busy || !note.trim()} onClick=${saveAnnotation}>Save annotation</button>
      </div>

      <div class="card">
        <div class="card-header">Promote to expectation</div>
        <div style=${{ ...label, marginBottom: '8px' }}>Turn this run into a repeatable case you can check later runs against.</div>
        <input class="rename-input" style="width:100%;margin-bottom:6px" placeholder="Expectation name" value=${expName} onInput=${e => setExpName(e.target.value)} />
        <textarea class="rename-input" style="width:100%;min-height:44px;resize:vertical" placeholder="Expected behavior (optional)" value=${expDesc} onInput=${e => setExpDesc(e.target.value)}></textarea>
        <button class="btn" style="margin-top:8px" disabled=${busy || !expName.trim()} onClick=${promote}>Promote to expectation</button>
      </div>
    </div>

    ${annotations.length > 0 ? html`
      <div class="page-title" style="font-size:14px;margin-top:24px">Annotations</div>
      <div class="table-wrap"><table>
        <thead><tr><th>When</th><th>Verdict</th><th>Note</th></tr></thead>
        <tbody>
          ${annotations.map(a => html`<tr>
            <td>${a.created_at ? fmtAgo(a.created_at) : '-'}</td>
            <td>${a.verdict ? html`<span style=${'color:' + (VERDICT_COLORS[a.verdict] || 'var(--text-dim)')}>${a.verdict}</span>` : '-'}</td>
            <td>${a.note}</td>
          </tr>`)}
        </tbody>
      </table></div>
    ` : null}

    ${allExpectations.length > 0 ? html`
      <div class="page-title" style="font-size:14px;margin-top:24px">Record this run against an expectation</div>
      <div style=${{ ...label, margin: '-14px 0 8px' }}>Viewing a rerun? Log whether it passed or regressed against a saved expectation.</div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <select class="rename-input" style="min-width:220px" value=${recordExp} onChange=${e => setRecordExp(e.target.value)}>
          <option value="">Select an expectation…</option>
          ${allExpectations.map(e => html`<option value=${e.expectation_id}>${e.name}</option>`)}
        </select>
        <button class="btn" style="border-color:var(--success);color:var(--success)" disabled=${busy || !recordExp} onClick=${() => recordRun('pass')}>pass</button>
        <button class="btn" style="border-color:var(--error);color:var(--error)" disabled=${busy || !recordExp} onClick=${() => recordRun('regress')}>regress</button>
      </div>
    ` : null}

    ${expectations.length > 0 ? html`
      <div class="page-title" style="font-size:14px;margin-top:24px">Expectations from this run</div>
      ${expectations.map(e => html`<${ExpectationHistory} expectation=${e} key=${e.expectation_id} />`)}
    ` : null}
  `;
}

function ExpectationHistory({ expectation }) {
  const [runs, setRuns] = useState(null);
  useEffect(() => {
    api('/expectations/' + encodeURIComponent(expectation.expectation_id))
      .then(d => setRuns(d.runs || []))
      .catch(() => setRuns([]));
  }, [expectation.expectation_id]);
  const label = { fontSize: '12px', color: 'var(--text-dim)', fontFamily: "'Geist Mono',monospace" };
  return html`
    <div class="card" style="margin-bottom:12px">
      <div class="card-header">${expectation.name}</div>
      ${expectation.description ? html`<div style=${{ ...label, marginBottom: '8px' }}>${expectation.description}</div>` : null}
      ${runs == null ? TableRowsSkeleton(['When', 'Outcome', 'Run', 'Note'], 2)
        : runs.length === 0 ? html`<div style=${label}>No reruns recorded yet.</div>`
        : html`<div class="table-wrap"><table>
            <thead><tr><th>When</th><th>Outcome</th><th>Run</th><th>Note</th></tr></thead>
            <tbody>
              ${runs.map(r => html`<tr>
                <td>${r.created_at ? fmtAgo(r.created_at) : '-'}</td>
                <td><span style=${'color:' + (OUTCOME_COLORS[r.outcome] || 'var(--text-dim)')}>${r.outcome}</span></td>
                <td>${r.session_id ? html`<span class="clickable" style="cursor:pointer;color:var(--brand)" onClick=${() => location.hash = '#/sessions/' + r.session_id}>${r.session_id.slice(0, 12)}</span>` : '-'}</td>
                <td>${r.note || ''}</td>
              </tr>`)}
            </tbody>
          </table></div>`}
    </div>
  `;
}

// ============================
// Run Detail View
// ============================
function RunDetailView({ runId }) {
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);

  const load = useCallback(async () => {
    try {
      const d = await api('/runs/' + runId);
      setData(d);
      setError(null);
    } catch (e) {
      setError(e && e.message ? e.message : 'Failed to load run');
    }
  }, [runId]);

  useEffect(() => { load(); const t = setInterval(load, 5000); return () => clearInterval(t); }, [load]);

  const backBtn = html`<button class="btn btn-back" onClick=${() => location.hash = '#/sessions'}>← Back to sessions</button>`;

  if (error) return html`<div>${backBtn}<div class="empty">Run not found.<code>${runId}</code></div></div>`;
  if (!data) return html`
    <div>
      ${backBtn}
      <div class="shimmer" style="height:22px;width:180px;margin-top:12px"></div>
      ${TableRowsSkeleton(['Session', 'Status', 'Project', 'Tokens', 'Tool calls', 'Cost', 'Last seen', ''], 5)}
    </div>`;

  const r = data.run;
  const sessions = data.sessions || [];
  const tree = data.tree || [];
  // Honest cost framing: a run aggregates member sessions; pricing_mode is
  // 'subscription' / 'local' / 'api' / 'unknown' / 'mixed'. Dollars price all
  // traffic at API list rates regardless of plan (product decision: tj does
  // not differentiate subscription-billed from API-billed users), including
  // a 'mixed' aggregate -- only LOCAL has no marginal cost to price at all.
  const isLocal = r.pricing_mode === 'local';
  const costTip = "Aggregated from member sessions' token usage, at API list rates.";

  // Map session_id -> summary for tree rendering.
  const byId = {};
  for (const s of sessions) byId[s.session_id] = s;
  // Has any real parent edge? (a node with children) -> render indented tree.
  const hasEdges = tree.some(n => (n.children || []).length > 0);

  const sessionRow = (s, depth) => html`
    <tr class="clickable" onClick=${() => location.hash = '#/sessions/' + s.session_id} title=${'Session ' + s.session_id}>
      <td class="mono" style=${'padding-left:' + (12 + depth * 18) + 'px'}>${depth > 0 ? '↳ ' : ''}${s.label || s.session_id.slice(0, 8)}</td>
      <td><span class="status-dot ${s.status}" style="margin-right:5px"></span><span class="badge badge-${s.status}">${s.status}</span></td>
      <td>${s.namespace || '-'}</td>
      <td>${fmtTokens(s.input_tokens)} in / ${fmtTokens(s.output_tokens)} out</td>
      <td>${s.tool_call_count}${s.error_count ? ' (' + s.error_count + ' failed)' : ''}</td>
      <td>${isLocal ? '-' : fmtCost(s.total_cost_usd)}</td>
      <td>${fmtAgo(s.last_span_time || s.started_at)}</td>
      <td class="chevron">→</td>
    </tr>`;

  // Flatten the tree depth-first when parent edges exist; otherwise list flat.
  const walk = (nodes, depth, out) => {
    for (const n of nodes) {
      const s = byId[n.session_id];
      if (s) out.push(sessionRow(s, depth));
      walk(n.children || [], depth + 1, out);
    }
    return out;
  };
  const rows = hasEdges ? walk(tree, 0, []) : sessions.map(s => sessionRow(s, 0));

  return html`
    ${backBtn}
    <div class="page-title">Run</div>
    <div style="font-size:12px;color:var(--text-dim);margin:-14px 0 16px;font-family:'Geist Mono',monospace">${runId} · ${r.session_count} session${r.session_count === 1 ? '' : 's'}</div>

    <div class="cards">
      <div class="card">
        <div class="card-header">Overview</div>
        <div class="card-row"><span class="label">Sessions</span><span class="value">${r.session_count}</span></div>
        ${r.started_at ? html`<div class="card-row"><span class="label">Started</span><span class="value">${fmtAgo(r.started_at)}</span></div>` : null}
        ${r.last_activity ? html`<div class="card-row"><span class="label">Last seen</span><span class="value">${fmtAgo(r.last_activity)}</span></div>` : null}
        ${r.time_span_seconds != null ? html`<div class="card-row"><span class="label">Time span</span><span class="value">${fmtDur(r.time_span_seconds * 1000)}</span></div>` : null}
        <div class="card-row"><span class="label">Spans</span><span class="value">${r.span_count}</span></div>
        <div class="card-row"><span class="label">Tool calls</span><span class="value">${r.tool_call_count}${r.error_count ? ' (' + r.error_count + ' failed)' : ''}</span></div>
      </div>

      <div class="card">
        <div class="card-header">Cost & Tokens</div>
        ${isLocal
          ? html`<div class="card-row"><span class="label">Cost</span><span class="value">Local model, no API cost</span></div>`
          : html`<div class="card-row"><span class="label">Cost <span class="info-btn">i<span class="info-tip">${costTip}</span></span></span><span class="value">${fmtCost(r.total_cost_usd)}</span></div>`}
        <div class="card-row"><span class="label">Input tokens</span><span class="value">${fmtTokens(r.input_tokens)}</span></div>
        <div class="card-row"><span class="label">Output tokens</span><span class="value">${fmtTokens(r.output_tokens)}</span></div>
        ${r.cache_tokens ? html`<div class="card-row"><span class="label">Cache tokens</span><span class="value">${fmtTokens(r.cache_tokens)}</span></div>` : null}
      </div>
    </div>

    <div class="page-title" style="font-size:14px;margin-top:24px">Sessions in this run</div>
    <div style="font-size:12px;color:var(--text-dim);margin:-14px 0 12px;font-family:'Geist Mono',monospace">${hasEdges ? 'Indented by spawn parent · click a row to open the session' : 'Click a session row to open its detail'}</div>
    ${sessions.length <= 1 ? html`<div style="font-size:12px;color:var(--text-dim);margin:-6px 0 12px;font-family:'Geist Mono',monospace">This run has only one session so far.</div>` : null}
    <div class="table-wrap"><table>
      <thead><tr><th>Session</th><th>Status</th><th>Project</th><th>Tokens</th><th>Tool calls</th><th>Cost <span class="info-btn">i<span class="info-tip">${costTip}</span></span></th><th>Last seen</th><th></th></tr></thead>
      <tbody>
        ${rows}
      </tbody>
    </table></div>
  `;
}

// ============================
// Traces View
// ============================
// Sort options for the Traces list (trace-cost-ranking). "recent" is the
// historical default (reverse-chronological, additive-safe); "cost" is the
// dedicated entry point onto the most expensive traces in the window.
const TRACE_SORTS = ['recent', 'cost'];

function TracesListView({ params }) {
  // Filters come from the URL (issue #112). `result` maps to the API's `status`.
  const DEFAULTS = { since: DEFAULT_SINCE, result: '', agent_id: '', sort: 'recent', min_cost: '' };
  const since = readParam(params, 'since', DEFAULTS.since, validSince);
  const result = readParam(params, 'result', DEFAULTS.result, v => ['ok', 'error'].includes(v));
  const agentId = readParam(params, 'agent_id', DEFAULTS.agent_id);
  const sort = readParam(params, 'sort', DEFAULTS.sort, v => TRACE_SORTS.includes(v));
  const minCost = readParam(params, 'min_cost', DEFAULTS.min_cost, v => !isNaN(parseFloat(v)));
  const setFilter = (k, v) => navigate('traces', { since, result, agent_id: agentId, sort, min_cost: minCost, [k]: v }, DEFAULTS);

  const [traces, setTraces] = useState([]);
  const [totalCount, setTotalCount] = useState(0);
  const [agentStatus, setAgentStatus] = useState({});
  // Window-level cost distribution behind the outlier badge (Tukey's-fence
  // rule) -- carried from the server so the plain-language explanation always
  // matches the flags actually rendered. Null until the first fetch resolves,
  // or if the backend didn't ship the block (older server behind a newer UI).
  const [outlierRule, setOutlierRule] = useState(null);
  // The window selector's own options, derived from the store's real data
  // span (core/data_span.py) rather than a fixed list — same mechanism the
  // Dashboard uses. Null until the first fetch answers, in which case the
  // selector falls back to its always-safe floor via standardWindowOptions.
  const [dataSpan, setDataSpan] = useState(null);
  const TRACE_PAGE_SIZE = 100;
  // Distinguish "first fetch in flight" from "fetch resolved with zero rows":
  // until the first /traces fetch settles, show a loading shimmer rather than
  // the "No traces yet" empty-state, which otherwise flashes on initial paint
  // while real rows are still loading (issue #20).
  const [loaded, setLoaded] = useState(false);

  const load = useCallback(async ({ append = false } = {}) => {
    const offset = append ? traces.length : 0;
    const minCostUsd = minCost !== '' && !isNaN(parseFloat(minCost)) ? parseFloat(minCost) : undefined;
    const [td, sd] = await Promise.all([
      api('/traces', {
        since, status: result || undefined, agent_id: agentId || undefined,
        sort, min_cost_usd: minCostUsd, limit: TRACE_PAGE_SIZE, offset,
      }),
      api('/status'),
    ]);
    const nextTraces = td.traces || [];
    setTraces(prev => append ? prev.concat(nextTraces) : nextTraces);
    setTotalCount(td.total_count ?? nextTraces.length);
    setOutlierRule(td.outlier_rule || null);
    setDataSpan(td.data_span || null);
    const map = {};
    for (const a of (sd.agents || [])) map[a.agent_id] = a.status;
    setAgentStatus(map);
    setLoaded(true);
  }, [since, result, agentId, sort, minCost, traces.length]);

  useEffect(() => { load(); const t = setInterval(load, 10000); return () => clearInterval(t); }, [load]);

  // Plain-language statement of the outlier rule, with the actual numbers for
  // this window (never just a bare badge) -- conservative wording, no claim
  // of more rigor than a box-plot rule actually provides. Traces always show
  // TOKEN totals on this page -- a display convention for how traces are
  // presented, not a consequence of plan tier -- so this states the rule in
  // those terms for every account, never the server's own internal $
  // thresholds (the rule is still computed server-side on cost_usd; this page
  // just never surfaces that figure).
  const outlierNote = (() => {
    if (!outlierRule) return null;
    if (outlierRule.threshold_usd == null) {
      return `Cost outliers need at least ${outlierRule.min_sample} priced traces in this window to measure a reliable range; this window has ${outlierRule.sample_size}, so none are flagged.`;
    }
    return `Traces marked "outlier" cost far more than the rest of this window's traces: above the top of the typical range (a box-plot style rule over ${outlierRule.sample_size} priced traces), not a fraud or error signal.`;
  })();
  const outlierTooltip = () => {
    if (!outlierRule || outlierRule.threshold_usd == null) return 'Cost outlier for this window';
    return 'Cost outlier for this window: above the top of the typical range (box-plot rule), based on ' + outlierRule.sample_size + ' priced traces.';
  };

  return html`
    <div class="page-title">Traces</div>
    <div style="font-size:12px;color:var(--text-dim);margin:-14px 0 16px;font-family:'Geist Mono',monospace">Click on a trace row for details</div>
    <div class="view-toggle" style="margin:0 0 12px">
      <button class=${sort === 'recent' ? 'active' : ''} onClick=${() => setFilter('sort', 'recent')}>Most recent</button>
      <button class=${sort === 'cost' ? 'active' : ''} onClick=${() => setFilter('sort', 'cost')}>Most expensive</button>
    </div>
    <div class="filters">
      <select value=${since} onChange=${e => setFilter('since', e.target.value)}>
        <option value="1h">Last 1h</option>
        ${windowOptionsWithCurrent(dataSpan ? dataSpan.available_days : null, since)
          .filter(w => w.value !== '1h')
          .map(w => html`<option value=${w.value}>${w.label}</option>`)}
      </select>
      <select value=${result} onChange=${e => setFilter('result', e.target.value)}>
        <option value="">All results</option>
        <option value="ok">ok</option>
        <option value="error">error</option>
      </select>
      <input type="number" min="0" step="0.0001" placeholder="Min cost $" value=${minCost}
        onChange=${e => setFilter('min_cost', e.target.value)} style="width:110px" title="Only show traces costing at least this much" />
      ${agentId ? html`<button class="btn" onClick=${() => setFilter('agent_id', '')}>agent: ${agentId} ✕</button>` : null}
      <button class="btn" onClick=${() => load()}>Refresh</button>
    </div>
    ${traces.length > 0 ? html`<div class="meta">Showing ${traces.length} of ${totalCount} traces</div>` : null}
    ${outlierNote ? html`<div class="meta" style="margin-top:-8px">${outlierNote}</div>` : null}
    ${!loaded ? html`<div class="shimmer" style="height:200px"></div>`
      : traces.length === 0 ? html`<div class="empty">No traces yet. Run an agent with ${'`@watch()`'} to start recording.</div>` : html`
      <div class="table-wrap"><table>
        <thead><tr><th>Agent</th><th>Type</th><th>Time</th><th>Duration</th><th>Cost (tokens) <span class="info-btn">i<span class="info-tip">Input + output tokens for this trace.</span></span></th><th>Result <span class="info-btn">i<span class="info-tip">Shows "error" if even a single span in this trace failed</span></span></th><th>Status <span class="info-btn">i<span class="info-tip">Agent liveness: active (seen in last 5 min), stale (no recent spans), completed or idle</span></span></th><th>Spans</th><th></th></tr></thead>
        <tbody>
          ${dedup(traces).map(t => {
            const st = agentStatus[t.agent_id];
            return html`
            <tr class="clickable" onClick=${() => location.hash = '#/traces/' + t.trace_id} title=${'Trace ' + t.trace_id}>
              <td class="mono">${t.agent_id || '-'}</td>
              <td>${friendlySpanName(t.name)}</td>
              <td>${fmtAgo(t.start_time)}</td>
              <td>${fmtDur(t.duration_ms)}</td>
              <td>${fmtTokens(_costVal(t, true) || 0)} tok${t.is_outlier ? html`<span class="badge badge-warning" style="margin-left:6px" title=${outlierTooltip()}>outlier</span>` : null}</td>
              <td><span class="badge badge-${t.status_code}">${t.status_code}</span></td>
              <td>${st ? html`<span class="status-dot ${st}" style="margin-right:5px"></span><span class="badge badge-${st}">${st}</span>` : html`<span style="color:var(--text-dim)">-</span>`}</td>
              <td>${t.span_count}</td>
              <td class="chevron">\u2192</td>
            </tr>
          `})}
        </tbody>
      </table></div>
      ${traces.length < totalCount ? html`<button class="btn" onClick=${() => load({ append: true })}>Load more</button>` : null}
    `}
  `;
}

function dedup(traces) {
  const seen = new Set();
  return traces.filter(t => {
    if (seen.has(t.trace_id)) return false;
    seen.add(t.trace_id);
    return true;
  });
}

// ============================
// Trace Detail + Waterfall
// ============================
function TraceDetailView({ traceId }) {
  const [spans, setSpans] = useState([]);
  const [selected, setSelected] = useState(null);
  // Load lifecycle (#653): a large trace used to hang the skeleton forever
  // because the payload was ~1 GB. The payload is now capped + attribute-free,
  // but we still guard the fetch with a timeout + error state so the skeleton
  // ALWAYS clears — on failure we show a clear message + retry, never spin.
  const [loadState, setLoadState] = useState('loading'); // loading | ready | error
  const [loadErr, setLoadErr] = useState('');
  // Truncation disclosure (#653): a very large trace returns its first N spans
  // (plus the costliest), with the true total so we can say "showing N of M".
  const [spanCount, setSpanCount] = useState(0);
  const [truncated, setTruncated] = useState(false);
  // Lazily-fetched captured content for the SELECTED span (#653). The waterfall
  // payload is attribute-free; we fetch one span's attributes on expand.
  const [selAttrs, setSelAttrs] = useState(null);       // {span_id, attributes} | null
  const [selAttrsState, setSelAttrsState] = useState('idle'); // idle | loading | ready | error
  // Waterfall bar-sizing mode (#244): tokens / duration. Tokens is the
  // default and the only magnitude mode -- this page shows token totals for
  // every account, matching the Traces list's own display convention (a
  // property of how traces are presented, not a consequence of plan tier).
  const [wfMode, setWfMode] = useState(null);
  // Rank spans WITHIN this trace by cost (trace-cost-ranking): span_ids of the
  // costliest spans, most expensive first, so a runaway single span is
  // findable without scanning the whole waterfall by eye.
  const [topCostSpanIds, setTopCostSpanIds] = useState([]);

  // Poll so a live trace's spans appear without re-navigating. Selection is
  // tracked by span_id, so replacing the spans array preserves it.
  // `firstLoad`: only the initial fetch drives the skeleton/error UI; later
  // poll ticks fail silently so a transient blip doesn't blank a rendered trace.
  const load = useCallback((firstLoad) => {
    // Timeout guard (#653): the skeleton must ALWAYS clear. If the fetch stalls
    // (huge payload, dead daemon), race it against a timeout and surface the
    // error state instead of spinning forever.
    const TIMEOUT_MS = 20000;
    const timeout = new Promise((_, rej) =>
      setTimeout(() => rej(new Error('timeout')), TIMEOUT_MS));
    // attributes=false -> the lightweight waterfall payload (#653/#659): tree +
    // timing + tokens + cost, WITHOUT every span's captured content (which could
    // be ~1 GB for a 45k-span trace). The detail panel fetches the selected
    // span's attributes lazily below. The default (no param) full-attributes
    // payload is left for exports / the API shim — never requested here.
    Promise.race([api('/traces/' + traceId + '?attributes=false', {}, { noCache: true }), timeout])
      .then(d => {
        setSpans(d.spans || []);
        setTopCostSpanIds(d.top_cost_span_ids || []);
        setSpanCount(d.span_count != null ? d.span_count : (d.spans || []).length);
        setTruncated(!!d.truncated);
        setLoadState('ready');
        setLoadErr('');
      })
      .catch(err => {
        if (firstLoad) {
          setLoadState('error');
          setLoadErr(err && err.message === 'timeout'
            ? 'This trace is taking too long to load.'
            : 'Could not load this trace.');
        }
      });
  }, [traceId]);

  useEffect(() => {
    setLoadState('loading'); setSelected(null); setSelAttrs(null); setSelAttrsState('idle');
    load(true);
    const t = setInterval(() => load(false), 10000);
    return () => clearInterval(t);
  }, [load]);

  // Lazily fetch the selected span's captured content (#653). Cleared + refetched
  // whenever the selection changes; the waterfall payload no longer carries it.
  useEffect(() => {
    if (!selected) { setSelAttrs(null); setSelAttrsState('idle'); return; }
    let cancelled = false;
    setSelAttrs(null); setSelAttrsState('loading');
    api('/traces/' + traceId + '/spans/' + selected, {}, { noCache: true })
      .then(d => { if (!cancelled) { setSelAttrs(d); setSelAttrsState('ready'); } })
      .catch(() => { if (!cancelled) setSelAttrsState('error'); });
    return () => { cancelled = true; };
  }, [selected, traceId]);

  // Error state (#653): the skeleton must never spin forever. On a failed /
  // timed-out load, show a clear message + retry instead of the shimmer.
  if (loadState === 'error') return html`
    <div>
      <button class="btn btn-back" onClick=${() => history.back()}>← Back</button>
      <div class="empty-state" style="padding:32px 0">
        <div style="font-size:14px;margin-bottom:8px">${loadErr || 'Could not load this trace.'}</div>
        <div class="meta" style="margin-bottom:16px">The trace may be very large, or the server may be busy.</div>
        <button class="btn" onClick=${() => { setLoadState('loading'); load(true); }}>Retry</button>
      </div>
    </div>`;

  // Waterfall-shaped: staggered-indent, staggered-width shimmer bars standing
  // in for the span tree rows below, so the real waterfall fills in rather
  // than replacing a differently-shaped centered line. Only while genuinely
  // loading -- a ready trace with zero spans falls through to the (empty) tree.
  if (loadState === 'loading' && !spans.length) return html`
    <div aria-hidden="true" style="padding:8px 0">
      ${[0, 1, 1, 2, 1, 0].map((depth, i) => html`
        <div key=${i} style=${'display:flex;align-items:center;gap:8px;padding:6px 0;padding-left:' + (depth * 22) + 'px'}>
          <span class="shimmer" style=${'display:inline-block;height:11px;width:' + (160 - depth * 20) + 'px'}></span>
          <span class="shimmer" style=${'display:inline-block;height:9px;flex:' + (5 - depth) + ' 1 0'}></span>
        </div>`)}
    </div>`;

  // Build tree
  const byId = {};
  spans.forEach(s => byId[s.span_id] = s);
  const children = {};
  spans.forEach(s => {
    const pid = s.parent_span_id || '__root__';
    (children[pid] = children[pid] || []).push(s);
  });
  const spanIds = new Set(spans.map(s => s.span_id));
  const roots = spans.filter(s => !s.parent_span_id || !spanIds.has(s.parent_span_id));

  // Timeline bounds
  const times = spans.map(s => new Date(s.start_time).getTime()).filter(t => !isNaN(t));
  const endTimes = spans.map(s => s.end_time ? new Date(s.end_time).getTime() : new Date(s.start_time).getTime() + (s.duration_ms || 0)).filter(t => !isNaN(t));
  const traceStart = Math.min(...times);
  const traceEnd = Math.max(...endTimes);
  const traceDur = traceEnd - traceStart || 1;

  // Flatten tree for rendering
  function flatten(nodeList, depth) {
    let result = [];
    for (const s of (nodeList || [])) {
      result.push({ span: s, depth });
      result = result.concat(flatten(children[s.span_id], depth + 1));
    }
    return result;
  }
  const allRows = flatten(roots, 0);
  // Render cap (#653): even after the server caps the payload at 2000 spans,
  // rendering thousands of DOM rows at once jankily freezes the tab. Cap the
  // rendered rows and disclose the remainder honestly (no silent drop) --
  // between this and the server `truncated` flag the user always knows the true
  // total (`spanCount`).
  const RENDER_ROW_CAP = 1000;
  const rowsHidden = Math.max(0, allRows.length - RENDER_ROW_CAP);
  // Base rendered set: the first RENDER_ROW_CAP depth-first rows.
  const cappedRows = rowsHidden > 0 ? allRows.slice(0, RENDER_ROW_CAP) : allRows;
  // No dead jump badges (#659): a costliest span whose depth-first row index is
  // past the cap would have a badge (built from the full `byId` map) but no
  // rendered row, so clicking it did nothing. Always pin any badge target that
  // fell beyond the cap onto the end of the rendered set so the jump resolves.
  const topCostSet = new Set(topCostSpanIds);
  const renderedIds = new Set(cappedRows.map(r => r.span.span_id));
  const pinnedRows = (rowsHidden > 0)
    ? allRows.filter(r => topCostSet.has(r.span.span_id) && !renderedIds.has(r.span.span_id))
    : [];
  const rows = pinnedRows.length > 0 ? cappedRows.concat(pinnedRows) : cappedRows;
  // Span ids that actually have a rendered row — the jump badges gate on this
  // so a badge can never target a hidden row (#659).
  const renderedRowIds = new Set(rows.map(r => r.span.span_id));
  const nameW = 220;

  // Token-first annotation (#215): the magnitude bar + summary read on TOKEN
  // volume for every account, matching the Traces list's own Cost column --
  // a display convention for how traces are presented, not a consequence of
  // plan tier, so there is no framing/pricing_mode branch here at all.
  const spanTokens = s => (s.input_tokens || 0) + (s.output_tokens || 0) + (s.cache_tokens || 0) + (s.cache_write_tokens || 0);
  const wfMagOf = s => spanTokens(s);
  const wfMaxMag = Math.max(0, ...rows.map(r => wfMagOf(r.span)));

  // #244 bar sizing: tokens by default (the only magnitude mode -- also the
  // only one that works on duration-less backfilled spans), with a duration
  // toggle alongside it.
  const wfMode2 = wfMode || 'tokens';
  const wfHasDuration = rows.some(r => r.span.duration_ms != null && r.span.duration_ms > 0);
  const magForMode = s => wfMode2 === 'duration' ? (s.duration_ms || 0) : spanTokens(s);
  const maxMagMode = Math.max(0, ...rows.map(r => magForMode(r.span)));

  const wfTotalTokens = spans.reduce((a, s) => a + spanTokens(s), 0);
  // A single trace's total is per-item and token-first, same as every other
  // per-span figure on this page (#249) -- no window-aggregate "% of cycle"
  // category error, and no dollar figure at all here any more.
  const wfTotalInOut = spans.reduce((a, s) => a + _costVal(s, true), 0);
  const wfTotalCostFramed = fmtTokens(wfTotalInOut) + ' tok';

  const sel = selected ? spans.find(s => s.span_id === selected) : null;

  // Determine agent name from root span
  const rootSpan = roots.length ? roots[0] : spans[0];
  const agentName = rootSpan ? (rootSpan.agent_id || traceId.slice(0, 12)) : traceId.slice(0, 12);

  return html`
    <button class="btn btn-back" onClick=${() => history.back()}>\u2190 Back</button>
    <div class="page-title">Trace details for ${agentName}</div>
    <div style="font-size:12px;color:var(--text-dim);margin:-14px 0 16px;font-family:'Geist Mono',monospace">Click a span for details</div>
    <div class="wf-summary">
      <span>Total cost (tokens) <b>${wfTotalCostFramed}</b></span>
      <span>Tokens <b>${fmtTokens(wfTotalTokens)}</b></span>
      <span>Duration <b>${fmtDur(traceDur)}</b></span>
      <span>Started <b>${isFinite(traceStart) ? new Date(traceStart).toLocaleString() : '—'}</b></span>
      <span><b>${fmtCount(spanCount || spans.length)}</b> spans</span>
    </div>
    ${(truncated || rowsHidden > 0) ? html`
      <div class="meta" style="margin:-4px 0 12px;padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface-2, rgba(255,255,255,0.03))" role="status">
        Showing ${fmtCount(rows.length)} of ${fmtCount(spanCount || spans.length)} spans${truncated ? ' (large trace — the costliest spans are always included)' : ''}. Deeper spans are not shown to keep this view responsive.
      </div>
    ` : null}
    ${topCostSpanIds.length > 0 ? html`
      <div class="meta" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-8px 0 12px">
        <span>Costliest spans in this trace:</span>
        ${topCostSpanIds.map((sid, i) => {
          const s = byId[sid];
          // No dead badges (#659): only render a jump badge whose target row is
          // actually in the rendered `rows` set. Costliest spans past the render
          // cap are pinned into `rows` above, so this should always pass for a
          // retained span; the guard means a badge can never point at a hidden
          // row even if the payload/cap logic changes.
          if (!s || !renderedRowIds.has(sid)) return null;
          // Token-first, same as every other per-span figure on this page
          // (#187/#249) -- the badge ranks by cost server-side (the
          // underlying signal), but the label always shows the token total.
          const label = fmtTokens(spanTokens(s)) + ' tok';
          return html`<span class="badge badge-warning" style="cursor:pointer" title=${'Rank #' + (i + 1) + ' by cost in this trace. Click to jump to it below.'} onClick=${() => setSelected(sid)}>#${i + 1} ${spanPrimaryName(s)} · ${label}</span>`;
        })}
      </div>
    ` : null}
    <div class="wf-toolbar">
      <div class="wf-legend">
        <span><i class="wf-kind-dot llm"></i>LLM</span>
        <span><i class="wf-kind-dot tool"></i>Tool</span>
        <span><i class="wf-kind-dot agent"></i>Agent</span>
        <span><i class="wf-kind-dot other"></i>Other</span>
      </div>
      <div class="view-toggle">
        <button class=${wfMode2 === 'tokens' ? 'active' : ''} onClick=${() => setWfMode('tokens')}>By tokens</button>
        <button class=${wfMode2 === 'duration' ? 'active' : ''} onClick=${() => setWfMode('duration')} title=${wfHasDuration ? '' : 'Backfilled spans have no latency; bars will be flat'}>By duration</button>
      </div>
    </div>
    <div class="wf-head">
      <div class="wf-name" style="width:${nameW}px;padding-left:8px">Span</div>
      <div class="wf-track">${wfMode2 === 'duration' ? 'Timeline' : ('Magnitude · by ' + wfMode2)}</div>
      <div class="wf-offset">Offset</div>
      <div class="wf-cost">Tokens</div>
    </div>
    <div class="waterfall">
      ${rows.map(({ span: s, depth }) => {
        const st = new Date(s.start_time).getTime() - traceStart;
        const kind = spanKindClass(s.name);
        const friendly = friendlySpanName(s.name);
        const primaryName = spanPrimaryName(s);
        const isError = (s.status_code || '') === 'error';
        // #244 bar geometry. Duration mode keeps the classic time-positioned bar;
        // cost/tokens modes draw a left-anchored magnitude bar (the only thing
        // that renders on duration-less backfill data). A minimum width keeps
        // tiny spans visible/clickable.
        let left, width;
        if (wfMode2 === 'duration') {
          left = (st / traceDur * 100);
          width = Math.max((s.duration_ms || 0) / traceDur * 100, 1.5);
        } else {
          left = 0;
          width = maxMagMode > 0 ? Math.max(magForMode(s) / maxMagMode * 100, 1.5) : 1.5;
        }
        left = Math.max(0, Math.min(left, 98.5));
        width = Math.max(1.5, Math.min(width, 100 - left));
        const barEnd = left + width;
        const valFlip = barEnd > 72;
        const sTok = spanTokens(s);
        const wfFrac = wfMaxMag > 0 ? (wfMagOf(s) / wfMaxMag * 100) : 0;
        // Value printed past the bar end reflects the active mode. Duration is
        // "\u2014" with a "not captured in backfilled data" hint when absent (#243).
        const durMissing = wfMode2 === 'duration' && s.duration_ms == null;
        const valLabel = wfMode2 === 'duration'
          ? (durMissing ? '\u2014' : fmtDur(s.duration_ms))
          : (sTok ? fmtTokens(sTok) : '');
        const valTitle = durMissing ? 'Duration not captured in backfilled data' : '';
        const absStart = isFinite(traceStart) && s.start_time ? new Date(s.start_time).toLocaleString() : '';
        const offsetLabel = '+' + fmtDur(st);
        const tipLines = [friendly];
        tipLines.push('Status: ' + (s.status_code || 'unset'));
        tipLines.push('Offset: ' + offsetLabel + (absStart ? ' (' + absStart + ')' : ''));
        tipLines.push('Duration: ' + (s.duration_ms == null ? '\u2014 (not captured in backfill)' : fmtDur(s.duration_ms)));
        if (s.provider) tipLines.push('Provider: ' + s.provider);
        if (s.model) tipLines.push('Model: ' + s.model);
        if (s.tool_name) tipLines.push('Tool: ' + s.tool_name);
        if (s.input_tokens != null) tipLines.push('Input tokens: ' + fmtTokens(s.input_tokens));
        if (s.output_tokens != null) tipLines.push('Output tokens: ' + fmtTokens(s.output_tokens));
        if (s.cache_tokens) tipLines.push('Cache read: ' + fmtTokens(s.cache_tokens));
        if (s.cache_write_tokens) tipLines.push('Cache write: ' + fmtTokens(s.cache_write_tokens));
        const tooltip = tipLines.join('\n');
        return html`
          <div class="wf-row ${selected === s.span_id ? 'selected' : ''}" onClick=${() => setSelected(s.span_id)}>
            <div class="wf-name" style="width:${nameW}px;padding-left:${depth * 16 + 8}px">
              <span class="wf-status ${isError ? 'error' : 'ok'}" title=${isError ? 'error' : 'ok'}>${isError ? '\u2715' : '\u2713'}</span>
              <span class="wf-kind-dot ${kind}"></span>
              <span class="wf-name-txt" title=${primaryName}>${primaryName}</span>
            </div>
            <div class="wf-track">
              <div class="wf-bar-wrap${valFlip ? ' tip-flip' : ''}" style="left:${left.toFixed(2)}%;width:${width.toFixed(2)}%">
                <div class="wf-bar ${kind}" style="width:100%"></div>
                <div class="wf-tip">${tooltip}</div>
              </div>
              ${valLabel ? html`<span class="wf-val ${valFlip ? 'flip' : ''}" title=${valTitle} style=${valFlip ? ('right:' + (100 - barEnd).toFixed(2) + '%') : ('left:' + barEnd.toFixed(2) + '%')}>${valLabel}</span>` : null}
            </div>
            <div class="wf-offset" title=${absStart}>${offsetLabel}</div>
            <div class="wf-cost">
              <div class="wf-cost-bar"><div class="wf-cost-fill" style="width:${wfFrac.toFixed(1)}%"></div></div>
              <span class="wf-cost-tok">${sTok ? fmtTokens(sTok) : ''}</span>
            </div>
          </div>
        `;
      })}
    </div>
    ${sel ? html`
      <div class="span-detail">
        <h3>${friendlySpanName(sel.name)}</h3>
        <div style="color:var(--text-dim);font-size:11px;margin:-8px 0 12px;font-family:'Geist Mono',monospace">${sel.name}</div>
        <div class="detail-grid">
          <span class="dk">Duration</span><span class="dv">${fmtDur(sel.duration_ms)}</span>
          <span class="dk">Status</span><span class="dv">${sel.status_code}</span>
          <span class="dk">Span ID</span><span class="dv">${sel.span_id}</span>
          ${sel.provider ? html`<span class="dk">Provider</span><span class="dv">${sel.provider}</span>` : null}
          ${sel.model ? html`<span class="dk">Model</span><span class="dv">${sel.model}</span>` : null}
          ${sel.tool_name ? html`<span class="dk">Tool</span><span class="dv">${sel.tool_name}</span>` : null}
          ${sel.input_tokens != null ? html`<span class="dk">Input tokens</span><span class="dv">${fmtTokens(sel.input_tokens)}</span>` : null}
          ${sel.output_tokens != null ? html`<span class="dk">Output tokens</span><span class="dv">${fmtTokens(sel.output_tokens)}</span>` : null}
          ${sel.cache_tokens ? html`<span class="dk">Cache read</span><span class="dv">${fmtTokens(sel.cache_tokens)}</span>` : null}
          ${sel.cache_write_tokens ? html`<span class="dk">Cache write</span><span class="dv">${fmtTokens(sel.cache_write_tokens)}</span>` : null}
          ${sel.cost_usd != null ? html`<span class="dk">Tokens (total)</span><span class="dv">${fmtTokens(_costVal(sel, true))} tok</span>` : null}
          ${sel.agent_id ? html`<span class="dk">Agent</span><span class="dv">${sel.agent_id}</span>` : null}
          ${sel.conversation_id ? html`<span class="dk">Conversation</span><span class="dv">${sel.conversation_id}</span>` : null}
          ${sel.session_id ? html`<span class="dk">Session</span><span class="dv">${sel.session_id}</span>` : null}
          <span class="dk">Trace ID</span><span class="dv">${sel.trace_id}</span>
          ${sel.has_attributes ? html`
            <span class="dk">Attributes</span>
            <span class="dv">
              ${selAttrsState === 'loading' ? html`<span class="meta">Loading captured content…</span>` : null}
              ${selAttrsState === 'error' ? html`<span class="meta" style="color:var(--error)">Could not load captured content for this span.</span>` : null}
              ${selAttrsState === 'ready' && selAttrs && selAttrs.attributes && Object.keys(selAttrs.attributes).length > 0
                ? html`<pre style="margin:0;white-space:pre-wrap;font-size:11px">${JSON.stringify(selAttrs.attributes, null, 2)}</pre>`
                : (selAttrsState === 'ready' ? html`<span class="meta">No captured content.</span>` : null)}
            </span>
          ` : null}
        </div>
      </div>
    ` : null}
  `;
}

// ============================
// Cost View
// ============================
// Render a dollar value with the server-decided plan-tier framing (#110). The
// rule (which mode) is server-side; this only formats per that decision —
// mirrors core/framing.render_dollar. `dollarFmt` defaults to fmtCost (every
// existing caller's behaviour is unchanged); the Dashboard is the one caller
// that passes fmtDashUsd, so its figures stay at most 2dp without touching
// this formatter's precision anywhere else it is used (Sessions, Cost,
// Optimize, ...).
//
// Product decision: tj does not differentiate subscription-billed from
// API-billed users -- both want the same token/cost savings, and dollars
// price all traffic at API list rates regardless of plan, so subscription no
// longer gets its own "% of cycle" rendering here. LOCAL is a structurally
// different case, not a differentiation choice: local inference incurs no
// marginal dollar cost at all (no vendor bills it), so it still renders as
// unknown/absent rather than a fabricated $0.
function fmtFramedDollar(v, framing, dollarFmt = fmtCost) {
  if (!framing) return dollarFmt(v);
  if (framing.pricing_mode === 'local') return '—';
  return dollarFmt(v); // api / subscription / unknown
}

// Per-ITEM (per-row) cost rendering (#249). Dollars, uniformly, for every
// pricing mode except local (no marginal cost to price at all). The Traces
// list is the one deliberate exception -- it shows token totals for EVERY
// account there, as the market-convention display for how traces are
// presented rather than a plan consequence -- so it bypasses this formatter
// entirely rather than reading perItemUsesTokens (see TracesListView).
// `tokenTotal` must be a server-provided per-row figure (single compute
// path) -- the /traces and /status payloads carry input_tokens/output_tokens
// per row.
function perItemUsesTokens(framing) {
  return !!framing && framing.pricing_mode === 'local';
}
function fmtPerItemCost(costUsd, tokenTotal, framing) {
  if (perItemUsesTokens(framing)) return fmtTokens(tokenTotal || 0) + ' tok';
  return fmtFramedDollar(costUsd, framing); // api / subscription / unknown → dollars
}

// Integer count with thousand separators (#262): "23954" → "23,954". For the
// Sessions / Events KPI tiles, which are exact counts (not abbreviated like
// fmtTokens "23.9k").
//
// NOTE the null case: this returns the STRING "0", and fmtCost(null) likewise
// returns "$0.0000". Both are long-standing behaviour of formatters shared by
// every screen in the app, so they are left exactly as they are; the guard for
// "the payload never reported this field" belongs at the call site, which is
// what kpiFigure() below does. Do not hand either formatter a value you have
// not confirmed exists.
function fmtCount(n) {
  if (n == null) return '0';
  return Math.round(n).toLocaleString('en-US');
}

// The single glyph this app uses in place of a figure it does not have. Not a 0,
// and not a dash either (a dash reads as "none"); a question mark is the one mark
// that cannot be mistaken for a measurement. Shared by the Health tiles and the
// KPI row so one page never shows two different kinds of "unknown".
const UNKNOWN_FIGURE = '?';

// Format a KPI field, or say we do not have it. A field the server omitted is
// UNKNOWN, and "0 Sessions" for an unreported count is the same lie as a health
// tile showing 0 for a read that failed.
const kpiFigure = (v, fmt) => (v == null ? UNKNOWN_FIGURE : fmt(v));

// The Spend KPI tile under plan-tier framing (#262). For SUBSCRIPTION, the
// confusing "% of cycle" is replaced by an honest implied-value MULTIPLIER —
// "43.5× plan value" (implied API value ÷ the plan's monthly fee, which is just
// the "% of cycle" number ÷ 100). It is plan VALUE, never "spent $X". api /
// unknown keep dollars. LOCAL (no plan fee) and a subscription with no declared
// monthly fee have no denominator, so the tile is dropped — the Tokens tile
// already conveys volume. Returns {label, value} or null (drop the tile).
function spendTileDisplay(spendUsd, framing) {
  const mode = framing && framing.pricing_mode;
  // An unreported spend field is unknown, not zero. Both branches below would
  // otherwise manufacture one: `(null || 0) / fee` renders "0.0× plan value" and
  // fmtDashUsd(null) renders "$0.00", and on a spend tile a zero reads as "this
  // window cost you nothing". Checked before the mode branches so neither can.
  const unknown = spendUsd == null;
  if (mode === 'subscription') {
    if (!framing.plan_monthly_usd) return null;          // no fee → no multiplier
    if (unknown) return { label: 'Implied plan value', value: UNKNOWN_FIGURE };
    const mult = spendUsd / framing.plan_monthly_usd;    // == (% of cycle) / 100
    return { label: 'Implied plan value', value: mult.toFixed(1) + '×' };
  }
  if (mode === 'local') return null;                     // no plan fee to multiply against
  // api / unknown → dollars, at most 2dp (Dashboard's own precision rule --
  // this tile has exactly one caller, AnalyticsView, which only ever renders
  // embedded on the Dashboard).
  return { label: 'Spend', value: unknown ? UNKNOWN_FIGURE : fmtDashUsd(spendUsd) };
}

// Positive plan-tier chip(s) from the server `framing` block (#110). Distinct from
// the warning `qualifier` banner — confirms api / subscription / local mode.
function PlanBadge({ framing }) {
  if (!framing || framing.pricing_mode === 'unknown') return null;
  const labels = (framing.plan_labels && framing.plan_labels.length)
    ? framing.plan_labels
    : (framing.plan_label ? [framing.plan_label] : []);
  if (!labels.length) return null;
  return html`${labels.map(l => html`
    <span class="plan-badge" title="Billing mode from your tj config">${l}</span>
  `)}`;
}

// Cap absurd-but-finite deltas so a near-empty prior window can't render a
// four-digit percentage (#262/#396). Above the ceiling we show ">999%" instead
// of e.g. "140980.0%", which reads as a broken number on a cost tool.
const DELTA_PCT_CEILING = 999;
function fmtDeltaPct(pct) {
  const mag = Math.abs(pct);
  return mag > DELTA_PCT_CEILING ? '>999%' : mag.toFixed(1) + '%';
}

// Trend chip: ▲ (up, red) / ▼ (down, green) with a percentage. When the prior
// window is empty/thin (`prevThin`, a fresh backfill's sliver period, #262) the
// % is arithmetic noise — show "new" instead of a blown-up figure.
function TrendChip({ pct, prevThin }) {
  if (prevThin && pct != null && pct > 0) {
    return html`<span class="trend-chip" style="color:var(--error)"
      title="The prior window had little or no data, so a percentage change would be misleading.">▲ new</span>`;
  }
  if (pct == null) return null;
  const up = pct > 0;
  const arrow = pct === 0 ? '·' : up ? '▲' : '▼';
  const color = pct === 0 ? 'var(--text-dim)' : up ? 'var(--error)' : 'var(--success)';
  return html`<span class="trend-chip" style="color:${color}">${arrow} ${fmtDeltaPct(pct)} vs prev</span>`;
}

// Signed period-over-period delta chip for KPI tiles (#217). `cost`=true uses
// the spend semantic (up = red/attention, down = green); volume metrics
// (tokens/sessions/events) stay neutral — more isn't inherently "bad".
function DeltaChip({ pct, cost, prevThin }) {
  if (pct == null) return null;
  // Soften a delta computed against a near-empty prior window (#262): a fresh
  // backfill makes the prior period a sliver of data, so the % (e.g. ▲1682%) is
  // arithmetic noise, not a trend. Suppress the alarming number and annotate.
  if (prevThin) {
    return html`<span class="delta-chip" style="color:var(--text-dim)"
      title="The prior window has little data, so a percentage change would be misleading.">vs partial prior window</span>`;
  }
  const up = pct > 0;
  const arrow = pct === 0 ? '·' : up ? '▲' : '▼';
  const color = cost
    ? (pct === 0 ? 'var(--text-dim)' : up ? 'var(--error)' : 'var(--success)')
    : 'var(--text-dim)';
  return html`<span class="delta-chip" style="color:${color}">${arrow} ${fmtDeltaPct(pct)} vs prev</span>`;
}

// Inline-SVG sparkline (#217) — lightweight + offline; avoids spinning up a
// uPlot instance per KPI tile. `values` is a numeric series (already in the
// plan-tier-appropriate unit chosen by the caller). Draws a normalized polyline
// over a faint area fill.
function Sparkline({ values, color = 'var(--accent)', width = 92, height = 26 }) {
  const vs = (values || []).filter(v => typeof v === 'number' && !isNaN(v));
  if (vs.length < 2) return html`<div class="spark-empty" style=${'width:' + width + 'px;height:' + height + 'px'}></div>`;
  const max = Math.max(...vs), min = Math.min(...vs);
  const span = (max - min) || 1;
  const n = vs.length;
  const px = i => (i / (n - 1)) * width;
  const py = v => height - ((v - min) / span) * (height - 4) - 2;
  const line = vs.map((v, i) => px(i).toFixed(1) + ',' + py(v).toFixed(1)).join(' ');
  const area = 'M0,' + height + ' L' + vs.map((v, i) => px(i).toFixed(1) + ',' + py(v).toFixed(1)).join(' L') + ' L' + width.toFixed(1) + ',' + height + ' Z';
  return html`<svg class="spark" width=${width} height=${height} viewBox=${'0 0 ' + width + ' ' + height} preserveAspectRatio="none">
    <path d=${area} fill=${color} opacity="0.13"></path>
    <polyline points=${line} fill="none" stroke=${color} stroke-width="1.5"></polyline>
  </svg>`;
}

// A trend-aware KPI tile (#217): value + sparkline + signed delta. The caller
// passes series/delta already in the right unit (token-share for a suppressed
// Spend tile), so framing is decided once upstream — never re-derived here.
// `onSelect` makes the tile the metric selector (#247): the kpi-active border
// already implied it was clickable; wiring onClick fulfills that. Falls back to
// a static tile when no handler is given.
function KpiTile({ label, value, active, series, delta, cost, prevThin, onSelect, sub = null }) {
  const cls = 'kpi-tile' + (active ? ' kpi-active' : '') + (onSelect ? ' kpi-clickable' : '');
  const props = onSelect
    ? { class: cls, role: 'button', tabindex: '0', 'aria-pressed': String(!!active),
        onClick: onSelect,
        onKeyDown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onSelect(); } } }
    : { class: cls };
  // #318: optional secondary line — the breakdown subtotal on the active tile
  // when grouping by a partial dimension (defaults null, so other callers are
  // unaffected).
  return html`<div ...${props}>
    <div class="kpi-top">
      <div class="kpi-num"><div class="kpi-val">${value}</div><div class="kpi-lab">${label}</div>${sub ? html`<div class=${'kpi-sub' + (sub.dim ? ' kpi-sub-dim' : '')}><span class="kpi-sub-val">${sub.value}</span><span class="kpi-sub-lab">${sub.label}</span></div>` : null}</div>
      <${Sparkline} values=${series} />
    </div>
    <${DeltaChip} pct=${delta} cost=${cost} prevThin=${prevThin} />
  </div>`;
}

// Zero-filled per-bucket values for one KPI metric from the analytics
// `kpi_series` (server-computed; the UI never aggregates per-bucket — single
// compute path). Spans the full window via the shared grid so the sparkline
// shape matches the chart's window.
function kpiSparkValues(resp, metric) {
  const grid = _windowGrid({ ...resp, series: resp.kpi_series });
  if (!grid) return (resp.kpi_series || []).map(b => b[metric] || 0);
  const { xs, idx, step } = grid;
  const ys = xs.map(() => 0);
  (resp.kpi_series || []).forEach(b => {
    const t = Math.floor(b.bucket / step) * step;
    if (t in idx) ys[idx[t]] += (b[metric] || 0);
  });
  return ys;
}

// Build a uPlot [xs, ys...] series from day-grouped cost rows. `mode` is
// total | model | agent; `useTokens` swaps cost for token volume (true only
// for LOCAL framing, where dollars are suppressed — no marginal cost to
// price at all). Splits keep the top-5 keys plus an "other" bucket.
function _costVal(r, useTokens) {
  return useTokens ? ((r.input_tokens || 0) + (r.output_tokens || 0)) : (r.cost_usd || 0);
}

// Build a uPlot [xs, ys...] series from a /cost response. The x-axis spans the
// FULL selected window (zero-filled across empty buckets) so 7d/30d/90d look
// distinct and idle periods show as $0 (#133). `resp` carries epoch-second
// `series` buckets, `series_bucket` ('hour'|'day'), and `window_start/end`.
// Upper bound on grid points handed to uPlot. Past this the chart coarsens its
// bucket (hour->day->week) rather than returning null and rendering an empty
// state (#139) — graceful degradation, never silent truncation.
const MAX_BUCKETS = 5000;
const _BUCKET_LADDER = [['hour', 3600], ['day', 86400], ['week', 604800]];

function buildCostSeries(resp, mode, useTokens) {
  const rows = (resp && resp.series) || [];
  const reqBucket = (resp && resp.series_bucket) || 'day';
  let start = resp && resp.window_start;
  let end = resp && resp.window_end;
  if (start == null || end == null) {
    if (!rows.length) return null;  // genuinely no data -> "No spend" empty state
    const bs = rows.map(r => r.bucket);
    start = Math.min(...bs); end = Math.max(...bs);
  }
  if (!(end >= start)) return null;
  // Pick the FINEST bucket (starting from the server-requested one) whose grid
  // stays within MAX_BUCKETS. Long windows (or future finer bucketing) coarsen
  // up the ladder instead of silently emptying the chart (#139). Counting is
  // closed-form so we never build an oversized array just to discard it.
  let reqIdx = _BUCKET_LADDER.findIndex(b => b[0] === reqBucket);
  if (reqIdx < 0) reqIdx = 1;  // unknown bucket name -> treat as daily
  let bucket = _BUCKET_LADDER[reqIdx][0], step = _BUCKET_LADDER[reqIdx][1];
  for (let i = reqIdx; i < _BUCKET_LADDER.length; i++) {
    const s = _BUCKET_LADDER[i][1];
    const count = (Math.floor(end / s) - Math.floor(start / s)) + 1;
    bucket = _BUCKET_LADDER[i][0]; step = s;
    if (count <= MAX_BUCKETS) break;  // fits; coarsest is kept if none do
  }
  const coarsened = bucket !== reqBucket;
  // Align bounds to bucket boundaries and build the full grid.
  start = Math.floor(start / step) * step;
  end = Math.floor(end / step) * step;
  const xs = [];
  for (let t = start; t <= end; t += step) xs.push(t);
  const idx = {}; xs.forEach((t, i) => { idx[t] = i; });
  const bucketOf = r => Math.floor(r.bucket / step) * step;
  if (mode === 'total') {
    const ys = xs.map(() => 0);
    rows.forEach(r => { const b = bucketOf(r); if (b in idx) ys[idx[b]] += _costVal(r, useTokens); });
    return { data: [xs, ys], labels: ['Total'], bucket, coarsened, requestedBucket: reqBucket };
  }
  const keyOf = mode === 'model' ? (r => r.model || '(none)') : (r => r.agent_id || '(none)');
  const totals = {};
  rows.forEach(r => { const k = keyOf(r); totals[k] = (totals[k] || 0) + _costVal(r, useTokens); });
  const top = Object.keys(totals).sort((a, b) => totals[b] - totals[a]).slice(0, 5);
  const topSet = new Set(top);
  const hasOther = Object.keys(totals).length > top.length;
  const labels = hasOther ? [...top, 'other'] : [...top];
  const yss = labels.map(() => xs.map(() => 0));
  rows.forEach(r => {
    const k = keyOf(r); const b = bucketOf(r);
    if (!(b in idx)) return;
    const li = topSet.has(k) ? labels.indexOf(k) : (hasOther ? labels.length - 1 : -1);
    if (li >= 0) yss[li][idx[b]] += _costVal(r, useTokens);
  });
  return { data: [xs, ...yss], labels, bucket, coarsened, requestedBucket: reqBucket };
}

// Shared window grid from a series response (epoch `window_start/end` +
// `series_bucket`). Returns the zero-filled bucket xs + an index map, coarsening
// up the bucket ladder past MAX_BUCKETS (#139). Used by the cache-savings chart
// (#212); buildCostSeries keeps its own inline copy for the stacked cost chart.
function _windowGrid(resp) {
  const rows = (resp && resp.series) || [];
  const reqBucket = (resp && resp.series_bucket) || 'day';
  let start = resp && resp.window_start, end = resp && resp.window_end;
  if (start == null || end == null) {
    if (!rows.length) return null;
    const bs = rows.map(r => r.bucket); start = Math.min(...bs); end = Math.max(...bs);
  }
  if (!(end >= start)) return null;
  let reqIdx = _BUCKET_LADDER.findIndex(b => b[0] === reqBucket); if (reqIdx < 0) reqIdx = 1;
  let bucket = _BUCKET_LADDER[reqIdx][0], step = _BUCKET_LADDER[reqIdx][1];
  for (let i = reqIdx; i < _BUCKET_LADDER.length; i++) {
    const s = _BUCKET_LADDER[i][1];
    const count = (Math.floor(end / s) - Math.floor(start / s)) + 1;
    bucket = _BUCKET_LADDER[i][0]; step = s;
    if (count <= MAX_BUCKETS) break;
  }
  const coarsened = bucket !== reqBucket;
  start = Math.floor(start / step) * step; end = Math.floor(end / step) * step;
  const xs = []; for (let t = start; t <= end; t += step) xs.push(t);
  const idx = {}; xs.forEach((t, i) => { idx[t] = i; });
  return { xs, idx, step, bucket, coarsened, reqBucket };
}

// Build the redesigned cache-savings view (#246) from a /cost/cache response.
// Leads with the answer instead of three overlaid series: PER-PERIOD savings
// bars are the one chart (not a cumulative ramp), the overall hit-rate is a
// headline stat (+ a tiny sparkline for trend, NOT an overlaid axis line), and
// the "recoverable (est.)" overlay is gone (noise here; it lives on Optimize).
// `useTokens` (true only for LOCAL) swaps captured $ for cached-token volume.
function buildCacheSeries(resp, useTokens) {
  const grid = _windowGrid(resp); if (!grid) return null;
  const { xs, idx, step, bucket } = grid;
  const rows = (resp && resp.series) || [];
  const sav = xs.map(() => 0), read = xs.map(() => 0), inp = xs.map(() => 0);
  rows.forEach(r => {
    const b = Math.floor(r.bucket / step) * step; if (!(b in idx)) return;
    const i = idx[b];
    sav[i] += useTokens ? (r.captured_tokens || 0) : (r.captured_usd || 0);
    read[i] += r.cache_read_tokens || 0; inp[i] += r.input_tokens || 0;
  });
  // Per-bucket hit-rate feeds the small sparkline; the headline stat is the
  // overall window ratio (cached reads / all input reads).
  const hitSpark = xs.map((_, i) => { const d = read[i] + inp[i]; return d > 0 ? (100 * read[i] / d) : 0; });
  const totRead = read.reduce((a, b) => a + b, 0), totInp = inp.reduce((a, b) => a + b, 0);
  const hitRate = (totRead + totInp) > 0 ? (100 * totRead / (totRead + totInp)) : 0;
  return { data: [xs, sav], hitSpark, hitRate, bucket, coarsened: grid.coarsened };
}

// Attribution (multi-tenant cost) dimensions the Cost view can group/filter
// by, beyond the original total/model/agent (#SDK dashboard shape). Keyed the
// same as the `group_by` query param / API value. `label` drives the dropdown
// option text + the table's leading column header.
const COST_ATTRIBUTION_DIMS = [
  ['tenant', 'By tenant'],
  ['feature', 'By feature'],
  ['environment', 'By environment'],
  ['prompt_version', 'By prompt version'],
];
const COST_GROUP_BY_LABELS = {
  day: 'Date', agent: 'Agent', model: 'Model',
  tenant: 'Tenant', feature: 'Feature', environment: 'Environment',
  prompt_version: 'Prompt version',
};

function CostView({ params }) {
  const DEFAULTS = { since: DEFAULT_SINCE, group_by: 'total', agent_id: '' };
  const since = readParam(params, 'since', DEFAULTS.since, validSince);
  const groupBy = readParam(params, 'group_by', DEFAULTS.group_by,
    v => ['total', 'model', 'agent', ...COST_ATTRIBUTION_DIMS.map(d => d[0])].includes(v));
  const agentId = readParam(params, 'agent_id', DEFAULTS.agent_id);
  const setFilter = (k, v) => navigate('cost', { since, group_by: groupBy, agent_id: agentId, [k]: v }, DEFAULTS);
  // The chart's stacked-series data only ever splits by model/agent (the
  // /cost `series` field carries no tenant/feature/environment/prompt_version
  // breakdown) — an attribution dim's chart falls back to a single Total line
  // so it stays accurate rather than mislabeling an agent/model split as the
  // requested dimension (see buildCostSeries).
  const isAttributionDim = COST_ATTRIBUTION_DIMS.some(d => d[0] === groupBy);

  const [st, setSt] = useState({ loading: true, error: null, rows: [], total: 0,
    totalTokens: 0, framing: null, costResp: null, compare: null, cacheResp: null });
  const [tenants, setTenants] = useState({ loading: true, data: null });

  // In-flight + generation guards, same mechanism as useTriageRead (see its
