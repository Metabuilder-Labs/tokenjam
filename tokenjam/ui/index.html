  // comment for the failure this prevents): on a slow backend, `refreshAll`'s
  // 30s poll used to fire `load`/`loadTenants` again regardless of whether the
  // previous call was still outstanding, with NO cap. Every poll tick added
  // another concurrent `/cost`, `/cost/compare` and `/cost/cache` request on
  // top of whatever was still running, and the browser's per-origin connection
  // limit (6 in Chrome) meant those requests queued behind the growing pile
  // rather than actually racing it — including the very FIRST load, which
  // could then starve indefinitely behind its own later polls. The header
  // (which renders unconditionally, not gated on `loading`) kept showing the
  // zeroed initial state the whole time, looking identical to "no spend" even
  // though the real answer was sitting in a request that never got a
  // connection slot. `gen` also drops a stale settle exactly like
  // useTriageRead, so a since/groupBy/agentId change never lets an
  // in-flight-at-the-time-of-the-change request overwrite the newer one.
  const loadGen = useRef(0);
  const loadInFlight = useRef(false);
  const tenantsGen = useRef(0);
  const tenantsInFlight = useRef(false);

  const load = useCallback(async (opts = {}) => {
    if (loadInFlight.current) return;
    const g = ++loadGen.current;
    loadInFlight.current = true;
    setSt(s => ({ ...s, loading: s.rows.length === 0, error: null }));
    try {
      const tableGroup = groupBy === 'total' ? 'day' : groupBy;
      // One /cost call returns the grouped table `rows` + the daily `series`
      // (per date+agent+model) the chart needs + framing + totals (#113).
      const d = await api('/cost', { since, group_by: tableGroup, agent_id: agentId || undefined }, opts);
      let compare = null;
      try {
        compare = await api('/cost/compare', { since, compare: 'previous', agent_id: agentId || undefined }, opts);
      } catch (_) { compare = null; }
      // Cache-savings series (#212). Best-effort: a failure here must not blank
      // the cost screen, so it falls back to null (card renders nothing).
      let cacheResp = null;
      try {
        cacheResp = await api('/cost/cache', { since, agent_id: agentId || undefined }, opts);
      } catch (_) { cacheResp = null; }
      const totalTokens = d.total_tokens != null
        ? d.total_tokens
        : (d.rows || []).reduce((s, r) => s + (r.input_tokens || 0) + (r.output_tokens || 0), 0);
      if (loadGen.current === g) loadInFlight.current = false;
      setSt(s => (loadGen.current === g ? { loading: false, error: null, rows: d.rows || [],
        total: d.total_cost_usd || 0, totalTokens, framing: d.framing || null,
        costResp: d, compare, cacheResp } : s));
    } catch (e) {
      if (loadGen.current === g) loadInFlight.current = false;
      setSt(s => (loadGen.current === g ? { ...s, loading: false, error: e.message || String(e) } : s));
    }
  }, [since, groupBy, agentId]);

  // Top-tenants-by-spend concentration panel (#SDK dashboard shape) — its own
  // fetch, independent of the table's group_by, so switching "group by" away
  // from tenant doesn't blank this panel. Best-effort: a failure renders the
  // panel's own error text, never the whole Cost screen.
  const loadTenants = useCallback(async (opts = {}) => {
    if (tenantsInFlight.current) return;
    const g = ++tenantsGen.current;
    tenantsInFlight.current = true;
    setTenants(s => ({ ...s, loading: true }));
    try {
      const d = await api('/cost/tenants', { since, agent_id: agentId || undefined, top_n: 10 }, opts);
      if (tenantsGen.current === g) tenantsInFlight.current = false;
      if (tenantsGen.current === g) setTenants({ loading: false, data: d });
    } catch (e) {
      if (tenantsGen.current === g) tenantsInFlight.current = false;
      if (tenantsGen.current === g) setTenants({ loading: false, data: null, error: e.message || String(e) });
    }
  }, [since, agentId]);
  // Same cadence as `load` below, in ONE effect: Refresh/the 30s poll used to
  // only re-run `load`, so Cost totals updated while this panel kept showing
  // whatever it fetched on mount (or on the last `since`/`agentId` change).
  // Re-running this effect also covers the since/agentId-changed case on its
  // own (both `load` and `loadTenants` change identity then), so no separate
  // mount-only effect is needed.
  const refreshAll = useCallback((opts = {}) => {
    load(opts);
    loadTenants(opts);
  }, [load, loadTenants]);

  // Reset-on-change, split from the poll timer below exactly like
  // useTriageRead: the CLEANUP here (not the poll effect's) is what bumps both
  // generations and clears both in-flight flags BEFORE the next effect run's
  // `refreshAll()` fires — so a since/groupBy/agentId change always gets a
  // fresh request immediately (the guard in `load`/`loadTenants` would
  // otherwise see the OLD window's fetch still marked in-flight and silently
  // no-op the new one), and the old request's eventual settle is dropped by
  // the generation check rather than clobbering the new window's result.
  useEffect(() => {
    refreshAll();
    return () => {
      loadGen.current++; loadInFlight.current = false;
      tenantsGen.current++; tenantsInFlight.current = false;
    };
  }, [refreshAll]);

  // Poll bypasses the GET cache so the 30s refresh always hits the network —
  // but the in-flight guards above mean a poll tick that lands while the prior
  // cycle is still running is a no-op instead of stacking another cycle.
  useEffect(() => {
    const t = setInterval(() => refreshAll({ noCache: true }), 30000);
    return () => clearInterval(t);
  }, [refreshAll]);

  const { loading, error, rows, total, totalTokens, framing, costResp, compare, cacheResp } = st;
  // LOCAL only -- no marginal cost to price at all. Subscription no longer
  // suppresses (product decision: tj does not differentiate subscription-
  // billed from API-billed users), so it renders dollars like api/unknown.
  const useTokens = !!framing && framing.pricing_mode === 'local';
  const series = buildCostSeries(costResp, isAttributionDim ? 'total' : groupBy, useTokens);
  const fmtY = useTokens ? fmtTokens : fmtCost;
  const cacheSeries = buildCacheSeries(cacheResp, useTokens);

  // Run-rate (total view only): per-day average over the FULL window length
  // (not the data range — #129), projected to the end of the billing cycle
  // (#134/#138), drawn as a dashed line. Single linear figure, no forecasting.
  const cyc = cycleRemaining(costResp && costResp.cycle);
  let runRate = null, projection = null;
  if (groupBy === 'total' && series && series.data[1] && series.data[1].length) {
    const windowTotal = useTokens ? totalTokens : total;
    runRate = runRateProjection(windowTotal, since, 1);  // per-day average (single windowDays source)
    const projected = runRate * cyc.days;
    projection = useTokens ? (fmtTokens(Math.round(projected)) + ' tokens') : fmtFramedDollar(projected, framing);
  }

  const trendPct = compare ? (useTokens ? compare.tokens_delta_pct : compare.cost_delta_pct) : null;
  // A near-empty prior window (a fresh backfill's sliver period, #262) makes the
  // % arithmetic noise. Use its session count as the "did anything happen" proxy
  // so TrendChip shows "new" instead of e.g. ▲140980% on a first-run compare.
  const trendPrevThin = !!(compare && compare.previous) && (compare.previous.sessions || 0) < 2;
  // Local has no marginal cost to price at all (a genuine no-rate case, never
  // an invented one), so it shows tokens only; every other mode shows the
  // dollar figure PLUS the token total so neither unit is ever the only one
  // on screen.
  // `costResp` is the last COMPLETE payload, or null for none ever received —
  // the same "held answer" contract useTriageRead's states use. Rendering
  // `total`/`totalTokens` before the first successful load would show the
  // initial-state zero as though it were the real figure (indistinguishable
  // from "spent nothing this window"); a slow first load must stay honestly
  // unknown, never a fabricated $0.
  const hasCostData = costResp != null;
  const totalDisplay = !hasCostData ? null : useTokens
    ? (fmtTokens(totalTokens) + ' tokens')
    : `${fmtFramedDollar(total, framing)} (${fmtTokens(totalTokens)} tokens)`;
  const tableMode = groupBy === 'total' ? 'day' : groupBy;
  const totalIn = rows.reduce((s, r) => s + (r.input_tokens || 0), 0);
  const totalOut = rows.reduce((s, r) => s + (r.output_tokens || 0), 0);

  return html`
    <div class="page-title" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      Cost <${PlanBadge} framing=${framing} />
    </div>
    <div class="filters">
      <select value=${since} onChange=${e => setFilter('since', e.target.value)}>
        ${windowOptionsWithCurrent(costResp && costResp.data_span ? costResp.data_span.available_days : null, since)
          .map(w => html`<option value=${w.value}>${w.label}</option>`)}
      </select>
      <select value=${groupBy} onChange=${e => setFilter('group_by', e.target.value)}>
        <option value="total">Total</option>
        <option value="model">By model</option>
        <option value="agent">By agent</option>
        ${COST_ATTRIBUTION_DIMS.map(([v, label]) => html`<option value=${v}>${label}</option>`)}
      </select>
      ${agentId ? html`<button class="btn" onClick=${() => setFilter('agent_id', '')}>agent: ${agentId} ✕</button>` : null}
      <button class="btn" onClick=${refreshAll}>Refresh</button>
    </div>

    ${error ? html`
      <div class="chart-card" style="border-color:var(--error)">
        <div style="color:var(--error);font-size:13px;margin-bottom:10px">Couldn't load cost data: ${error}</div>
        <button class="btn" onClick=${load}>Retry</button>
      </div>` : null}

    ${!error ? html`
      <div class="chart-card">
        <div class="chart-head">
          <div class="chart-title">Spend over time ${groupBy === 'model' ? 'by model' : groupBy === 'agent' ? 'by agent' : ''} ${useTokens ? '(tokens)' : ''}</div>
          ${isAttributionDim ? html`<div class="chart-meta"><span class="dim">Shown as a single total line; the chart doesn't yet split by ${COST_GROUP_BY_LABELS[groupBy].toLowerCase()}; the table below does.</span></div>` : null}
          <div class="chart-meta">
            <span class="chart-total">${hasCostData ? totalDisplay : html`<span class="shimmer" style="display:inline-block;width:140px;height:15px;vertical-align:middle"></span>`}</span>
            ${hasCostData ? html`<${TrendChip} pct=${trendPct} prevThin=${trendPrevThin} />` : null}
          </div>
        </div>
        ${loading ? html`<div class="shimmer" style="height:160px"></div>`
          : series ? (groupBy === 'total' ? html`
            <${SpendChart} data=${series.data} labels=${series.labels} height=${160}
              fmtY=${fmtY} axisFmtY=${useTokens ? fmtTokens : fmtAxisUsd} runRate=${runRate}
              showLegend=${false} bucket=${series.bucket} />
            ${projection ? html`<div class="chart-foot">At this pace, ~${projection} by ${cyc.label} <span class="dim">(linear run-rate, not a forecast)</span></div>` : null}
            ${series.coarsened ? html`<div class="chart-foot"><span class="dim">Showing ${series.bucket} buckets; this range is too long for ${series.requestedBucket}ly detail.</span></div>` : null}
          ` : html`
            <${StackedBarChart} data=${series.data} labels=${series.labels} height=${200}
              fmtY=${fmtY} axisFmtY=${useTokens ? fmtTokens : fmtAxisUsd} bucket=${series.bucket} />
            ${series.coarsened ? html`<div class="chart-foot"><span class="dim">Showing ${series.bucket} buckets; this range is too long for ${series.requestedBucket}ly detail.</span></div>` : null}
          `) : html`<div class="empty compact">No spend in this window.</div>`}
      </div>
    ` : null}

    ${!error && cacheSeries ? html`
      <div class="chart-card">
        <div class="chart-title">Caching</div>
        <!-- Lead with the answer (#246): hit-rate + savings this window, framed.
             LOCAL shows cached-token volume (never raw $, no marginal cost to
             price at all); api and subscription both show the dollar figure. -->
        <div class="cache-headline">
          <span class="cache-stat"><b>${cacheSeries.hitRate.toFixed(0)}%</b> cache hit-rate</span>
          <${Sparkline} values=${cacheSeries.hitSpark} color="var(--chart-2)" width=${72} height=${22} />
          <span class="cache-sep">·</span>
          <span class="cache-stat">${useTokens
            ? html`<b>${fmtTokens(cacheResp.total_captured_tokens || 0)}</b> cached reads this window`
            : html`~<b>${fmtCost(cacheResp.total_captured_usd || 0)}</b> saved this window
              <span class="dim">(${fmtTokens(cacheResp.total_captured_tokens || 0)} cached reads)</span>`}</span>
        </div>
        ${loading ? html`<div class="shimmer" style="height:180px"></div>` : html`
          <${CacheSavingsChart} data=${cacheSeries.data} height=${180}
            fmtY=${useTokens ? fmtTokens : fmtCost} axisFmtY=${useTokens ? fmtTokens : fmtCost}
            bucket=${cacheSeries.bucket} />
          <div class="chart-foot">
            <span class="dim">Per-${cacheSeries.bucket === 'hour' ? 'hour' : 'day'} ${useTokens ? 'cached-token volume' : 'savings'}. Cached input bills at roughly a tenth of the normal input rate; you read these tokens at that discount, ${useTokens ? 'sparing your token budget' : 'saving the difference vs paying full price'}.</span>
            ${cacheSeries.coarsened ? html` <span class="dim">Showing ${cacheSeries.bucket} buckets.</span>` : null}
          </div>
        `}
      </div>
    ` : null}

    ${!error && !loading && isAttributionDim && rows.length === 0 ? html`
      <div class="chart-card">
        <div class="empty compact">
          No ${COST_GROUP_BY_LABELS[groupBy].toLowerCase()} data in this window.
          ${costResp && costResp.attribution_coverage && !costResp.attribution_coverage[groupBy].has_data
            ? html`Set <code class="mono">${costResp.attribution_coverage[groupBy].attribute}</code> at the call site (an OTel span or resource attribute) to see spend broken down by ${COST_GROUP_BY_LABELS[groupBy].toLowerCase()}.`
            : html`No spend in this window carried a ${COST_GROUP_BY_LABELS[groupBy].toLowerCase()} value.`}
        </div>
      </div>
    ` : null}

    ${!error && !loading && rows.length > 0 ? html`
      <div class="table-wrap"><table>
        <thead><tr>
          <th>${COST_GROUP_BY_LABELS[tableMode] || 'Group'}</th>
          ${tableMode !== 'agent' ? html`<th>Agent</th>` : null}
          ${tableMode !== 'model' ? html`<th>Model</th>` : null}
          <th>Input</th><th>Output</th><th>Cache R <span class="info-btn">i<span class="info-tip">Cache-read tokens (billed at the discounted cache-read rate).</span></span></th><th>Cache W <span class="info-btn">i<span class="info-tip">Cache-write (creation) tokens: often the dominant cost driver on cache-heavy workloads.</span></span></th><th>Cost ${useTokens ? '(tokens) ' : ''}<span class="info-btn">i<span class="info-tip">Estimated from token usage at API list rates.</span></span></th>
        </tr></thead>
        <tbody>
          ${rows.map(r => html`
            <tr>
              <td class="mono">${r.group || '-'}</td>
              ${tableMode !== 'agent' ? html`<td class="mono">${r.agent_id || '-'}</td>` : null}
              ${tableMode !== 'model' ? html`<td class="mono">${r.model || '-'}</td>` : null}
              <td>${fmtTokens(r.input_tokens)}</td>
              <td>${fmtTokens(r.output_tokens)}</td>
              <td>${fmtTokens(r.cache_tokens || 0)}</td>
              <td>${fmtTokens(r.cache_write_tokens || 0)}</td>
              <td>${useTokens ? fmtTokens(_costVal(r, true)) : fmtFramedDollar(r.cost_usd, framing)}</td>
            </tr>
          `)}
          <tr style="font-weight:600;border-top:2px solid var(--border)">
            <td colspan=${1 + (tableMode !== 'agent' ? 1 : 0) + (tableMode !== 'model' ? 1 : 0)}></td>
            <td>${fmtTokens(totalIn)}</td>
            <td>${fmtTokens(totalOut)}</td>
            <td>${fmtTokens(rows.reduce((s, r) => s + (r.cache_tokens || 0), 0))}</td>
            <td>${fmtTokens(rows.reduce((s, r) => s + (r.cache_write_tokens || 0), 0))}</td>
            <td>${useTokens ? fmtTokens(totalTokens) : fmtFramedDollar(total, framing)}</td>
          </tr>
        </tbody>
      </table></div>
    ` : null}

    ${!error ? html`<${TopTenantsPanel} tenants=${tenants} framing=${framing} />` : null}
  `;
}

// Top-N tenants by spend (#SDK dashboard shape): the concentration view that
// answers "which customers are driving the bill". Degrades honestly (Critical
// Rule 14): renders a "set tokenjam.tenant_id" empty state — never a blank or
// misleading chart — when no span in the window carries a tenant_id.
function TopTenantsPanel({ tenants, framing }) {
  const { loading, data } = tenants;
  return html`
    <div class="chart-card">
      <div class="chart-head">
        <div class="chart-title">Top tenants by spend</div>
      </div>
      ${loading ? html`<div class="shimmer" style="height:120px"></div>` : (!data || !data.has_data) ? html`
        <div class="empty compact">
          No tenant data in this window. Set <code class="mono">${(data && data.attribute) || 'tokenjam.tenant_id'}</code>
          at the call site (an OTel span attribute, or via <code class="mono">tokenjam.sdk.attribution.attribution(tenant_id=...)</code>
          for auto-instrumented calls) to see spend concentration by customer/tenant.
        </div>
      ` : html`
        <div class="table-wrap"><table>
          <thead><tr>
            <th>Tenant</th><th>Cost</th><th>Tokens</th><th>Share of total</th><th>Calls</th><th>Trend</th>
          </tr></thead>
          <tbody>
            ${data.rows.map(r => html`
              <tr>
                <td class="mono">${r.tenant_id}</td>
                <td>${fmtFramedDollar(r.cost_usd, framing)}</td>
                <td>${fmtTokens((r.input_tokens || 0) + (r.output_tokens || 0) + (r.cache_tokens || 0) + (r.cache_write_tokens || 0))}</td>
                <td>${r.share_of_total != null ? (r.share_of_total * 100).toFixed(1) + '%' : '-'}</td>
                <td>${fmtCount(r.call_count)}</td>
                <td>${r.delta_pct != null
                  ? html`<${TrendChip} pct=${r.delta_pct} prevThin=${false} />`
                  : html`<span class="dim">new</span>`}</td>
              </tr>
            `)}
          </tbody>
        </table></div>
        ${data.unattributed_cost_usd > 0 ? html`
          <div class="chart-foot"><span class="dim">${fmtFramedDollar(data.unattributed_cost_usd, framing)} of spend in this window has no tenant set and isn't included above.</span></div>
        ` : null}
      `}
    </div>
  `;
}

// ============================
// Alerts View
// ============================
function AlertsView({ params }) {
  const DEFAULTS = { severity: '', unread: '', agent_id: '', since: '' };
  const severity = readParam(params, 'severity', DEFAULTS.severity,
    v => ['critical', 'warning', 'info'].includes(v));
  const unread = readParam(params, 'unread', DEFAULTS.unread, v => ['true', 'false'].includes(v));
  const agentId = readParam(params, 'agent_id', DEFAULTS.agent_id);
  const since = readParam(params, 'since', DEFAULTS.since, validSince);
  const setFilter = (k, v) =>
    navigate('alerts', { severity, unread, agent_id: agentId, since, [k]: v }, DEFAULTS);

  const [alerts, setAlerts] = useState([]);
  const [expanded, setExpanded] = useState(null);
  const [acking, setAcking] = useState(null);
  const [ackError, setAckError] = useState(null);

  const load = useCallback(async () => {
    const d = await api('/alerts', {
      severity: severity || undefined,
      unread: unread === 'true' ? 'true' : undefined,
      agent_id: agentId || undefined,
      since: since || undefined,
    });
    setAlerts(d.alerts || []);
  }, [severity, unread, agentId, since]);

  useEffect(() => { load(); const t = setInterval(load, 10000); return () => clearInterval(t); }, [load]);

  // Acknowledge flips `acknowledged` server-side; reloading afterwards is what
  // keeps the "Unread only" filter honest, since an acknowledged alert is no
  // longer unread and must drop out of that list.
  const acknowledge = useCallback(async (alertId) => {
    setAcking(alertId);
    setAckError(null);
    try {
      await apiPatch(`/alerts/${encodeURIComponent(alertId)}/acknowledge`);
      await load();
    } catch (e) {
      setAckError(`Could not acknowledge alert: ${e.message}`);
    } finally {
      setAcking(null);
    }
  }, [load]);

  return html`
    <div class="page-title">Alerts</div>
    <div class="filters">
      <select value=${severity} onChange=${e => setFilter('severity', e.target.value)}>
        <option value="">All severities</option>
        <option value="critical">Critical</option>
        <option value="warning">Warning</option>
        <option value="info">Info</option>
      </select>
      <select value=${unread} onChange=${e => setFilter('unread', e.target.value)}>
        <option value="">All alerts</option>
        <option value="true">Unread only</option>
      </select>
      ${agentId ? html`<button class="btn" onClick=${() => setFilter('agent_id', '')}>agent: ${agentId} ✕</button>` : null}
      <button class="btn" onClick=${load}>Refresh</button>
    </div>
    ${ackError ? html`<div class="alerts-ack-error">${ackError}</div>` : null}
    ${alerts.length === 0 ? html`<div class="empty">No alerts fired. Configure sensitive actions in ${'`tj.toml`'}.</div>` : html`
      <div class="table-wrap"><table>
        <thead><tr><th></th><th>Time</th><th>Severity</th><th>Type</th><th>Title</th><th>Agent</th><th>Status</th></tr></thead>
        <tbody>
          ${alerts.map(a => html`
            <tr class="clickable" onClick=${() => setExpanded(expanded === a.alert_id ? null : a.alert_id)}>
              <td><span class="expand-toggle ${expanded === a.alert_id ? 'open' : ''}">\u25B8</span></td>
              <td>${fmtAgo(a.fired_at)}</td>
              <td><span class="badge badge-${a.severity}">${a.severity}</span></td>
              <td>${friendlyAlertType(a.type)}</td>
              <td>${a.title}</td>
              <td class="mono">${a.agent_id || '-'}</td>
              <td onClick=${e => e.stopPropagation()}>
                ${a.acknowledged
                  ? html`<span class="badge badge-neutral">acknowledged</span>`
                  : html`<button class="btn" disabled=${acking === a.alert_id}
                      onClick=${() => acknowledge(a.alert_id)}>
                      ${acking === a.alert_id ? 'Acknowledging...' : 'Acknowledge'}
                    </button>`}
              </td>
            </tr>
            ${expanded === a.alert_id ? html`<tr><td colspan="7"><div class="alert-detail">${JSON.stringify(a.detail, null, 2)}</div></td></tr>` : null}
          `)}
        </tbody>
      </table></div>
    `}
  `;
}

// ============================
// Drift View
// ============================
function DriftView({ params }) {
  const agentId = readParam(params, 'agent_id', '');
  const [data, setData] = useState(null);

  useEffect(() => {
    const fetchDrift = () => api('/drift', { agent_id: agentId || undefined }).then(d => setData(d));
    fetchDrift();
    const t = setInterval(fetchDrift, 10000);
    return () => clearInterval(t);
  }, [agentId]);

  if (!data) return html`
    <div class="page-title">Drift Detection</div>
    ${TableRowsSkeleton(['Metric', 'Baseline', 'Latest', 'Z-score', ''], 4)}`;

  // /drift returns a single-agent shape when agent_id is set; normalize to a list.
  const agents = data.agents || (data.agent_id ? [data] : []);
  // An honest empty state says WHY there is nothing here, not just that there is
  // nothing. Two of the three reasons are permanent for most users: interactive
  // coding agents are deliberately never baselined (the API applies the same
  // persona gate the detector does), and backfilled history never builds one.
  if (!agents.length) return html`
    <div class="page-title">Drift Detection</div>
    <div class="empty">
      <div>No drift baselines to compare against.</div>
      <div class="drift-empty-lead">Drift needs live SDK agents with 10+ completed sessions — Claude Code / Codex sessions and backfilled history aren't baselined.</div>
      <div class="drift-empty-why">
        <div>Drift compares a service against its own past behavior, so it needs a baseline: at least 10 completed sessions for one agent.</div>
        <div>Interactive coding sessions are not baselined. A Claude Code or Codex session varies by design; one mean and standard deviation over that workload measures nothing, so no baseline is built or shown for those agents.</div>
        <div>Baselines build only from live sessions. Backfilled history is not baselined, so importing past transcripts will not produce one.</div>
      </div>
    </div>`;

  const metrics = [
    ['Input tokens', 'avg_input_tokens', 'stddev_input_tokens', 'input_tokens'],
    ['Output tokens', 'avg_output_tokens', 'stddev_output_tokens', 'output_tokens'],
    ['Session duration', 'avg_session_duration_s', 'stddev_session_duration', 'duration_seconds'],
    ['Tool calls', 'avg_tool_call_count', 'stddev_tool_call_count', 'tool_call_count'],
  ];

  return html`
    <div class="page-title">Drift Detection</div>
    ${agents.map(a => html`
      <div class="drift-section">
        <h3>${a.agent_id}</h3>
        ${!a.baseline ? html`<div style="color:var(--text-dim);font-size:13px">No baseline yet.</div>` : html`
          <div style="font-size:12px;color:var(--text-dim);margin-bottom:12px;font-family:'Geist Mono',monospace">
            Baseline: ${a.baseline.sessions_sampled} sessions sampled${a.baseline.computed_at ? ', computed ' + fmtAgo(a.baseline.computed_at) : ''}
          </div>
          <table>
            <thead><tr><th>Metric</th><th>Baseline</th><th>Latest</th><th>Z-score (threshold: 2.0\u03C3)</th><th></th></tr></thead>
            <tbody>
              ${metrics.map(([label, avgKey, stdKey, latestKey]) => {
                const avg = a.baseline[avgKey];
                const std = a.baseline[stdKey];
                const latest = a.latest_session ? a.latest_session[latestKey] : null;
                let z = null;
                let zDisplay = '-';
                // A baseline with zero spread cannot judge anything. Every
                // sampled session had the same value, so any movement divides by
                // zero and reads as an infinite deviation. That is an absence of
                // evidence, not a regression, so this renders a neutral "cannot
                // judge" row rather than a red drift verdict with `inf` in it.
                // The Python z_score() is unchanged; this is a display decision.
                const noVariance = avg != null && latest != null && (std == null || std === 0);
                if (avg != null && latest != null && std != null && std > 0) {
                  z = (latest - avg) / std;
                  zDisplay = z.toFixed(2);
                } else if (noVariance) {
                  zDisplay = 'n/a';
                }
                const pass = !noVariance && (z == null || Math.abs(z) < 2);
                const zColor = noVariance
                  ? 'var(--text-dim)'
                  : (pass ? 'var(--success)' : 'var(--error)');
                const badgeClass = noVariance ? 'badge-neutral' : (pass ? 'badge-ok' : 'badge-critical');
                const badgeLabel = noVariance ? 'no baseline variance' : (pass ? 'pass' : 'drift');
                return html`
                  <tr>
                    <td>${label}</td>
                    <td class="mono">${avg != null ? avg.toFixed(1) : '-'}${std != null ? ' +/- ' + std.toFixed(1) : ''}</td>
                    <td class="mono">${latest != null ? (typeof latest === 'number' ? latest.toFixed(1) : latest) : '-'}</td>
                    <td class="mono" style="color:${zColor}" title=${noVariance ? 'Every sampled session had the same value, so there is no spread to measure a deviation against.' : ''}>${zDisplay}</td>
                    <td><span class="badge ${badgeClass}">${badgeLabel}</span></td>
                  </tr>
                `;
              })}
            </tbody>
          </table>
        `}
      </div>
    `)}
  `;
}

// ============================
// Budget View
// ============================
// Daily-only budget row, shared by both zones (coding-tool groups and SDK
// workflow agents). A per-session cap already configured in a user's TOML
// keeps being enforced (see api/routes/budget.py's module docstring) but
// this row never offers a way to set a new one.
function DailyBudgetRow({ scope, label, sublabel, daily, effectiveDaily, onSave }) {
  const [dailyVal, setDailyVal] = useState(daily != null ? String(daily) : '');
  const [saving, setSaving] = useState(false);
  const [saved, setSaved] = useState(false);

  const save = async () => {
    setSaving(true);
    try {
      await onSave(scope, dailyVal);
      setSaved(true);
      setTimeout(() => setSaved(false), 2000);
    } catch (e) {
      alert('Save failed: ' + e.message);
    } finally {
      setSaving(false);
    }
  };

  const dailyPlaceholder = (effectiveDaily != null && daily == null)
    ? `default: $${effectiveDaily}` : 'no limit';

  return html`
    <tr>
      <td class="mono">
        ${label}
        ${sublabel ? html`<div style="color:var(--text-dim);font-size:11px;margin-top:2px">${sublabel}</div>` : null}
      </td>
      <td>
        <input type="number" min="0" step="0.01" placeholder=${dailyPlaceholder}
          value=${dailyVal} onInput=${e => setDailyVal(e.target.value)}
          style="width:120px;background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:4px 6px;color:var(--text);font-size:13px" />
      </td>
      <td>
        <button class="btn" onClick=${save} disabled=${saving}
          style="padding:4px 12px;font-size:12px">
          ${saving ? 'Saving...' : saved ? '\u2713 Saved' : 'Save'}
        </button>
      </td>
    </tr>
  `;
}

// Provider spend-forecast ceiling — the OTHER budget object on this screen.
// Distinct from DailyBudgetRow (per-agent/group daily ALERT caps, checked on
// every ingested span): this is a per-provider recurring monthly ceiling that
// Optimize's Budget projection analyzer projects the current run rate
// against. Editing it here means the projection can never point at a ceiling
// this screen doesn't also show.
function ProviderBudgetRow({ provider, usd, cycleStartDay, highlighted, onSave }) {
  const [usdVal, setUsdVal] = useState(usd != null ? String(usd) : '');
  const [cycleVal, setCycleVal] = useState(cycleStartDay != null ? String(cycleStartDay) : '1');
  const [saving, setSaving] = useState(false);
  const [saved, setSaved] = useState(false);

  const save = async () => {
    setSaving(true);
    try {
      await onSave(provider, usdVal, cycleVal);
      setSaved(true);
      setTimeout(() => setSaved(false), 2000);
    } catch (e) {
      alert('Save failed: ' + e.message);
    } finally {
      setSaving(false);
    }
  };

  return html`
    <tr id=${'provider-budget-' + provider} style=${highlighted ? 'background:var(--surface-hover, rgba(127,127,127,0.08))' : ''}>
      <td class="mono">${provider}</td>
      <td>
        <input type="number" min="0" step="0.01" placeholder="no ceiling"
          value=${usdVal} onInput=${e => setUsdVal(e.target.value)}

      </td>

      </td>

        </button>
      </td>
    </tr>
  `;
}

function BudgetView({ params }) {
  // `provider` deep-link param (#112), now wired to the provider spend-forecast
  // table below: Optimize's Budget projection links here with `?provider=X` so
  // the ceiling it projected against is highlighted where it's editable.
  const provider = readParam(params, 'provider', '');
  const [data, setData] = useState(null);
  const [alerts, setAlerts] = useState([]);
  const [error, setError] = useState(null);

  // The two /alerts reads already catch their own failures (a transient
  // blip on either non-essential read must never take the page down with
  // it), so only /budget itself -- the one essential read -- can still
  // reach the outer .catch below. That catch names WHICH request failed and
  // its status rather than surfacing api()'s bare `API <status>` message.
  const load = () => Promise.all([
    api('/budget').catch(e => { throw new Error('/budget failed: ' + e.message); }),
    api('/alerts', { type: 'cost_budget_daily', since: '24h' })
      .then(d => d.alerts || [])
      .catch(() => []),
    api('/alerts', { type: 'cost_budget_session', since: '24h' })
      .then(d => d.alerts || [])
      .catch(() => []),
  ]).then(([budget, daily, session]) => {
    setData(budget);
    setAlerts([...daily, ...session].sort((a, b) => b.fired_at.localeCompare(a.fired_at)));
    setError(null);
  }).catch(e => setError(e.message));

  useEffect(() => { load(); const t = setInterval(load, 10000); return () => clearInterval(t); }, []);

  // Scroll the deep-linked provider's forecast row into view (arriving from
  // Optimize's Budget projection via #/budget?provider=X, #114).
  useEffect(() => {
    if (!provider || !data) return;
    const el = document.getElementById('provider-budget-' + provider);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, [provider, data]);

  // Daily-only save, both zones. A coding-group scope ("group:<id>" /
  // "defaults_coding") rejects session_usd outright server-side; an SDK
  // scope keeps honoring an already-configured session_usd, this screen
  // just never sends one on a save. See api/routes/budget.py's docstring.
  const handleSave = async (scope, dailyStr) => {
    // Empty field means "no limit" — send 0 so the server runs validate_budget_value(0) → None.
    const daily = dailyStr !== '' ? parseFloat(dailyStr) : 0;
    const updated = await apiPost('/budget', { scope, daily_usd: daily });
    setData(updated);
  };

  const handleSaveProvider = async (prov, usdStr, cycleStr) => {
    // Empty field means "no ceiling" — send 0 so the server runs validate_budget_value(0) → None.
    const usd = usdStr !== '' ? parseFloat(usdStr) : 0;
    const cycleStartDay = cycleStr !== '' ? parseInt(cycleStr, 10) : 1;
    const updated = await apiPost('/budget/provider', {
      provider: prov,
      usd,
      cycle_start_day: cycleStartDay,
    });
    setData(updated);
  };

  const [newProvider, setNewProvider] = useState('');
  // Providers typed into "Add" but not yet saved — kept local-only so typing a
  // name doesn't round-trip an empty [budget.<provider>] stanza to the server
  // (POST /budget/provider drops a provider entirely once every field on it
  // is unset, which would otherwise make the just-added row vanish again).
  const [pendingProviders, setPendingProviders] = useState([]);
  const addProvider = () => {
    const p = newProvider.trim();
    if (p) {
      setPendingProviders(prev => prev.includes(p) ? prev : [...prev, p]);
      setNewProvider('');
    }
  };

  // A failure blanks the WHOLE page only when there is no prior answer at
  // all to fall back to. Once /budget has answered once, a later failed
  // refresh (this view polls every 10s) must not throw away the last good
  // data still on screen -- it renders as a scoped banner above the content
  // instead, same pattern the Dashboard uses for its own /cost failures.
  if (error && !data) return html`<div class="empty err">${error}</div>`;
  if (!data) return html`
    <div class="page-title">Budget</div>
    ${TableRowsSkeleton(['Scope', 'Daily (USD)', ''], 6)}`;

  // Two zones per the Budget-page redesign (see api/routes/budget.py):
  // coding-tool groups (one row per TOOL, summed across every member
  // agent_id, e.g. every claude-code-<project> variant) and SDK workflow
  // agents (one row per declared agent_id, unchanged). Neither zone reads
  // the legacy top-level `defaults`/`agents` keys — those exist only so an
  // old, already-shipped client build doesn't crash.
  const codingGroups = Object.entries(data.coding.groups || {});
  const sdkAgents = Object.entries(data.sdk.agents || {});
  const providerBudgets = data.provider_budgets || {};
  // Every provider we know about: configured + the one deep-linked from
  // Optimize's projection (even with no ceiling set yet) + any just-added
  // pending row not yet saved.
  const providerNames = Array.from(new Set([
    ...Object.keys(providerBudgets),
    ...(provider ? [provider] : []),
    ...pendingProviders,
  ])).sort();

  return html`
    <div class="page-title">Budget</div>
    ${error ? html`
      <div class="band-msg err" style="margin-bottom:14px">
        <b>Couldn't refresh budget data.</b>
        <p>${error}</p>
        <p>Showing the last data successfully loaded; everything below is unaffected.</p>
      </div>` : null}
    ${provider ? html`<div class="filters"><button class="btn" onClick=${() => navigate('budget', {}, {})}>provider: ${provider} ✕</button></div>` : null}

    <div style="font-size:13px;font-weight:600;margin-bottom:8px">Coding-tool budget caps</div>
    <div style="color:var(--text-dim);font-size:12px;margin-bottom:12px">
      One daily ceiling per coding tool (Claude Code, Codex), checked against every session that
      tool runs today summed together, including every Claude Code project variant under one row.
      Enforcement runs at session end, not the instant spend crosses the line. Clear a field or
      enter 0 to remove a limit. Changes are written to your config file immediately.
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Tool</th><th>Daily (USD)</th><th></th></tr></thead>
      <tbody>
        <${DailyBudgetRow}
          scope="defaults_coding"
          label="defaults"
          daily=${data.coding.defaults.daily_usd}
          onSave=${handleSave}
        />
        ${codingGroups.map(([gid, g]) => html`
          <${DailyBudgetRow}
            key=${gid}
            scope=${'group:' + gid}
            label=${gid}
            sublabel=${g.members.length > 1 ? g.members.length + ' agent ids merged into this cap' : null}
            daily=${g.configured.daily_usd}
            effectiveDaily=${g.effective.daily_usd}
            onSave=${handleSave}
          />
        `)}
        ${codingGroups.length === 0 ? html`
          <tr><td colspan="3" class="empty-cell">
            No coding-tool sessions recorded yet. Run Claude Code or Codex once to register it.
          </td></tr>
        ` : null}
      </tbody>
    </table></div>

    <div style="font-size:13px;font-weight:600;margin-top:28px;margin-bottom:8px">SDK workflow budget caps</div>
    <div style="color:var(--text-dim);font-size:12px;margin-bottom:12px">
      One daily ceiling per SDK-declared workflow agent, checked at session end. A per-session cap
      already set in your config file keeps being enforced; it is no longer editable from this
      screen, since a per-session ceiling has no reliable meaning at the start of a coding session.
      Clear a field or enter 0 to remove the daily limit. Changes are written to your config file
      immediately.
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Agent</th><th>Daily (USD)</th><th></th></tr></thead>
      <tbody>
        <${DailyBudgetRow}
          scope="defaults"
          label="defaults"
          daily=${data.sdk.defaults.daily_usd}
          onSave=${handleSave}
        />
        ${sdkAgents.map(([id, b]) => html`
          <${DailyBudgetRow}
            key=${id}
            scope=${id}
            label=${id}
            daily=${b.configured.daily_usd}
            effectiveDaily=${b.effective.daily_usd}
            onSave=${handleSave}
          />
        `)}
        ${sdkAgents.length === 0 ? html`
          <tr><td colspan="3" class="empty-cell">
            No SDK workflow agents configured yet. Declare one with @watch() and run it once.
          </td></tr>
        ` : null}
      </tbody>
    </table></div>

    <div style="font-size:13px;font-weight:600;margin-top:28px;margin-bottom:8px">Provider spend forecast</div>
    <div style="color:var(--text-dim);font-size:12px;margin-bottom:12px">
      A recurring monthly ceiling per provider, scoped to its billing cycle rather than a single
      ${/* The space before "projects" is explicit: htm drops the whitespace
            between a closing tag and the next line's text, so the link ran
            straight into the word after it ("Budget projectionprojects"). */''}
      agent or day. This is what Optimize's <a class="sz-link" href="#/optimize">Budget projection</a>${' '}
      projects your current run rate against; it is advisory only (a forecast, never an alert).
      Clear a field or enter 0 to remove the ceiling.
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Provider</th><th>Monthly ceiling (USD)</th><th>Cycle start day</th><th></th></tr></thead>
      <tbody>
        ${providerNames.map(p => html`
          <${ProviderBudgetRow}
            key=${p}
            provider=${p}
            usd=${(providerBudgets[p] || {}).usd}
            cycleStartDay=${(providerBudgets[p] || {}).cycle_start_day}
            highlighted=${p === provider}
            onSave=${handleSaveProvider}
          />
        `)}
        ${providerNames.length === 0 ? html`
          <tr><td colspan="4" class="empty-cell">
            No provider budgets configured yet.
          </td></tr>
        ` : null}
        <tr>
          <td>
            <input type="text" placeholder="provider (e.g. anthropic)" value=${newProvider}
              onInput=${e => setNewProvider(e.target.value)}
              style="width:160px;background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:4px 6px;color:var(--text);font-size:13px" />
          </td>
          <td colspan="2" style="color:var(--text-dim);font-size:12px">Enter a ceiling in the new row below, then Save.</td>
          <td>
            <button class="btn" style="padding:4px 12px;font-size:12px" onClick=${addProvider}>
              Add
            </button>
          </td>
        </tr>
      </tbody>
    </table></div>

    ${alerts.length === 0
      ? html`<div class="empty" style="margin-top:20px">No budget alerts in the last 24h.</div>`
      : html`
        <div style="margin-top:24px">
          <div style="font-size:13px;font-weight:600;margin-bottom:8px;color:var(--error)">
            Budget alerts (last 24h)
          </div>
          <div class="table-wrap"><table>
            <thead><tr><th>Time</th><th>Severity</th><th>Type</th><th>Agent</th><th>Detail</th></tr></thead>
            <tbody>
              ${alerts.map(a => html`
                <tr>
                  <td>${fmtAgo(a.fired_at)}</td>
                  <td><span class="badge badge-${a.severity}">${a.severity}</span></td>
                  <td>${friendlyAlertType(a.type)}</td>
                  <td class="mono">${a.agent_id || '-'}</td>
                  <td style="color:var(--text-dim);font-size:12px">${a.detail.message || ''}</td>
                </tr>
              `)}
            </tbody>
          </table></div>
        </div>
      `}
  `;
}

// ============================
// Overview + Optimize (issue #114)
// ============================
// Per-analyzer display metadata for the recoverable band + Optimize sections.
// cache-recommend / budget-projection are intentionally absent from the savings
// band (no past_overspend_usd); they surface elsewhere.
const ANALYZER_META = {
  downsize:   { title: 'Downsize',   hint: 'Use a cheaper model on these sessions' },
  cache:      { title: 'Cache',      hint: 'Cache the context you re-read' },
  script:     { title: 'Script',     hint: 'Replace the pattern with a script' },
  trim:       { title: 'Trim',       hint: 'Trim low-value tokens from prompts' },
  reuse:      { title: 'Reuse',      hint: 'Reuse the plan instead of re-planning' },
  subagent:   { title: 'Subagent',   hint: 'Use a smaller model for subagents' },
  relearn:    { title: 'Relearn',    hint: 'Turn recurring mistakes into a rule' },
  verbosity:  { title: 'Verbosity',  hint: 'Rein in over-long outputs' },
  deadweight: { title: 'Deadweight', hint: 'Remove MCP servers you never call' },
  resend:     { title: 'Context resend', hint: 'Offload context instead of re-sending it' },
  placement:  { title: 'Batch placement', hint: 'Move batch-friendly work to the Batch API' },
  summarize:  { title: 'Summarize', hint: 'Compress oversized prompt files' },
  'cache-recommend': { title: 'Cache recommend', hint: 'Add cache_control breakpoints (Anthropic)' },
  'budget-projection': { title: 'Budget projection', hint: 'Projected cycle spend vs ceiling' },
};

// Fallback threshold values for the `placement` empty state, mirroring
// analyzers/batch_placement.py's MIN_SESSIONS_FOR_CADENCE / MIN_GROUP_COST_USD
// module defaults. Used only when the finding itself is absent from the
// payload (nothing qualified this window) — `analyze_batch_placement` returns
// None rather than a finding carrying the effective (possibly user-tuned via
// [optimize] in tj.toml) values in that case, so the empty state can't read
// the run's actual thresholds off the response the way the populated card
// does off `fd.min_sessions_for_cadence` / `fd.min_group_cost_usd`.
const PLACEMENT_DEFAULT_MIN_SESSIONS = 5;
const PLACEMENT_DEFAULT_MIN_GROUP_COST_USD = 1.0;

// A median inter-start gap as something a person reads at a glance — mirrors
// cmd_optimize.py's `_cadence_phrase`, the CLI placement renderer's own helper.
function fmtCadence(seconds) {
  if (seconds >= 86400) return '~' + (seconds / 86400).toFixed(1) + 'd';
  if (seconds >= 3600) return '~' + (seconds / 3600).toFixed(1) + 'h';
  if (seconds >= 60) return '~' + Math.round(seconds / 60) + 'm';
  return '~' + Math.round(seconds) + 's';
}

// Deep-link straight to an analyzer's OWN Optimize detail sub-page
// (#/optimize/<name>), where the full evidence + fix card lives. The Optimize
// page split from one long stacked page into a summary landing + one detail
// sub-page per analyzer-with-a-finding, so a deep link now opens that page
// directly rather than scrolling to an anchor on the stacked page. `since` is
// carried as a query param so the destination shows the same window the source
// figure was computed from.
function optimizeFindingHref(name, since) {
  const sp = new URLSearchParams();
  // Omit `since` only at the shared DEFAULT_SINCE (the value Optimize resolves
  // to on a bare href) — read it from the constant rather than a literal so a
  // future default move can't silently drop a real window (issue #655).
  if (since && since !== DEFAULT_SINCE) sp.set('since', since);
  const q = sp.toString();
  return '#/optimize/' + name + (q ? '?' + q : '');
}

// Reverse hop: deep-link a detail card's evidence into the Review inbox's
// matching cost advisory (or advisories — one analyzer can carry several).
// The `analyzer` param drives ReviewInboxView's scroll-into-view + highlight
// of every open advisory that analyzer produced, mirroring
// optimizeFindingHref's card-level (not per-instance) granularity.
function reviewProposalHref(analyzer) {
  return '#/review?analyzer=' + encodeURIComponent(analyzer);
}

// Title-case a registry key for display. Centralizes capitalization so a tile
// for a not-yet-known analyzer still renders title-case instead of the raw
// lowercase key (#162) — registry keys are lowercase by convention.
function capitalize(name) {
  return name ? name.charAt(0).toUpperCase() + name.slice(1) : name;
}

// Mirror core/framing's dollars-by-default rule: dollars unless the server
// explicitly suppressed them (local inference, or an all-unknown plan mix —
// see dollarsSuppressed below). Subscription no longer suppresses: dollars
// price all traffic at API list rates, a list-price equivalent rather than an
// amount billed (no caveat banner renders for this any more — product
// decision). The `window_total_tokens` token-share fallback stays for the
// rare case a payload only carries `display_rule`-less legacy framing
// (pricing_mode-only fallback below).
// `dollarFmt` defaults to fmtCost so every existing caller (Optimize,
// Summarize) is byte-identical; the Dashboard passes fmtDashUsd so its
// Recoverable-waste tiles stay at most 2dp without changing this formatter's
// precision anywhere else it's used.
// Reuse clustering runs on prompt prefixes, tool sequences, or a mix of both.
// Anything short of full prompt capture must SAY so: a window where only some
// planning calls carried prompt text was previously indistinguishable from one
// where they all did, because the check tested only for the all-degraded value.
const DEGRADED_CAPTURE_MODES = ['tool_sequence_only', 'mixed_prompt_prefix'];

function isDegradedCapture(mode) {
  return DEGRADED_CAPTURE_MODES.includes(mode);
}

function captureModeNote(mode) {
  if (mode === 'tool_sequence_only') {
    return ' (tool-sequence only: no prompt text was captured for these calls)';
  }
  if (mode === 'mixed_prompt_prefix') {
    return ' (mixed basis: only some of these calls carried prompt text; the rest matched on tool sequence alone)';
  }
  return '';
}

function fmtFramedSavings(usd, tokens, framing, dollarFmt = fmtCost) {
  // `framing == null` means "not yet known" (the read that would carry it
  // hasn't landed), NOT "no suppression needed" — dollarsSuppressed(null)
  // returns false, so without this guard an unknown framing fell through to
  // a bare, unqualified dollar figure below. On a subscription-billed account
  // that reads as real money billed, which is exactly what framing exists to
  // prevent (the UI-asserts-more-than-data-supports defect class). Fall back
  // to the same tokens-only form the suppressed path already uses rather
  // than inventing a second placeholder shape.
  if (framing == null) {
    return tokens == null ? '—' : (fmtTokens(tokens) + ' tokens');
  }
  if (dollarsSuppressed(framing)) {
    // The window-total "% of cycle tokens" branch this used to have for
    // subscription is dead: dollarsSuppressed() can no longer be true for
    // subscription (see its own comment below), so the only pricing_mode
    // that ever reaches here is 'local'.
    return tokens == null ? '—' : (fmtTokens(tokens) + ' tokens');
  }
  return usd == null ? '—' : dollarFmt(usd);
}

// Is the server telling us NOT to lead with dollars? Reads the explicit
// server-side decision (`display_rule`, core/framing.py) rather than
// re-deriving it, with a pricing_mode fallback for older payloads. True for
// local inference (no marginal cost to price) and an all-unknown plan mix.
// The subscription-share suppression rule is deliberately gone from this set
// — product decision: tj does not differentiate subscription-billed from
// API-billed users, so dollars price all traffic at API list rates
// regardless of plan. That display_rule value is dead on the server side too
// (core/framing.py's compute_framing no longer produces it; the constant
// stays defined there for any other caller that wants to detect a
// subscription-dominant window from pricing_mode). Callers make TOKENS the
// headline only in the suppressed case.
const DOLLARS_SUPPRESSED_RULES = new Set(['tokens_only', 'suppress_dollars_unknown']);
function dollarsSuppressed(framing) {
  if (!framing) return false;
  if (framing.display_rule) return DOLLARS_SUPPRESSED_RULES.has(framing.display_rule);
  return framing.pricing_mode === 'local';
}

// Count agents whose latest session breaches the 2σ drift threshold on any
// tracked metric (mirrors the Drift screen's z-score logic).
function driftSignalCount(drift) {
  const agents = (drift && drift.agents) || (drift && drift.agent_id ? [drift] : []);
  const metrics = [
    ['avg_input_tokens', 'stddev_input_tokens', 'input_tokens'],
    ['avg_output_tokens', 'stddev_output_tokens', 'output_tokens'],
    ['avg_session_duration_s', 'stddev_session_duration', 'duration_seconds'],
    ['avg_tool_call_count', 'stddev_tool_call_count', 'tool_call_count'],
  ];
  let n = 0;
  for (const a of agents) {
    if (!a.baseline || !a.latest_session) continue;
    let breach = false;
    for (const [avgK, stdK, latK] of metrics) {
      const avg = a.baseline[avgK], std = a.baseline[stdK], latest = a.latest_session[latK];
      if (avg == null || latest == null) continue;
      if (std != null && std > 0) { if (Math.abs((latest - avg) / std) >= 2) breach = true; }
      else if (latest !== avg) breach = true;
    }
    if (breach) n++;
  }
  return n;
}

// Flatten the optimize report into recoverable-band tiles. Ready tiles carry a
// number; not-ready ones (capture off, missing dep, or skipped under fast=true)
// render muted with an enablement hint.
// Cache efficacy ceiling — fallback if the response doesn't carry
// `efficacy_ceiling`; mirrors core/optimize cache_efficacy.EFFICACY_CEILING.
const CACHE_EFFICACY_CEILING = 0.80;

// Classify a finding into one of four honest tile states (issue #127):
//   actionable  — ran, found recoverable waste (carries a number)
//   at_ceiling  — ran, already optimized (no waste because at the ceiling)
//   no_findings — ran, nothing actionable in this window
//   not_ready   — couldn't run (capture off / missing dep / skipped on fast)
// Reads richer discriminators from the finding rather than `usd in (None,0)`.
function classifyFinding(name, fd, skipped) {
  if (skipped.has(name)) return { state: 'not_ready', hint: 'Not run on Overview. Open the Optimize tab.' };
  if (fd && fd.enabled === false) {
    return { state: 'not_ready', hint: fd.hint || (ANALYZER_META[name] || {}).hint };
  }
  // WHICH FIGURE A TILE IS ALLOWED TO SHOW. Every tile in this row sits under
  // ONE window (the stored report's `window_days`), so a tile may only publish a
  // figure observed over that window. Most analyzers have exactly one figure and
  // it is already window-scoped. relearn does not: its `past_overspend_usd` is
  // unbounded by design (its signal is recurrence across all retained history —
  // core/optimize/analyzers/relearn.py's `run(ctx)` deliberately does not
  // forward the report window), and rendering it here put an all-history number
  // beside five 30-day ones with nothing marking it. Measured on a real corpus
  // that tile said $386.64 while the Review inbox said $260.21 for the same
  // analyzer over the same days, and a reader summing the row got a total on no
  // basis at all.
  //
  // The server now derives the bounded figure for this report's own window and
  // publishes it as `window_scoped_past_overspend_usd`, through the same helper
  // the inbox row uses (core/optimize/inbox_contribution). When that field is
  // PRESENT it is the only figure this tile may render — including when it is
  // null, which means "no figure on this window's basis". Falling back to the
  // unbounded number there is the exact defect this closes, so `not_ready` is
  // the honest state rather than a bigger, wrong-basis dollar amount.
  const windowScoped = fd && 'window_scoped_past_overspend_usd' in fd;
  const usd = fd ? (windowScoped ? fd.window_scoped_past_overspend_usd : fd.past_overspend_usd) : null;
  const tokens = fd ? (windowScoped ? fd.window_scoped_past_overspend_tokens : fd.past_overspend_tokens) : null;
  if (usd != null && usd > 0) {
    return { state: 'actionable', usd, tokens, basis: (windowScoped ? fd.window_scoped_basis : fd.estimate_basis) || '' };
  }
  if (windowScoped && usd == null) {
    return { state: 'not_ready', hint: 'Rescan to surface recurring mistakes.' };
  }
  // Ran, nothing to recover. For cache, distinguish "already at the ceiling"
  // (positive) from "nothing here" so we never tell a user to raise efficacy
  // they've already maxed out. A fully-cached model can have tiny *uncached*
  // input (most volume is cache reads), so DON'T gate at_ceiling on input
  // volume — gate on "all rows with usage are at/above the ceiling" (#135).
  if (name === 'cache' && fd) {
    const ceiling = fd.efficacy_ceiling != null ? fd.efficacy_ceiling : CACHE_EFFICACY_CEILING;
    const used = (fd.rows || []).filter(r => (r.input_tokens + r.cache_tokens) > 0);
    if (used.length && used.every(r => r.efficacy >= ceiling)) {
      const best = used.slice().sort((a, b) =>
        (b.input_tokens + b.cache_tokens) - (a.input_tokens + a.cache_tokens))[0];
      return { state: 'at_ceiling', metric: Math.round(best.efficacy * 100) + '% cache efficacy' };
    }
  }
  return { state: 'no_findings' };
}

// Flatten the optimize report into recoverable-band tiles, each carrying a
// state (see classifyFinding). Registry-driven: downsize is a typed slot; any
// wave-2 finding carrying the `past_overspend_usd` contract field becomes
// a tile (so a future `reuse` analyzer appears with no UI change).
// cache-recommend / budget-projection lack the field → excluded by contract.
// Persona-disabled analyzers (`opt.persona_disabled_analyzers`, sourced from
// the server's persona-disabled-analyzer map — core/optimize/runner.py) are
// dropped before ranking, not shown as a placeholder — they vanish entirely
// from the band so a claude-code window isn't crowded out by findings it
// can't act on, and the tile that survives at rank 0 is guaranteed to carry
// a real lever. An older payload lacking the field falls back to an empty
// set (show everything) rather than reintroducing a hardcoded list.
// --- Analyzer scan state (the COMPUTE layer's counterpart to the phase
// machine below) ------------------------------------------------------------
// No route runs an analyzer any more. `tj serve` computes the report in the
// background — at boot, on a schedule, or from the Rescan control — and every
// surface reads the stored result plus its `computed_at`
// (core/optimize/report_store.py). Ingestion is unaffected: traces, spans,
// sessions, maps, approach and timeline still update live.
//
// This is deliberately NOT a second state machine beside `optState.phase`.
// `phase` answers "did the READ answer?"; this answers "does the STORE hold a
// result?" — a question that did not exist while routes computed inline, and
// that `phase` structurally cannot see. A cold store answers its HTTP request
// perfectly well (`phase === 'ready'`, `data` truthy) while holding nothing,
// and without this the band would read that as "scanned, found nothing" and
// print `No recoverable candidates.` — the exact false absence claim the phase
// machine exists to prevent, arriving through the one door it can't watch.
//
//   cold (never_run / error)  Nothing has ever been computed. Never `0`,
//                             never `$0.00`, never "no candidates".
//   computing                 A scan is in flight; keep showing the last
//                             completed result with a scanning indicator.
//   ready                     A scan completed. The ONLY state in which an
//                             empty-state string is honest.
function scanState(opt) {
  const fetchFailed = opt == null;
  // An older server predating the store sends no `report_available`; treat that
  // as "a result is present" so this never invents a cold state for a payload
  // that really is a full report.
  const known = opt != null && opt.report_available !== false;
  return {
    status: (opt && opt.status) || (fetchFailed ? 'unknown' : 'ready'),
    known, fetchFailed,
    cold: !fetchFailed && !known,
    // THE CYCLE, NOT THIS STORE. `status === 'computing'` is the report's own
    // in-flight flag, and one pass writes three stores sequentially on one
    // thread — report, then relearn, then the cost proposals behind the Review
    // inbox. So the report's flag drops the moment its leg lands and this
    // control switched from "Scanning…" to asserting freshness while the most
    // expensive analyzer in the product was still running. `cycle_computing`
    // covers the whole pass; the OR is what stays true until the last store
    // lands, and an older server that sends neither still reads correctly.
    computing: !!opt && (opt.status === 'computing' || opt.cycle_computing === true),
    computedAt: (opt && opt.computed_at) || null,
    // The build that PRODUCED the stored figures vs the one SERVING them. Equal
    // is the ordinary case; different means a card the previous build computed
    // is being rendered under a fresh timestamp, because these stores are caches
    // and an upgrade does not invalidate them. `null`/absent is UNKNOWN, which
    // is not the same as agreement — see ScanBar.
    computedBuild: (opt && opt.computed_build) || null,
    build: (opt && opt.build) || null,
    windowDays: (opt && opt.window_days) || null,
    degraded: !!(opt && opt.degraded),
    lastError: (opt && opt.last_error) || null,
    // Cadence at which a surface asks for a rescan. 0 disables it entirely.
    pollSeconds: (opt && typeof opt.ui_poll_seconds === 'number') ? opt.ui_poll_seconds : 0,
    scanEnabled: !(opt && opt.scan_enabled === false),
  };
}

// How often a surface re-READS the stored result while a pass is in flight. The
// stored cadence (`[optimize] scan_ui_poll_seconds`) is sized for idle watching;
// this one exists so the control stops saying "Scanning…" promptly once the pass
// lands, since the button stays disabled until it does.
const SCAN_INFLIGHT_POLL_SECONDS = 5;

// Start a background scan. The server owns the rails — an overlap guard (a
// second press while one runs is a no-op) and a rate limit — so this is safe
// to call freely, including from the auto-rescan below. `apiPostOrDetail`
// rather than `apiPost`: a rescan that FAILED must not look identical to one
// that succeeded, so the caller needs the server's reason.
async function rescanAnalyzers() { return apiPostOrDetail('/optimize/rescan', {}); }

// Provenance and the control that re-runs it, side by side: a reader can always
// see WHEN the figures beside this bar were computed, and re-run them. Two
// stored artifacts with different cadences (this report and the relearn
// detector's own cache) can legitimately disagree; each stating its own
// computed-at is what makes that difference explicable rather than a mystery.
//
// One component, mounted top-right of the heading row on every analyzer-fed
// surface (Dashboard, Optimize, Review inbox) so the same provenance text and
// the same button render everywhere rather than each screen growing its own
// rescan link. A real <button>, not a styled span, so it is keyboard-operable
// and gets a focus ring for free; `disabled` while a scan is in flight is
// what makes "scanning\u2026" actually true rather than just its label.
// WHETHER THE FRESHNESS CLAIM IS STILL SUFFICIENT ON ITS OWN.
//
// `computed <age> ago` answers HOW OLD; readers take it for WHICH BUILD. The
// analyzer stores are caches and an upgrade does not invalidate them, so the
// next pass after one stamps a fresh timestamp over figures the replaced binary
// may have produced \u2014 and the audience for that sentence is exactly the user who
// upgraded to get a fix and will conclude it did not work.
//
// Three cases, and the middle one is the trap: SAME build (say nothing \u2014 the
// timestamp is the whole truth), DIFFERENT build (the figures predate this
// build; say so), and UNKNOWN (the result predates the stamp, so we cannot
// vouch either way \u2014 which is NOT agreement and must not render as it).
// Returns null when there is nothing honest to add.
function buildQualifier(scan) {
  if (!scan.computedAt) return null;              // nothing to qualify
  if (!scan.build) return null;                   // older server: no stance either way
  if (!scan.computedBuild) return 'producing build unknown';
  if (scan.computedBuild === scan.build) return null;
  return 'computed by ' + scan.computedBuild + ', you are on ' + scan.build;
}

function ScanBar({ scan, busy, error, declined, declinedDetail, onRescan }) {
  const scanning = !!(busy || scan.computing);
  const when = scan.fetchFailed ? 'scan state unavailable'
    : scan.computedAt
      ? 'computed ' + fmtAgo(scan.computedAt)
      : (scan.status === 'error' ? 'no scan has succeeded yet' : 'never computed');
  const qualifier = buildQualifier(scan);
  return html`<span class="rescan-bar">
    <span class="scan-provenance">${when}</span>
    ${qualifier ? html`<span class="scan-stale-build" title="These figures are a cached result. Rescan to recompute them on this build.">${qualifier}</span>` : null}
    <button type="button" class="rescan-ctl${scanning ? ' scanning' : ''}" onClick=${onRescan} disabled=${scanning}
      aria-label=${scanning ? 'Scanning\u2026' : 'Rescan'}>
      <span aria-hidden="true" class="rescan-ctl-icon">\u27f3</span>${scanning ? 'Scanning\u2026' : 'Rescan'}
    </button>
    ${error ? html`<span class="scan-error">rescan failed: ${error}</span>` : null}
    ${/* The server answered 200 saying it did NOT start a pass (an overlap guard
          or the rate limit declined). That used to resolve as an ordinary
          success: the button spun, re-enabled, reloaded, and showed the same
          provenance line \u2014 the server said "I did not start" and the control
          dropped it. Rendered here as its own state, distinct from both a
          success and a thrown error. */
      !error && declined ? html`<span class="scan-declined" title=${declinedDetail || ''}>${declined}</span>` : null}
    ${scan.degraded ? html`<span class="scan-degraded" title=${scan.lastError || ''}>last refresh failed</span>` : null}
  </span>`;
}

// A rescan button plus the state it needs, shared by every surface that
// carries one. `action` defaults to the analyzer-report rescan
// (`POST /optimize/rescan`); the Review inbox passes its own two-endpoint
// refresh instead, so all three surfaces share this hook's busy/error/timing
// behaviour even though what they re-run differs. Surfaces the failure: a
// rescan whose POST was refused reports the server's reason instead of
// silently looking like a success.
// A REFUSAL IS NOT AN ERROR AND NOT A SUCCESS.
//
// `POST /optimize/rescan` answers HTTP 200 with `started: false` plus a `reason`
// when a guard declines — a pass is already in flight (including the daemon's
// own startup kick, which is precisely when an impatient user presses the
// button), or the rate limit refused. `useRescan` only ever surfaced THROWN
// errors, so a refusal resolved normally and the press read as a broken button:
// spinner, re-enable, reload, identical numbers. The server said "I did not
// start" and the control dropped it.
//
// Returns the text to show, or null when the response really was a start.
// Deliberately requires an EXPLICIT `started === false`: a response that omits
// the field (an older server, a surface whose action is not this endpoint) is
// not evidence of a refusal, and inventing one would put a permanent "already
// running" on a control that works.
//
// PAST TENSE, AND CLIENT-OWNED. This notice describes the OUTCOME OF A PRESS,
// and it stays on screen until the next one. The server's own reason strings are
// present tense ("a scan is already running"), which stops being true the moment
// that scan lands — so rendering them verbatim would leave the control asserting
// a running scan long after it finished, which is the very defect this control is
// being fixed for. A past-tense statement about a press the user just made cannot
// go stale. The server's wording is kept as the tooltip, where it is evidence
// rather than a claim about now.
function declinedReason(res) {
  if (!res || res.started !== false) return null;
  return res.throttled
    ? 'refresh not started: rescanned too recently'
    : 'refresh not started: a scan was already in flight';
}

function useRescan(reload, action = rescanAnalyzers) {
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [declined, setDeclined] = useState(null);
  // The server's own words, shown as the notice's tooltip rather than as the
  // notice — see `declinedReason` on why the visible copy is ours and past tense.
  const [declinedDetail, setDeclinedDetail] = useState(null);
  const rescan = useCallback(async () => {
    setBusy(true);
    setError(null);
    setDeclined(null);
    setDeclinedDetail(null);
    try {
      const res = await action();
      setDeclined(declinedReason(res));
      setDeclinedDetail((res && res.reason) || null);
    } catch (e) {
      setError(e.message || String(e));
    }
    // No fixed timeout. The 1.5s wait was standing in for "is it running yet",
    // and it answered that question by guessing: it re-enabled the button
    // whether or not a pass was in flight, and reloaded once whether or not
    // anything had landed. The cycle's in-flight flag is set before the POST
    // returns (`scan_cycle._CYCLE_COMPUTING`), so the reload below already sees
    // it and `scan.computing` — not this hook's `busy` — is what keeps the
    // control saying "Scanning…" for as long as that is true.
    setBusy(false);
    reload();
  }, [reload, action]);
  return { busy, error, declined, declinedDetail, rescan };
}

// Re-READ the stored result on the server-published cadence, visibility-gated so
// a hidden tab does no work. 0 seconds turns it off entirely.
//
// This polls the STORE; it does not ask the daemon to scan. The knob behind it
// says so in its own definition — `[optimize] scan_ui_poll_seconds`: "how often
// a UI surface re-reads the stored result (NOT how often the scan runs)" — and
// this hook used to contradict that by firing a rescan on every tick. At the
// default cadence that put a full-corpus analyzer pass on a five-minute timer,
// against passes that take minutes on a real corpus: most of a duty cycle of
// continuous scanning, driven by nothing but a browser tab being open. The
// daemon owns WHEN scanning happens (`core/optimize/scan_cycle.py`); a surface
// owns only how often it looks. An explicit Rescan press still scans.
//
// `scanEnabled` is deliberately NOT consulted any more. It is the kill switch
// for automatic SCANNING, and gating reads on it left a surface that had turned
// scanning off unable to notice a scan a human had just triggered by hand.
function useAutoRefresh(scan, reload) {
  // WHILE A PASS IS IN FLIGHT, LOOK MORE OFTEN. The stored cadence defaults to
  // five minutes, and the Rescan button is disabled for as long as the surface
  // believes a scan is running — so a pass that finishes in twenty seconds left
  // the control disabled and asserting "Scanning…" for the rest of that window,
  // with no way for the user to act and nothing telling them it had landed. A
  // control that is wrong AND unpressable is worse than a stale figure.
  //
  // This is still only a READ of the stored result; no surface may drive a scan
  // from a timer (see this hook's note above and `core/optimize/scan_cycle.py`).
  // The in-flight cadence deliberately overrides a `0` too: zero means "do not
  // poll", but honouring it here would leave a user who pressed Rescan with a
  // permanently disabled button and no path out short of reloading the page.
  const inFlight = !!scan.computing;
  const seconds = inFlight
    ? Math.min(scan.pollSeconds || SCAN_INFLIGHT_POLL_SECONDS, SCAN_INFLIGHT_POLL_SECONDS)
    : scan.pollSeconds;
  useEffect(() => {
    if (!seconds || seconds <= 0) return undefined;
    const timer = setInterval(() => {
      if (document.visibilityState === 'visible') reload();
    }, seconds * 1000);
    return () => clearInterval(timer);
  }, [seconds, reload]);
}

function recoverableTiles(opt) {
  // A cold store yields NO tiles, and the caller must render the cold branch
  // rather than an empty grid — see scanState() above.
  if (!opt || opt.report_available === false) return [];
  const disabled = new Set(opt.persona_disabled_analyzers || []);
  const out = [];
  const skipped = new Set(opt.skipped_analyzers || []);
  const f = opt.findings || {};
  // Downsize always gets a tile — it runs unconditionally; a null typed slot
  // means "ran, no candidates", not "missing" (issue #126).
  if (!disabled.has('downsize')) {
    out.push({ name: 'downsize', ...classifyFinding('downsize', opt.downgrade, skipped) });
  }
  Object.keys(f).forEach(k => {
    if (disabled.has(k)) return;
    if (f[k] && 'past_overspend_usd' in f[k]) out.push({ name: k, ...classifyFinding(k, f[k], skipped) });
  });
  skipped.forEach(k => {
    if (disabled.has(k)) return;
    if (!(k in f) && k !== 'downsize') {
      out.push({ name: k, state: 'not_ready', hint: 'Not run on Overview. Open the Optimize tab.' });
    }
  });
  return rankTiles(out, opt.finding_rank);
}

// The analyzers that earn their OWN Optimize detail sub-page (#/optimize/<name>)
// and a left-submenu entry: exactly the tiles that carry a real finding
// (`state === 'actionable'`), in the same biggest-waste-first order the tiles
// and the summary list use. This is the ONE predicate that decides has-data vs
// empty across all three surfaces — the submenu, the per-analyzer routes, and
// which Dashboard tiles are clickable — so they can never disagree about which
// analyzers have a page. `summarize` is handled separately (it has its own
// SummarizeView + finding shape); this covers the analyzer detail cards
// rendered by OptimizeFinding.
const DETAIL_ANALYZER_NAMES = new Set([
  'downsize', 'resend', 'cache', 'cache-recommend', 'script', 'trim',
  'reuse', 'subagent', 'verbosity', 'deadweight', 'placement',
]);
function optimizeDetailAnalyzers(opt) {
  if (!opt || opt.report_available === false) return [];
  return recoverableTiles(opt)
    .filter(t => t.state === 'actionable' && DETAIL_ANALYZER_NAMES.has(t.name))
    .map(t => t.name);
}

// Order recoverable tiles biggest-waste-first, mirroring the CLI's ranking
// (cmd_optimize.py's `_rank_findings`) instead of Object.keys() insertion
// order (#229) — the server ships that same ranking as
// `finding_rank` on the /optimize payload so the algorithm lives in one
// place. `share` entries are ordered largest-first with unranked findings
// (share === null — no quantified estimate, NOT zero) already sorted last by
// the server; a tile whose name is missing from finding_rank (older server,
// or a name the rank doesn't cover) keeps its original relative position at
// the end via a stable sort.
function rankTiles(tiles, findingRank) {
  if (!findingRank || !findingRank.length) return tiles;
  const order = new Map(findingRank.map((r, i) => [r.name, i]));
  return tiles
    .map((t, i) => ({ t, i, rank: order.has(t.name) ? order.get(t.name) : Infinity }))
    .sort((a, b) => (a.rank - b.rank) || (a.i - b.i))
    .map(x => x.t);
}

// ---- One independently-settling read ------------------------------------- //
// Every panel on the Dashboard is fed by exactly one of these, and each one
// carries its OWN latency and its OWN failure. Sharing a load flag across them
// (the previous single `Promise.all`) is what let a 27-second endpoint decide
// when a 13-second panel was allowed to paint, and what left the page with
// nothing on it in the meantime.
//
// `phase` is 'loading' | 'ready' | 'error'. `data` is the last COMPLETE payload
// or null; those two together are the whole contract every panel renders from,
// and no panel may read `data` without checking whether it is null:
//   data != null              -> we have an answer, figures may be stated
//   data == null, 'loading'   -> unknown, still working: skeleton, never a 0
//   data == null, 'error'     -> unknown, failed: say so, never a 0
// A held answer survives a failed REFRESH deliberately: it was true when it was
// read, which is a much better thing to show than a blank.
//
// `deps` follows the useCallback convention: change them and the read is re-run.
// A deps change also DROPS the held answer, because the deps are the question
// (`since` is in there) and last window's figures under this window's label
// would be a fresh lie rather than a stale truth.
function useTriageRead(run, deps) {
  const [st, setSt] = useState({ phase: 'loading', data: null, error: null });
  const gen = useRef(0);          // generation counter; stale settles are dropped
  const inFlight = useRef(false);

  const refresh = useCallback(() => {
    // Never stack reads on a slow endpoint. The 30s poll calls this on every
    // tick, and on a corpus where a read takes 27 seconds an unguarded poll
    // would keep opening new queries against a DB the previous one still holds.
    if (inFlight.current) return;
    const g = ++gen.current;
    inFlight.current = true;
    setSt(s => ({ phase: 'loading', data: s.data, error: null }));
    run().then(
      (data) => {
        // Only the settle whose generation still matches the current one may
        // clear the guard. A window/filter change bumps gen.current and (via
        // the effect's cleanup below) already cleared inFlight.current so the
        // REPLACEMENT request could start immediately — if this superseded
        // settle unconditionally cleared it again, a poll tick landing between
        // the replacement starting and finishing would see a falsely-idle
        // guard and stack a second query on top of it.
        if (gen.current === g) inFlight.current = false;
        setSt(s => (gen.current === g ? { phase: 'ready', data, error: null } : s));
      },
      (err) => {
        if (gen.current === g) inFlight.current = false;
        setSt(s => (gen.current === g
          ? { phase: 'error', data: s.data, error: err.message || String(err) } : s));
      },
    );
  }, deps);

  useEffect(() => {
    setSt({ phase: 'loading', data: null, error: null });
    refresh();
    // Bump the generation so a settle from the superseded question cannot write
    // into the new one.
    return () => { gen.current++; inFlight.current = false; };
  }, [refresh]);

  return { phase: st.phase, data: st.data, error: st.error, refresh };
}

// The render status of a panel fed by one useTriageRead, in the vocabulary
// HealthTile and the bands speak. A held answer counts as 'ready' even if the
// latest refresh failed: the figure was true when it was read.
function readStatus(read) {
  if (!read) return 'loading';
  if (read.data != null) return 'ready';
  return read.phase === 'error' ? 'error' : 'loading';
}

// ---- Triage-band state machine (honest-absence rules) --------------------- //
// The Dashboard's two triage bands each make FACTUAL CLAIMS ("no recoverable
// candidates", "0 unread alerts", "within baseline"). Every one of those claims
// needs a completed read behind it, and the reads behind them are independently
// fallible and — for /optimize, an analyzer sweep that is minutes long on a
// large history — independently slow. The original code funnelled all of them
// through `.catch(() => <empty default>)`, which erases the difference between
// "the answer is nothing" and "there is no answer": a timed-out /optimize
// arrived at the tiles as an empty report and printed "No recoverable
// candidates." over a corpus holding thousands of dollars of them.
//
// So the decision of what a band is ALLOWED TO SAY is factored out here, into
// two pure functions with no rendering in them. They are the single place that
// rule lives, and being pure they are directly testable under node
