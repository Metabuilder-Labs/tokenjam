.ap-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.ap-kind { font-size: 9.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-faint); font-family: 'Geist Mono', monospace; }
.ap-label { font-size: 13px; font-weight: 600; color: var(--text); }
.ap-move.dead .ap-label, .ap-move.retry .ap-label { text-decoration: line-through; color: var(--text-dim); }
.ap-revert { font-size: 9px; color: var(--error); border: 1px solid var(--error); border-radius: 9px; padding: 1px 6px; font-family: 'Geist Mono', monospace; }
/* Source tag chip: agent's words (brand) vs structural (warn). No "distilled". */
.ap-src { font-size: 9px; padding: 1px 6px; border-radius: 9px; font-family: 'Geist Mono', monospace; border: 1px solid var(--border); color: var(--text-dim); }
.ap-src.words { color: var(--brand); border-color: var(--brand); }
.ap-src.struct { color: var(--warn); border-color: var(--warn); }
.ap-quote { font-size: 11.5px; color: var(--text-dim); font-style: italic; margin: 4px 0 0; border-left: 2px solid var(--border); padding-left: 9px; }
.ap-ev { font-size: 10.5px; color: var(--text-faint); margin-top: 5px; font-family: 'Geist Mono', monospace; }
.ap-ev-st.err { color: var(--error); }
/* Delegation toggle — clickable, collapsed by default, recurses on open. */
.ap-deleg { margin-top: 7px; border: 1px solid var(--chart-5); border-radius: 8px; background: var(--surface3); padding: 8px 10px; display: flex; align-items: center; gap: 9px; cursor: pointer; user-select: none; }
.ap-caret { color: var(--chart-5); font-size: 10px; width: 12px; transition: transform .15s; display: inline-block; }
.ap-deleg.open .ap-caret { transform: rotate(90deg); }
/* Nested child method (recursion): indent + a left depth rail. */
.ap-nested { margin: 2px 0 4px 6px; padding: 10px 0 2px 14px; border-left: 2px solid var(--chart-5); }
/* Cross-terminal children (M2b): a separate run-linked session, amber not pink,
   spliced under its own divider so the eye reads it apart from in-session subs. */
.ap-xterm-divider { margin: 16px 0 6px; font-size: 9.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--warn); font-family: 'Geist Mono', monospace; border-top: 1px solid var(--border); padding-top: 11px; }
.ap-deleg.ap-xterm { border-color: var(--warn); }
.ap-deleg.ap-xterm .ap-caret { color: var(--warn); }
.ap-xterm-nested { border-left-color: var(--warn); }
/* Two-column layout: the delegation-tree rail (left) + the focused method (right). */
.ap-grid { display: grid; grid-template-columns: 268px 1fr; gap: 16px; }
@media (max-width: 760px) { .ap-grid { grid-template-columns: 1fr; } }
/* Left rail: every agent in the spawn tree, indented by depth. */
.ap-rail { border: 1px solid var(--border); border-radius: 9px; background: var(--surface2); padding: 12px; height: fit-content; }
.ap-rail-h { margin: 0 0 3px; font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .05em; }
.ap-rail-sub { font-size: 10.5px; color: var(--text-faint); margin-bottom: 11px; }
.ap-node { display: flex; align-items: flex-start; gap: 8px; padding: 7px 9px; border-radius: 7px; }
.ap-node + .ap-node { margin-top: 2px; }
.ap-node.d1 { margin-left: 14px; } .ap-node.d2 { margin-left: 28px; } .ap-node.d3 { margin-left: 42px; }
.ap-dot { flex: 0 0 auto; width: 9px; height: 9px; border-radius: 50%; margin-top: 4px; }
.ap-dot.is-main { background: var(--brand); } .ap-dot.is-sub { background: var(--chart-5); } .ap-dot.is-term { background: var(--warn); }
.ap-nname { font-size: 11.5px; font-weight: 600; font-family: 'Geist Mono', monospace; }
.ap-nmeta { font-size: 10px; color: var(--text-dim); margin-top: 2px; }
.ap-badge { display: inline-block; font-size: 9px; padding: 1px 6px; border-radius: 10px; margin-top: 4px; font-family: 'Geist Mono', monospace; border: 1px solid var(--border); color: var(--text-dim); }
.ap-badge.live { color: var(--success); border-color: var(--success); }
.ap-badge.partial { color: var(--warn); border-color: var(--warn); }
.ap-prov { font-size: 8.5px; color: var(--text-faint); font-family: 'Geist Mono', monospace; margin-top: 3px; }
.ap-railcap { margin-top: 12px; padding-top: 11px; border-top: 1px solid var(--border); font-size: 10.5px; color: var(--text-dim); line-height: 1.5; }
.ap-railcap b { color: var(--text); }
/* Header card: mandate (left) + a right-aligned stats column. */
.ap-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.ap-rt { text-align: right; font-size: 10.5px; color: var(--text-dim); white-space: nowrap; font-family: 'Geist Mono', monospace; line-height: 1.7; }
.ap-rt b { color: var(--text); }
/* Rich delegation card: identity + depth + cost/status chips. */
.ap-deleg-main { display: flex; flex-direction: column; }
.ap-deleg-name { font-size: 11.5px; font-weight: 600; font-family: 'Geist Mono', monospace; color: var(--text); }
.ap-deleg-stats { margin-left: auto; font-size: 10px; color: var(--text-dim); font-family: 'Geist Mono', monospace; white-space: nowrap; }
.ap-deleg-note { font-size: 10px; color: var(--text-dim); font-style: italic; margin-top: 2px; }
.ap-depthtag { font-size: 8.5px; color: var(--chart-5); border: 1px solid var(--chart-5); border-radius: 8px; padding: 0 5px; margin-left: 6px; font-family: 'Geist Mono', monospace; }
.ap-chead { font-size: 11px; color: var(--text-dim); margin-bottom: 2px; }
.ap-chead b { color: var(--text); font-family: 'Geist Mono', monospace; }
.ap-cmandate { font-size: 11px; color: var(--text-faint); margin-bottom: 4px; }
.ap-cmandate i { color: var(--text-dim); }
/* Source-of-each-line legend at the foot of the panel. */
.ap-legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 10.5px; color: var(--text-dim); align-items: center; }
.ap-src.distill { color: var(--chart-6); border-color: var(--chart-6); }
/* Collapsed conversational run — a fold marker for >4 consecutive chat-only
   moves, so the method doesn't drown in Q&A narration. */
.ap-collapse {
  position: relative; margin: 2px 0 2px; padding: 5px 0 5px 2px; cursor: pointer;
  font-size: 11px; color: var(--text-faint); font-family: 'Geist Mono', monospace;
  font-style: italic; user-select: none; border-left: 2px dashed var(--border);
  padding-left: 10px; margin-left: -1px;
}
.ap-collapse:hover { color: var(--text-dim); }
/* Verify-flavored delegation (review/audit mandates) — green accent + chip. */
.ap-deleg.ap-verify-deleg { border-color: var(--success); }
.ap-deleg.ap-verify-deleg .ap-caret { color: var(--success); }
.ap-verify-chip {
  display: inline-block; margin-left: 6px; font-size: 8.5px; color: var(--success);
  border: 1px solid var(--success); border-radius: 8px; padding: 0 5px;
  font-family: 'Geist Mono', monospace; vertical-align: 1px;
}
/* Outcome block: 3-line clamp with a click-to-toggle "show all" (outcomes are
   truncated server-side mid-word; the toggle keeps the header compact). */
.ap-outcome .ap-outcome-body.clamp {
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  overflow: hidden;
}
.ap-outcome .ap-outcome-more {
  display: inline-block; margin-top: 3px; cursor: pointer; font-size: 10.5px;
  color: var(--text-faint); font-family: 'Geist Mono', monospace; user-select: none;
}
.ap-outcome .ap-outcome-more:hover { color: var(--success); }
/* Inline `code` in approach labels/quotes/outcome (rendered by mdInline). */
code.md-code {
  font-family: 'Geist Mono', monospace; font-size: 0.92em;
  background: var(--surface3); border: 1px solid var(--border);
  border-radius: 4px; padding: 0 4px;
}

/* Map board (GET /sessions/{id}/sessionmap): synchronized swimlanes (① phase /
   tools / context / cost over one time-or-step axis) + a codebase-territory
   treemap (③). Ported from the approved mocks; every color is a theme var
   (offline-only, Rule 18) — never the mock's hardcoded hexes. */
.mb-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 18px 0 12px; flex-wrap: wrap; }
.mb-chips { display: flex; gap: 7px; flex-wrap: wrap; }
.mb-chip { font-size: 11px; padding: 2px 9px; border: 1px solid var(--border); border-radius: 20px; color: var(--text-dim); background: var(--surface2); font-family: 'Geist Mono', monospace; }
.mb-chip b { color: var(--text); font-weight: 600; }
.mb-toggle { display: flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; font-size: 11.5px; cursor: pointer; font-family: 'Geist Mono', monospace; }
.mb-toggle span { padding: 5px 12px; color: var(--text-dim); user-select: none; }
.mb-toggle span.on { background: var(--surface3); color: var(--text); }

.mb-board { position: relative; border: 1px solid var(--border); border-radius: 9px; background: var(--surface2); overflow: hidden; }
.mb-lane { display: flex; align-items: stretch; border-bottom: 1px solid var(--border); }
.mb-lane:last-child { border-bottom: none; }
.mb-gutter { width: 78px; flex: 0 0 78px; display: flex; align-items: center; padding: 0 10px; font-size: 10.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; border-right: 1px solid var(--border); background: var(--surface); }
/* y-axis gutter for the CONTEXT / COST lanes: max value at the top, lane name in
   the middle, 0 at the baseline — so the magnitude is readable, not just a shape. */
.mb-gutter.axis { flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 6px 8px; }
.mb-gutter.axis .mb-yv { font-family: 'Geist Mono', monospace; font-size: 9.5px; font-weight: 600; color: var(--text); text-transform: none; letter-spacing: 0; }
.mb-gutter.axis .mb-yv.mb-y0 { color: var(--text-faint); font-weight: 400; }
.mb-gutter.axis .mb-yname { color: var(--text-dim); }
.mb-plot { position: relative; flex: 1 1 auto; }
/* faint horizontal gridlines + peak annotation overlaid on the ctx/cost plots. */
.mb-grid { position: absolute; left: 0; right: 0; height: 0; border-top: 1px dashed var(--border); opacity: 0.6; pointer-events: none; }
.mb-grid.mid { top: 50%; }
.mb-peak { position: absolute; top: 3px; left: 7px; font-size: 9px; font-family: 'Geist Mono', monospace; color: var(--text-dim); background: color-mix(in srgb, var(--surface2) 78%, transparent); padding: 0 4px; border-radius: 3px; pointer-events: none; z-index: 2; }
.mb-lane.phase { height: 30px; }
.mb-seg { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; justify-content: flex-start; font-size: 10.5px; color: var(--text); border-right: 1px solid var(--border); overflow: hidden; white-space: nowrap; }
.mb-seg-lab { padding: 0 7px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mb-lane.tools { height: 52px; }
.mb-ev { position: absolute; bottom: 16px; width: 3px; border-radius: 1px; transform: translateX(-50%); }
.mb-ev.retry { outline: 1px dashed var(--error); outline-offset: 1px; }
.mb-evlab { position: absolute; bottom: 2px; font-size: 8.5px; color: var(--text-faint); transform: translateX(-50%); white-space: nowrap; font-family: 'Geist Mono', monospace; max-width: 72px; overflow: hidden; text-overflow: ellipsis; text-align: center; }
/* time-mode tools lane: a stacked-by-category density histogram (option 1) — one
   bar per time bucket, height ∝ event count, segments colored by category with
   error on top so failures pop. Replaces the 3px per-event ticks (which smeared
   into an unreadable smudge over ~hundreds of events). Step mode keeps the ticks. */
.mb-hbar { position: absolute; bottom: 0; display: flex; flex-direction: column-reverse; box-sizing: border-box; border-radius: 1px 1px 0 0; overflow: hidden; cursor: default; }
.mb-hbar.retry { outline: 1px dashed var(--error); outline-offset: -1px; border-radius: 0; }
.mb-hseg { width: 100%; flex: 0 0 auto; }
/* sub-agents lane (mock .lane.sub / .subbar): each in-session subagent as a
   horizontal bar positioned by its time window; color mapped to --chart-5. */
.mb-lane.sub { height: 40px; }
.mb-subbar { position: absolute; height: 13px; border-radius: 3px; display: flex; align-items: center; padding: 0 6px; font-size: 9px; font-family: 'Geist Mono', monospace; color: var(--text); white-space: nowrap; overflow: hidden; box-sizing: border-box; }
/* one ellipsized run ("name · tokens · $cost") so a narrow bar shows the name
   and as much of the metric as fits — never a cryptic truncated "1…" stub. */
.mb-subbar .mb-sublab { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mb-lane.ctx { height: 120px; }
.mb-lane.cost { height: 78px; }
.mb-board svg { display: block; width: 100%; height: 100%; }
/* align-items: stretch (not center) so .mb-ticks fills the row height — a
   zero-height centered ticks box let the tick text spill past the board's
   overflow:hidden bottom and clipped the last tick row. height 26px leaves room. */
.mb-xaxis { display: flex; align-items: stretch; height: 26px; }
.mb-ticks { position: relative; flex: 1; }
.mb-tick { position: absolute; font-size: 9.5px; line-height: 1; color: var(--text-faint); transform: translateX(-50%); top: 6px; font-family: 'Geist Mono', monospace; }
.mb-cross { position: absolute; top: 0; bottom: 26px; width: 1px; background: var(--text-faint); pointer-events: none; z-index: 5; display: none; }
/* idle-gap break markers (time mode): a faint dashed rule where wall-clock idle
   time was collapsed off the active-time axis, labelled "⋯ idle Nh/Nm". */
.mb-break { position: absolute; top: 0; bottom: 26px; width: 0; border-left: 1px dashed var(--text-faint); opacity: 0.55; pointer-events: none; z-index: 4; }
.mb-break-lab { position: absolute; top: 1px; max-width: 68px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 8.5px; color: var(--text-faint); font-family: 'Geist Mono', monospace; background: var(--surface2); padding: 0 3px; border-radius: 3px; pointer-events: none; z-index: 4; }
.mb-crosslabel { position: absolute; bottom: 2px; transform: translateX(-50%); background: var(--surface3); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; font-size: 9.5px; color: var(--text); font-family: 'Geist Mono', monospace; white-space: nowrap; }
.mb-tip { position: absolute; background: var(--surface3); border: 1px solid var(--border); border-radius: 7px; padding: 8px 10px; font-size: 11px; z-index: 6; width: 190px; box-shadow: 0 6px 22px rgba(0,0,0,0.55); pointer-events: none; display: none; top: 60px; }
.mb-tip .mb-tip-hd { color: var(--text); font-weight: 600; margin-bottom: 5px; font-size: 11.5px; }
.mb-tip .mb-tip-r { display: flex; justify-content: space-between; gap: 10px; color: var(--text-dim); margin: 1px 0; }
.mb-tip .mb-tip-r b { color: var(--text); }
/* Derived-callouts strip: the board's answers (costliest burst, friction, top
   delegation, idle share, edit footprint) surfaced by DEFAULT — never hover-gated. */
.mb-insights { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 10px; }
.mb-ins { display: inline-flex; align-items: baseline; gap: 6px; border: 1px solid var(--border); background: var(--surface2); border-radius: 6px; padding: 4px 9px; font-size: 10.5px; font-family: 'Geist Mono', monospace; color: var(--text-dim); }
.mb-ins b { color: var(--text); font-weight: 600; }
.mb-ins.bad b { color: var(--error); }
.mb-legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 10px 2px 2px; font-size: 10.5px; color: var(--text-dim); }
.mb-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.mb-hint { color: var(--text-faint); margin-left: auto; }

/* territory treemap (③) */
.mb-sec { margin-top: 22px; }
.mb-sec-h { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; gap: 12px; }
.mb-sec-h h3 { margin: 0; font-size: 13px; font-weight: 600; }
.mb-sec-cap { font-size: 11px; color: var(--text-dim); font-family: 'Geist Mono', monospace; }
.mb-tree { border: 1px solid var(--border); border-radius: 9px; background: var(--surface2); padding: 12px; }
.mb-root { font-size: 10.5px; color: var(--text-dim); margin-bottom: 9px; font-family: 'Geist Mono', monospace; }
.mb-dirs { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
.mb-dir { border: 1px solid var(--border); border-radius: 8px; padding: 9px; background: var(--surface); display: flex; flex-direction: column; min-width: 170px; max-width: 340px; }
/* Demoted temp/scratch reads: one muted, fixed-size card at the end of the row. */
.mb-dir.mb-scratch { flex: 0 0 auto; opacity: 0.62; border-style: dashed; }
.mb-dh { font-size: 11px; color: var(--text-dim); margin-bottom: 8px; font-family: 'Geist Mono', monospace; display: flex; align-items: baseline; gap: 6px; }
.mb-dh .mb-dh-nm { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mb-dh .mb-meta { flex: 0 0 auto; }
.mb-files { display: flex; flex-direction: column; gap: 6px; }
.mb-file { position: relative; display: flex; align-items: center; gap: 7px; padding: 7px 9px; border-radius: 6px; font-size: 11.5px; font-family: 'Geist Mono', monospace; border: 1px solid var(--border); }
.mb-ord { flex: 0 0 auto; width: 17px; height: 17px; border-radius: 50%; background: var(--surface3); color: var(--text-dim); font-size: 9px; display: flex; align-items: center; justify-content: center; }
/* The file NAME is the card's payload — give it a readable floor and let the
   touch-count meta ellipsize first (pre-fix the meta won and names shrank to one letter). */
.mb-nm { flex: 1 1 auto; min-width: 9ch; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mb-file .mb-meta { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mb-edt { color: var(--success); font-size: 11px; }
.mb-meta { font-size: 9px; color: var(--text-faint); }
.mb-tcap { margin-top: 11px; font-size: 11.5px; color: var(--text-dim); }

/* ============================================================
   Optimize ▸ Summarize (Track B) — curator + run + review/apply.
   Uses the monochrome design tokens (--accent for intensity,
   --brand for links) so it reads as one system with the rest of Lens.
   ============================================================ */
.sidebar a.nav-child { display: none; padding-left: 38px; font-size: 13px; color: var(--text-faint); }
.sidebar a.nav-child.active { color: var(--accent); }
.sidebar a.nav-child .icon { font-size: 12px; opacity: .6; }
/* A reference entry: always visible (NOT a nav-child), but set apart from the
   live data views above it by a rule and a quieter weight. No `display` rule
   here on purpose — nothing may make this conditional on the active view. */
.sidebar a.nav-reference { margin-top: 10px; padding-top: 14px; border-top: 1px solid var(--border); color: var(--text-dim); }
.sidebar a.nav-reference .icon { opacity: .7; }
.nav-badge { font-size: 9px; letter-spacing: .04em; text-transform: uppercase; border: 1px solid var(--border); border-radius: 3px; padding: 0 4px; color: var(--text-faint); margin-left: auto; }
.sz-link { color: var(--brand); cursor: pointer; text-decoration: none; }
.sz-link:hover { text-decoration: underline; }
.sz-sub { font-size: 13.5px; color: var(--text-dim); font-weight: 400; }
/* Neutral helper/caption text — calm (not warn-yellow), readable, capped width. */
.sz-note { font-size: 13px; color: var(--text-dim); line-height: 1.55; max-width: 74ch; margin: 0; }
/* The 74ch measure above is right for a standalone explanatory paragraph (a page
   intro, an Optimize section note) and wrong inside a Review-inbox row, where the
   text sits in a bordered card whose width the reader has already accepted: the
   cap left a wide empty gutter with the amount stranded in the far corner.
   Scoped to `.inbox-row` rather than lifted globally, and applied to the row's own
   `.sz-note`/`.sz-copybox` children only, so every other surface keeps its
   measure. `.inbox-row` is set by exactly the two row components, and the
   collapsed tail plus the below-the-fold group render through those same
   components, so they inherit this without a second rule. The relearn Approve
   MODAL is deliberately not covered: it renders outside the card and is a reading
   surface, so 74ch is still correct there. */
/* The row's own box. This was written inline on all four components that
   render one (the real row, the group row, the proposal row and the loading
   skeleton), each repeating a border and radius `.opt-section` already
   declares and each overriding its padding to a different value — so a
   skeleton and the row it stood in for could disagree, and the inbox sat on a
   different inset from every other list in the app. Declared once here, with
   the shared row padding; `.opt-section.inbox-row` rather than `.inbox-row`
   alone so it beats `.opt-section` on specificity rather than on source
   order. The tighter bottom margin is the one intentional difference: these
   stack as a dense list, not as standalone panels. */
.opt-section.inbox-row { padding: var(--pad-row-y) var(--inset-x); margin: 0 0 10px; }
.inbox-row .sz-note, .inbox-row .sz-copybox { max-width: none; }
/* A snippet is the row's payload and stays visible, but it must not decide the
   row's height: a six-line downsize fix made that row 2.5x a relearn row. Capped
   with its own scroll rather than collapsed, so the fix is still readable in place
   and `CopySnippetButton` still copies the full text either way.
   TWO lines (12px x 1.5 plus the box's own 14px padding). Four, then three, each
   still left the one row whose only fix is a long snippet among the tallest on
   the list; the box scrolls and the Copy button takes the whole snippet either
   way, so the cap costs the reader nothing that a scroll does not return. */
.inbox-row .sz-copybox { max-height: 64px; }
/* An apply control nested inside a row is a card inside a card. `.opt-section`
   is the page's standalone-panel rule (16px/18px padding, its own border), and
   the row already IS one; the nested copy therefore spent 34px of a row's height
   on chrome that only restated a boundary the row had already drawn. Padding
   trimmed and the border softened rather than removed: the box still has to read
   as a distinct affordance, since it is the one part of the row that writes to
   disk. Scoped to `.inbox-row` so every standalone Optimize panel keeps its own
   measure. */
.inbox-row .opt-section { padding: 8px 10px; background: transparent; }
/* The snippet's Copy control sits INSIDE the box rather than on a label line
   above it. That label line was 20px of a row's height to render the word "Fix"
   next to a monospace code block on a row whose title already says what is wrong,
   and it made the driver-role row the tallest on the list. The button is now
   adjacent to the thing it copies, which is also where a reader looks for it.
   `padding-right` reserves the button's own width so a long first line cannot run
   underneath it. Scoped to `.inbox-row`: the standalone Optimize panels have room
   for a labelled section header and keep theirs. */
.inbox-row .sz-fixbox { position: relative; margin-top: 10px; }
.inbox-row .sz-fixbox > .sz-copybox { padding-right: 74px; }
.inbox-row .sz-fixbox > .sz-copy-slot { position: absolute; top: 6px; right: 8px; z-index: 1; }
/* Uniform collapsed height for a row's prose, so the LIST can be scanned rather
   than read. Row descriptions come straight from the analyzers and their lengths
   are wildly uneven: `resend` concatenates evidence + advise_text + caveat into
   fifteen-odd lines while a downsize row has one, which made the list ragged and
   unscannable even at full width.
     * The clamp is on LINES, not characters, so the collapsed height is identical
       regardless of how the text happens to wrap at the current width.
     * `min-height` matches the clamp, so a row with LITTLE or NO prose occupies
       the same space as one with a wall of it. Without this, shortening the long
       rows would just move the raggedness to the short ones.
     * Nothing is destroyed: `.is-open` lifts the clamp in place.
   `-webkit-line-clamp` is the load-bearing property (Chromium + WebKit + Firefox
   all honour it); the unprefixed `line-clamp` is listed after it for the future. */
.inbox-desc { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; min-height: calc(2 * 1.55 * 13px); }
.inbox-desc.is-open { display: block; -webkit-line-clamp: unset; line-clamp: unset; overflow: visible; min-height: 0; }
/* The expander. A link rather than a button: it reveals text in place, it is not
   an action on the proposal, and the row's real actions are the buttons below. */
.inbox-more { font-size: 11.5px; margin-top: 4px; }

/* Summarize back link — deliberately NOT the brand-blue .sz-link: this one
   isn't an in-flow action, it's page chrome. Founder instruction: white text,
   not blue. It's already full-brightness at rest, so brighten-on-hover isn't
   available as a hover signal here — the affordance is the leading arrow
   glyph plus an underline on hover. */
.sz-back-link { color: var(--text); text-decoration: none; }
.sz-back-link:hover { text-decoration: underline; }
/* Engine gate */
.sz-engines { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; margin: 4px 0; align-items: stretch; }
.sz-engine { display: flex; flex-direction: column; height: 100%; box-sizing: border-box; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; cursor: pointer; transition: border-color .15s, background-color .15s; color: var(--text); font-family: inherit; }
.sz-engine:hover:not(:disabled) { border-color: var(--accent); }
/* Disabled = "unavailable until you set a key", not "broken". A dashed border
   and a slightly recessed fill signal a deliberate, labeled state; title and
   description stay at full legibility (uniform opacity dimming previously
   made the disabled card read as lower-quality rather than gated). */
.sz-engine:disabled { cursor: not-allowed; background: var(--surface2); border-style: dashed; }
.sz-eng-name { font-family: 'Geist', sans-serif; font-weight: 700; font-size: 16px; }
.sz-eng-tag { font-family: 'Geist Mono', monospace; font-size: 12px; color: var(--text-dim); margin-top: 4px; }
.sz-eng-desc { font-size: 13px; color: var(--text-dim); margin-top: 10px; line-height: 1.55; flex: 1; }
.sz-eng-off { margin-top: 10px; }
/* Founder instruction, repeated: the disabled-reason text ("set
   TJ_ANTHROPIC_API_KEY to enable") must render white, not amber and not the
   dim grey .badge-closed normally carries. Keep the badge's recessed pill
   background (it still reads as a deliberate label against it in both
   themes) but override just the text color back up to full strength. */
.sz-eng-off.badge-closed { color: var(--text); }

/* Curator / review filterable box */
.cur-filters { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin:0 0 14px; }
.cur-seg { display:inline-flex; align-items:center; border:1px solid var(--border); border-radius:6px; overflow:hidden; }
.cur-seg .seg-label { padding:0 9px; color:var(--text-faint); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; }
.cur-seg button { background:var(--surface); border:none; border-left:1px solid var(--border); color:var(--text-dim); padding:6px 12px; cursor:pointer; font-family:'Geist Mono',monospace; font-size:12.5px; }
.cur-seg button.on { background:rgba(var(--accent-rgb),0.12); color:var(--accent); }
.cur-search { flex:1; min-width:180px; background:var(--surface); border:1px solid var(--border); border-radius:6px; color:var(--text); padding:8px 12px; font-family:'Geist Mono',monospace; font-size:13px; }
.cur-listhead { display:flex; align-items:center; gap:16px; margin:12px 2px 8px; font-size:12.5px; color:var(--text-faint); }
.cur-listhead .sz-link { cursor:pointer; }
.cur-table { width:100%; border-collapse:collapse; }
.cur-table th { text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint); padding:9px 12px; border-bottom:1px solid var(--border); }
.cur-table td { padding:10px 12px; border-bottom:1px solid var(--border); font-size:13px; }
.cur-row.added { opacity:.42; }
.cur-addbar { display:flex; align-items:center; gap:14px; margin-top:16px; flex-wrap:wrap; }
.cur-btn { font-size:13px; padding:9px 16px; border-radius:6px; border:1px solid var(--border); background:var(--surface); color:var(--text); cursor:pointer; font-family:'Geist Mono',monospace; }
.cur-btn:hover:not(:disabled) { border-color:var(--accent); }
/* The primary action is brand-blue on white text (inbox mockup). The rest of
   the chrome stays monochrome, so this fill is what marks the ONE action a
   surface wants you to take. */
.cur-btn.primary { background:var(--brand); border-color:var(--brand); color:#fff; }
.cur-btn.primary:hover:not(:disabled) { background:#2f7ae8; border-color:#2f7ae8; }
.cur-btn:disabled { opacity:.4; cursor:not-allowed; }
.cur-tally { border:1px solid var(--border); border-radius:9px; background:var(--surface); padding:var(--pad-card-y) var(--inset-x); margin:0; cursor:pointer; transition:border-color .15s; }
.cur-tally.empty { cursor:default; }
.cur-tally:not(.empty):hover { border-color:rgba(var(--accent-rgb),0.5); }
.cur-tally-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
.cur-tally-count { font-family:'Geist Mono',monospace; font-size:24px; color:var(--accent); }
.cur-tally-count small { font-size:13px; color:var(--text-dim); }
.cur-tally-hint { font-size:12px; color:var(--text-faint); }
.cur-chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; max-height:64px; overflow:hidden; }
.cur-chip { font-family:'Geist Mono',monospace; font-size:12px; background:rgba(var(--accent-rgb),0.08); border:1px solid rgba(var(--accent-rgb),0.25); color:var(--text-dim); border-radius:4px; padding:3px 8px; white-space:nowrap; }
.cur-chip.more { background:transparent; border-color:var(--border); color:var(--text-faint); }
.cur-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.62); display:flex; align-items:center; justify-content:center; z-index:60; padding:24px; }
.cur-modal { background:var(--surface); border:1px solid var(--border); border-radius:12px; width:min(760px,100%); max-height:84vh; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.55); }
.cur-modal-head { display:flex; align-items:center; gap:10px; padding:var(--pad-card-y) var(--inset-x); border-bottom:1px solid var(--border); }
.cur-modal-title { font-size:15px; font-weight:600; }
.cur-modal-x { margin-left:auto; background:none; border:none; color:var(--text-dim); font-size:18px; cursor:pointer; line-height:1; }
.cur-modal-body { padding:var(--pad-card-y) var(--inset-x); overflow-y:auto; }
.cur-modal-foot { padding:var(--pad-card-y) var(--inset-x); border-top:1px solid var(--border); display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.cur-mrow { display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid var(--border); font-size:13px; }
.cur-mrow .path { font-family:'Geist Mono',monospace; flex:1; word-break:break-all; }
.cur-mrow .rm { background:none; border:1px solid var(--border); color:var(--error); border-radius:4px; width:24px; height:24px; cursor:pointer; line-height:1; flex:0 0 auto; }
.cur-mrow .rm:hover { border-color:var(--error); }
.cur-cwd { font-size:12px; color:var(--text-faint); margin:0 2px; line-height:1.5; }
.cur-cwd code { color:var(--text-dim); }
.cur-listbox { max-height:380px; overflow-y:auto; border:1px solid var(--border); border-radius:9px; background:var(--surface); }
/* The last row's divider would otherwise double up against the box border. */
.cur-listbox > .sz-runrow:last-child { border-bottom:none; }
.rev-note { margin:0; }
.rev-state { margin-left:auto; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; border-radius:4px; padding:3px 9px; border:1px solid var(--border); }
.rev-state.staged { color:var(--warn); border-color:rgba(245,166,35,.4); }
.rev-state.applied { color:var(--success); border-color:rgba(12,228,144,.4); }
.rev-state.rejected { color:var(--text-faint); }
.rev-state.reverted { color:var(--text-dim); border-color:var(--border); }
.rev-diff { font-family:'Geist Mono',monospace; font-size:12.5px; line-height:1.6; white-space:pre-wrap; word-break:break-word; margin:12px 0 0; }
.sz-diffblock { border:1px solid var(--border); border-radius:6px; padding:9px 11px 11px; margin:0 0 10px; background:var(--surface2); }
.sz-diffblock-h { font-family:'Geist Mono',monospace; font-size:11.5px; color:var(--text-dim); }
/* Run progress + manual copy block */

.sz-prog > div { height:100%; background:var(--brand); transition:width .2s; }
