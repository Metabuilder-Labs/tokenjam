function SessionDetailView({ sessionId }) {
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);
  const [tab, setTab] = useState('models');

  const load = useCallback(async () => {
    try {
      const d = await api('/sessions/' + sessionId);
      setData(d);
      setError(null);
    } catch (e) {
      setError(e && e.message ? e.message : 'Failed to load session');
    }
  }, [sessionId]);

  useEffect(() => { load(); const t = setInterval(load, 5000); return () => clearInterval(t); }, [load]);

  const backBtn = html`<button class="btn btn-back" onClick=${() => location.hash = '#/sessions'}>← Back to sessions</button>`;

  if (error) return html`<div>${backBtn}<div class="empty">Session not found.<code>${sessionId}</code></div></div>`;
  if (!data) return html`<${SessionDetailSkeleton} backBtn=${backBtn} />`;

  const s = data.session;
  const tools = data.tools || [];
  const traces = data.traces || [];
  const modelMix = data.model_mix || [];
  const contextSeries = data.context_series || [];
  const subagents = data.subagents || { rows: [], total: 0, cost_usd: 0, tokens: 0, flagged: 0 };
  const ctxMax = contextSeries.reduce((m, p) => Math.max(m, p.input_tokens || 0), 0);
  const isLocal = s.pricing_mode === 'local';
  const framing = data.framing || null;
  // Same rule as the Sessions lists: a user-set label wins, else the agent's
  // display name. One record, so there is no list to disambiguate against.
  const title = s.label || s.agent_display_name || s.agent_id;
  // Whether this session has a real compute-time figure. `> 0` rather than
  // `!= null`: see the tile below for why a zero sum is absence, not a
  // measurement.
  const hasActiveCompute = s.active_seconds != null && s.active_seconds > 0;

  return html`
    ${backBtn}
    <div class="ses-head">
      <span class="status-dot ${s.status}"></span>
      <div class="page-title" style="margin-bottom:0">${title}</div>
      <span class="ses-id-chip">${s.session_id}</span>
      <span class="badge badge-${s.status}">${s.status}</span>
    </div>

    <div class="ses-stats">
      <div class="ses-tile">
        ${isLocal ? html`
          <div class="ses-tile-v">Local model</div>
          <div class="ses-tile-l">no API cost</div>
        ` : html`
          <div class="ses-tile-v">${fmtFramedDollar(s.total_cost_usd, framing)}</div>
          <div class="ses-tile-l">cost today <span class="info-btn">i<span class="info-tip">Estimated from token usage at API list rates.</span></span></div>
        `}
      </div>
      <div class="ses-tile">
        <div class="ses-tile-v">${s.tool_call_count}</div>
        <div class="ses-tile-l">tool calls</div>
      </div>
      ${/* COMPUTE TIME WHEN THERE IS ONE, TOKENS WHEN THERE IS NOT — and the
            label always names the figure beside it, so the tile can never
            present tokens under a compute-time heading.

            `active_seconds` is SUM(duration_ms) over the session's spans
            (`core/db.session_active_seconds`), and duration_ms is populated for
            some ingested spans and not others. It is not a per-persona split:
            measured on a real corpus, SDK sessions carry it in full while
            coding sessions carry it for a minority, with the share falling in
            recent months. So the fallback is decided per SESSION, not per
            persona, and both personas can take either branch.

            Zero is treated as absent rather than shown as `0s`. A sum of
            durations that lands on zero means the spans recorded no duration,
            not that the session did no work, and `0s` states the second. The
            dash this replaced was honest but useless; a wrong number is worse
            than either, which is why nothing here derives a duration from
            adjacent timestamps (that measures wall clock, which the tile beside
            this one already shows, and the two diverge sharply on a resumed
            session). */ ''}
      <div class="ses-tile">
        ${hasActiveCompute ? html`
          <div class="ses-tile-v">${fmtDurLong(s.active_seconds * 1000)}</div>
          <div class="ses-tile-l">active (compute time)</div>
        ` : html`
          <div class="ses-tile-v">${fmtTokens(s.input_tokens)} / ${fmtTokens(s.output_tokens)}</div>
          <div class="ses-tile-l">tokens in / out <span class="info-btn">i<span class="info-tip">Compute time is unavailable for this session: its spans carry no recorded duration. Tokens are shown instead rather than a blank tile.</span></span></div>
        `}
      </div>
      <div class="ses-tile">
        <div class="ses-tile-v">${fmtDurLong(s.duration_seconds != null ? s.duration_seconds * 1000 : null)}</div>
        <div class="ses-tile-l">elapsed (wall clock)</div>
      </div>
    </div>

    <div class="tab-bar" role="tablist">
      <button class="tab ${tab === 'models' ? 'active' : ''}" role="tab" aria-selected=${tab === 'models'} onClick=${() => setTab('models')}>Models & context</button>
      ${subagents.total > 0 ? html`<button class="tab ${tab === 'subagents' ? 'active' : ''}" role="tab" aria-selected=${tab === 'subagents'} onClick=${() => setTab('subagents')}>Subagents${subagents.flagged ? ' (' + subagents.flagged + ')' : ''}</button>` : null}
      <button class="tab ${tab === 'tools' ? 'active' : ''}" role="tab" aria-selected=${tab === 'tools'} onClick=${() => setTab('tools')}>Tools used</button>
      <button class="tab ${tab === 'traces' ? 'active' : ''}" role="tab" aria-selected=${tab === 'traces'} onClick=${() => setTab('traces')}>Traces</button>
      <button class="tab ${tab === 'approach' ? 'active' : ''}" role="tab" aria-selected=${tab === 'approach'} onClick=${() => setTab('approach')}>Approach</button>
      <button class="tab ${tab === 'timeline' ? 'active' : ''}" role="tab" aria-selected=${tab === 'timeline'} onClick=${() => setTab('timeline')}>Timeline</button>
    </div>

    ${tab === 'models' ? html`
      ${(modelMix.length > 0 || contextSeries.length > 0) ? html`
        <div class="tab-cap">How this session split across models${data.turn_count ? ' · ' + data.turn_count + ' LLM call' + (data.turn_count === 1 ? '' : 's') : ''}</div>
        ${modelMix.length > 0 ? html`
          <div class="panel"><div class="table-wrap"><table>
            <thead><tr><th>Model</th><th class="num">Calls</th><th class="num">Input</th><th class="num">Output</th><th class="num">Cache</th><th class="num">Cost <span class="info-btn">i<span class="info-tip">Estimated from token usage at API list rates.</span></span></th></tr></thead>
            <tbody>
              ${modelMix.map(m => html`
                <tr>
                  <td class="mono">${m.model}</td>
                  <td class="num dim">${m.calls}</td>
                  <td class="num dim">${fmtTokens(m.input_tokens)}</td>
                  <td class="num dim">${fmtTokens(m.output_tokens)}</td>
                  <td class="num dim">${m.cache_tokens ? fmtTokens(m.cache_tokens) : '-'}</td>
                  <td class="num"><b>${fmtCost(m.cost_usd)}</b></td>
                </tr>
              `)}
            </tbody>
          </table></div></div>
        ` : null}
        ${/* The histogram gets its own panel with the caption INSIDE it, above
              the plot: the caption names what the bars are, and a caption
              floating outside the card it explains reads as a page-level note
              about the tab rather than a label on this chart. */ ''}
        ${contextSeries.length > 0 ? html`
          <div class="panel"><div class="panel-body">
            <div class="tab-cap">Input (context) tokens per LLM call over the session</div>
            <div class="ctx-plot">
              ${contextSeries.map(p => html`
                <i style=${'height:' + (ctxMax > 0 ? Math.max(2, Math.round((p.input_tokens / ctxMax) * 100)) : 2) + '%'} title=${fmtTokens(p.input_tokens) + ' input tokens' + (p.t ? ' · ' + fmtAgo(p.t) : '')}></i>
              `)}
            </div>
            <div class="ctx-axis">
              <span>0</span>
              <span>peak ${fmtTokens(ctxMax)}</span>
            </div>
          </div></div>
        ` : html`<div class="tab-foot">No LLM calls recorded.</div>`}
      ` : html`<div class="empty">No LLM calls recorded for this session.</div>`}
    ` : null}

    ${tab === 'subagents' ? html`
      <div class="tab-cap">${subagents.total} subagent${subagents.total === 1 ? '' : 's'}${s.total_cost_usd > 0 ? ' · ' + Math.round(subagents.cost_usd / s.total_cost_usd * 100) + '% of session cost' : ''}${subagents.flagged ? ' · ' + subagents.flagged + ' flagged for right-sizing' : ''}</div>
      ${subagents.rows.length > 0 ? html`
        ${/* The right-sizing flag rides UNDER the subagent's name as a tinted
              pill rather than in a column of its own at the far edge of a wide
              table: the row tint and the pill are one signal, and putting them
              together is what makes a flagged row readable at a glance. */ ''}
        <div class="panel"><div class="table-wrap"><table>
          <thead><tr><th>Subagent</th><th>Model</th><th class="num">Calls</th><th class="num">Tools</th><th class="num">Input</th><th class="num">Cache</th><th class="num">Output</th><th class="num">Cost <span class="info-btn">i<span class="info-tip">Estimated from token usage at API list rates.</span></span></th></tr></thead>
          <tbody>
            ${subagents.rows.map(r => html`
              <tr class=${r.flags.length ? 'sub-flagged' : ''}>
                <td class="mono">
                  <div>${r.sub_agent_id.slice(0, 12)}</div>
                  ${r.flags.map(f => html`<span class="sub-flag">${f.replace(/_/g, '-')}</span>`)}
                </td>
                <td class="mono dim">${r.model}</td>
                <td class="num dim">${r.llm_calls}</td>
                <td class="num dim">${r.tool_calls}</td>
                <td class="num dim">${fmtTokens(r.input_tokens)}</td>
                <td class="num dim">${(r.cache_tokens + r.cache_write_tokens) ? fmtTokens(r.cache_tokens + r.cache_write_tokens) : '-'}</td>
                <td class="num dim">${fmtTokens(r.output_tokens)}</td>
                <td class="num"><b>${fmtFramedDollar(r.cost_usd, framing)}</b></td>
              </tr>
            `)}
          </tbody>
        </table></div></div>
        <div class="tab-foot">A candidate-flagging heuristic, not a quality judgment. Review before changing how subagents are dispatched.</div>
      ` : html`<div class="empty">No subagents in this session.</div>`}
    ` : null}

    ${tab === 'tools' ? html`
      ${tools.length > 0 ? html`
        <div class="panel"><div class="table-wrap"><table>
          <thead><tr><th>Tool</th><th class="num">Calls</th><th class="num">Failed</th></tr></thead>
          <tbody>
            ${tools.map(t => html`
              <tr>
                <td class="mono">${t.tool_name}</td>
                <td class="num dim">${t.count}</td>
                ${/* A zero here is a real, known measurement — dimmed, not
                      hidden, and never blank. Only a nonzero count takes the
                      error color, so the eye lands on the tools that failed. */ ''}
                <td class=${t.error_count ? 'num' : 'num dim'} style=${t.error_count ? 'color:var(--error)' : ''}>${t.error_count || 0}</td>
              </tr>
            `)}
          </tbody>
        </table></div></div>
      ` : html`<div class="empty">No tool calls recorded for this session.</div>`}
    ` : null}

    ${tab === 'traces' ? html`
      ${/* A backfilled Claude Code session usually rolls its whole conversation
            under ONE trace_id, so the trace list would be a single row you have to
            click through. When there's exactly one trace, show its span waterfall
            right here (embedded, no extra hop); a session with several traces
            (multiple conversations, or live per-call ingest) keeps the list. */ ''}
      ${traces.length === 0 ? html`<div class="empty">No traces recorded for this session yet.</div>`
        : traces.length === 1 ? html`
          ${/* One caption for the embedded waterfall, owned here — the embedded
                TraceDetailView suppresses its own so the two don't stack. */ ''}
          <div class="tab-cap">One trace · ${traces[0].span_count} spans · bars sized by tokens, and the costliest are marked, so a runaway span is findable without scanning by eye. Click a span for details.</div>
          <${TraceDetailView} traceId=${traces[0].trace_id} embedded=${true} />
          <div class="tab-foot">Tool spans carry no tokens; an empty bar is a tool call, not a missing measurement.</div>`
        : html`
        <div class="tab-cap">${traces.length} traces in this session. Click a trace row to drill into its waterfall.</div>
        <div class="panel"><div class="table-wrap"><table>
          <thead><tr><th>Type</th><th>Time</th><th>Duration</th><th class="num">Cost <span class="info-btn">i<span class="info-tip">Estimated from token usage at API list rates.</span></span></th><th>Result</th><th class="num">Spans</th><th></th></tr></thead>
          <tbody>
            ${traces.map(t => html`
              <tr class="clickable" onClick=${() => location.hash = '#/traces/' + t.trace_id} title=${'Trace ' + t.trace_id}>
                ${/* A backfilled Claude Code session rolls its whole conversation
                      up under one trace_id, so this one row can hold thousands of
                      mixed spans. Labelling it by the FIRST span's type (e.g. "Tool
                      Call") read as "only one tool call happened"; call a multi-span
                      roll-up a Conversation instead, with the real count in Spans. */ ''}
                <td>${t.span_count > 1 ? 'Conversation' : friendlySpanName(t.name)}</td>
                <td>${fmtAgo(t.start_time)}</td>
                ${/* Backfilled spans carry no per-span duration, so the SUM is 0;
                      an em dash is honest where "0ms" reads as an instant trace. */ ''}
                <td class="dim">${t.duration_ms > 0 ? fmtDur(t.duration_ms) : '—'}</td>
                <td class="num">${fmtPerItemCost(t.cost_usd, _costVal(t, true), framing)}</td>
                <td><span class="badge badge-${t.status_code}">${t.status_code}</span></td>
                <td class="num dim">${t.span_count}</td>
                <td class="chevron">→</td>
              </tr>
            `)}
          </tbody>
        </table></div></div>
      `}
    ` : null}

    ${tab === 'approach' ? html`<${ApproachSection} sessionId=${sessionId} />` : null}

    ${tab === 'timeline' ? html`<${StorySection} sessionId=${sessionId} />` : null}
  `;
}
