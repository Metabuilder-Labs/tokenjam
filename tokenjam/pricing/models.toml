# tokenjam/pricing/models.toml
# Prices in USD per million tokens.
# Submit a PR when provider prices change.
#
# ─── 1M-context / [1m] variants ────────────────────────────────────────────
# Claude's 1M-context models surface in telemetry as `claude-opus-4-8[1m]`,
# `claude-sonnet-4-6[1m]`, etc. There are intentionally NO separate `[1m]` rows
# in this file: as of Anthropic's 2026-03-13 pricing change the 1M context window
# bills at STANDARD per-token rates — the old long-context premium (historically
# ~2x input / ~1.5x output for requests over 200K tokens) was removed, so a
# 900K-token request bills at the same per-token rate as a 9K-token one.
# `get_rates` strips the trailing `[...]` context tag (core/pricing.py
# `_strip_context_tag`), so `claude-opus-4-8[1m]` resolves to the base
# `claude-opus-4-8` rates. Source:
# https://platform.claude.com/docs/en/about-claude/pricing → "Long context pricing".
#
# ─── Rate history (the time axis) ──────────────────────────────────────────
# A `[provider.model]` table with rate keys directly on it is one rate that has
# always applied — the form every row below uses, and the only form that ever
# existed. A model whose price CHANGES on a date adds dated rows instead of
# being edited in place:
#
#   [anthropic.claude-sonnet-5]          # the rate before the change
#   input_per_mtok = 2.00
#
#   [[anthropic.claude-sonnet-5.rates]]  # the rate from that date onward
#   valid_from = 2026-09-01
#   input_per_mtok = 3.00
#
# Lookup picks the row whose window contains the span's start_time, so a span
# recorded before the change keeps pricing at the rate that actually billed it
# while a later one picks up the new rate. Editing a rate in place instead makes
# past and future figures silently incomparable. Fields a dated row omits are
# inherited from the rate it supersedes.
#
# ADDING A DATED ROW SCHEDULES A TEST FAILURE unless you also pin the tests that
# price this model. A test that hardcodes an expected dollar figure and lets the
# pricing instant default to "now" asserts the pre-boundary row until the date
# lands, then asserts the post-boundary row against a pre-boundary number. The
# row above did exactly that on 2026-09-01 and turned main red with no commit to
# blame, days after the last green run. So when you add a dated row:
#   * give `tests/unit/test_cost.py`'s priced-models table a case on EACH side
#     of the boundary, each passing `at=` explicitly;
#   * check any test that prices this model for a floating instant — the rule is
#     that the expected rate and the span must be read at the SAME instant, and
#     both pinned, or both "now" so they move together.
# `test_only_the_labelled_call_site_prices_at_now` enforces this for analyzers,
# but it scans `core/optimize/` only and cannot see the test suite.
#
# ─── Variants (the variant axis) ───────────────────────────────────────────
# A variant is a different way of buying the SAME model id. Two forms:
#   * per-model, when the rate is specific to that model — a `[[...rates]]` row
#     carrying `variant = "fast"`;
#   * model-independent, under `[variants.<name>]`, where each field is either
#     an absolute per-MTok rate or `{ multiplier = X }` (X times the model's own
#     standard rate for that field) / `{ multiplier = X, of = "<field>" }` for a
#     multiple of a DIFFERENT standard field.
# Fields a variant doesn't name keep the model's standard rate.

# The Batch API bills a flat half of standard prices, on every model that
# offers it. See https://platform.claude.com/docs/en/build-with-claude/batch-processing.
[variants.batch]
input_per_mtok       = { multiplier = 0.50 }
output_per_mtok      = { multiplier = 0.50 }
cache_read_per_mtok  = { multiplier = 0.50 }
cache_write_per_mtok = { multiplier = 0.50 }

# A 1-hour-TTL cache write bills at 2x the model's INPUT rate, against 1.25x for
# the default 5-minute write that `cache_write_per_mtok` carries. Expressed as a
# multiple of the input rate rather than of the 5-minute write rate because that
# is how the provider defines it — see the "1h cache write" row in
# https://platform.claude.com/docs/en/build-with-claude/prompt-caching.
[variants.cache-1h]
cache_write_per_mtok = { multiplier = 2.0, of = "input_per_mtok" }

# Claude Fable 5 — Anthropic's most capable widely released model.
# See https://platform.claude.com/docs/en/pricing (cache_write = 5-minute write).
[anthropic.claude-fable-5]
input_per_mtok = 10.00
output_per_mtok = 50.00
cache_read_per_mtok = 1.00
cache_write_per_mtok = 12.50

# Claude Mythos 5 — same published rates as Fable 5.
[anthropic.claude-mythos-5]
input_per_mtok = 10.00
output_per_mtok = 50.00
cache_read_per_mtok = 1.00
cache_write_per_mtok = 12.50

